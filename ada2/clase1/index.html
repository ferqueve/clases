<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANDIS 2 · Arquitectura de Software — Clase 1</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#070b14;
  --bg-1:#0d1424;
  --panel:#111a2e;
  --panel-2:#16223a;
  --accent:#3ec1ff;
  --accent-2:#7b6bff;
  --accent-3:#ffb547;
  --ok:#3ee6a8;
  --text:#e8edf7;
  --text-dim:#8fa0bd;
  --border:#22304d;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(1200px 700px at 15% -10%, rgba(62,193,255,.10), transparent 60%),
    radial-gradient(1000px 700px at 110% 10%, rgba(123,107,255,.12), transparent 55%),
    var(--bg-0);
  color:var(--text);
  font-family:'Inter',sans-serif;
  overflow:hidden;
}
.mono{font-family:'JetBrains Mono',monospace}

/* blueprint grid backdrop */
.blueprint{
  position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.35;
  background-image:
    linear-gradient(rgba(62,193,255,.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(62,193,255,.06) 1px, transparent 1px);
  background-size:42px 42px;
}

.progress-track{position:fixed; top:0; left:0; width:100%; height:4px; background:rgba(255,255,255,.06); z-index:50;}
.progress-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--accent-2)); transition:width .4s ease; box-shadow:0 0 12px var(--accent);}

.hud{
  position:fixed; top:14px; right:18px; z-index:50;
  background:rgba(17,26,46,.85); border:1px solid var(--border); backdrop-filter:blur(6px);
  padding:7px 14px; border-radius:999px; font-size:.82rem; color:var(--text-dim);
  display:flex; align-items:center; gap:8px;
}
.hud .unit-tag{color:var(--accent); font-weight:700}

.brand{
  position:fixed; top:14px; left:18px; z-index:50; font-size:.78rem; color:var(--text-dim);
  display:flex; align-items:center; gap:8px; letter-spacing:.03em;
}
.brand i{color:var(--accent-3)}

.slides-container{position:relative; z-index:1; height:100vh; width:100vw;}
.slide{
  position:absolute; inset:0; display:none;
  padding:90px 8vw 110px 8vw;
  overflow-y:auto;
}
.slide.active{display:block}
.slide-inner{max-width:1180px; margin:0 auto;}

.eyebrow{
  display:inline-flex; align-items:center; gap:8px; font-size:.78rem; text-transform:uppercase;
  letter-spacing:.12em; color:var(--accent); font-weight:700; margin-bottom:14px;
}
.eyebrow i{font-size:.9rem}

h1.slide-title{font-size:clamp(1.9rem,3.4vw,3rem); font-weight:800; margin-bottom:.4rem; line-height:1.1;}
h2.slide-title{font-size:clamp(1.5rem,2.6vw,2.2rem); font-weight:800; margin-bottom:.6rem;}
.subtitle{color:var(--text-dim); font-size:1.05rem; max-width:820px;}

.card-panel{
  background:linear-gradient(180deg, var(--panel), var(--panel-2));
  border:1px solid var(--border); border-radius:16px; padding:26px 28px;
  box-shadow:0 12px 30px rgba(0,0,0,.35);
}
.card-panel + .card-panel{margin-top:18px}

.pill{
  display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:999px;
  font-size:.76rem; font-weight:700; background:rgba(62,193,255,.12); color:var(--accent); border:1px solid rgba(62,193,255,.35);
}
.pill.purple{background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)}
.pill.amber{background:rgba(255,181,71,.14); color:var(--accent-3); border-color:rgba(255,181,71,.4)}
.pill.ok{background:rgba(62,230,168,.12); color:var(--ok); border-color:rgba(62,230,168,.35)}

.icon-tile{
  width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center;
  background:rgba(62,193,255,.12); color:var(--accent); font-size:1.3rem; border:1px solid rgba(62,193,255,.3);
  flex-shrink:0;
}

.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
@media (max-width:900px){.grid-2,.grid-3{grid-template-columns:1fr;}}

ul.clean{list-style:none; margin:0; padding:0;}
ul.clean li{
  position:relative; padding:6px 0 6px 26px; color:var(--text); font-size:.96rem;
}
ul.clean li::before{
  content:"\f105"; font-family:"Font Awesome 6 Free"; font-weight:900; color:var(--accent);
  position:absolute; left:2px; top:8px; font-size:.85rem;
}
ul.clean.sec li::before{content:"\f111"; font-size:.4rem; color:var(--accent-2); top:11px;}

table.uni-table{width:100%; border-collapse:separate; border-spacing:0; font-size:.92rem;}
table.uni-table th{
  text-align:left; color:var(--accent); text-transform:uppercase; font-size:.72rem; letter-spacing:.08em;
  padding:10px 12px; border-bottom:1px solid var(--border);
}
table.uni-table td{padding:12px; border-bottom:1px solid rgba(255,255,255,.05); vertical-align:top; color:var(--text-dim);}
table.uni-table tr:hover td{background:rgba(62,193,255,.04); color:var(--text);}
table.uni-table td strong{color:var(--text)}

.timeline{display:flex; gap:10px; overflow-x:auto; padding-bottom:8px;}
.timeline .tstep{
  flex:1 0 150px; background:var(--panel-2); border:1px solid var(--border); border-radius:12px; padding:16px;
  cursor:pointer; transition:.2s; position:relative;
}
.timeline .tstep:hover{transform:translateY(-4px); border-color:var(--accent);}
.timeline .tstep .tnum{font-family:'JetBrains Mono'; color:var(--accent); font-weight:800; font-size:1.1rem;}
.timeline .tstep .tname{font-size:.85rem; margin-top:4px; color:var(--text);}
.timeline .tstep .thrs{font-size:.72rem; color:var(--text-dim); margin-top:6px;}

.badge-hours{
  font-family:'JetBrains Mono'; font-size:.78rem; background:rgba(255,181,71,.12); color:var(--accent-3);
  border:1px solid rgba(255,181,71,.3); padding:3px 10px; border-radius:8px; display:inline-block;
}

.check-btn{
  border:none; background:linear-gradient(90deg,var(--accent),var(--accent-2)); color:#04101f; font-weight:800;
  padding:10px 22px; border-radius:10px; font-size:.9rem; box-shadow:0 8px 22px rgba(62,193,255,.25);
}
.check-btn:hover{filter:brightness(1.08); color:#04101f;}

.nav-controls{
  position:fixed; bottom:18px; left:0; right:0; z-index:50; display:flex; justify-content:center; gap:14px; align-items:center;
}
.nav-btn{
  width:46px; height:46px; border-radius:50%; border:1px solid var(--border); background:rgba(17,26,46,.9);
  color:var(--text); display:flex; align-items:center; justify-content:center; font-size:1.1rem; backdrop-filter:blur(6px);
}
.nav-btn:hover{border-color:var(--accent); color:var(--accent);}
.nav-dots{display:flex; gap:6px; align-items:center; background:rgba(17,26,46,.9); border:1px solid var(--border); padding:8px 14px; border-radius:999px;}
.nav-dots .dot{width:7px; height:7px; border-radius:50%; background:var(--border); cursor:pointer; transition:.2s;}
.nav-dots .dot.active{background:var(--accent); width:20px; border-radius:4px;}

.footer-note{position:fixed; bottom:20px; right:22px; z-index:50; font-size:.72rem; color:var(--text-dim); font-family:'JetBrains Mono';}

::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px}

.acc-item{border:1px solid var(--border); border-radius:12px; margin-bottom:10px; overflow:hidden; background:var(--panel-2);}
.acc-head{padding:14px 18px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; font-weight:700;}
.acc-head i.chev{transition:.25s; color:var(--accent);}
.acc-head.open i.chev{transform:rotate(180deg);}
.acc-body{max-height:0; overflow:hidden; transition:max-height .3s ease; padding:0 18px;}
.acc-body.open{max-height:400px; padding:0 18px 16px 18px;}
.acc-body p{color:var(--text-dim); font-size:.88rem; margin:0;}

.res-card{display:flex; gap:16px; align-items:flex-start; padding:16px 0; border-bottom:1px solid rgba(255,255,255,.06);}
.res-card:last-child{border-bottom:none;}
</style>
</head>
<body>

<div class="blueprint"></div>
<div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
<div class="brand"><i class="fa-solid fa-cubes"></i> ANDIS 2 · FIT UCU</div>
<div class="hud"><i class="fa-solid fa-layer-group"></i> <span class="unit-tag" id="hudCurrent">1</span>/<span id="hudTotal">0</span></div>

<div class="slides-container" id="slidesContainer"></div>

<div class="nav-controls">
  <button class="nav-btn" id="prevBtn"><i class="fa-solid fa-chevron-left"></i></button>
  <div class="nav-dots" id="navDots"></div>
  <button class="nav-btn" id="nextBtn"><i class="fa-solid fa-chevron-right"></i></button>
</div>
<div class="footer-note">← → para navegar</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.10.5/sweetalert2.all.min.js"></script>
<script>
/* ============ CONTENIDO DE LAS DIAPOSITIVAS ============ */
const slidesHTML = [];

// 0. Portada
slidesHTML.push(`
<div class="slide-inner d-flex flex-column justify-content-center" style="min-height:78vh;">
  <div class="animate__animated animate__fadeInDown">
    <span class="eyebrow"><i class="fa-solid fa-diagram-project"></i> FIT UCU · Grado en Desarrollo de Software</span>
    <h1 class="slide-title">Análisis y Diseño de Aplicaciones 2</h1>
    <p class="subtitle">Arquitectura de software: de los requerimientos funcionales al diseño que sostiene la calidad de un sistema.</p>
  </div>
  <div class="row mt-5 animate__animated animate__fadeInUp animate__delay-1s">
    <div class="col-md-3 col-6 mb-3">
      <div class="card-panel text-center py-4">
        <i class="fa-solid fa-layer-group mb-2" style="font-size:1.6rem;color:var(--accent)"></i>
        <div class="mono fw-bold">6</div><div class="text-dim small" style="color:var(--text-dim)">Unidades</div>
      </div>
    </div>
    <div class="col-md-3 col-6 mb-3">
      <div class="card-panel text-center py-4">
        <i class="fa-solid fa-clock mb-2" style="font-size:1.6rem;color:var(--accent-3)"></i>
        <div class="mono fw-bold">78 hs</div><div class="small" style="color:var(--text-dim)">en clase</div>
      </div>
    </div>
    <div class="col-md-3 col-6 mb-3">
      <div class="card-panel text-center py-4">
        <i class="fa-solid fa-users mb-2" style="font-size:1.6rem;color:var(--accent-2)"></i>
        <div class="mono fw-bold">195 hs</div><div class="small" style="color:var(--text-dim)">en casa</div>
      </div>
    </div>
    <div class="col-md-3 col-6 mb-3">
      <div class="card-panel text-center py-4">
        <i class="fa-solid fa-scale-balanced mb-2" style="font-size:1.6rem;color:var(--ok)"></i>
        <div class="mono fw-bold">4</div><div class="small" style="color:var(--text-dim)">resultados de aprendizaje</div>
      </div>
    </div>
  </div>
</div>
`);

// 1. Introducción / contexto
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-route"></i> De dónde venimos</span>
  <h2 class="slide-title">Del "qué" al "cómo lo sostenemos"</h2>
  <div class="card-panel mt-4">
    <div class="d-flex gap-3">
      <div class="icon-tile"><i class="fa-solid fa-list-check"></i></div>
      <div>
        <p style="font-size:1.05rem; line-height:1.7; margin-bottom:14px;">
        En cursos anteriores viste cómo <strong>relevar y especificar requerimientos funcionales</strong> de aplicaciones informáticas,
        y cómo crear diseños que cumplan con esos requerimientos.
        </p>
        <p style="font-size:1.05rem; line-height:1.7; margin:0;">
        Pero las aplicaciones también tienen <strong>requerimientos no funcionales</strong>: escalabilidad, desempeño,
        confiabilidad, y muchos más. En este curso vas a aprender a <strong>diseñar aplicaciones para cumplir con estos nuevos requerimientos.</strong>
        </p>
      </div>
    </div>
  </div>
  <div class="grid-3 mt-3">
    <div class="card-panel py-3">
      <span class="pill"><i class="fa-solid fa-bolt"></i> Desempeño</span>
    </div>
    <div class="card-panel py-3">
      <span class="pill purple"><i class="fa-solid fa-arrows-up-down-left-right"></i> Escalabilidad</span>
    </div>
    <div class="card-panel py-3">
      <span class="pill amber"><i class="fa-solid fa-shield-halved"></i> Confiabilidad</span>
    </div>
  </div>
</div>
`);

// 2. Objetivos
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-bullseye"></i> Propósito del curso</span>
  <h2 class="slide-title">Objetivos</h2>
  <div class="card-panel mt-3">
    <p style="font-size:1.1rem; line-height:1.75; margin:0;">
      La intención de este curso es que puedas <strong>relevar requerimientos no funcionales</strong> de aplicaciones
      empresariales y <strong>diseñar la infraestructura y el software apropiados</strong> para satisfacer esos requerimientos.
    </p>
  </div>
  <div class="row mt-3">
    <div class="col-md-6 mb-3">
      <div class="card-panel h-100">
        <div class="icon-tile mb-3"><i class="fa-solid fa-magnifying-glass-chart"></i></div>
        <h6 class="fw-bold">Relevar</h6>
        <p class="small" style="color:var(--text-dim)">Identificar atributos de calidad y requerimientos arquitectónicamente significativos de un sistema real.</p>
      </div>
    </div>
    <div class="col-md-6 mb-3">
      <div class="card-panel h-100">
        <div class="icon-tile mb-3" style="background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)"><i class="fa-solid fa-drafting-compass"></i></div>
        <h6 class="fw-bold">Diseñar</h6>
        <p class="small" style="color:var(--text-dim)">Aplicar tácticas, patrones y estilos de arquitectura para dar respuesta a esos requerimientos.</p>
      </div>
    </div>
  </div>
</div>
`);

// 3. Competencias y resultados de aprendizaje
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-graduation-cap"></i> Marco de competencias</span>
  <h2 class="slide-title">Competencias y resultados de aprendizaje</h2>
  <div class="card-panel mt-3">
    <div class="d-flex gap-3 mb-2">
      <div class="icon-tile"><i class="fa-solid fa-cubes-stacked"></i></div>
      <p class="small mb-0 align-self-center" style="color:var(--text-dim)">Aplica principios y patrones de diseño y arquitectura de software e infraestructura en el modelado y diseño de sistemas informáticos, demostrando comprensión de las decisiones alternativas involucradas.</p>
    </div>
    <ul class="clean mt-2">
      <li><strong>RA1.</strong> Aplica estilos y patrones de arquitectura para satisfacer requerimientos no funcionales; explica a una audiencia de pares cómo el diseño los satisface.</li>
      <li><strong>RA4.</strong> Diseña la arquitectura de software e infraestructura considerando nubes privadas, públicas e híbridas, y servicios de infraestructura o plataforma; la documenta con notación apropiada.</li>
    </ul>
  </div>
  <div class="card-panel mt-3">
    <div class="d-flex gap-3 mb-2">
      <div class="icon-tile" style="background:rgba(255,181,71,.14); color:var(--accent-3); border-color:rgba(255,181,71,.4)"><i class="fa-solid fa-people-group"></i></div>
      <p class="small mb-0 align-self-center" style="color:var(--text-dim)">Comunica efectivamente información técnica a diversas audiencias; analiza problemas complejos del mundo real aplicando enfoques y principios computacionales.</p>
    </div>
    <ul class="clean mt-2">
      <li><strong>RA2.</strong> Evalúa opciones de integración de aplicaciones y cómo afectan las pruebas dentro del desarrollo del sistema.</li>
      <li><strong>RA3.</strong> Evalúa microservicios en contenedores vs. arquitecturas tradicionales en VMs o físicas; explica las consecuencias a partes interesadas.</li>
    </ul>
  </div>
</div>
`);

// 4. Temario overview (timeline)
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-map"></i> Hoja de ruta</span>
  <h2 class="slide-title">Temario — 6 unidades</h2>
  <p class="subtitle mb-4">Recorremos el proceso completo: qué impulsa una arquitectura, con qué tácticas y patrones se resuelve, en qué estilos se materializa y cómo se evalúa.</p>
  <div class="timeline">
    <div class="tstep"><div class="tnum">01</div><div class="tname">Drivers de arquitectura</div><div class="thrs">12 en clase · 30 en casa</div></div>
    <div class="tstep"><div class="tnum">02</div><div class="tname">Tácticas de arquitectura</div><div class="thrs">12 en clase · 30 en casa</div></div>
    <div class="tstep"><div class="tnum">03</div><div class="tname">Soluciones arquitectónicas</div><div class="thrs">14 en clase · 35 en casa</div></div>
    <div class="tstep"><div class="tnum">04</div><div class="tname">Patrones de arquitectura</div><div class="thrs">14 en clase · 35 en casa</div></div>
    <div class="tstep"><div class="tnum">05</div><div class="tname">Estilos de arquitectura</div><div class="thrs">14 en clase · 35 en casa</div></div>
    <div class="tstep"><div class="tnum">06</div><div class="tname">Proceso y evaluación</div><div class="thrs">12 en clase · 30 en casa</div></div>
  </div>
  <div class="card-panel mt-4 d-flex gap-3 align-items-center">
    <div class="icon-tile"><i class="fa-solid fa-chalkboard-user"></i></div>
    <div class="small" style="color:var(--text-dim)">Estrategia de enseñanza en todas las unidades: <strong style="color:var(--text)">lecturas previas, clase invertida, ejercicios prácticos de aplicación y trabajo en grupo.</strong></div>
  </div>
</div>
`);

// Helper para armar slides de unidad
function unidadSlide(num, icon, color, titulo, primarios, secundarios, horas){
  const secHtml = secundarios ? `
    <div class="mt-3">
      <span class="pill purple mb-2"><i class="fa-solid fa-plus"></i> Contenidos secundarios</span>
      <ul class="clean sec mt-2">${secundarios.map(s=>`<li>${s}</li>`).join('')}</ul>
    </div>` : '';
  return `
  <div class="slide-inner">
    <span class="eyebrow"><i class="fa-solid ${icon}"></i> Unidad ${num}</span>
    <h2 class="slide-title">${titulo}</h2>
    <div class="card-panel mt-3">
      <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-2">
        <span class="pill"><i class="fa-solid fa-star"></i> Contenidos primarios</span>
        <span class="badge-hours"><i class="fa-solid fa-clock"></i> ${horas}</span>
      </div>
      <ul class="clean">${primarios.map(p=>`<li>${p}</li>`).join('')}</ul>
      ${secHtml}
    </div>
    <div class="card-panel mt-3 d-flex gap-3 align-items-center">
      <div class="icon-tile" style="background:${color}22; color:${color}; border-color:${color}55"><i class="fa-solid fa-chalkboard-user"></i></div>
      <div class="small" style="color:var(--text-dim)">Lecturas previas · clase invertida · ejercicios prácticos de aplicación · trabajo en grupo</div>
    </div>
  </div>`;
}

// 5. Unidad 1
slidesHTML.push(unidadSlide(1, 'fa-drafting-compass', '#3ec1ff', 'Impulsores o drivers de la arquitectura',
  ['Atributos de calidad','Requerimientos arquitectónicamente significativos','Disponibilidad, rendimiento, protección, seguridad, facilidad de modificación, facilidad de despliegue','Modelos de calidad de software'],
  null, '12 en clase · 30 en casa'));

// 6. Unidad 2
slidesHTML.push(unidadSlide(2, 'fa-chess-knight', '#7b6bff', 'Tácticas de arquitectura',
  ['Tácticas para disponibilidad, rendimiento, protección, seguridad, facilidad de modificación y facilidad de despliegue'],
  null, '12 en clase · 30 en casa'));

// 7. Unidad 3
slidesHTML.push(unidadSlide(3, 'fa-server', '#ffb547', 'Soluciones arquitectónicas',
  ['Componentes','Interfaces','Interacción','Virtualización','Microservicios'],
  ['Computación distribuida','Propiedades ACID','Propiedades BASE','Teorema de Brewer (CAP)','Consistencia fuerte vs. eventual'],
  '14 en clase · 35 en casa'));

// 8. Unidad 4
slidesHTML.push(unidadSlide(4, 'fa-shapes', '#3ee6a8', 'Patrones de arquitectura',
  ['Patrones para disponibilidad, rendimiento, protección, seguridad, facilidad de modificación y facilidad de despliegue'],
  ['CQRS','Compensating Transaction','Event Sourcing','Choreography'],
  '14 en clase · 35 en casa'));

// 9. Unidad 5
slidesHTML.push(unidadSlide(5, 'fa-diagram-project', '#3ec1ff', 'Estilos de arquitectura',
  ['Layered','Pipes and Filters','Microkernel','Service-Based','Event-Driven','Service-Oriented','Microservices'],
  ['Space-Based','Orchestration-Driven'],
  '14 en clase · 35 en casa'));

// 10. Unidad 6
slidesHTML.push(unidadSlide(6, 'fa-magnifying-glass-chart', '#7b6bff', 'Proceso y evaluación de arquitectura',

/* ============ MOTOR DE NAVEGACIÓN ============ */
const container = document.getElementById('slidesContainer');
slidesHTML.forEach((html, i)=>{
  const div = document.createElement('div');
  div.className = 'slide' + (i===0 ? ' active' : '');
  div.id = 'slide'+i;
  div.innerHTML = html;
  container.appendChild(div);
});

let current = 0;
const total = slidesHTML.length;
document.getElementById('hudTotal').textContent = total;

const dotsWrap = document.getElementById('navDots');
for(let i=0;i<total;i++){
  const d = document.createElement('div');
  d.className = 'dot' + (i===0?' active':'');
  d.onclick = ()=>goTo(i);
  dotsWrap.appendChild(d);
}

function updateUI(){
  document.querySelectorAll('.slide').forEach((s,i)=>{
    s.classList.toggle('active', i===current);
  });
  document.querySelectorAll('.nav-dots .dot').forEach((d,i)=>{
    d.classList.toggle('active', i===current);
  });
  document.getElementById('hudCurrent').textContent = current+1;
  document.getElementById('progressFill').style.width = ((current+1)/total*100)+'%';
  const active = document.getElementById('slide'+current);
  active.scrollTop = 0;
  const animTarget = active.querySelector('.slide-inner');
  if(animTarget){
    animTarget.classList.remove('animate__fadeIn');
    void animTarget.offsetWidth;
    animTarget.classList.add('animate__animated','animate__fadeIn');
  }
}
function goTo(i){
  if(i<0||i>=total) return;
  current = i;
  updateUI();
}
document.getElementById('prevBtn').onclick = ()=>goTo(current-1);
document.getElementById('nextBtn').onclick = ()=>goTo(current+1);
document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight') goTo(current+1);
  if(e.key==='ArrowLeft') goTo(current-1);
});
updateUI();

/* ============ QUIZ INTERACTIVO ============ */
const preguntas = [
  {
    texto: '"El sistema debe permitir registrar un pago con tarjeta de crédito."',
    correcta: 'funcional',
    explicacion: 'Describe una acción/comportamiento concreto del sistema: es un requerimiento <b>funcional</b>.'
  },
  {
    texto: '"El sistema debe responder a cualquier consulta en menos de 200 ms bajo carga de 1000 usuarios concurrentes."',
    correcta: 'no-funcional',
    explicacion: 'Es un atributo de calidad (rendimiento), no una función puntual: es <b>no funcional</b>.'
  },
  {
    texto: '"El sistema debe seguir operativo aunque falle uno de sus servidores (99.9% de disponibilidad)."',
    correcta: 'no-funcional',
    explicacion: 'Habla de disponibilidad como atributo de calidad del sistema: es <b>no funcional</b>.'
  }
];
let idxPregunta = 0;
let aciertos = 0;

function lanzarQuiz(){
  idxPregunta = 0; aciertos = 0;
  mostrarPregunta();
}
function mostrarPregunta(){
  if(idxPregunta >= preguntas.length){
    Swal.fire({
      title: 'Resultado',
      html: `Acertaste <b>${aciertos}/${preguntas.length}</b> requerimientos.`,
      icon: aciertos===preguntas.length ? 'success' : 'info',
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    });
    return;
  }
  const p = preguntas[idxPregunta];
  Swal.fire({
    title: `Requerimiento ${idxPregunta+1}/${preguntas.length}`,
    html: `<p style="font-size:1rem;">${p.texto}</p>`,
    background:'#111a2e', color:'#e8edf7',
    showDenyButton: true,
    confirmButtonText: 'Funcional',
    denyButtonText: 'No funcional',
    confirmButtonColor:'#3ec1ff',
    denyButtonColor:'#7b6bff'
  }).then(res=>{
    const eligio = res.isConfirmed ? 'funcional' : 'no-funcional';
    const ok = eligio === p.correcta;
    if(ok) aciertos++;
    Swal.fire({
      title: ok ? '¡Correcto!' : 'No es así',
      html: p.explicacion,
      icon: ok ? 'success' : 'error',
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    }).then(()=>{
      idxPregunta++;
      mostrarPregunta();
    });
  });
}

/* ============ ACORDEÓN ============ */
function toggleAcc(headEl){
  const body = headEl.nextElementSibling;
  const isOpen = body.classList.contains('open');
  document.querySelectorAll('.acc-body.open').forEach(b=>{b.classList.remove('open'); b.previousElementSibling.classList.remove('open');});
  if(!isOpen){ body.classList.add('open'); headEl.classList.add('open'); }
}

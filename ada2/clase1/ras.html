<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANDIS 2 · Teórico — Atributo de calidad</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#070b14; --bg-1:#0d1424; --panel:#111a2e; --panel-2:#16223a;
  --accent:#3ec1ff; --accent-2:#7b6bff; --accent-3:#ffb547; --ok:#3ee6a8;
  --text:#e8edf7; --text-dim:#8fa0bd; --border:#22304d;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(1200px 700px at 15% -10%, rgba(62,193,255,.10), transparent 60%),
    radial-gradient(1000px 700px at 110% 10%, rgba(123,107,255,.12), transparent 55%),
    var(--bg-0);
  color:var(--text); font-family:'Inter',sans-serif; overflow:hidden;
}
.mono{font-family:'JetBrains Mono',monospace}
.blueprint{
  position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.35;
  background-image:linear-gradient(rgba(62,193,255,.06) 1px, transparent 1px),linear-gradient(90deg, rgba(62,193,255,.06) 1px, transparent 1px);
  background-size:42px 42px;
}
.progress-track{position:fixed; top:0; left:0; width:100%; height:4px; background:rgba(255,255,255,.06); z-index:50;}
.progress-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--accent-2)); transition:width .4s ease; box-shadow:0 0 12px var(--accent);}
.hud{position:fixed; top:14px; right:18px; z-index:50; background:rgba(17,26,46,.85); border:1px solid var(--border); backdrop-filter:blur(6px); padding:7px 14px; border-radius:999px; font-size:.82rem; color:var(--text-dim); display:flex; align-items:center; gap:8px;}
.hud .unit-tag{color:var(--accent); font-weight:700}
.brand{position:fixed; top:14px; left:18px; z-index:50; font-size:.78rem; color:var(--text-dim); display:flex; align-items:center; gap:8px; letter-spacing:.03em;}
.brand i{color:var(--accent-3)}
.slides-container{position:relative; z-index:1; height:100vh; width:100vw;}
.slide{position:absolute; inset:0; display:none; padding:90px 8vw 110px 8vw; overflow-y:auto;}
.slide.active{display:block}
.slide-inner{max-width:1180px; margin:0 auto;}
.eyebrow{display:inline-flex; align-items:center; gap:8px; font-size:.78rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent); font-weight:700; margin-bottom:14px;}
.eyebrow i{font-size:.9rem}
h1.slide-title{font-size:clamp(1.9rem,3.4vw,3rem); font-weight:800; margin-bottom:.4rem; line-height:1.1;}
h2.slide-title{font-size:clamp(1.5rem,2.6vw,2.2rem); font-weight:800; margin-bottom:.6rem;}
.subtitle{color:var(--text-dim); font-size:1.05rem; max-width:820px;}
.card-panel{background:linear-gradient(180deg, var(--panel), var(--panel-2)); border:1px solid var(--border); border-radius:16px; padding:26px 28px; box-shadow:0 12px 30px rgba(0,0,0,.35);}
.card-panel + .card-panel{margin-top:18px}
.pill{display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:999px; font-size:.76rem; font-weight:700; background:rgba(62,193,255,.12); color:var(--accent); border:1px solid rgba(62,193,255,.35);}
.pill.purple{background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)}
.pill.amber{background:rgba(255,181,71,.14); color:var(--accent-3); border-color:rgba(255,181,71,.4)}
.pill.ok{background:rgba(62,230,168,.12); color:var(--ok); border-color:rgba(62,230,168,.35)}
.icon-tile{width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center; background:rgba(62,193,255,.12); color:var(--accent); font-size:1.3rem; border:1px solid rgba(62,193,255,.3); flex-shrink:0;}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
@media (max-width:900px){.grid-2,.grid-3{grid-template-columns:1fr;}}
ul.clean{list-style:none; margin:0; padding:0;}
ul.clean li{position:relative; padding:6px 0 6px 26px; color:var(--text); font-size:.94rem;}
ul.clean li::before{content:"\f105"; font-family:"Font Awesome 6 Free"; font-weight:900; color:var(--accent); position:absolute; left:2px; top:8px; font-size:.85rem;}
.check-btn{border:none; background:linear-gradient(90deg,var(--accent),var(--accent-2)); color:#04101f; font-weight:800; padding:10px 22px; border-radius:10px; font-size:.9rem; box-shadow:0 8px 22px rgba(62,193,255,.25); cursor:pointer;}
.check-btn:hover{filter:brightness(1.08); color:#04101f;}
.nav-controls{position:fixed; bottom:18px; left:0; right:0; z-index:50; display:flex; justify-content:center; gap:14px; align-items:center;}
.nav-btn{width:46px; height:46px; border-radius:50%; border:1px solid var(--border); background:rgba(17,26,46,.9); color:var(--text); display:flex; align-items:center; justify-content:center; font-size:1.1rem; backdrop-filter:blur(6px);}
.nav-btn:hover{border-color:var(--accent); color:var(--accent);}
.nav-dots{display:flex; gap:6px; align-items:center; background:rgba(17,26,46,.9); border:1px solid var(--border); padding:8px 14px; border-radius:999px;}
.nav-dots .dot{width:7px; height:7px; border-radius:50%; background:var(--border); cursor:pointer; transition:.2s;}
.nav-dots .dot.active{background:var(--accent); width:20px; border-radius:4px;}
.footer-note{position:fixed; bottom:20px; right:22px; z-index:50; font-size:.72rem; color:var(--text-dim); font-family:'JetBrains Mono';}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px}

.cat-header{display:flex; gap:16px; align-items:center; margin-bottom:16px;}
.cat-header .icon-tile{width:60px;height:60px;font-size:1.5rem;}
.sub-item{background:var(--panel-2); border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:10px;}
.sub-item .sname{font-weight:700; font-size:.94rem; color:var(--accent); margin-bottom:3px;}
.sub-item .sdesc{font-size:.85rem; color:var(--text-dim); margin:0;}
.chip-count{font-family:'JetBrains Mono'; font-size:.72rem; color:var(--text-dim);}
</style>
</head>
<body>

<div class="blueprint"></div>
<div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
<div class="brand"><i class="fa-solid fa-cubes"></i> ANDIS 2 · Teórico</div>
<div class="hud"><i class="fa-solid fa-layer-group"></i> <span class="unit-tag" id="hudCurrent">1</span>/<span id="hudTotal">0</span></div>

<div class="slides-container" id="slidesContainer"></div>

<div class="nav-controls">
  <button class="nav-btn" id="prevBtn"><i class="fa-solid fa-chevron-left"></i></button>
  <div class="nav-dots" id="navDots"></div>
  <button class="nav-btn" id="nextBtn"><i class="fa-solid fa-chevron-right"></i></button>
</div>
<div class="footer-note">← → para navegar</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.10.5/sweetalert2.all.min.js"></script>
<script>
const slidesHTML = [];

// 0. Portada
slidesHTML.push(`
<div class="slide-inner d-flex flex-column justify-content-center" style="min-height:78vh;">
  <div class="animate__animated animate__fadeInDown">
    <span class="eyebrow"><i class="fa-solid fa-book"></i> Teórico · Unidad 1</span>
    <h1 class="slide-title">Atributo de calidad</h1>
    <p class="subtitle">Qué es, por qué es responsabilidad del arquitecto, y el mapa completo de características que define el estándar ISO/IEC 25010.</p>
  </div>
</div>
`);

// 1. Definición
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-circle-question"></i> Definición</span>
  <h2 class="slide-title">¿Qué es un atributo de calidad?</h2>
  <div class="card-panel mt-3">
    <div class="d-flex gap-3">
      <div class="icon-tile"><i class="fa-solid fa-ruler-combined"></i></div>
      <p style="font-size:1.05rem; line-height:1.75; margin:0;">
        Los atributos de calidad —también llamados <strong>características arquitectónicas</strong> o
        <strong>características de calidad</strong>— son propiedades <strong>medibles o comprobables</strong> de un
        sistema. Sirven para indicar qué tan bien ese sistema satisface las necesidades de los interesados,
        <strong>más allá de su funcionalidad básica</strong>.
      </p>
    </div>
  </div>
  <div class="card-panel mt-3">
    <span class="pill amber"><i class="fa-solid fa-language"></i> Otros nombres para lo mismo</span>
    <ul class="clean mt-2">
      <li>Características arquitectónicas</li>
      <li>Requerimientos no funcionales (para algunos autores)</li>
      <li>"Ilities" en inglés — por el sufijo -ility: availability, deployability, integrability...</li>
    </ul>
  </div>
</div>
`);

// 2. Atributo de calidad vs RNF
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-code-compare"></i> Precisión de vocabulario</span>
  <h2 class="slide-title">Atributo de calidad vs. requerimiento no funcional</h2>
  <div class="grid-2 mt-3">
    <div class="card-panel h-100">
      <div class="icon-tile mb-3"><i class="fa-solid fa-shapes"></i></div>
      <h6 class="fw-bold">Atributo de calidad</h6>
      <p class="small mb-0" style="color:var(--text-dim)">En este curso lo usamos como término genérico: una <strong style="color:var(--text)">característica del software</strong> que agrupa factores y sub-factores de calidad (por ejemplo, "Fiabilidad" agrupa a "Disponibilidad").</p>
    </div>
    <div class="card-panel h-100">
      <div class="icon-tile mb-3" style="background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)"><i class="fa-solid fa-file-signature"></i></div>
      <h6 class="fw-bold">Requerimiento no funcional</h6>
      <p class="small mb-0" style="color:var(--text-dim)">Es una <strong style="color:var(--text)">propiedad o cualidad concreta</strong> que un producto de software debe tener para ser aceptable para su dueño y sus operadores.</p>
    </div>
  </div>
  <div class="card-panel mt-3 d-flex gap-3 align-items-center">
    <div class="icon-tile" style="background:rgba(255,181,71,.14); color:var(--accent-3); border-color:rgba(255,181,71,.4)"><i class="fa-solid fa-user-tie"></i></div>
    <div class="small" style="color:var(--text-dim)"><strong style="color:var(--text)">Rol del arquitecto:</strong> puede colaborar en el análisis de requerimientos, pero es responsable directo de definir, descubrir y analizar los atributos de calidad — todo lo que el software debe hacer que no pertenece al dominio del problema.</div>
  </div>
</div>
`);

// 3. Característica 1
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-fingerprint"></i> Rasgo 1 de 3</span>
  <h2 class="slide-title">No pertenece al dominio del problema</h2>
  <div class="card-panel mt-3">
    <p style="font-size:1.02rem; line-height:1.75;">
      Los requerimientos especifican <strong>qué debe hacer</strong> el producto. Los atributos de calidad especifican
      <strong>criterios operativos y de diseño para el éxito</strong>: cómo implementar esos requerimientos y por qué
      tomar ciertas decisiones.
    </p>
    <div class="grid-2 mt-2">
      <div class="sub-item">
        <div class="sname"><i class="fa-solid fa-gauge-high me-1"></i>Rendimiento</div>
        <p class="sdesc">Un atributo de calidad frecuente e importante que casi nunca aparece explícito en el documento de requerimientos.</p>
      </div>
      <div class="sub-item">
        <div class="sname"><i class="fa-solid fa-triangle-exclamation me-1"></i>"Prevenir la deuda técnica"</div>
        <p class="sdesc">Ningún documento de requerimientos lo va a decir así, pero es una consideración de diseño constante para arquitectos y desarrolladores.</p>
      </div>
    </div>
  </div>
</div>
`);

// 4. Característica 2
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-fingerprint"></i> Rasgo 2 de 3</span>
  <h2 class="slide-title">Influye en un aspecto estructural del diseño</h2>
  <div class="card-panel mt-3">
    <p style="font-size:1.02rem; line-height:1.75;">
      La pregunta que se hace un arquitecto: ¿esta característica exige una <strong>consideración estructural especial</strong>
      para tener éxito? Esa es la razón principal por la que los arquitectos describen atributos de calidad en los proyectos.
    </p>
    <div class="card-panel mt-2" style="background:var(--panel-2);">
      <div class="d-flex gap-3">
        <div class="icon-tile" style="background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)"><i class="fa-solid fa-lock"></i></div>
        <p class="small mb-0" style="color:var(--text-dim)">La <strong style="color:var(--text)">seguridad</strong> preocupa en prácticamente todos los proyectos, y todo sistema toma precauciones básicas al diseñar y construir. Pero recién se <em>eleva</em> al nivel de característica arquitectónica cuando el arquitecto necesita diseñar algo especial para lograrla.</p>
      </div>
    </div>
  </div>
</div>
`);

// 5. Característica 3
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-fingerprint"></i> Rasgo 3 de 3</span>
  <h2 class="slide-title">Es crítico para el éxito del producto</h2>
  <div class="card-panel mt-3">
    <p style="font-size:1.02rem; line-height:1.75;">
      Un producto podría "admitir" una gran cantidad de atributos de calidad... pero no debería. Cada atributo adicional
      <strong>agrega complejidad</strong> al diseño.
    </p>
    <div class="card-panel mt-2" style="background:var(--panel-2);">
      <div class="d-flex gap-3 align-items-center">
        <div class="icon-tile" style="background:rgba(62,230,168,.12); color:var(--ok); border-color:rgba(62,230,168,.35)"><i class="fa-solid fa-minimize"></i></div>
        <p class="small mb-0" style="color:var(--text-dim)">La tarea fundamental del arquitecto es elegir <strong style="color:var(--text)">la menor cantidad posible</strong> de atributos de calidad — no la mayor cantidad posible.</p>
      </div>
    </div>
  </div>
</div>
`);

// 6. Intro ISO 25010
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-sitemap"></i> El estándar de referencia</span>
  <h2 class="slide-title">ISO/IEC 25010</h2>
  <div class="card-panel mt-3">
    <p style="font-size:1.02rem; line-height:1.75; margin-bottom:0;">
      Existen muchas clasificaciones y definiciones de atributos de calidad; cualquier lista será necesariamente
      incompleta. La que vamos a recorrer a continuación es la del estándar <strong>ISO/IEC 25010</strong>: nueve
      categorías, cada una con sus propias sub-características.
    </p>
  </div>
  <div class="grid-3 mt-3">
    <div class="card-panel py-3 text-center"><i class="fa-solid fa-check-double d-block mb-2" style="color:var(--accent)"></i><span class="small">Adecuación funcional</span></div>
    <div class="card-panel py-3 text-center"><i class="fa-solid fa-gauge-high d-block mb-2" style="color:var(--accent)"></i><span class="small">Eficiencia de desempeño</span></div>
    <div class="card-panel py-3 text-center"><i class="fa-solid fa-plug d-block mb-2" style="color:var(--accent)"></i><span class="small">Compatibilidad</span></div>
    <div class="card-panel py-3 text-center"><i class="fa-solid fa-hand-pointer d-block mb-2" style="color:var(--accent-2)"></i><span class="small">Capacidad de interacción</span></div>
    <div class="card-panel py-3 text-center"><i class="fa-solid fa-power-off d-block mb-2" style="color:var(--accent-2)"></i><span class="small">Fiabilidad</span></div>
    <div class="card-panel py-3 text-center"><i class="fa-solid fa-lock d-block mb-2" style="color:var(--accent-2)"></i><span class="small">Seguridad</span></div>
    <div class="card-panel py-3 text-center"><i class="fa-solid fa-screwdriver-wrench d-block mb-2" style="color:var(--accent-3)"></i><span class="small">Facilidad de mantenimiento</span></div>
    <div class="card-panel py-3 text-center"><i class="fa-solid fa-arrows-up-down-left-right d-block mb-2" style="color:var(--accent-3)"></i><span class="small">Flexibilidad</span></div>
    <div class="card-panel py-3 text-center"><i class="fa-solid fa-shield-heart d-block mb-2" style="color:var(--accent-3)"></i><span class="small">Protección</span></div>
  </div>
</div>
`);

// Helper para armar slide de categoría
function categoriaSlide(icon, color, nombre, definicion, subs){
  const subsHtml = subs.map(s=>`
    <div class="sub-item">
      <div class="sname">${s.n}</div>
      <p class="sdesc">${s.d}</p>
    </div>`).join('');
  return `
  <div class="slide-inner">
    <div class="cat-header">
      <div class="icon-tile" style="background:${color}22; color:${color}; border-color:${color}55"><i class="fa-solid ${icon}"></i></div>
      <div>
        <span class="eyebrow mb-0"><i class="fa-solid fa-layer-group"></i> ISO/IEC 25010</span>
        <h2 class="slide-title mb-0">${nombre}</h2>
      </div>
    </div>
    <div class="card-panel">
      <p style="font-size:1rem; line-height:1.7; margin-bottom:16px;">${definicion}</p>
      <span class="chip-count"><i class="fa-solid fa-list-ul me-1"></i>${subs.length} sub-características</span>
      <div class="mt-2">${subsHtml}</div>
    </div>
  </div>`;
}

// 7. Adecuación funcional
slidesHTML.push(categoriaSlide('fa-check-double', '#3ec1ff', 'Adecuación funcional',
  'Representa la capacidad del producto software para proporcionar funciones que satisfacen las necesidades declaradas e implícitas de los usuarios, cuando el producto se usa en las condiciones especificadas.',
  [
    {n:'Completitud funcional', d:'Grado en el que el conjunto de funcionalidades del producto cubre todas las tareas y objetivos de usuario especificados.'},
    {n:'Corrección funcional', d:'Capacidad del producto o sistema para proveer resultados exactos cuando es usado por los usuarios especificados.'},
    {n:'Pertinencia funcional', d:'Capacidad del producto software para proporcionar un conjunto de funciones que facilitan la consecución de tareas y objetivos de usuario especificados.'}
  ]));

// 8. Eficiencia de desempeño
slidesHTML.push(categoriaSlide('fa-gauge-high', '#3ec1ff', 'Eficiencia de desempeño',
  'Representa el desempeño de un producto al realizar sus funciones dentro de parámetros de tiempo y rendimiento especificados, con un uso eficiente de recursos de CPU, memoria, almacenamiento y energía bajo determinadas condiciones.',
  [
    {n:'Comportamiento temporal', d:'Grado en que un producto realiza sus funciones de forma que el tiempo de respuesta y el ratio de rendimiento cumplen los requerimientos especificados.'},
    {n:'Utilización de recursos', d:'Grado en que la cantidad y tipos de recursos utilizados por el producto no exceden lo especificado, bajo condiciones determinadas.'},
    {n:'Capacidad', d:'Grado en que el producto cumple los requerimientos relativos a límites máximos de un parámetro (ítems almacenados, usuarios concurrentes, ancho de banda...).'}
  ]));

// 9. Compatibilidad
slidesHTML.push(categoriaSlide('fa-plug', '#3ec1ff', 'Compatibilidad',
  'Capacidad de un producto de intercambiar información con otros productos y/o llevar a cabo sus funciones requeridas cuando comparten un mismo entorno y recursos.',
  [
    {n:'Coexistencia', d:'Capacidad del producto para coexistir con otro software independiente, en un entorno común, compartiendo recursos sin detrimento.'},
    {n:'Interoperabilidad', d:'Capacidad de dos o más sistemas o componentes para intercambiar información y utilizar la información intercambiada.'}
  ]));

// 10. Capacidad de interacción
slidesHTML.push(categoriaSlide('fa-hand-pointer', '#7b6bff', 'Capacidad de interacción',
  'Capacidad del producto software para que el usuario interactúe mediante su interfaz, intercambiando información para completar determinadas tareas.',
  [
    {n:'Capacidad de reconocer la adecuación', d:'Permite al usuario entender si el software es adecuado para sus necesidades.'},
    {n:'Facilidad de aprendizaje', d:'Permite al usuario aprender su funcionamiento dentro de un tiempo especificado.'},
    {n:'Facilidad de operación', d:'Permite al usuario operarlo y controlarlo con facilidad.'},
    {n:'Protección contra errores de usuario', d:'Capacidad del sistema para prevenir errores en su operación.'},
    {n:'Participación del usuario', d:'Presenta sus funciones e información de forma atractiva y motivadora, fomentando la interacción continua.'},
    {n:'Inclusión', d:'Puede ser utilizado por personas con distintos contextos: edad, habilidades, cultura, lenguaje, género...'},
    {n:'Asistencia al usuario', d:'Permite que sea utilizado por usuarios con determinadas características y capacidades logrando objetivos específicos.'},
    {n:'Autodescripción', d:'Presenta la información adecuada, haciendo su uso evidente sin interacciones excesivas con otros recursos (documentación, help desk...).'}
  ]));

// 11. Fiabilidad
slidesHTML.push(categoriaSlide('fa-power-off', '#7b6bff', 'Fiabilidad',
  'Capacidad de un sistema o componente para desempeñar las funciones especificadas, bajo condiciones y un período de tiempo determinados, sin interrupciones ni fallos.',
  [
    {n:'Ausencia de fallos', d:'Capacidad del sistema de llevar a cabo sus funciones sin fallos, bajo condiciones normales de operación.'},
    {n:'Disponibilidad', d:'Capacidad del sistema o componente de estar operativo y accesible para su uso cuando se requiere.'},
    {n:'Tolerancia a fallos', d:'Capacidad del sistema o componente para operar según lo previsto en presencia de fallos de hardware o software.'},

/* ============ MOTOR DE NAVEGACIÓN ============ */
const container = document.getElementById('slidesContainer');
slidesHTML.forEach((html, i)=>{
  const div = document.createElement('div');
  div.className = 'slide' + (i===0 ? ' active' : '');
  div.id = 'slide'+i;
  div.innerHTML = html;
  container.appendChild(div);
});

let current = 0;
const total = slidesHTML.length;
document.getElementById('hudTotal').textContent = total;

const dotsWrap = document.getElementById('navDots');
for(let i=0;i<total;i++){
  const d = document.createElement('div');
  d.className = 'dot' + (i===0?' active':'');
  d.onclick = ()=>goTo(i);
  dotsWrap.appendChild(d);
}

function updateUI(){
  document.querySelectorAll('.slide').forEach((s,i)=>{ s.classList.toggle('active', i===current); });
  document.querySelectorAll('.nav-dots .dot').forEach((d,i)=>{ d.classList.toggle('active', i===current); });
  document.getElementById('hudCurrent').textContent = current+1;
  document.getElementById('progressFill').style.width = ((current+1)/total*100)+'%';
  const active = document.getElementById('slide'+current);
  active.scrollTop = 0;
  const animTarget = active.querySelector('.slide-inner');
  if(animTarget){
    animTarget.classList.remove('animate__fadeIn');
    void animTarget.offsetWidth;
    animTarget.classList.add('animate__animated','animate__fadeIn');
  }
}
function goTo(i){ if(i<0||i>=total) return; current = i; updateUI(); }
document.getElementById('prevBtn').onclick = ()=>goTo(current-1);
document.getElementById('nextBtn').onclick = ()=>goTo(current+1);
document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight') goTo(current+1);
  if(e.key==='ArrowLeft') goTo(current-1);
});
updateUI();

/* ============ QUIZ — posiciones y longitudes de respuesta variadas ============ */
const preguntas = [
  {
    texto: '¿Qué tipo de consideración especifica un atributo de calidad, según el texto?',
    opciones: {
      a:'Una funcionalidad que el sistema debe ejecutar paso a paso',
      b:'Una regla de negocio validada por el área comercial',
      c:'Un criterio operativo o de diseño para el éxito de la implementación',
      d:'Un caso de uso adicional no cubierto en el relevamiento inicial'
    },
    correcta:'c'
  },
  {
    texto:'¿Qué sub-característica de Fiabilidad permite restablecer el estado deseado del sistema tras un fallo?',
    opciones: {
      a:'Capacidad de recuperación',
      b:'Tolerancia a fallos',
      c:'Disponibilidad',
      d:'Ausencia de fallos'
    },
    correcta:'a'
  },
  {
    texto:'¿En qué categoría de ISO/IEC 25010 se ubica la sub-característica "Interoperabilidad"?',
    opciones: {
      a:'Capacidad de interacción',
      b:'Facilidad de mantenimiento',
      c:'Fiabilidad',
      d:'Compatibilidad'
    },
    correcta:'d'
  },
  {
    texto:'¿Cuál de estas NO es una sub-característica de Seguridad?',
    opciones: {
      a:'Confidencialidad',
      b:'Escalabilidad',
      c:'No repudio',
      d:'Autenticidad'
    },
    correcta:'b'
  },
  {
    texto:'Según el texto, ¿por qué un arquitecto debería elegir pocos atributos de calidad en vez de muchos?',
    opciones: {
      a:'Porque el cliente solo paga por uno',
      b:'Porque ISO 25010 limita la cantidad permitida por proyecto',
      c:'Porque cada atributo adicional agrega complejidad al diseño',
      d:'Porque los atributos de calidad son mutuamente excluyentes'
    },
    correcta:'c'
  }
];
let idxPregunta = 0, aciertos = 0;

function lanzarQuiz(){ idxPregunta = 0; aciertos = 0; mostrarPregunta(); }
function mostrarPregunta(){
  if(idxPregunta >= preguntas.length){
    Swal.fire({
      title:'Resultado',
      html:`Acertaste <b>${aciertos}/${preguntas.length}</b>.`,
      icon: aciertos===preguntas.length ? 'success' : 'info',
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    });
    return;
  }
  const p = preguntas[idxPregunta];
  Swal.fire({
    title: p.texto,
    input:'radio',
    inputOptions: p.opciones,
    background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff',
    confirmButtonText:'Responder',
    inputValidator: (value)=> !value && 'Elegí una opción'
  }).then(res=>{
    if(!res.isConfirmed) return;
    const ok = res.value === p.correcta;
    if(ok) aciertos++;
    Swal.fire({
      title: ok ? '¡Correcto!' : 'No es así',
      html: `La respuesta correcta era: <b>${p.opciones[p.correcta]}</b>`,
      icon: ok ? 'success' : 'error',
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    }).then(()=>{ idxPregunta++; mostrarPregunta(); });
  });
}
</script>

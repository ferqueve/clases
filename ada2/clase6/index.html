<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANDIS 2 · Teórico — Rendimiento</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#070b14; --bg-1:#0d1424; --panel:#111a2e; --panel-2:#16223a;
  --accent:#3ec1ff; --accent-2:#7b6bff; --accent-3:#ffb547; --ok:#3ee6a8;
  --text:#e8edf7; --text-dim:#8fa0bd; --border:#22304d;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(1200px 700px at 15% -10%, rgba(62,193,255,.10), transparent 60%),
    radial-gradient(1000px 700px at 110% 10%, rgba(123,107,255,.12), transparent 55%),
    var(--bg-0);
  color:var(--text); font-family:'Inter',sans-serif; overflow:hidden;
}
.mono{font-family:'JetBrains Mono',monospace}
.blueprint{
  position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.35;
  background-image:linear-gradient(rgba(62,193,255,.06) 1px, transparent 1px),linear-gradient(90deg, rgba(62,193,255,.06) 1px, transparent 1px);
  background-size:42px 42px;
}
.progress-track{position:fixed; top:0; left:0; width:100%; height:4px; background:rgba(255,255,255,.06); z-index:50;}
.progress-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--accent-2)); transition:width .4s ease; box-shadow:0 0 12px var(--accent);}
.hud{position:fixed; top:14px; right:18px; z-index:50; background:rgba(17,26,46,.85); border:1px solid var(--border); backdrop-filter:blur(6px); padding:7px 14px; border-radius:999px; font-size:.82rem; color:var(--text-dim); display:flex; align-items:center; gap:8px;}
.hud .unit-tag{color:var(--accent); font-weight:700}
.brand{position:fixed; top:14px; left:18px; z-index:50; font-size:.78rem; color:var(--text-dim); display:flex; align-items:center; gap:8px; letter-spacing:.03em;}
.brand i{color:var(--accent-3)}
.slides-container{position:relative; z-index:1; height:100vh; width:100vw;}
.slide{position:absolute; inset:0; display:none; padding:90px 8vw 110px 8vw; overflow-y:auto;}
.slide.active{display:block}
.slide-inner{max-width:1180px; margin:0 auto;}
.eyebrow{display:inline-flex; align-items:center; gap:8px; font-size:.78rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent); font-weight:700; margin-bottom:14px;}
.eyebrow i{font-size:.9rem}
h1.slide-title{font-size:clamp(1.9rem,3.4vw,3rem); font-weight:800; margin-bottom:.4rem; line-height:1.1;}
h2.slide-title{font-size:clamp(1.5rem,2.6vw,2.2rem); font-weight:800; margin-bottom:.6rem;}
.subtitle{color:var(--text-dim); font-size:1.05rem; max-width:820px;}
.card-panel{background:linear-gradient(180deg, var(--panel), var(--panel-2)); border:1px solid var(--border); border-radius:16px; padding:26px 28px; box-shadow:0 12px 30px rgba(0,0,0,.35);}
.card-panel + .card-panel{margin-top:18px}
.pill{display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:999px; font-size:.76rem; font-weight:700; background:rgba(62,193,255,.12); color:var(--accent); border:1px solid rgba(62,193,255,.35);}
.pill.purple{background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)}
.pill.amber{background:rgba(255,181,71,.14); color:var(--accent-3); border-color:rgba(255,181,71,.4)}
.pill.ok{background:rgba(62,230,168,.12); color:var(--ok); border-color:rgba(62,230,168,.35)}
.icon-tile{width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center; background:rgba(62,193,255,.12); color:var(--accent); font-size:1.3rem; border:1px solid rgba(62,193,255,.3); flex-shrink:0;}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
@media (max-width:900px){.grid-2,.grid-3{grid-template-columns:1fr;}}
ul.clean{list-style:none; margin:0; padding:0;}
ul.clean li{position:relative; padding:6px 0 6px 26px; color:var(--text); font-size:.94rem;}
ul.clean li::before{content:"\f105"; font-family:"Font Awesome 6 Free"; font-weight:900; color:var(--accent); position:absolute; left:2px; top:8px; font-size:.85rem;}
.check-btn{border:none; background:linear-gradient(90deg,var(--accent),var(--accent-2)); color:#04101f; font-weight:800; padding:10px 22px; border-radius:10px; font-size:.9rem; box-shadow:0 8px 22px rgba(62,193,255,.25); cursor:pointer;}
.check-btn:hover{filter:brightness(1.08); color:#04101f;}
.nav-controls{position:fixed; bottom:18px; left:0; right:0; z-index:50; display:flex; justify-content:center; gap:14px; align-items:center;}
.nav-btn{width:46px; height:46px; border-radius:50%; border:1px solid var(--border); background:rgba(17,26,46,.9); color:var(--text); display:flex; align-items:center; justify-content:center; font-size:1.1rem; backdrop-filter:blur(6px);}
.nav-btn:hover{border-color:var(--accent); color:var(--accent);}
.nav-dots{display:flex; gap:6px; align-items:center; background:rgba(17,26,46,.9); border:1px solid var(--border); padding:8px 14px; border-radius:999px;}
.nav-dots .dot{width:7px; height:7px; border-radius:50%; background:var(--border); cursor:pointer; transition:.2s;}
.nav-dots .dot.active{background:var(--accent); width:20px; border-radius:4px;}
.footer-note{position:fixed; bottom:20px; right:22px; z-index:50; font-size:.72rem; color:var(--text-dim); font-family:'JetBrains Mono';}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px}

.sub-item{background:var(--panel-2); border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:10px;}
.sub-item .sname{font-weight:700; font-size:.94rem; color:var(--accent); margin-bottom:4px; display:flex; align-items:center; gap:8px;}
.sub-item .sdesc{font-size:.85rem; color:var(--text-dim); margin:0;}

.link-row{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid rgba(255,255,255,.06);}
.link-row:last-child{border-bottom:none;}
.link-row a{color:var(--text); text-decoration:none; font-weight:600;}
.link-row a:hover{color:var(--accent);}
.link-row .ext{margin-left:auto; color:var(--text-dim); font-size:.75rem;}

/* latency timeline bar */
.tl-bar{position:relative; height:56px; border-radius:12px; overflow:hidden; display:flex; border:1px solid var(--border); margin:18px 0 8px 0;}
.tl-seg{display:flex; align-items:center; justify-content:center; font-size:.78rem; font-weight:700; color:#04101f;}
.tl-seg.latencia{background:var(--accent-3); flex:0 0 25%;}
.tl-seg.procesamiento{background:var(--accent); flex:0 0 45%;}
.tl-seg.bloqueo{background:var(--accent-2); flex:0 0 30%; color:#fff;}
.tl-labels{display:flex; font-size:.72rem; color:var(--text-dim); margin-top:4px;}
.tl-labels span{flex:1; text-align:center;}
.tl-brace{text-align:center; font-size:.72rem; color:var(--text-dim); margin-top:10px;}
</style>
</head>
<body>

<div class="blueprint"></div>
<div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
<div class="brand"><i class="fa-solid fa-cubes"></i> ANDIS 2 · Teórico</div>
<div class="hud"><i class="fa-solid fa-layer-group"></i> <span class="unit-tag" id="hudCurrent">1</span>/<span id="hudTotal">0</span></div>

<div class="slides-container" id="slidesContainer"></div>

<div class="nav-controls">
  <button class="nav-btn" id="prevBtn"><i class="fa-solid fa-chevron-left"></i></button>
  <div class="nav-dots" id="navDots"></div>
  <button class="nav-btn" id="nextBtn"><i class="fa-solid fa-chevron-right"></i></button>
</div>
<div class="footer-note">← → para navegar</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.10.5/sweetalert2.all.min.js"></script>
<script>
const slidesHTML = [];

// 0. Portada
slidesHTML.push(`
<div class="slide-inner d-flex flex-column justify-content-center" style="min-height:78vh;">
  <div class="animate__animated animate__fadeInDown">
    <span class="eyebrow"><i class="fa-solid fa-gauge-high"></i> Teórico · Unidad 1</span>
    <h1 class="slide-title">Rendimiento</h1>
    <p class="subtitle">Performance: cuánto tarda el sistema en responder, cuánto trabajo puede sostener, y qué tácticas y patrones existen para mejorarlo.</p>
  </div>
</div>
`);

// 1. Definición
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-circle-question"></i> Definición</span>
  <h2 class="slide-title">¿Qué es el rendimiento?</h2>
  <div class="card-panel mt-3">
    <div class="d-flex gap-3">
      <div class="icon-tile"><i class="fa-solid fa-stopwatch"></i></div>
      <p style="font-size:1.05rem; line-height:1.75; margin:0;">
        El <strong>rendimiento</strong> (performance) es un atributo de calidad de una arquitectura de software que
        define la <strong>capacidad</strong> de un sistema o componente para cumplir con sus funciones dentro de
        <strong>límites de tiempo aceptables</strong>.
      </p>
    </div>
  </div>
  <div class="card-panel mt-3">
    <span class="pill amber"><i class="fa-solid fa-clock"></i> Todo lleva tiempo</span>
    <ul class="clean mt-2">
      <li>Cálculos en el procesador: del orden de <strong>nanosegundos</strong></li>
      <li>Acceso a disco (SSD o mecánico): del orden de <strong>milisegundos</strong></li>
      <li>Acceso a la red: desde cientos de <strong>microsegundos</strong> (mismo datacenter) hasta más de <strong>100 ms</strong> hacia la nube</li>
    </ul>
  </div>
</div>
`);

// 2. Relación con ISO 25010 y Azure WAF
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-diagram-project"></i> Precisión de vocabulario</span>
  <h2 class="slide-title">Rendimiento vs. eficiencia de desempeño</h2>
  <div class="card-panel mt-3">
    <div class="d-flex gap-3">
      <div class="icon-tile"><i class="fa-solid fa-triangle-exclamation"></i></div>
      <p style="font-size:1.02rem; line-height:1.75; margin:0;">
        ISO/IEC 25010 <strong>no define</strong> un atributo llamado "rendimiento" con este significado. Lo más
        cercano es la sub-característica <strong>comportamiento temporal</strong>, dentro de la categoría más amplia
        <strong>eficiencia de desempeño</strong> — que además incluye <em>utilización de recursos</em> y
        <em>capacidad</em>.
      </p>
    </div>
  </div>
  <div class="card-panel mt-3 d-flex gap-3 align-items-center">
    <div class="icon-tile" style="background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)"><i class="fa-solid fa-cloud"></i></div>
    <div class="small" style="color:var(--text-dim)">En el <strong style="color:var(--text)">Azure Well-Architected Framework</strong>, el pilar equivalente es <strong style="color:var(--text)">"rendimiento eficiente"</strong> (performance efficiency), que también combina comportamiento temporal con utilización de recursos y capacidad.</div>
  </div>
</div>
`);

// 3. Componentes del rendimiento
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-puzzle-piece"></i> Cinco componentes</span>
  <h2 class="slide-title">Componentes del rendimiento</h2>
  <div class="grid-2 mt-3">
    <div class="sub-item">
      <div class="sname"><i class="fa-solid fa-reply"></i>Tiempo de respuesta</div>
      <p class="sdesc">El tiempo que tarda el sistema en responder a una solicitud, desde que se inicia la acción hasta que se recibe la respuesta.</p>
    </div>
    <div class="sub-item">
      <div class="sname"><i class="fa-solid fa-gauge"></i>Throughput</div>
      <p class="sdesc">Cantidad de trabajo que el sistema realiza en un período dado: transacciones/seg, solicitudes/seg, bytes/seg transmitidos...</p>
    </div>
    <div class="sub-item">
      <div class="sname"><i class="fa-solid fa-microchip"></i>Utilización de recursos</div>
      <p class="sdesc">Cantidad de CPU, memoria, disco o red usada para una tarea, expresada como porcentaje del total disponible.</p>
    </div>
    <div class="sub-item">
      <div class="sname"><i class="fa-solid fa-arrows-up-down-left-right"></i>Capacidad de escalabilidad</div>
      <p class="sdesc">Capacidad de mantener el rendimiento cuando crece la carga de trabajo o el número de usuarios.</p>
    </div>
  </div>
  <div class="card-panel mt-2">
    <div class="sname mb-1"><i class="fa-solid fa-hourglass-half"></i>Latencia</div>
    <p class="sdesc mb-0">Tiempo de espera para comenzar a procesar una solicitud — es parte del tiempo de respuesta, pero excluye el tiempo de procesamiento en sí.</p>
  </div>
</div>
`);

// 4. Diagrama tiempo de respuesta
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-timeline"></i> Cómo se compone el tiempo de respuesta</span>
  <h2 class="slide-title">Procesamiento vs. bloqueo</h2>
  <div class="card-panel mt-3">
    <p style="font-size:1rem; line-height:1.7;">
      Entre que llega una solicitud y se completa la respuesta, el sistema está en uno de dos estados: <strong>trabajando</strong>
      activamente (consumiendo recursos) o <strong>bloqueado</strong> (sin poder avanzar).
    </p>
    <div class="tl-bar">
      <div class="tl-seg latencia">Latencia</div>
      <div class="tl-seg procesamiento">Procesamiento</div>
      <div class="tl-seg bloqueo">Bloqueo</div>
    </div>
    <div class="tl-brace">← Tiempo de respuesta →</div>
  </div>
  <div class="grid-2 mt-3">
    <div class="sub-item">
      <div class="sname"><i class="fa-solid fa-bolt"></i>Tiempo de procesamiento y uso de recursos</div>
      <p class="sdesc">El sistema trabaja activamente y consume recursos para generar la respuesta.</p>
    </div>
    <div class="sub-item">
      <div class="sname"><i class="fa-solid fa-hand"></i>Tiempo de bloqueo y contención de recursos</div>
      <p class="sdesc">El sistema no puede avanzar: espera un recurso, otra operación, o su disponibilidad.</p>
    </div>
  </div>
</div>
`);

// 5. Tácticas
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-compass"></i> Cómo se ataca</span>
  <h2 class="slide-title">Tácticas para el rendimiento</h2>
  <p class="subtitle mb-3">Se agrupan según si atacan el tiempo de procesamiento o el tiempo de bloqueo.</p>
  <div class="grid-2">
    <div class="sub-item"><div class="sname"><i class="fa-solid fa-microchip"></i>Tiempo de procesamiento y uso de los recursos</div></div>
    <div class="sub-item"><div class="sname"><i class="fa-solid fa-hourglass"></i>Tiempo de bloqueo y contención de recursos</div></div>
    <div class="sub-item"><div class="sname"><i class="fa-solid fa-people-group"></i>Contención de los recursos</div></div>
    <div class="sub-item"><div class="sname"><i class="fa-solid fa-warehouse"></i>Disponibilidad de recursos</div></div>
  </div>
  <div class="sub-item mt-0"><div class="sname"><i class="fa-solid fa-link"></i>Dependencia de otras operaciones</div></div>
  <div class="card-panel mt-3">
    <div class="link-row">
      <i class="fa-solid fa-link" style="color:var(--accent)"></i>
      <a href="https://github.com/ucudal/ANDIS_Conceptos/blob/main/2_Tecnicas_y_herramientas/2_05_.Tacticas_arquitectura/2_05_02_Tacticas_rendimiento.md" target="_blank">Tácticas para rendimiento — desarrollo completo</a>
      <span class="ext">repositorio</span>
    </div>
  </div>
</div>
`);

// 6. Patrones y PASA
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-book-open-reader"></i> Para profundizar</span>
  <h2 class="slide-title">Patrones y evaluación del rendimiento</h2>
  <div class="card-panel mt-3">
    <span class="pill purple"><i class="fa-solid fa-shapes"></i> Patrones</span>
    <div class="link-row mt-2">
      <i class="fa-solid fa-link" style="color:var(--accent)"></i>
      <a href="https://learn.microsoft.com/en-us/azure/well-architected/performance-efficiency/design-patterns" target="_blank">Cloud design patterns that support performance efficiency</a>
      <span class="ext">Azure Well-Architected Framework</span>
    </div>
  </div>
  <div class="card-panel mt-3">
    <span class="pill amber"><i class="fa-solid fa-magnifying-glass-chart"></i> Evaluación</span>
    <div class="link-row mt-2">
      <i class="fa-solid fa-link" style="color:var(--accent)"></i>
      <a href="https://github.com/ucudal/ANDIS_Conceptos/blob/main/2_Tecnicas_y_herramientas/2_10_.Evaluacion_arquitectura/2_10_4_PASA.md" target="_blank">Método PASA de evaluación del rendimiento</a>
      <span class="ext">repositorio</span>
    </div>
  </div>
</div>
`);

// 7. Quiz
slidesHTML.push(`
<div class="slide-inner d-flex flex-column justify-content-center align-items-center text-center" style="min-height:70vh;">
  <span class="eyebrow"><i class="fa-solid fa-brain"></i> Chequeo de comprensión</span>
  <h2 class="slide-title">5 preguntas sobre rendimiento</h2>
  <p class="subtitle mb-4">Definición, componentes, relación con ISO 25010 y tácticas.</p>
  <button class="check-btn" onclick="lanzarQuiz()"><i class="fa-solid fa-play me-2"></i>Iniciar quiz</button>
</div>
`);

// 8. Cierre
slidesHTML.push(`
<div class="slide-inner d-flex flex-column justify-content-center align-items-center text-center" style="min-height:78vh;">
  <div class="icon-tile mb-3" style="width:72px;height:72px;font-size:2rem;"><i class="fa-solid fa-check"></i></div>
  <span class="eyebrow"><i class="fa-solid fa-flag-checkered"></i> Repaso completo</span>
  <h2 class="slide-title">Rendimiento: tiempo, throughput y recursos</h2>
  <p class="subtitle mb-4" style="max-width:640px;">Cada milisegundo de latencia tiene un origen físico: procesador, disco o red. Próxima lectura: Protección.</p>
</div>
`);

/* ============ MOTOR DE NAVEGACIÓN ============ */
const container = document.getElementById('slidesContainer');
slidesHTML.forEach((html, i)=>{
  const div = document.createElement('div');
  div.className = 'slide' + (i===0 ? ' active' : '');
  div.id = 'slide'+i;
  div.innerHTML = html;
  container.appendChild(div);
});

let current = 0;
const total = slidesHTML.length;
document.getElementById('hudTotal').textContent = total;

const dotsWrap = document.getElementById('navDots');
for(let i=0;i<total;i++){
  const d = document.createElement('div');
  d.className = 'dot' + (i===0?' active':'');
  d.onclick = ()=>goTo(i);
  dotsWrap.appendChild(d);
}

function updateUI(){
  document.querySelectorAll('.slide').forEach((s,i)=>{ s.classList.toggle('active', i===current); });
  document.querySelectorAll('.nav-dots .dot').forEach((d,i)=>{ d.classList.toggle('active', i===current); });
  document.getElementById('hudCurrent').textContent = current+1;
  document.getElementById('progressFill').style.width = ((current+1)/total*100)+'%';
  const active = document.getElementById('slide'+current);
  active.scrollTop = 0;
  const animTarget = active.querySelector('.slide-inner');
  if(animTarget){
    animTarget.classList.remove('animate__fadeIn');
    void animTarget.offsetWidth;
    animTarget.classList.add('animate__animated','animate__fadeIn');
  }
}
function goTo(i){ if(i<0||i>=total) return; current = i; updateUI(); }
document.getElementById('prevBtn').onclick = ()=>goTo(current-1);
document.getElementById('nextBtn').onclick = ()=>goTo(current+1);
document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight') goTo(current+1);
  if(e.key==='ArrowLeft') goTo(current-1);
});
updateUI();

/* ============ QUIZ — posiciones y longitudes de respuesta variadas ============ */
const preguntas = [
  {
    texto:'¿Qué define el rendimiento (performance) de un sistema, según el texto?',
    opciones:{
      a:'La capacidad de cumplir sus funciones dentro de límites de tiempo aceptables',
      b:'La cantidad de funcionalidades que ofrece al usuario final',
      c:'El costo de infraestructura necesario para operar el sistema',
      d:'La facilidad con la que se puede modificar el código fuente'
    },
    correcta:'a'
  },
  {
    texto:'¿Con qué sub-característica de ISO/IEC 25010 se relaciona más de cerca lo que este texto llama "rendimiento"?',
    opciones:{
      a:'Capacidad',
      b:'Utilización de recursos',
      c:'Comportamiento temporal',
      d:'Escalabilidad'
    },
    correcta:'c'
  },
  {
    texto:'¿Qué mide el throughput de un sistema?',
    opciones:{
      a:'El tiempo que tarda en responder una única solicitud',
      b:'La cantidad de trabajo realizado en un período de tiempo dado',
      c:'El porcentaje de CPU utilizado durante un pico de carga',
      d:'El tiempo de espera antes de comenzar a procesar una solicitud'
    },
    correcta:'b'
  },
  {
    texto:'¿Qué es la latencia, según el texto?',
    opciones:{
      a:'El tiempo de espera para comenzar a procesar una solicitud, sin incluir el procesamiento en sí',
      b:'Sinónimo exacto de tiempo de respuesta',
      c:'La cantidad de solicitudes procesadas por segundo',
      d:'El tiempo total que un sistema pasa bloqueado en un día'
    },
    correcta:'a'
  },
  {
    texto:'En el Azure Well-Architected Framework, ¿cómo se llama el pilar equivalente al rendimiento?',
    opciones:{
      a:'Reliability',
      b:'Operational excellence',
      c:'Cost optimization',
      d:'Performance efficiency'
    },
    correcta:'d'
  }
];
let idxPregunta = 0, aciertos = 0;

function lanzarQuiz(){ idxPregunta = 0; aciertos = 0; mostrarPregunta(); }
function mostrarPregunta(){
  if(idxPregunta >= preguntas.length){
    Swal.fire({
      title:'Resultado',
      html:`Acertaste <b>${aciertos}/${preguntas.length}</b>.`,
      icon: aciertos===preguntas.length ? 'success' : 'info',
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    });
    return;
  }
  const p = preguntas[idxPregunta];
  Swal.fire({
    title: p.texto,
    input:'radio',
    inputOptions: p.opciones,
    background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff',
    confirmButtonText:'Responder',
    inputValidator: (value)=> !value && 'Elegí una opción'
  }).then(res=>{
    if(!res.isConfirmed) return;
    const ok = res.value === p.correcta;
    if(ok) aciertos++;
    Swal.fire({
      title: ok ? '¡Correcto!' : 'No es así',
      html: `La respuesta correcta era: <b>${p.opciones[p.correcta]}</b>`,
      icon: ok ? 'success' : 'error',
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    }).then(()=>{ idxPregunta++; mostrarPregunta(); });
  });
}
</script>

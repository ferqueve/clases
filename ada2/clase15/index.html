<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANDIS 2 · Unidad 2 — Tácticas para la facilidad de modificación</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#070b14; --bg-1:#0d1424; --panel:#111a2e; --panel-2:#16223a;
  --accent:#3ec1ff; --accent-2:#7b6bff; --accent-3:#ffb547; --ok:#3ee6a8;
  --text:#e8edf7; --text-dim:#8fa0bd; --border:#22304d;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(1200px 700px at 15% -10%, rgba(62,193,255,.10), transparent 60%),
    radial-gradient(1000px 700px at 110% 10%, rgba(123,107,255,.12), transparent 55%),
    var(--bg-0);
  color:var(--text); font-family:'Inter',sans-serif; overflow:hidden;
}
.mono{font-family:'JetBrains Mono',monospace}
.blueprint{
  position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.35;
  background-image:linear-gradient(rgba(62,193,255,.06) 1px, transparent 1px),linear-gradient(90deg, rgba(62,193,255,.06) 1px, transparent 1px);
  background-size:42px 42px;
}
.progress-track{position:fixed; top:0; left:0; width:100%; height:4px; background:rgba(255,255,255,.06); z-index:50;}
.progress-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--accent-2)); transition:width .4s ease; box-shadow:0 0 12px var(--accent);}
.hud{position:fixed; top:14px; right:18px; z-index:50; background:rgba(17,26,46,.85); border:1px solid var(--border); backdrop-filter:blur(6px); padding:7px 14px; border-radius:999px; font-size:.82rem; color:var(--text-dim); display:flex; align-items:center; gap:8px;}
.hud .unit-tag{color:var(--accent); font-weight:700}
.brand{position:fixed; top:14px; left:18px; z-index:50; font-size:.78rem; color:var(--text-dim); display:flex; align-items:center; gap:8px; letter-spacing:.03em;}
.brand i{color:var(--accent-3)}
.slides-container{position:relative; z-index:1; height:100vh; width:100vw;}
.slide{position:absolute; inset:0; display:none; padding:90px 8vw 110px 8vw; overflow-y:auto;}
.slide.active{display:block}
.slide-inner{max-width:1180px; margin:0 auto;}
.eyebrow{display:inline-flex; align-items:center; gap:8px; font-size:.78rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent); font-weight:700; margin-bottom:14px;}
.eyebrow i{font-size:.9rem}
h1.slide-title{font-size:clamp(1.9rem,3.4vw,3rem); font-weight:800; margin-bottom:.4rem; line-height:1.1;}
h2.slide-title{font-size:clamp(1.5rem,2.6vw,2.2rem); font-weight:800; margin-bottom:.6rem;}
.subtitle{color:var(--text-dim); font-size:1.05rem; max-width:820px;}
.card-panel{background:linear-gradient(180deg, var(--panel), var(--panel-2)); border:1px solid var(--border); border-radius:16px; padding:26px 28px; box-shadow:0 12px 30px rgba(0,0,0,.35);}
.card-panel + .card-panel{margin-top:18px}
.pill{display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:999px; font-size:.76rem; font-weight:700; background:rgba(62,193,255,.12); color:var(--accent); border:1px solid rgba(62,193,255,.35);}
.pill.purple{background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)}
.pill.amber{background:rgba(255,181,71,.14); color:var(--accent-3); border-color:rgba(255,181,71,.4)}
.pill.ok{background:rgba(62,230,168,.12); color:var(--ok); border-color:rgba(62,230,168,.35)}
.icon-tile{width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center; background:rgba(62,193,255,.12); color:var(--accent); font-size:1.3rem; border:1px solid rgba(62,193,255,.3); flex-shrink:0;}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
@media (max-width:900px){.grid-2,.grid-3{grid-template-columns:1fr;}}
ul.clean{list-style:none; margin:0; padding:0;}
ul.clean li{position:relative; padding:6px 0 6px 26px; color:var(--text); font-size:.94rem;}
ul.clean li::before{content:"\f105"; font-family:"Font Awesome 6 Free"; font-weight:900; color:var(--accent); position:absolute; left:2px; top:8px; font-size:.85rem;}
.check-btn{border:none; background:linear-gradient(90deg,var(--accent),var(--accent-2)); color:#04101f; font-weight:800; padding:10px 22px; border-radius:10px; font-size:.9rem; box-shadow:0 8px 22px rgba(62,193,255,.25); cursor:pointer;}
.check-btn:hover{filter:brightness(1.08); color:#04101f;}
.nav-controls{position:fixed; bottom:18px; left:0; right:0; z-index:50; display:flex; justify-content:center; gap:14px; align-items:center;}
.nav-btn{width:46px; height:46px; border-radius:50%; border:1px solid var(--border); background:rgba(17,26,46,.9); color:var(--text); display:flex; align-items:center; justify-content:center; font-size:1.1rem; backdrop-filter:blur(6px);}
.nav-btn:hover{border-color:var(--accent); color:var(--accent);}
.nav-dots{display:flex; gap:6px; align-items:center; background:rgba(17,26,46,.9); border:1px solid var(--border); padding:8px 14px; border-radius:999px;}
.nav-dots .dot{width:7px; height:7px; border-radius:50%; background:var(--border); cursor:pointer; transition:.2s;}
.nav-dots .dot.active{background:var(--accent); width:20px; border-radius:4px;}
.footer-note{position:fixed; bottom:20px; right:22px; z-index:50; font-size:.72rem; color:var(--text-dim); font-family:'JetBrains Mono';}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px}

.tac-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
@media (max-width:900px){.tac-grid{grid-template-columns:repeat(2,1fr);}}
.tac-tile{
  background:var(--panel-2); border:1px solid var(--border); border-radius:14px; padding:16px;
  cursor:pointer; transition:.2s; text-align:center;
}
.tac-tile:hover{transform:translateY(-4px); border-color:var(--accent); box-shadow:0 10px 24px rgba(62,193,255,.15);}
.tac-tile i{font-size:1.3rem; color:var(--accent); margin-bottom:6px; display:block;}
.tac-tile .tname{font-size:.82rem; font-weight:700;}

.link-row{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid rgba(255,255,255,.06);}
.link-row:last-child{border-bottom:none;}
.link-row a{color:var(--text); text-decoration:none; font-weight:600;}
.link-row a:hover{color:var(--accent);}
.link-row .ext{margin-left:auto; color:var(--text-dim); font-size:.75rem;}

.tree{display:flex; gap:14px; flex-wrap:wrap; justify-content:center;}
.tree .branch{flex:1; min-width:220px; border-radius:14px; padding:18px; text-align:center; border:1px solid var(--border);}
.branch-a{background:rgba(62,193,255,.10); border-color:rgba(62,193,255,.35);}
.branch-b{background:rgba(123,107,255,.10); border-color:rgba(123,107,255,.35);}
.branch-c{background:rgba(255,181,71,.10); border-color:rgba(255,181,71,.35);}
</style>
</head>
<body>

<div class="blueprint"></div>
<div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
<div class="brand"><i class="fa-solid fa-cubes"></i> ANDIS 2 · Unidad 2</div>
<div class="hud"><i class="fa-solid fa-layer-group"></i> <span class="unit-tag" id="hudCurrent">1</span>/<span id="hudTotal">0</span></div>

<div class="slides-container" id="slidesContainer"></div>

<div class="nav-controls">
  <button class="nav-btn" id="prevBtn"><i class="fa-solid fa-chevron-left"></i></button>
  <div class="nav-dots" id="navDots"></div>
  <button class="nav-btn" id="nextBtn"><i class="fa-solid fa-chevron-right"></i></button>
</div>
<div class="footer-note">← → para navegar</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.10.5/sweetalert2.all.min.js"></script>
<script>
const slidesHTML = [];

// 0. Portada
slidesHTML.push(`
<div class="slide-inner d-flex flex-column justify-content-center" style="min-height:78vh;">
  <div class="animate__animated animate__fadeInDown">
    <span class="eyebrow"><i class="fa-solid fa-toolbox"></i> Unidad 2 · Tácticas de arquitectura</span>
    <h1 class="slide-title">Tácticas para la facilidad de modificación</h1>
    <p class="subtitle">Tres formas de bajar el costo de cambiar el sistema: hacerlo más cohesivo, menos acoplado, o postergar la decisión de qué implementación usar hasta el último momento posible.</p>
  </div>
</div>
`);

// 1. Introducción
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-circle-question"></i> Punto de partida</span>
  <h2 class="slide-title">Tres objetivos, un mismo propósito</h2>
  <div class="card-panel mt-3">
    <p style="font-size:1.02rem; line-height:1.75;">
      Las tácticas para facilidad de modificación buscan <strong>aumentar la cohesión</strong>,
      <strong>reducir el acoplamiento</strong>, o <strong>diferir el binding</strong> (posponer la decisión de qué
      implementación concreta usar).
    </p>
  </div>
  <div class="card-panel mt-3 d-flex gap-3 align-items-center">
    <div class="icon-tile" style="background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)"><i class="fa-solid fa-link"></i></div>
    <div class="small" style="color:var(--text-dim)">Recordá de la Unidad 1: la facilidad de modificación incluye categorías con nombre propio como <strong style="color:var(--text)">escalabilidad, variabilidad, portabilidad</strong> e <strong style="color:var(--text)">independencia de la ubicación</strong>. Muchas de las tácticas de "diferir el binding" son exactamente las herramientas para lograr variabilidad y portabilidad.</div>
  </div>
</div>
`);

// 2. Taxonomía
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-sitemap"></i> El mapa completo</span>
  <h2 class="slide-title">Tres ramas, quince tácticas</h2>
  <div class="tree mt-3">
    <div class="branch branch-a"><i class="fa-solid fa-object-group mb-2 d-block" style="color:var(--accent)"></i><strong>Aumentar la cohesión</strong><div class="small mt-1" style="color:var(--text-dim)">2 tácticas</div></div>
    <div class="branch branch-b"><i class="fa-solid fa-unlink mb-2 d-block" style="color:#b3a8ff"></i><strong>Reducir el acoplamiento</strong><div class="small mt-1" style="color:var(--text-dim)">4 tácticas</div></div>
    <div class="branch branch-c"><i class="fa-solid fa-clock-rotate-left mb-2 d-block" style="color:var(--accent-3)"></i><strong>Diferir el binding</strong><div class="small mt-1" style="color:var(--text-dim)">9 tácticas</div></div>
  </div>
</div>
`);

// 3. Explorador: Cohesión
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-object-group"></i> Rama 1</span>
  <h2 class="slide-title">Aumentar la cohesión</h2>
  <p class="subtitle mb-3">Que cada componente agrupe responsabilidades que realmente pertenecen juntas.</p>
  <div class="tac-grid" id="gridCohesion"></div>
  <div class="card-panel mt-3">
    <div class="link-row">
      <i class="fa-solid fa-link" style="color:var(--accent)"></i>
      <a href="https://learn.microsoft.com/en-us/azure/architecture/guide/design-principles/design-for-evolution" target="_blank">Design for evolution</a>
      <span class="ext">Azure Architecture Center</span>
    </div>
  </div>
</div>
`);

// 4. Explorador: Acoplamiento
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-unlink"></i> Rama 2</span>
  <h2 class="slide-title">Reducir el acoplamiento</h2>
  <p class="subtitle mb-3">Que un cambio en un componente no obligue a tocar otros.</p>
  <div class="tac-grid" id="gridAcoplamiento"></div>
</div>
`);

// 5. Explorador: Diferir el binding
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-clock-rotate-left"></i> Rama 3</span>
  <h2 class="slide-title">Diferir el binding</h2>
  <p class="subtitle mb-3">Postergar la decisión de qué implementación concreta usar — desde tiempo de compilación hasta tiempo de ejecución.</p>
  <div class="tac-grid" id="gridBinding"></div>
</div>
`);

// 6. Línea de tiempo del binding
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-timeline"></i> Para ordenar el catálogo</span>
  <h2 class="slide-title">¿Cuándo se "ata" la decisión?</h2>
  <p class="subtitle mb-3">Cuanto más tarde se decide qué implementación usar, más fácil es cambiarla sin recompilar ni redesplegar — pero también hay más trabajo en tiempo de ejecución.</p>
  <div class="grid-3">
    <div class="card-panel py-3 text-center">
      <span class="pill amber"><i class="fa-solid fa-hammer"></i> Compilación</span>
      <p class="small mt-2 mb-0" style="color:var(--text-dim)">Parametrización en tiempo de compilación</p>
    </div>
    <div class="card-panel py-3 text-center">
      <span class="pill purple"><i class="fa-solid fa-rocket"></i> Inicio de ejecución</span>
      <p class="small mt-2 mb-0" style="color:var(--text-dim)">Binding en tiempo de configuración, archivos de recursos</p>
    </div>
    <div class="card-panel py-3 text-center">
      <span class="pill ok"><i class="fa-solid fa-arrows-spin"></i> Tiempo de ejecución</span>
      <p class="small mt-2 mb-0" style="color:var(--text-dim)">Descubrimiento, interpretación de parámetros, polimorfismo</p>
    </div>
  </div>
</div>
`);

// 7. Quiz
slidesHTML.push(`
<div class="slide-inner d-flex flex-column justify-content-center align-items-center text-center" style="min-height:70vh;">
  <span class="eyebrow"><i class="fa-solid fa-brain"></i> Chequeo de comprensión</span>
  <h2 class="slide-title">5 preguntas sobre facilidad de modificación</h2>
  <p class="subtitle mb-4">Cohesión, acoplamiento, y las 9 formas de diferir el binding.</p>
  <button class="check-btn" onclick="lanzarQuiz()"><i class="fa-solid fa-play me-2"></i>Iniciar quiz</button>
</div>
`);

// 8. Cierre
slidesHTML.push(`
<div class="slide-inner d-flex flex-column justify-content-center align-items-center text-center" style="min-height:78vh;">
  <div class="icon-tile mb-3" style="width:72px;height:72px;font-size:2rem;"><i class="fa-solid fa-check"></i></div>
  <span class="eyebrow"><i class="fa-solid fa-flag-checkered"></i> Repaso completo</span>
  <h2 class="slide-title">15 tácticas, tres decisiones de diseño</h2>
  <p class="subtitle mb-4" style="max-width:640px;">Agrupar lo que pertenece junto, desacoplar lo que no debería depender entre sí, y postergar decisiones cuanto se pueda. Con esto arrancamos los prácticos oficiales de la universidad.</p>
</div>
`);

/* ============ MOTOR DE NAVEGACIÓN ============ */
const container = document.getElementById('slidesContainer');
slidesHTML.forEach((html, i)=>{
  const div = document.createElement('div');
  div.className = 'slide' + (i===0 ? ' active' : '');
  div.id = 'slide'+i;
  div.innerHTML = html;
  container.appendChild(div);
});

let current = 0;
const total = slidesHTML.length;
document.getElementById('hudTotal').textContent = total;

const dotsWrap = document.getElementById('navDots');
for(let i=0;i<total;i++){
  const d = document.createElement('div');
  d.className = 'dot' + (i===0?' active':'');
  d.onclick = ()=>goTo(i);
  dotsWrap.appendChild(d);
}

function updateUI(){
  document.querySelectorAll('.slide').forEach((s,i)=>{ s.classList.toggle('active', i===current); });
  document.querySelectorAll('.nav-dots .dot').forEach((d,i)=>{ d.classList.toggle('active', i===current); });
  document.getElementById('hudCurrent').textContent = current+1;
  document.getElementById('progressFill').style.width = ((current+1)/total*100)+'%';
  const active = document.getElementById('slide'+current);
  active.scrollTop = 0;
  const animTarget = active.querySelector('.slide-inner');
  if(animTarget){
    animTarget.classList.remove('animate__fadeIn');
    void animTarget.offsetWidth;
    animTarget.classList.add('animate__animated','animate__fadeIn');
  }
}
function goTo(i){ if(i<0||i>=total) return; current = i; updateUI(); }
document.getElementById('prevBtn').onclick = ()=>goTo(current-1);
document.getElementById('nextBtn').onclick = ()=>goTo(current+1);
document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight') goTo(current+1);
  if(e.key==='ArrowLeft') goTo(current-1);
});
updateUI();

/* ============ DATOS DE TÁCTICAS ============ */
const cohesion = [
  {icon:'fa-scissors', n:'Separar módulos', d:'Dividir un componente en dos o más independientes, para aumentar la cohesión y reducir el acoplamiento y la co-nascencia.'},
  {icon:'fa-people-arrows', n:'Redistribuir las responsabilidades', d:'Mover responsabilidades relacionadas que están dispersas en distintos componentes hacia uno nuevo, para aumentar la cohesión y reducir acoplamiento y co-nascencia.'}
];

const acoplamiento = [
  {icon:'fa-box-archive', n:'Encapsulamiento', d:'Ocultar los detalles de implementación de un componente detrás de una interfaz bien definida, para que los cambios internos no afecten a quienes dependen de él.'},
  {icon:'fa-people-roof', n:'Usar un intermediario', d:'Introducir un componente entre otros dos interdependientes para manejar su interacción, facilitando cambiar cualquiera de los dos sin afectar al otro.'},
  {icon:'fa-shapes', n:'Abstraer servicios comunes', d:'Ante dos componentes con interfaces similares, ocultar las diferencias detrás de uno más abstracto y general, reduciendo las dependencias de sus clientes.'},
  {icon:'fa-diagram-project', n:'Restringir las dependencias', d:'Limitar las dependencias entre componentes para reducir el impacto de los cambios. Ejemplo: la capa de presentación solo depende de la capa de negocio, nunca directamente de la de datos.'}
];

const binding = [
  {icon:'fa-puzzle-piece', n:'Reemplazo de componentes', d:'Diseñar el sistema para que sus componentes puedan reemplazarse fácilmente en tiempo de despliegue, por ejemplo mediante un script.'},
  {icon:'fa-code', n:'Parametrización en tiempo de compilación', d:'Usar directivas de compilación condicional para generar distintas versiones de un componente a partir del mismo código fuente.'},
  {icon:'fa-layer-group', n:'Aspectos', d:'Programación orientada a aspectos (AOP) para separar cuestiones transversales —como logging o seguridad— del código principal, facilitando su modificación sin tocar la lógica central.'},
  {icon:'fa-gears', n:'Binding en tiempo de configuración', d:'Configurar los componentes mediante parámetros al iniciar la ejecución. Ejemplo: archivos .appconfig o .INI.'},
  {icon:'fa-file-lines', n:'Archivos de recursos', d:'Almacenar textos de mensajes o etiquetas de interfaz en archivos externos, para modificarlos sin recompilar ni redesplegar.'},
  {icon:'fa-compass-drafting', n:'Descubrimiento', d:'Localizar y conectarse dinámicamente a servicios o recursos en tiempo de ejecución, a través de un discovery service donde fueron registrados previamente.'},
  {icon:'fa-sliders', n:'Interpretación de parámetros', d:'Similar al binding en tiempo de configuración, pero la configuración llega mediante parámetros recibidos en tiempo de ejecución.'},
  {icon:'fa-database', n:'Repositorios compartidos', d:'Usar un repositorio común accesible por múltiples componentes para almacenar configuraciones. Ejemplo: el Windows Registry.'},
  {icon:'fa-shuffle', n:'Polimorfismo', d:'Identificar las responsabilidades comunes a un conjunto de servicios y separarlas del resto de las responsabilidades del sistema.'}
];

function renderGrid(containerId, items){
  const grid = document.getElementById(containerId);
  items.forEach(t=>{
    const tile = document.createElement('div');
    tile.className = 'tac-tile';
    tile.innerHTML = `<i class="fa-solid ${t.icon}"></i><div class="tname">${t.n}</div>`;
    tile.onclick = ()=>{
      Swal.fire({
        title: t.n,
        html: `<p style="text-align:left;">${t.d}</p>`,
        background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
      });
    };
    grid.appendChild(tile);
  });
}
renderGrid('gridCohesion', cohesion);
renderGrid('gridAcoplamiento', acoplamiento);
renderGrid('gridBinding', binding);

/* ============ QUIZ ============ */
const preguntas = [
  {
    texto:'¿Cuáles son los tres objetivos generales de las tácticas de facilidad de modificación?',
    opciones:{
      a:'Aumentar la cohesión, reducir el acoplamiento y diferir el binding',
      b:'Aumentar la disponibilidad, mejorar el rendimiento y reducir costos',
      c:'Escalar horizontalmente, replicar datos y cachear resultados',
      d:'Documentar, versionar y testear el código fuente'
    },
    correcta:'a'
  },
  {
    texto:'¿Qué diferencia hay entre "separar módulos" y "redistribuir las responsabilidades"?',
    opciones:{
      a:'No hay ninguna diferencia real entre ambas tácticas',
      b:'Separar módulos divide un componente en varios; redistribuir responsabilidades mueve responsabilidades ya dispersas en distintos componentes hacia uno nuevo',
      c:'Redistribuir responsabilidades solo aplica a bases de datos',
      d:'Separar módulos únicamente reduce el acoplamiento, nunca aumenta la cohesión'
    },
    correcta:'b'
  },
  {
    texto:'Un sistema en capas asegura que la capa de presentación solo dependa de la capa de negocio, nunca directamente de la capa de datos. ¿Qué táctica es esta?',
    opciones:{
      a:'Abstraer servicios comunes',
      b:'Usar un intermediario',
      c:'Restringir las dependencias',
      d:'Encapsulamiento'
    },
    correcta:'c'
  },
  {
    texto:'¿Qué caracteriza a la táctica de "descubrimiento" dentro de diferir el binding?',
    opciones:{
      a:'Usa directivas de compilación condicional para generar versiones distintas de un componente',
      b:'Permite localizar y conectarse dinámicamente a servicios en tiempo de ejecución, a través de un discovery service donde fueron registrados previamente',
      c:'Almacena textos de mensajes en archivos externos para no recompilar',
      d:'Separa cuestiones transversales como logging del código principal'
    },
    correcta:'b'
  },
  {
    texto:'¿Qué técnica de programación usa la táctica "Aspectos" para separar cuestiones transversales del código principal?',
    opciones:{
      a:'Programación orientada a aspectos (AOP)',
      b:'Programación funcional pura',
      c:'Programación orientada a eventos',
      d:'Programación declarativa con SQL'
    },
    correcta:'a'
  }
];
let idxPregunta = 0, aciertos = 0;

function lanzarQuiz(){ idxPregunta = 0; aciertos = 0; mostrarPregunta(); }
function mostrarPregunta(){
  if(idxPregunta >= preguntas.length){
    Swal.fire({
      title:'Resultado',
      html:`Acertaste <b>${aciertos}/${preguntas.length}</b>.`,
      icon: aciertos===preguntas.length ? 'success' : 'info',
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    });
    return;
  }
  const p = preguntas[idxPregunta];
  Swal.fire({
    title: p.texto,
    input:'radio',
    inputOptions: p.opciones,
    background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff',
    confirmButtonText:'Responder',
    inputValidator: (value)=> !value && 'Elegí una opción'
  }).then(res=>{
    if(!res.isConfirmed) return;
    const ok = res.value === p.correcta;
    if(ok) aciertos++;
    Swal.fire({
      title: ok ? '¡Correcto!' : 'No es así',
      html: `La respuesta correcta era: <b>${p.opciones[p.correcta]}</b>`,
      icon: ok ? 'success' : 'error',
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    }).then(()=>{ idxPregunta++; mostrarPregunta(); });
  });
}
</script>

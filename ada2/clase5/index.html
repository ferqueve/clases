<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANDIS 2 · Teórico — Disponibilidad</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#070b14; --bg-1:#0d1424; --panel:#111a2e; --panel-2:#16223a;
  --accent:#3ec1ff; --accent-2:#7b6bff; --accent-3:#ffb547; --ok:#3ee6a8;
  --text:#e8edf7; --text-dim:#8fa0bd; --border:#22304d;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(1200px 700px at 15% -10%, rgba(62,193,255,.10), transparent 60%),
    radial-gradient(1000px 700px at 110% 10%, rgba(123,107,255,.12), transparent 55%),
    var(--bg-0);
  color:var(--text); font-family:'Inter',sans-serif; overflow:hidden;
}
.mono{font-family:'JetBrains Mono',monospace}
.blueprint{
  position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.35;
  background-image:linear-gradient(rgba(62,193,255,.06) 1px, transparent 1px),linear-gradient(90deg, rgba(62,193,255,.06) 1px, transparent 1px);
  background-size:42px 42px;
}
.progress-track{position:fixed; top:0; left:0; width:100%; height:4px; background:rgba(255,255,255,.06); z-index:50;}
.progress-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--accent-2)); transition:width .4s ease; box-shadow:0 0 12px var(--accent);}
.hud{position:fixed; top:14px; right:18px; z-index:50; background:rgba(17,26,46,.85); border:1px solid var(--border); backdrop-filter:blur(6px); padding:7px 14px; border-radius:999px; font-size:.82rem; color:var(--text-dim); display:flex; align-items:center; gap:8px;}
.hud .unit-tag{color:var(--accent); font-weight:700}
.brand{position:fixed; top:14px; left:18px; z-index:50; font-size:.78rem; color:var(--text-dim); display:flex; align-items:center; gap:8px; letter-spacing:.03em;}
.brand i{color:var(--accent-3)}
.slides-container{position:relative; z-index:1; height:100vh; width:100vw;}
.slide{position:absolute; inset:0; display:none; padding:90px 8vw 110px 8vw; overflow-y:auto;}
.slide.active{display:block}
.slide-inner{max-width:1180px; margin:0 auto;}
.eyebrow{display:inline-flex; align-items:center; gap:8px; font-size:.78rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent); font-weight:700; margin-bottom:14px;}
.eyebrow i{font-size:.9rem}
h1.slide-title{font-size:clamp(1.9rem,3.4vw,3rem); font-weight:800; margin-bottom:.4rem; line-height:1.1;}
h2.slide-title{font-size:clamp(1.5rem,2.6vw,2.2rem); font-weight:800; margin-bottom:.6rem;}
.subtitle{color:var(--text-dim); font-size:1.05rem; max-width:820px;}
.card-panel{background:linear-gradient(180deg, var(--panel), var(--panel-2)); border:1px solid var(--border); border-radius:16px; padding:26px 28px; box-shadow:0 12px 30px rgba(0,0,0,.35);}
.card-panel + .card-panel{margin-top:18px}
.pill{display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:999px; font-size:.76rem; font-weight:700; background:rgba(62,193,255,.12); color:var(--accent); border:1px solid rgba(62,193,255,.35);}
.pill.purple{background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)}
.pill.amber{background:rgba(255,181,71,.14); color:var(--accent-3); border-color:rgba(255,181,71,.4)}
.pill.ok{background:rgba(62,230,168,.12); color:var(--ok); border-color:rgba(62,230,168,.35)}
.icon-tile{width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center; background:rgba(62,193,255,.12); color:var(--accent); font-size:1.3rem; border:1px solid rgba(62,193,255,.3); flex-shrink:0;}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
@media (max-width:900px){.grid-2,.grid-3{grid-template-columns:1fr;}}
ul.clean{list-style:none; margin:0; padding:0;}
ul.clean li{position:relative; padding:6px 0 6px 26px; color:var(--text); font-size:.94rem;}
ul.clean li::before{content:"\f105"; font-family:"Font Awesome 6 Free"; font-weight:900; color:var(--accent); position:absolute; left:2px; top:8px; font-size:.85rem;}
.check-btn{border:none; background:linear-gradient(90deg,var(--accent),var(--accent-2)); color:#04101f; font-weight:800; padding:10px 22px; border-radius:10px; font-size:.9rem; box-shadow:0 8px 22px rgba(62,193,255,.25); cursor:pointer;}
.check-btn:hover{filter:brightness(1.08); color:#04101f;}
.nav-controls{position:fixed; bottom:18px; left:0; right:0; z-index:50; display:flex; justify-content:center; gap:14px; align-items:center;}
.nav-btn{width:46px; height:46px; border-radius:50%; border:1px solid var(--border); background:rgba(17,26,46,.9); color:var(--text); display:flex; align-items:center; justify-content:center; font-size:1.1rem; backdrop-filter:blur(6px);}
.nav-btn:hover{border-color:var(--accent); color:var(--accent);}
.nav-dots{display:flex; gap:6px; align-items:center; background:rgba(17,26,46,.9); border:1px solid var(--border); padding:8px 14px; border-radius:999px;}
.nav-dots .dot{width:7px; height:7px; border-radius:50%; background:var(--border); cursor:pointer; transition:.2s;}
.nav-dots .dot.active{background:var(--accent); width:20px; border-radius:4px;}
.footer-note{position:fixed; bottom:20px; right:22px; z-index:50; font-size:.72rem; color:var(--text-dim); font-family:'JetBrains Mono';}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px}

.formula-box{
  background:var(--bg-1); border:1px solid var(--border); border-radius:12px; padding:20px 24px; text-align:center;
  font-family:'JetBrains Mono'; font-size:1.15rem; color:var(--accent); margin:14px 0;
}
.formula-box .frac{display:inline-block; vertical-align:middle; text-align:center; margin:0 8px;}
.formula-box .frac .num{display:block; border-bottom:1px solid var(--accent); padding:0 6px 3px 6px;}
.formula-box .frac .den{display:block; padding:3px 6px 0 6px;}

table.sla-table{width:100%; border-collapse:separate; border-spacing:0; font-size:.9rem;}
table.sla-table th{text-align:left; color:var(--accent); text-transform:uppercase; font-size:.7rem; letter-spacing:.06em; padding:10px 12px; border-bottom:1px solid var(--border);}
table.sla-table td{padding:12px; border-bottom:1px solid rgba(255,255,255,.05); vertical-align:top; color:var(--text-dim);}
table.sla-table tr:hover td{background:rgba(62,193,255,.04); color:var(--text);}
table.sla-table td strong{color:var(--text)}

.calc-input{
  background:var(--bg-1); border:1px solid var(--border); border-radius:10px; color:var(--text);
  padding:10px 12px; font-size:.92rem; width:100%;
}
.calc-input:focus{outline:none; border-color:var(--accent);}
.calc-result{
  font-family:'JetBrains Mono'; font-size:2rem; font-weight:800; color:var(--ok); text-align:center; margin-top:10px;
}
.tab-btn{
  background:transparent; border:1px solid var(--border); color:var(--text-dim); padding:8px 18px; border-radius:10px 10px 0 0;
  font-size:.85rem; cursor:pointer; border-bottom:none;
}
.tab-btn.active{color:var(--accent); border-color:var(--accent); background:var(--panel-2);}
.tab-panel{display:none; background:var(--panel-2); border:1px solid var(--border); border-radius:0 12px 12px 12px; padding:20px;}
.tab-panel.active{display:block;}

.link-row{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid rgba(255,255,255,.06);}
.link-row:last-child{border-bottom:none;}
.link-row a{color:var(--text); text-decoration:none; font-weight:600;}
.link-row a:hover{color:var(--accent);}
.link-row .ext{margin-left:auto; color:var(--text-dim); font-size:.75rem;}
</style>
</head>
<body>

<div class="blueprint"></div>
<div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
<div class="brand"><i class="fa-solid fa-cubes"></i> ANDIS 2 · Teórico</div>
<div class="hud"><i class="fa-solid fa-layer-group"></i> <span class="unit-tag" id="hudCurrent">1</span>/<span id="hudTotal">0</span></div>

<div class="slides-container" id="slidesContainer"></div>

<div class="nav-controls">
  <button class="nav-btn" id="prevBtn"><i class="fa-solid fa-chevron-left"></i></button>
  <div class="nav-dots" id="navDots"></div>
  <button class="nav-btn" id="nextBtn"><i class="fa-solid fa-chevron-right"></i></button>
</div>
<div class="footer-note">← → para navegar</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.10.5/sweetalert2.all.min.js"></script>
<script>
const slidesHTML = [];

// 0. Portada
slidesHTML.push(`
<div class="slide-inner d-flex flex-column justify-content-center" style="min-height:78vh;">
  <div class="animate__animated animate__fadeInDown">
    <span class="eyebrow"><i class="fa-solid fa-power-off"></i> Teórico · Unidad 1</span>
    <h1 class="slide-title">Disponibilidad</h1>
    <p class="subtitle">Availability: el atributo que decide si tu sistema está ahí cuando alguien lo necesita. Cómo se mide, cómo se relaciona con otros atributos, y qué significa prometer "cuatro nueves".</p>
  </div>
</div>
`);

// 1. Definición
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-circle-question"></i> Definición</span>
  <h2 class="slide-title">¿Qué es la disponibilidad?</h2>
  <div class="card-panel mt-3">
    <div class="d-flex gap-3">
      <div class="icon-tile"><i class="fa-solid fa-signal"></i></div>
      <p style="font-size:1.05rem; line-height:1.75; margin:0;">
        La <strong>disponibilidad</strong> (availability) es un atributo de calidad de una arquitectura de software que
        define el grado en el cual un sistema o componente está <strong>operativo y accesible</strong> cuando se
        requiere su uso. Es la <strong>probabilidad</strong> de que el sistema esté funcionando en cualquier momento dado.
      </p>
    </div>
  </div>
  <div class="card-panel mt-3">
    <span class="pill"><i class="fa-solid fa-hospital"></i> Especialmente relevante en</span>
    <ul class="clean mt-2">
      <li>Servicios de emergencia</li>
      <li>Sistemas bancarios</li>
      <li>Plataformas de comercio electrónico</li>
    </ul>
  </div>
</div>
`);

// 2. Relación con otros marcos
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-diagram-project"></i> Cómo se relaciona con otros modelos</span>
  <h2 class="slide-title">Prevención y recuperación de fallos</h2>
  <div class="grid-2 mt-3">
    <div class="card-panel h-100">
      <div class="icon-tile mb-3"><i class="fa-solid fa-book"></i></div>
      <h6 class="fw-bold">Bass, Clements y Kazman</h6>
      <p class="small mb-0" style="color:var(--text-dim)">Incluyen dentro de "disponibilidad" los conceptos de <strong style="color:var(--text)">prevención de fallos</strong> y <strong style="color:var(--text)">recuperación de fallos</strong> — que en ISO/IEC 25010 corresponden, respectivamente, a <em>tolerancia a fallos</em> y <em>capacidad de recuperación</em> (ambas dentro de Fiabilidad).</p>
    </div>
    <div class="card-panel h-100">
      <div class="icon-tile mb-3" style="background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)"><i class="fa-solid fa-cloud"></i></div>
      <h6 class="fw-bold">Azure Well-Architected Framework</h6>
      <p class="small mb-0" style="color:var(--text-dim)">Su pilar "Fiabilidad" incluye <strong style="color:var(--text)">resiliencia</strong> y <strong style="color:var(--text)">recuperación</strong> — otra vez, en la misma línea que tolerancia a fallos y capacidad de recuperación de ISO 25010.</p>
    </div>
  </div>
</div>
`);

// 3. Fórmula base
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-calculator"></i> Cómo se mide (1/2)</span>
  <h2 class="slide-title">Tiempo de operación sobre tiempo total</h2>
  <div class="card-panel mt-3">
    <p style="font-size:1rem; line-height:1.7;">
      La disponibilidad se expresa como un porcentaje: la proporción del tiempo en que el sistema está operativo y
      accesible, frente al tiempo total.
    </p>
    <div class="formula-box">
      Disponibilidad = <span class="frac"><span class="num">Tiempo de Operación</span><span class="den">Tiempo Total</span></span> × 100
    </div>
    <div class="grid-2 mt-3">
      <div class="card-panel py-3" style="background:var(--panel-2);">
        <span class="pill"><i class="fa-solid fa-arrow-up"></i> Tiempo de operación (uptime)</span>
        <p class="small mb-0 mt-2" style="color:var(--text-dim)">Tiempo durante el cual el sistema funciona correctamente.</p>
      </div>
      <div class="card-panel py-3" style="background:var(--panel-2);">
        <span class="pill amber"><i class="fa-solid fa-arrow-down"></i> Tiempo total</span>
        <p class="small mb-0 mt-2" style="color:var(--text-dim)">Operación + inactividad (downtime) — planificada (mantenimiento) o no planificada (fallos, interrupciones).</p>
      </div>
    </div>
  </div>
  <div class="card-panel mt-3">
    <div class="d-flex gap-3">
      <div class="icon-tile" style="background:rgba(62,230,168,.12); color:var(--ok); border-color:rgba(62,230,168,.35)"><i class="fa-solid fa-lightbulb"></i></div>
      <div>
        <h6 class="fw-bold mb-1">Ejemplo</h6>
        <p class="small mb-0" style="color:var(--text-dim)">Un sistema estuvo operativo 696 horas en un mes de 720 horas (24 horas de inactividad no planificada):</p>
        <p class="mono mb-0 mt-1" style="color:var(--accent);">(720 − 24) / 720 × 100 ≈ <strong>96.67%</strong></p>
      </div>
    </div>
  </div>
</div>
`);

// 4. MTBF / MTTR
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-calculator"></i> Cómo se mide (2/2)</span>
  <h2 class="slide-title">MTBF y MTTR</h2>
  <div class="card-panel mt-3">
    <p style="font-size:1rem; line-height:1.7;">La misma fórmula se puede expresar en términos de dos tiempos promedio:</p>
    <div class="grid-2">
      <div class="card-panel py-3" style="background:var(--panel-2);">
        <span class="pill"><i class="fa-solid fa-hourglass"></i> MTBF</span>
        <p class="small mb-0 mt-2" style="color:var(--text-dim)"><em>Mean Time Between Failures</em> — tiempo promedio entre fallos sucesivos. Representa la <strong style="color:var(--text)">fiabilidad</strong> del sistema.</p>
      </div>
      <div class="card-panel py-3" style="background:var(--panel-2);">
        <span class="pill purple"><i class="fa-solid fa-screwdriver-wrench"></i> MTTR</span>
        <p class="small mb-0 mt-2" style="color:var(--text-dim)"><em>Mean Time To Repair</em> — tiempo promedio para reparar un fallo y restaurar el funcionamiento normal. Representa la <strong style="color:var(--text)">capacidad de recuperación</strong>.</p>
      </div>
    </div>
    <div class="formula-box">
      Disponibilidad = <span class="frac"><span class="num">MTBF</span><span class="den">MTBF + MTTR</span></span>
    </div>
    <div class="card-panel py-3" style="background:var(--panel-2);">
      <div class="d-flex gap-3">
        <div class="icon-tile" style="background:rgba(62,230,168,.12); color:var(--ok); border-color:rgba(62,230,168,.35)"><i class="fa-solid fa-lightbulb"></i></div>
        <div>
          <p class="small mb-0" style="color:var(--text-dim)">Con MTBF de 1000 horas y MTTR de 10 horas:</p>
          <p class="mono mb-0 mt-1" style="color:var(--accent);">1000 / (1000 + 10) ≈ <strong>99.01%</strong></p>
        </div>
      </div>
    </div>
  </div>
  <div class="card-panel mt-3 d-flex gap-3 align-items-center">
    <div class="icon-tile" style="background:rgba(255,181,71,.14); color:var(--accent-3); border-color:rgba(255,181,71,.4)"><i class="fa-solid fa-scale-balanced"></i></div>
    <div class="small" style="color:var(--text-dim)">Un <strong style="color:var(--text)">MTBF mayor</strong> = menos fallas = más disponibilidad. Un <strong style="color:var(--text)">MTTR menor</strong> = reparación más rápida = más disponibilidad.</div>
  </div>
</div>
`);

// 5. Calculadora interactiva
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-flask"></i> Probalo vos mismo</span>
  <h2 class="slide-title">Calculadora de disponibilidad</h2>
  <div class="card-panel mt-3">
    <div class="d-flex gap-2 mb-0">
      <button class="tab-btn active" id="tabBtnUptime" onclick="switchTab('uptime')"><i class="fa-solid fa-clock me-1"></i>Uptime / Tiempo total</button>
      <button class="tab-btn" id="tabBtnMtbf" onclick="switchTab('mtbf')"><i class="fa-solid fa-gauge me-1"></i>MTBF / MTTR</button>
    </div>
    <div class="tab-panel active" id="panelUptime">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="small mb-1" style="color:var(--text-dim)">Tiempo de operación (horas)</label>
          <input type="number" class="calc-input" id="inUptime" value="696" oninput="calcUptime()">
        </div>
        <div class="col-md-6">
          <label class="small mb-1" style="color:var(--text-dim)">Tiempo total (horas)</label>
          <input type="number" class="calc-input" id="inTotal" value="720" oninput="calcUptime()">
        </div>
      </div>
      <div class="calc-result" id="resUptime">96.67%</div>
    </div>
    <div class="tab-panel" id="panelMtbf">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="small mb-1" style="color:var(--text-dim)">MTBF (horas)</label>
          <input type="number" class="calc-input" id="inMtbf" value="1000" oninput="calcMtbf()">
        </div>
        <div class="col-md-6">
          <label class="small mb-1" style="color:var(--text-dim)">MTTR (horas)</label>
          <input type="number" class="calc-input" id="inMttr" value="10" oninput="calcMtbf()">
        </div>
      </div>
      <div class="calc-result" id="resMtbf">99.01%</div>
    </div>
  </div>
</div>
`);

// 6. SLA — nines
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-file-contract"></i> Compromisos formales</span>
  <h2 class="slide-title">Objetivos de disponibilidad y SLA</h2>
  <p class="subtitle mb-3">Las organizaciones fijan objetivos de disponibilidad en <strong>SLA</strong> (service level agreement), según la criticidad del sistema.</p>
  <div class="card-panel" style="overflow-x:auto;">
    <table class="sla-table">
      <thead><tr><th>Nivel</th><th>Disponibilidad</th><th>Inactividad al año</th></tr></thead>
      <tbody>
        <tr><td><strong>Tres nueves</strong></td><td>99.9%</td><td>≈ 8.76 horas</td></tr>
        <tr><td><strong>Cuatro nueves</strong></td><td>99.99%</td><td>≈ 52.56 minutos</td></tr>
        <tr><td><strong>Cinco nueves</strong></td><td>99.999%</td><td>≈ 5.26 minutos</td></tr>
      </tbody>
    </table>
  </div>
  <div class="card-panel mt-3 d-flex gap-3 align-items-center">
    <div class="icon-tile"><i class="fa-solid fa-triangle-exclamation"></i></div>
    <div class="small" style="color:var(--text-dim)">Cada nueve adicional es exponencialmente más caro de lograr: pasar de tres a cinco nueves reduce la inactividad tolerada de <strong style="color:var(--text)">~9 horas</strong> a apenas <strong style="color:var(--text)">~5 minutos</strong> al año.</div>
  </div>
</div>
`);

// 7. Tácticas y patrones (links)
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-book-open-reader"></i> Para profundizar</span>
  <h2 class="slide-title">Tácticas y patrones para disponibilidad</h2>
  <div class="card-panel mt-3">
    <span class="pill"><i class="fa-solid fa-compass"></i> Tácticas</span>
    <p class="small mt-2" style="color:var(--text-dim)">La Unidad 2 del curso (Tácticas de arquitectura) desarrolla en detalle las tácticas específicas para disponibilidad — prevención, detección, recuperación y reintroducción de fallos.</p>
  </div>
  <div class="card-panel mt-3">
    <span class="pill purple"><i class="fa-solid fa-shapes"></i> Patrones</span>
    <div class="link-row mt-2">
      <i class="fa-solid fa-link" style="color:var(--accent)"></i>
      <a href="https://learn.microsoft.com/en-us/azure/well-architected/reliability/design-patterns" target="_blank">Cloud design patterns that support reliability — Azure Well-Architected Framework</a>
      <span class="ext">Microsoft Learn</span>
    </div>
    <div class="link-row">
      <i class="fa-solid fa-link" style="color:var(--accent)"></i>
      <a href="https://www.sei.cmu.edu/blog/tactics-and-patterns-for-software-robustness/" target="_blank">Tactics and Patterns for Software Robustness</a>
      <span class="ext">SEI · Carnegie Mellon</span>
    </div>
  </div>
</div>
`);

// 8. Quiz
slidesHTML.push(`
<div class="slide-inner d-flex flex-column justify-content-center align-items-center text-center" style="min-height:70vh;">
  <span class="eyebrow"><i class="fa-solid fa-brain"></i> Chequeo de comprensión</span>
  <h2 class="slide-title">5 preguntas sobre disponibilidad</h2>
  <p class="subtitle mb-4">Definición, fórmulas, MTBF/MTTR y objetivos de SLA.</p>
  <button class="check-btn" onclick="lanzarQuiz()"><i class="fa-solid fa-play me-2"></i>Iniciar quiz</button>
</div>
`);

// 9. Cierre
slidesHTML.push(`
<div class="slide-inner d-flex flex-column justify-content-center align-items-center text-center" style="min-height:78vh;">
  <div class="icon-tile mb-3" style="width:72px;height:72px;font-size:2rem;"><i class="fa-solid fa-check"></i></div>
  <span class="eyebrow"><i class="fa-solid fa-flag-checkered"></i> Repaso completo</span>
  <h2 class="slide-title">Disponibilidad: medible, negociable, cara al extremo</h2>
  <p class="subtitle mb-4" style="max-width:640px;">Cada nueve adicional en el SLA es una decisión de arquitectura — y de presupuesto. Próxima lectura: Rendimiento.</p>
</div>
`);

/* ============ MOTOR DE NAVEGACIÓN ============ */
const container = document.getElementById('slidesContainer');
slidesHTML.forEach((html, i)=>{
  const div = document.createElement('div');
  div.className = 'slide' + (i===0 ? ' active' : '');
  div.id = 'slide'+i;
  div.innerHTML = html;
  container.appendChild(div);
});

let current = 0;
const total = slidesHTML.length;
document.getElementById('hudTotal').textContent = total;

const dotsWrap = document.getElementById('navDots');
for(let i=0;i<total;i++){
  const d = document.createElement('div');
  d.className = 'dot' + (i===0?' active':'');
  d.onclick = ()=>goTo(i);
  dotsWrap.appendChild(d);
}

function updateUI(){
  document.querySelectorAll('.slide').forEach((s,i)=>{ s.classList.toggle('active', i===current); });
  document.querySelectorAll('.nav-dots .dot').forEach((d,i)=>{ d.classList.toggle('active', i===current); });
  document.getElementById('hudCurrent').textContent = current+1;
  document.getElementById('progressFill').style.width = ((current+1)/total*100)+'%';
  const active = document.getElementById('slide'+current);
  active.scrollTop = 0;
  const animTarget = active.querySelector('.slide-inner');
  if(animTarget){
    animTarget.classList.remove('animate__fadeIn');
    void animTarget.offsetWidth;
    animTarget.classList.add('animate__animated','animate__fadeIn');
  }
}
function goTo(i){ if(i<0||i>=total) return; current = i; updateUI(); }
document.getElementById('prevBtn').onclick = ()=>goTo(current-1);
document.getElementById('nextBtn').onclick = ()=>goTo(current+1);
document.addEventListener('keydown', (e)=>{
  const tag = document.activeElement.tagName;
  if(tag==='INPUT' || tag==='TEXTAREA') return;
  if(e.key==='ArrowRight') goTo(current+1);
  if(e.key==='ArrowLeft') goTo(current-1);
});
updateUI();

/* ============ CALCULADORA ============ */
function switchTab(tab){
  document.getElementById('tabBtnUptime').classList.toggle('active', tab==='uptime');
  document.getElementById('tabBtnMtbf').classList.toggle('active', tab==='mtbf');
  document.getElementById('panelUptime').classList.toggle('active', tab==='uptime');
  document.getElementById('panelMtbf').classList.toggle('active', tab==='mtbf');
}
function calcUptime(){
  const up = parseFloat(document.getElementById('inUptime').value) || 0;
  const tot = parseFloat(document.getElementById('inTotal').value) || 0;
  const res = tot > 0 ? (up/tot*100) : 0;
  document.getElementById('resUptime').textContent = res.toFixed(2) + '%';
}
function calcMtbf(){
  const mtbf = parseFloat(document.getElementById('inMtbf').value) || 0;
  const mttr = parseFloat(document.getElementById('inMttr').value) || 0;
  const res = (mtbf+mttr) > 0 ? (mtbf/(mtbf+mttr)*100) : 0;
  document.getElementById('resMtbf').textContent = res.toFixed(2) + '%';
}

/* ============ QUIZ — posiciones y longitudes de respuesta variadas ============ */
const preguntas = [
  {
    texto:'¿Qué representa la disponibilidad de un sistema?',
    opciones:{
      a:'El grado en que el sistema está operativo y accesible cuando se lo necesita',
      b:'La cantidad total de funcionalidades implementadas en el sistema',
      c:'El tiempo que toma desarrollar una nueva versión del sistema',
      d:'La velocidad de respuesta del sistema ante una consulta'
    },
    correcta:'a'
  },
  {
    texto:'Un sistema estuvo operativo 950 horas en un mes de 1000 horas totales. ¿Cuál es su disponibilidad?',
    opciones:{
      a:'99.5%',
      b:'90%',
      c:'95%',
      d:'85%'
    },
    correcta:'c'
  },
  {
    texto:'¿Qué mide el MTTR (Mean Time To Repair)?',
    opciones:{
      a:'El tiempo total que el sistema estuvo funcionando sin interrupciones',
      b:'El tiempo promedio para reparar un fallo y restaurar el funcionamiento normal',
      c:'El número de fallos ocurridos en un período determinado',
      d:'El tiempo promedio entre dos fallos sucesivos del sistema'
    },
    correcta:'b'
  },
  {
    texto:'¿Qué efecto tiene un MTBF más alto sobre la disponibilidad?',
    opciones:{
      a:'La reduce, porque implica fallos más largos de reparar',
      b:'No tiene ningún efecto sobre la disponibilidad',
      c:'La aumenta, porque indica menos fallas en el tiempo',
      d:'Depende exclusivamente del valor del MTTR'
    },
    correcta:'c'
  },
  {
    texto:'¿Aproximadamente cuánta inactividad anual permite un SLA de "cuatro nueves" (99.99%)?',
    opciones:{
      a:'52.56 minutos',
      b:'8.76 horas',
      c:'5.26 minutos',
      d:'24 horas'
    },
    correcta:'a'
  }
];
let idxPregunta = 0, aciertos = 0;

function lanzarQuiz(){ idxPregunta = 0; aciertos = 0; mostrarPregunta(); }
function mostrarPregunta(){
  if(idxPregunta >= preguntas.length){
    Swal.fire({
      title:'Resultado',
      html:`Acertaste <b>${aciertos}/${preguntas.length}</b>.`,
      icon: aciertos===preguntas.length ? 'success' : 'info',
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    });
    return;
  }
  const p = preguntas[idxPregunta];
  Swal.fire({
    title: p.texto,
    input:'radio',
    inputOptions: p.opciones,
    background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff',
    confirmButtonText:'Responder',
    inputValidator: (value)=> !value && 'Elegí una opción'
  }).then(res=>{
    if(!res.isConfirmed) return;
    const ok = res.value === p.correcta;
    if(ok) aciertos++;
    Swal.fire({
      title: ok ? '¡Correcto!' : 'No es así',
      html: `La respuesta correcta era: <b>${p.opciones[p.correcta]}</b>`,
      icon: ok ? 'success' : 'error',
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    }).then(()=>{ idxPregunta++; mostrarPregunta(); });
  });
}
</script>

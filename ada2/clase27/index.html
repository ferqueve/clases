<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANDIS 2 · Unidad 3 — Interacción e Integración de aplicaciones</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#070b14; --bg-1:#0d1424; --panel:#111a2e; --panel-2:#16223a;
  --accent:#3ec1ff; --accent-2:#7b6bff; --accent-3:#ffb547; --ok:#3ee6a8;
  --text:#e8edf7; --text-dim:#8fa0bd; --border:#22304d;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(1200px 700px at 15% -10%, rgba(62,193,255,.10), transparent 60%),
    radial-gradient(1000px 700px at 110% 10%, rgba(123,107,255,.12), transparent 55%),
    var(--bg-0);
  color:var(--text); font-family:'Inter',sans-serif; overflow:hidden;
}
.mono{font-family:'JetBrains Mono',monospace}
.blueprint{
  position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.35;
  background-image:linear-gradient(rgba(62,193,255,.06) 1px, transparent 1px),linear-gradient(90deg, rgba(62,193,255,.06) 1px, transparent 1px);
  background-size:42px 42px;
}
.progress-track{position:fixed; top:0; left:0; width:100%; height:4px; background:rgba(255,255,255,.06); z-index:50;}
.progress-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--accent-2)); transition:width .4s ease; box-shadow:0 0 12px var(--accent);}
.hud{position:fixed; top:14px; right:18px; z-index:50; background:rgba(17,26,46,.85); border:1px solid var(--border); backdrop-filter:blur(6px); padding:7px 14px; border-radius:999px; font-size:.82rem; color:var(--text-dim); display:flex; align-items:center; gap:8px;}
.hud .unit-tag{color:var(--accent); font-weight:700}
.brand{position:fixed; top:14px; left:18px; z-index:50; font-size:.78rem; color:var(--text-dim); display:flex; align-items:center; gap:8px; letter-spacing:.03em;}
.brand i{color:var(--accent-3)}
.slides-container{position:relative; z-index:1; height:100vh; width:100vw;}
.slide{position:absolute; inset:0; display:none; padding:90px 8vw 110px 8vw; overflow-y:auto;}
.slide.active{display:block}
.slide-inner{max-width:1180px; margin:0 auto;}
.eyebrow{display:inline-flex; align-items:center; gap:8px; font-size:.78rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent); font-weight:700; margin-bottom:14px;}
.eyebrow i{font-size:.9rem}
h1.slide-title{font-size:clamp(1.9rem,3.4vw,3rem); font-weight:800; margin-bottom:.4rem; line-height:1.1;}
h2.slide-title{font-size:clamp(1.5rem,2.6vw,2.2rem); font-weight:800; margin-bottom:.6rem;}
.subtitle{color:var(--text-dim); font-size:1.05rem; max-width:820px;}
.card-panel{background:linear-gradient(180deg, var(--panel), var(--panel-2)); border:1px solid var(--border); border-radius:16px; padding:26px 28px; box-shadow:0 12px 30px rgba(0,0,0,.35);}
.card-panel + .card-panel{margin-top:18px}
.pill{display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:999px; font-size:.76rem; font-weight:700; background:rgba(62,193,255,.12); color:var(--accent); border:1px solid rgba(62,193,255,.35);}
.pill.purple{background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)}
.pill.amber{background:rgba(255,181,71,.14); color:var(--accent-3); border-color:rgba(255,181,71,.4)}
.pill.ok{background:rgba(62,230,168,.12); color:var(--ok); border-color:rgba(62,230,168,.35)}
.pill.bad{background:rgba(255,107,107,.12); color:#ff6b6b; border-color:rgba(255,107,107,.35)}
.icon-tile{width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center; background:rgba(62,193,255,.12); color:var(--accent); font-size:1.3rem; border:1px solid rgba(62,193,255,.3); flex-shrink:0;}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
.grid-4{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
@media (max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}
ul.clean{list-style:none; margin:0; padding:0;}
ul.clean li{position:relative; padding:6px 0 6px 26px; color:var(--text); font-size:.94rem;}
ul.clean li::before{content:"\f105"; font-family:"Font Awesome 6 Free"; font-weight:900; color:var(--accent); position:absolute; left:2px; top:8px; font-size:.85rem;}
.check-btn{border:none; background:linear-gradient(90deg,var(--accent),var(--accent-2)); color:#04101f; font-weight:800; padding:10px 22px; border-radius:10px; font-size:.9rem; box-shadow:0 8px 22px rgba(62,193,255,.25); cursor:pointer;}
.check-btn:hover{filter:brightness(1.08); color:#04101f;}
.nav-controls{position:fixed; bottom:18px; left:0; right:0; z-index:50; display:flex; justify-content:center; gap:14px; align-items:center;}
.nav-btn{width:46px; height:46px; border-radius:50%; border:1px solid var(--border); background:rgba(17,26,46,.9); color:var(--text); display:flex; align-items:center; justify-content:center; font-size:1.1rem; backdrop-filter:blur(6px);}
.nav-btn:hover{border-color:var(--accent); color:var(--accent);}
.nav-dots{display:flex; gap:6px; align-items:center; background:rgba(17,26,46,.9); border:1px solid var(--border); padding:8px 14px; border-radius:999px;}
.nav-dots .dot{width:7px; height:7px; border-radius:50%; background:var(--border); cursor:pointer; transition:.2s;}
.nav-dots .dot.active{background:var(--accent); width:20px; border-radius:4px;}
.footer-note{position:fixed; bottom:20px; right:22px; z-index:50; font-size:.72rem; color:var(--text-dim); font-family:'JetBrains Mono';}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px}

.tac-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px;}
@media (max-width:900px){.tac-grid{grid-template-columns:1fr;}}
.tac-tile{
  background:var(--panel-2); border:1px solid var(--border); border-radius:14px; padding:16px;
  cursor:pointer; transition:.2s; text-align:center;
}
.tac-tile:hover{transform:translateY(-4px); border-color:var(--accent); box-shadow:0 10px 24px rgba(62,193,255,.15);}
.tac-tile i{font-size:1.3rem; color:var(--accent); margin-bottom:6px; display:block;}
.tac-tile .tname{font-size:.86rem; font-weight:700;}

.link-row{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid rgba(255,255,255,.06);}
.link-row:last-child{border-bottom:none;}
.link-row a{color:var(--text); text-decoration:none; font-weight:600;}
.link-row a:hover{color:var(--accent);}
.link-row .ext{margin-left:auto; color:var(--text-dim); font-size:.75rem;}

.fig-img{max-width:100%; border-radius:12px; border:1px solid var(--border); background:#fff; padding:14px; display:block; margin:0 auto;}
.fig-cap{text-align:center; font-size:.78rem; color:var(--text-dim); margin-top:8px;}

.step-big{display:flex; gap:20px; align-items:flex-start;}
.step-num{
  width:60px; height:60px; border-radius:16px; background:rgba(62,193,255,.12); border:1px solid rgba(62,193,255,.35);
  color:var(--accent); display:flex; align-items:center; justify-content:center; font-size:1.6rem; font-weight:800;
  font-family:'JetBrains Mono'; flex-shrink:0;
}
.compare-col{background:var(--panel-2); border:1px solid var(--border); border-radius:14px; padding:20px;}
.compare-col h4{font-weight:800; font-size:1.02rem; margin-bottom:10px; display:flex; align-items:center; gap:8px;}
.example-box{background:rgba(62,193,255,.07); border:1px dashed rgba(62,193,255,.35); border-radius:12px; padding:14px 16px; margin-top:10px;}
.example-box .ex-label{font-size:.72rem; text-transform:uppercase; letter-spacing:.08em; color:var(--accent); font-weight:800; margin-bottom:4px; display:flex; align-items:center; gap:6px;}
.flow-diagram{display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; padding:18px 10px;}
.flow-box{background:var(--panel-2); border:1px solid var(--border); border-radius:12px; padding:14px 18px; text-align:center; min-width:120px;}
.flow-box i{font-size:1.4rem; color:var(--accent); display:block; margin-bottom:6px;}
.flow-box .flabel{font-size:.82rem; font-weight:700;}
.flow-arrow{color:var(--text-dim); font-size:1.3rem;}
.cmp-table{width:100%; border-collapse:collapse; font-size:.86rem;}
.cmp-table th, .cmp-table td{padding:10px 12px; text-align:left; border-bottom:1px solid var(--border);}
.cmp-table th{color:var(--accent); font-weight:800; font-size:.78rem; text-transform:uppercase; letter-spacing:.05em;}
.cmp-table td{color:var(--text-dim);}
.cmp-table td strong{color:var(--text);}
.cmp-table tr:last-child td{border-bottom:none;}
</style>
</head>
<body>

<div class="blueprint"></div>
<div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
<div class="brand"><i class="fa-solid fa-plug-circle-bolt"></i> ANDIS 2 · Unidad 3</div>
<div class="hud"><i class="fa-solid fa-layer-group"></i> <span class="unit-tag" id="hudCurrent">1</span>/<span id="hudTotal">0</span></div>

<div class="slides-container" id="slidesContainer"></div>

<div class="nav-controls">
  <button class="nav-btn" id="prevBtn"><i class="fa-solid fa-chevron-left"></i></button>
  <div class="nav-dots" id="navDots"></div>
  <button class="nav-btn" id="nextBtn"><i class="fa-solid fa-chevron-right"></i></button>
</div>
<div class="footer-note">← → para navegar</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.10.5/sweetalert2.all.min.js"></script>
<script>
const slidesHTML = [];

// 0. Portada
slidesHTML.push(`
<div class="slide-inner d-flex flex-column justify-content-center" style="min-height:78vh;">
  <div class="animate__animated animate__fadeInDown">
    <span class="eyebrow"><i class="fa-solid fa-plug-circle-bolt"></i> Unidad 3 · Soluciones arquitectónicas</span>
    <h1 class="slide-title">Interacción e integración de aplicaciones</h1>
    <p class="subtitle">Cómo se comunican los componentes entre sí, y cómo se hace que aplicaciones separadas —construidas en momentos y tecnologías distintas— trabajen juntas: 4 mecanismos clásicos, con ejemplos de la vida real.</p>
  </div>
</div>
`);

// 1. Interacción
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-arrows-left-right"></i> El concepto base</span>
  <h2 class="slide-title">Interacción</h2>
  <div class="card-panel">
    <p style="font-size:1.02rem; line-height:1.75; margin-bottom:0;">
      En el contexto de componentes e interfaces, las interacciones más relevantes son las <strong>transferencias de control</strong> —calls— o las <strong>transferencias de datos</strong>.
    </p>
  </div>
  <p class="subtitle mt-3 mb-2">Algunas formas concretas de interacción:</p>
  <div class="grid-2">
    <div class="card-panel d-flex gap-3 align-items-center">
      <div class="icon-tile"><i class="fa-solid fa-code"></i></div>
      <div><h4 style="margin:0 0 3px 0; font-weight:800; font-size:.95rem;">Invocación local</h4><p style="margin:0; color:var(--text-dim); font-size:.84rem;">Llamar a una función o método con el propio lenguaje de programación.</p></div>
    </div>
    <div class="card-panel d-flex gap-3 align-items-center">
      <div class="icon-tile" style="background:rgba(123,107,255,.12); color:#b3a8ff; border-color:rgba(123,107,255,.35)"><i class="fa-solid fa-tower-broadcast"></i></div>
      <div><h4 style="margin:0 0 3px 0; font-weight:800; font-size:.95rem;">RPC</h4><p style="margin:0; color:var(--text-dim); font-size:.84rem;">Llamada a procedimientos remotos, en otra máquina o proceso.</p></div>
    </div>
    <div class="card-panel d-flex gap-3 align-items-center">
      <div class="icon-tile" style="background:rgba(255,181,71,.12); color:var(--accent-3); border-color:rgba(255,181,71,.35)"><i class="fa-solid fa-water"></i></div>
      <div><h4 style="margin:0 0 3px 0; font-weight:800; font-size:.95rem;">Flujos de datos</h4><p style="margin:0; color:var(--text-dim); font-size:.84rem;">Datos que fluyen de forma continua entre componentes —streaming—.</p></div>
    </div>
    <div class="card-panel d-flex gap-3 align-items-center">
      <div class="icon-tile" style="background:rgba(62,230,168,.12); color:var(--ok); border-color:rgba(62,230,168,.35)"><i class="fa-solid fa-memory"></i></div>
      <div><h4 style="margin:0 0 3px 0; font-weight:800; font-size:.95rem;">Memoria compartida</h4><p style="margin:0; color:var(--text-dim); font-size:.84rem;">Dos componentes leen y escriben la misma región de memoria.</p></div>
    </div>
  </div>
  <div class="card-panel mt-3 d-flex gap-3 align-items-center">
    <div class="icon-tile" style="background:rgba(255,107,107,.12); color:#ff6b6b; border-color:rgba(255,107,107,.35)"><i class="fa-solid fa-envelope"></i></div>
    <div class="small" style="color:var(--text-dim)"><strong style="color:var(--text)">Envío de mensajes:</strong> una aplicación publica datos que otra recibe de forma desacoplada — es la base de la mensajería que vamos a ver en esta clase.</div>
  </div>
</div>
`);

// 2. Integración de aplicaciones - concepto
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-puzzle-piece"></i> Un problema de todos los días</span>
  <h2 class="slide-title">Integración de aplicaciones</h2>
  <div class="card-panel">
    <p style="font-size:1.0rem; line-height:1.75; margin-bottom:0;">
      Es la tarea de lograr que <strong>aplicaciones separadas funcionen juntas</strong> para implementar cierta funcionalidad. Las aplicaciones a integrar típicamente son <strong>sistemas adyacentes</strong> de la aplicación que estamos construyendo.
    </p>
  </div>
  <div class="example-box mt-3" style="margin-top:18px;">
    <div class="ex-label"><i class="fa-solid fa-lightbulb"></i> Ejemplo simple</div>
    Una tienda online desarrolla su propio carrito de compras, pero necesita comunicarse con la pasarela de pagos —un COTS de terceros—, con el sistema contable existente de la empresa —hecho hace 10 años en otra tecnología—, y con el sistema de logística que gestiona los envíos. Ninguno de esos tres sistemas se construyó pensando en el otro: hay que <strong>integrarlos</strong>.
  </div>
  <div class="card-panel mt-3 d-flex gap-3 align-items-center">
    <div class="icon-tile" style="background:rgba(255,181,71,.12); color:var(--accent-3); border-color:rgba(255,181,71,.35)"><i class="fa-solid fa-triangle-exclamation"></i></div>
    <div class="small" style="color:var(--text-dim)">Esto pasa en <strong style="color:var(--text)">cualquier organización</strong>: se compran paquetes COTS o SaaS de distintos proveedores, se desarrollan aplicaciones en distintos momentos con tecnologías distintas, y distintos equipos eligen enfoques distintos. Aunque hablemos de aplicaciones existentes, los mismos mecanismos también se usan al diseñar aplicaciones nuevas.</div>
  </div>
</div>
`);

// 3. Las 4 opciones - overview
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-list-check"></i> Cuatro caminos posibles</span>
  <h2 class="slide-title">Opciones para integrar aplicaciones</h2>
  <p class="subtitle mb-3">Cada una resuelve el problema de una forma distinta, con sus propios costos y beneficios. Las vemos una por una.</p>
  <div class="grid-2">
    <div class="compare-col">
      <h4><i class="fa-solid fa-file-arrow-up" style="color:var(--accent)"></i> File Transfer</h4>
      <p style="color:var(--text-dim); font-size:.87rem; margin:0;">Compartir datos mediante archivos —CSV, XML, JSON—.</p>
    </div>
    <div class="compare-col">
      <h4><i class="fa-solid fa-database" style="color:var(--accent-2)"></i> Shared Database</h4>
      <p style="color:var(--text-dim); font-size:.87rem; margin:0;">Todas las aplicaciones leen y escriben en la misma base de datos.</p>
    </div>
    <div class="compare-col">
      <h4><i class="fa-solid fa-tower-broadcast" style="color:var(--accent-3)"></i> Remote Procedure Invocation</h4>
      <p style="color:var(--text-dim); font-size:.87rem; margin:0;">Una aplicación invoca directamente una función de otra.</p>
    </div>
    <div class="compare-col">
      <h4><i class="fa-solid fa-envelope" style="color:var(--ok)"></i> Messaging</h4>
      <p style="color:var(--text-dim); font-size:.87rem; margin:0;">Se envían mensajes asíncronos a través de un canal.</p>
    </div>
  </div>
</div>
`);

// 4. File Transfer
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-file-arrow-up"></i> Opción 1</span>
  <h2 class="slide-title">File Transfer — transferencia de archivos</h2>
  <div class="card-panel">
    <p style="font-size:.98rem; line-height:1.7; margin-bottom:0;">
      Cada aplicación produce archivos con la información que las demás deben consumir. Es el mecanismo <strong>más simple</strong>: los archivos son un formato universal, soportado por cualquier sistema operativo y lenguaje. El formato y el contenido —muchas veces— se convierten en una <strong>interfaz pública</strong>, sobre todo si la aplicación productora es un COTS.
    </p>
  </div>
  <div class="example-box mt-3" style="margin-top:18px;">
    <div class="ex-label"><i class="fa-solid fa-lightbulb"></i> Ejemplo simple</div>
    Todas las noches, el sistema de ventas de una cadena de supermercados genera un archivo CSV con las ventas del día y lo deja en una carpeta compartida. A la madrugada, el sistema contable lee ese archivo y actualiza sus registros. Nadie necesita saber cómo funciona el otro sistema por dentro — solo se ponen de acuerdo en el formato del archivo.
  </div>
  <div class="card-panel mt-3 d-flex gap-3 align-items-center">
    <div class="icon-tile" style="background:rgba(255,107,107,.12); color:#ff6b6b; border-color:rgba(255,107,107,.35)"><i class="fa-solid fa-clock"></i></div>
    <div class="small" style="color:var(--text-dim)">El límite principal: la actualización tarda tanto como la <strong style="color:var(--text)">frecuencia de sincronización</strong>. Si el negocio necesita datos al instante, este no es el mecanismo adecuado.</div>
  </div>
</div>
`);

// 5. Shared Database
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-database"></i> Opción 2</span>
  <h2 class="slide-title">Shared Database — base de datos compartida</h2>
  <div class="card-panel">
    <p style="font-size:.98rem; line-height:1.7; margin-bottom:0;">
      Se hace que todas las aplicaciones almacenen sus datos en <strong>una única base de datos compartida</strong>, con un esquema diseñado para cubrir las necesidades de todas ellas. Como comparten transacciones, los datos son <strong>consistentes todo el tiempo</strong> —la propia base de datos maneja la concurrencia—.
    </p>
  </div>
  <div class="example-box mt-3" style="margin-top:18px;">
    <div class="ex-label"><i class="fa-solid fa-lightbulb"></i> Ejemplo simple</div>
    Un hospital tiene un sistema de turnos, uno de historias clínicas y uno de facturación, pero los tres leen y escriben sobre la misma base de datos de pacientes: si el sistema de turnos actualiza el teléfono de un paciente, el de facturación lo ve al instante, sin ningún archivo ni llamada de por medio.
  </div>
  <div class="card-panel mt-3 d-flex gap-3 align-items-center">
    <div class="icon-tile" style="background:rgba(255,181,71,.12); color:var(--accent-3); border-color:rgba(255,181,71,.35)"><i class="fa-solid fa-triangle-exclamation"></i></div>
    <div class="small" style="color:var(--text-dim)">Riesgos: acordar un <strong style="color:var(--text)">esquema único</strong> para todas las aplicaciones es difícil y puede quedar complejo; con COTS el esquema puede ser inmodificable; y si muchas aplicaciones la usan a la vez, la base de datos puede volverse un <strong style="color:var(--text)">cuello de botella</strong> —peor aún si son aplicaciones distribuidas, sumando latencia de red—.</div>
  </div>
</div>
`);

// 6. RPC
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-tower-broadcast"></i> Opción 3</span>
  <h2 class="slide-title">Remote Procedure Invocation</h2>
  <div class="card-panel">
    <p style="font-size:.98rem; line-height:1.7; margin-bottom:0;">
      Cada aplicación se diseña como un <strong>componente a gran escala</strong> con sus datos encapsulados, y expone una <strong>interfaz</strong> para que otras aplicaciones la invoquen. A diferencia de File Transfer o Shared Database, acá se integra <strong>funcionalidad</strong>, no solo datos — y cada aplicación mantiene el control sobre los suyos.
    </p>
  </div>
  <div class="example-box mt-3" style="margin-top:18px;">
    <div class="ex-label"><i class="fa-solid fa-lightbulb"></i> Ejemplo simple</div>
    Una app de delivery, al confirmar un pedido, llama directamente a una API REST del sistema del restaurante para preguntar "¿tenés stock de esta pizza?" y recibe la respuesta al instante. Es como llamar a una función local, pero la función vive en otra empresa, en otro servidor.
  </div>
  <div class="card-panel mt-3 d-flex gap-3 align-items-center">
    <div class="icon-tile" style="background:rgba(255,107,107,.12); color:#ff6b6b; border-color:rgba(255,107,107,.35)"><i class="fa-solid fa-triangle-exclamation"></i></div>

/* ============ MOTOR DE NAVEGACIÓN ============ */
const container = document.getElementById('slidesContainer');
slidesHTML.forEach((html, i)=>{
  const div = document.createElement('div');
  div.className = 'slide' + (i===0 ? ' active' : '');
  div.id = 'slide'+i;
  div.innerHTML = html;
  container.appendChild(div);
});

let current = 0;
const total = slidesHTML.length;
document.getElementById('hudTotal').textContent = total;

const dotsWrap = document.getElementById('navDots');
for(let i=0;i<total;i++){
  const d = document.createElement('div');
  d.className = 'dot' + (i===0?' active':'');
  d.onclick = ()=>goTo(i);
  dotsWrap.appendChild(d);
}

function updateUI(){
  document.querySelectorAll('.slide').forEach((s,i)=>{ s.classList.toggle('active', i===current); });
  document.querySelectorAll('.nav-dots .dot').forEach((d,i)=>{ d.classList.toggle('active', i===current); });
  document.getElementById('hudCurrent').textContent = current+1;
  document.getElementById('progressFill').style.width = ((current+1)/total*100)+'%';
  const active = document.getElementById('slide'+current);
  active.scrollTop = 0;
  const animTarget = active.querySelector('.slide-inner');
  if(animTarget){
    animTarget.classList.remove('animate__fadeIn');
    void animTarget.offsetWidth;
    animTarget.classList.add('animate__animated','animate__fadeIn');
  }
}
function goTo(i){ if(i<0||i>=total) return; current = i; updateUI(); }
document.getElementById('prevBtn').onclick = ()=>goTo(current-1);
document.getElementById('nextBtn').onclick = ()=>goTo(current+1);
document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight') goTo(current+1);
  if(e.key==='ArrowLeft') goTo(current-1);
});
updateUI();

/* ============ ROLES DE LA MENSAJERÍA ============ */
const roles = [
  {icon:'fa-road', n:'Message Channel', d:'El canal que conecta al remitente —quien envía el mensaje— con el receptor —quien lo recibe—. Es la "cañería" por donde viaja el mensaje.<br><br><strong>Ejemplo simple:</strong> una cola de RabbitMQ o un tópico de Kafka llamado "pedidos-confirmados".'},
  {icon:'fa-signs-post', n:'Message Router', d:'Decide a qué receptor enviar cada mensaje, cuando hay varios posibles destinos.<br><br><strong>Ejemplo simple:</strong> un mensaje de "pedido internacional" se enruta al sistema de aduanas; uno de "pedido local" se enruta directo a logística.'},
  {icon:'fa-language', n:'Message Translator', d:'Convierte el mensaje al formato que el receptor espera, para que remitente y receptor no necesiten compartir el mismo modelo de datos.<br><br><strong>Ejemplo simple:</strong> el sistema de ventas envía el precio en dólares, y el traductor lo convierte a pesos antes de entregarlo al sistema contable local.'},
  {icon:'fa-plug', n:'Message Endpoint', d:'El código que cada aplicación implementa para poder enviar y recibir mensajes — su "conexión" al sistema de mensajería.<br><br><strong>Ejemplo simple:</strong> el pequeño módulo dentro de la app que se suscribe a la cola y llama a una función cada vez que llega un mensaje nuevo.'}
];
const gridMensajeria = document.getElementById('gridMensajeria');
roles.forEach(t=>{
  const tile = document.createElement('div');
  tile.className = 'tac-tile';
  tile.innerHTML = `<i class="fa-solid ${t.icon}"></i><div class="tname">${t.n}</div>`;
  tile.onclick = ()=>{
    Swal.fire({
      title: t.n,
      html: `<div style="text-align:left; font-size:.94rem; line-height:1.6;">${t.d}</div>`,
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    });
  };
  gridMensajeria.appendChild(tile);
});

/* ============ QUIZ ============ */
const preguntas = [
  {
    texto:'Un sistema de nómina genera cada noche un archivo con los sueldos calculados, y el sistema contable lo lee a la madrugada. ¿Qué mecanismo de integración es este?',
    opciones:{
      a:'Remote Procedure Invocation',
      b:'Shared Database',
      c:'File Transfer',
      d:'Messaging'
    },
    correcta:'c'
  },
  {
    texto:'¿Cuál es la ventaja principal de una base de datos compartida frente a la transferencia de archivos?',
    opciones:{
      a:'No requiere ponerse de acuerdo en ningún esquema de datos',
      b:'Los datos son consistentes todo el tiempo, porque la propia base de datos maneja la concurrencia entre aplicaciones',
      c:'Elimina por completo el riesgo de cuellos de botella',
      d:'Funciona igual de bien sin importar cuántas aplicaciones la usen a la vez'
    },
    correcta:'b'
  },
  {
    texto:'Una aplicación de delivery llama a una API del restaurante para consultar stock, y espera la respuesta antes de continuar. ¿Qué riesgo advierte el texto sobre este tipo de integración?',
    opciones:{
      a:'Que como se siente igual de simple que una llamada local, es fácil ignorar las diferencias de rendimiento y confiabilidad entre invocaciones locales y remotas',
      b:'Que nunca puede usarse entre dos empresas distintas',
      c:'Que no permite compartir funcionalidad, solo datos',
      d:'Que siempre requiere una base de datos compartida de por medio'
    },
    correcta:'a'
  },
  {
    texto:'¿Qué característica distingue a la mensajería de la invocación de procedimientos remotos (RPC)?',
    opciones:{
      a:'La mensajería nunca puede desencadenar comportamiento en el receptor',
      b:'La mensajería es asíncrona: quien envía no tiene que esperar a que el receptor procese el mensaje',
      c:'RPC siempre es más rápida que la mensajería en cualquier escenario',
      d:'La mensajería solo puede usarse entre aplicaciones del mismo proveedor'
    },
    correcta:'b'
  },
  {
    texto:'En un sistema de mensajería, ¿qué rol se encarga de convertir un mensaje al formato que espera el receptor?',
    opciones:{
      a:'Message Channel',
      b:'Message Endpoint',
      c:'Message Router',
      d:'Message Translator'
    },
    correcta:'d'
  },
  {
    texto:'¿Por qué, según el teórico, los mismos mecanismos de integración de aplicaciones existentes también sirven al diseñar aplicaciones nuevas?',
    opciones:{
      a:'Porque son patrones que resuelven un problema general de comunicación entre componentes, no exclusivo de sistemas legados',
      b:'Porque las aplicaciones nuevas nunca necesitan comunicarse con nada más',
      c:'Porque todas las aplicaciones nuevas deben usar exactamente Shared Database',
      d:'Porque no es cierto: los mecanismos solo aplican a sistemas existentes'
    },
    correcta:'a'
  }
];
let idxPregunta = 0, aciertos = 0;

function lanzarQuiz(){ idxPregunta = 0; aciertos = 0; mostrarPregunta(); }
function mostrarPregunta(){
  if(idxPregunta >= preguntas.length){
    Swal.fire({
      title:'Resultado',
      html:`Acertaste <b>${aciertos}/${preguntas.length}</b>.`,
      icon: aciertos===preguntas.length ? 'success' : 'info',
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    });
    return;
  }
  const p = preguntas[idxPregunta];
  Swal.fire({
    title: p.texto,
    input:'radio',
    inputOptions: p.opciones,
    background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff',
    confirmButtonText:'Responder',
    inputValidator: (value)=> !value && 'Elegí una opción'
  }).then(res=>{
    if(!res.isConfirmed) return;
    const ok = res.value === p.correcta;
    if(ok) aciertos++;
    Swal.fire({
      title: ok ? '¡Correcto!' : 'No es así',
      html: `La respuesta correcta era: <b>${p.opciones[p.correcta]}</b>`,
      icon: ok ? 'success' : 'error',
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    }).then(()=>{ idxPregunta++; mostrarPregunta(); });
  });
}
</script>

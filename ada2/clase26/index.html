<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANDIS 2 · Unidad 3 — Teorema de Brewer (CAP)</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#070b14; --bg-1:#0d1424; --panel:#111a2e; --panel-2:#16223a;
  --accent:#3ec1ff; --accent-2:#7b6bff; --accent-3:#ffb547; --ok:#3ee6a8;
  --text:#e8edf7; --text-dim:#8fa0bd; --border:#22304d;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(1200px 700px at 15% -10%, rgba(62,193,255,.10), transparent 60%),
    radial-gradient(1000px 700px at 110% 10%, rgba(123,107,255,.12), transparent 55%),
    var(--bg-0);
  color:var(--text); font-family:'Inter',sans-serif; overflow:hidden;
}
.mono{font-family:'JetBrains Mono',monospace}
.blueprint{
  position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.35;
  background-image:linear-gradient(rgba(62,193,255,.06) 1px, transparent 1px),linear-gradient(90deg, rgba(62,193,255,.06) 1px, transparent 1px);
  background-size:42px 42px;
}
.progress-track{position:fixed; top:0; left:0; width:100%; height:4px; background:rgba(255,255,255,.06); z-index:50;}
.progress-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--accent-2)); transition:width .4s ease; box-shadow:0 0 12px var(--accent);}
.hud{position:fixed; top:14px; right:18px; z-index:50; background:rgba(17,26,46,.85); border:1px solid var(--border); backdrop-filter:blur(6px); padding:7px 14px; border-radius:999px; font-size:.82rem; color:var(--text-dim); display:flex; align-items:center; gap:8px;}
.hud .unit-tag{color:var(--accent); font-weight:700}
.brand{position:fixed; top:14px; left:18px; z-index:50; font-size:.78rem; color:var(--text-dim); display:flex; align-items:center; gap:8px; letter-spacing:.03em;}
.brand i{color:var(--accent-3)}
.slides-container{position:relative; z-index:1; height:100vh; width:100vw;}
.slide{position:absolute; inset:0; display:none; padding:90px 8vw 110px 8vw; overflow-y:auto;}
.slide.active{display:block}
.slide-inner{max-width:1180px; margin:0 auto;}
.eyebrow{display:inline-flex; align-items:center; gap:8px; font-size:.78rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent); font-weight:700; margin-bottom:14px;}
.eyebrow i{font-size:.9rem}
h1.slide-title{font-size:clamp(1.9rem,3.4vw,3rem); font-weight:800; margin-bottom:.4rem; line-height:1.1;}
h2.slide-title{font-size:clamp(1.5rem,2.6vw,2.2rem); font-weight:800; margin-bottom:.6rem;}
.subtitle{color:var(--text-dim); font-size:1.05rem; max-width:820px;}
.card-panel{background:linear-gradient(180deg, var(--panel), var(--panel-2)); border:1px solid var(--border); border-radius:16px; padding:26px 28px; box-shadow:0 12px 30px rgba(0,0,0,.35);}
.card-panel + .card-panel{margin-top:18px}
.pill{display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:999px; font-size:.76rem; font-weight:700; background:rgba(62,193,255,.12); color:var(--accent); border:1px solid rgba(62,193,255,.35);}
.pill.purple{background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)}
.pill.amber{background:rgba(255,181,71,.14); color:var(--accent-3); border-color:rgba(255,181,71,.4)}
.pill.ok{background:rgba(62,230,168,.12); color:var(--ok); border-color:rgba(62,230,168,.35)}
.pill.bad{background:rgba(255,107,107,.12); color:#ff6b6b; border-color:rgba(255,107,107,.35)}
.icon-tile{width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center; background:rgba(62,193,255,.12); color:var(--accent); font-size:1.3rem; border:1px solid rgba(62,193,255,.3); flex-shrink:0;}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
.grid-4{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
@media (max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}
ul.clean{list-style:none; margin:0; padding:0;}
ul.clean li{position:relative; padding:6px 0 6px 26px; color:var(--text); font-size:.94rem;}
ul.clean li::before{content:"\f105"; font-family:"Font Awesome 6 Free"; font-weight:900; color:var(--accent); position:absolute; left:2px; top:8px; font-size:.85rem;}
.check-btn{border:none; background:linear-gradient(90deg,var(--accent),var(--accent-2)); color:#04101f; font-weight:800; padding:10px 22px; border-radius:10px; font-size:.9rem; box-shadow:0 8px 22px rgba(62,193,255,.25); cursor:pointer;}
.check-btn:hover{filter:brightness(1.08); color:#04101f;}
.nav-controls{position:fixed; bottom:18px; left:0; right:0; z-index:50; display:flex; justify-content:center; gap:14px; align-items:center;}
.nav-btn{width:46px; height:46px; border-radius:50%; border:1px solid var(--border); background:rgba(17,26,46,.9); color:var(--text); display:flex; align-items:center; justify-content:center; font-size:1.1rem; backdrop-filter:blur(6px);}
.nav-btn:hover{border-color:var(--accent); color:var(--accent);}
.nav-dots{display:flex; gap:6px; align-items:center; background:rgba(17,26,46,.9); border:1px solid var(--border); padding:8px 14px; border-radius:999px;}
.nav-dots .dot{width:7px; height:7px; border-radius:50%; background:var(--border); cursor:pointer; transition:.2s;}
.nav-dots .dot.active{background:var(--accent); width:20px; border-radius:4px;}
.footer-note{position:fixed; bottom:20px; right:22px; z-index:50; font-size:.72rem; color:var(--text-dim); font-family:'JetBrains Mono';}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px}

.tac-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px;}
@media (max-width:900px){.tac-grid{grid-template-columns:1fr;}}
.tac-tile{
  background:var(--panel-2); border:1px solid var(--border); border-radius:14px; padding:16px;
  cursor:pointer; transition:.2s; text-align:center;
}
.tac-tile:hover{transform:translateY(-4px); border-color:var(--accent); box-shadow:0 10px 24px rgba(62,193,255,.15);}
.tac-tile i{font-size:1.3rem; color:var(--accent); margin-bottom:6px; display:block;}
.tac-tile .tname{font-size:.86rem; font-weight:700;}

.link-row{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid rgba(255,255,255,.06);}
.link-row:last-child{border-bottom:none;}
.link-row a{color:var(--text); text-decoration:none; font-weight:600;}
.link-row a:hover{color:var(--accent);}
.link-row .ext{margin-left:auto; color:var(--text-dim); font-size:.75rem;}

.fig-img{max-width:100%; border-radius:12px; border:1px solid var(--border); background:#fff; padding:14px; display:block; margin:0 auto;}
.fig-cap{text-align:center; font-size:.78rem; color:var(--text-dim); margin-top:8px;}

.step-big{display:flex; gap:20px; align-items:flex-start;}
.step-num{
  width:60px; height:60px; border-radius:16px; background:rgba(62,193,255,.12); border:1px solid rgba(62,193,255,.35);
  color:var(--accent); display:flex; align-items:center; justify-content:center; font-size:1.6rem; font-weight:800;
  font-family:'JetBrains Mono'; flex-shrink:0;
}
.acid-letter{
  width:64px; height:64px; border-radius:18px; display:flex; align-items:center; justify-content:center;
  font-size:1.9rem; font-weight:800; font-family:'JetBrains Mono'; flex-shrink:0;
}
.compare-col{background:var(--panel-2); border:1px solid var(--border); border-radius:14px; padding:20px;}
.compare-col h4{font-weight:800; font-size:1.02rem; margin-bottom:10px; display:flex; align-items:center; gap:8px;}
.venn-wrap{position:relative; width:100%; max-width:520px; height:340px; margin:10px auto;}
.venn-circle{position:absolute; width:230px; height:230px; border-radius:50%; opacity:.22; mix-blend-mode:screen;}
.venn-label{position:absolute; font-weight:800; font-size:1.1rem; font-family:'JetBrains Mono';}
</style>
</head>
<body>

<div class="blueprint"></div>
<div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
<div class="brand"><i class="fa-solid fa-scale-unbalanced"></i> ANDIS 2 · Unidad 3</div>
<div class="hud"><i class="fa-solid fa-layer-group"></i> <span class="unit-tag" id="hudCurrent">1</span>/<span id="hudTotal">0</span></div>

<div class="slides-container" id="slidesContainer"></div>

<div class="nav-controls">
  <button class="nav-btn" id="prevBtn"><i class="fa-solid fa-chevron-left"></i></button>
  <div class="nav-dots" id="navDots"></div>
  <button class="nav-btn" id="nextBtn"><i class="fa-solid fa-chevron-right"></i></button>
</div>
<div class="footer-note">← → para navegar</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.10.5/sweetalert2.all.min.js"></script>
<script>
const slidesHTML = [];

// 0. Portada
slidesHTML.push(`
<div class="slide-inner d-flex flex-column justify-content-center" style="min-height:78vh;">
  <div class="animate__animated animate__fadeInDown">
    <span class="eyebrow"><i class="fa-solid fa-scale-unbalanced"></i> Unidad 3 · Soluciones arquitectónicas</span>
    <h1 class="slide-title">Teorema de Brewer (CAP)</h1>
    <p class="subtitle">El teorema que explica por qué ningún sistema distribuido con réplicas puede tenerlo todo: consistencia fuerte, alta disponibilidad y resiliencia a la partición — como máximo, dos de tres.</p>
  </div>
</div>
`);

// 1. Contexto
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-chart-line"></i> El contexto</span>
  <h2 class="slide-title">Aplicaciones a escala de Internet</h2>
  <div class="card-panel">
    <p style="font-size:1.02rem; line-height:1.75; margin-bottom:14px;">
      Las aplicaciones modernas a escala de Internet deben afrontar altas expectativas de <strong>disponibilidad</strong> y <strong>rendimiento</strong> ante cargas de usuarios en crecimiento exponencial.
    </p>
    <p style="font-size:1.02rem; line-height:1.75; margin-bottom:0;">
      Se supone que esas aplicaciones proporcionan alta disponibilidad a través de <strong>redundancia</strong> —por ejemplo, replicación de datos—. Los datos se consideran altamente disponibles si un consumidor determinado siempre puede acceder a <strong>alguna</strong> réplica. A esa escala, el equilibrio entre consistencia y disponibilidad se vuelve inevitable.
    </p>
  </div>
</div>
`);

// 2. Las 3 propiedades definidas
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-list-check"></i> Tres definiciones precisas</span>
  <h2 class="slide-title">Consistencia, disponibilidad, partición</h2>
  <div class="grid-3">
    <div class="compare-col">
      <h4><i class="fa-solid fa-check-double" style="color:var(--accent)"></i> Consistencia fuerte</h4>
      <p style="color:var(--text-dim); font-size:.88rem; line-height:1.6; margin:0;">En este contexto significa consistencia <strong style="color:var(--text)">ACID de copia única</strong>: como si solo existiera una copia de los datos.</p>
    </div>
    <div class="compare-col">
      <h4><i class="fa-solid fa-signal" style="color:var(--ok)"></i> Alta disponibilidad</h4>
      <p style="color:var(--text-dim); font-size:.88rem; line-height:1.6; margin:0;">Se proporciona a través de la <strong style="color:var(--text)">redundancia</strong>: siempre hay alguna réplica accesible.</p>
    </div>
    <div class="compare-col">
      <h4><i class="fa-solid fa-network-wired" style="color:var(--accent-3)"></i> Resiliencia a la partición</h4>
      <p style="color:var(--text-dim); font-size:.88rem; line-height:1.6; margin:0;">El sistema completo puede <strong style="color:var(--text)">sobrevivir</strong> a una partición entre réplicas de datos.</p>
    </div>
  </div>
  <div class="card-panel mt-3">
    <p style="margin:0; font-size:.95rem; line-height:1.7; color:var(--text-dim);">
      Una <strong style="color:var(--text)">partición</strong> ocurre cuando un conjunto de réplicas no puede acceder a otro conjunto de réplicas —los datos redundantes no pueden sincronizarse entre ambos conjuntos— pero ambos conjuntos siguen siendo accesibles por algún grupo de clientes.
    </p>
  </div>
</div>
`);

// 3. CAP - Venn / el teorema
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-shapes"></i> El teorema</span>
  <h2 class="slide-title">CAP: elegí dos de tres</h2>
  <div class="card-panel">
    <p style="font-size:1.02rem; line-height:1.75; margin-bottom:0;">
      El teorema de Brewer establece compromisos entre <strong>Consistencia</strong> fuerte, <strong>Alta disponibilidad</strong> y <strong>Resiliencia a la Partición</strong> —de ahí el nombre <strong class="mono" style="color:var(--accent)">CAP</strong>—. Solo es posible cumplir <strong>dos como máximo, nunca las tres al mismo tiempo</strong>.
    </p>
  </div>
  <div class="venn-wrap">
    <div class="venn-circle" style="background:var(--accent); left:20px; top:20px;"></div>
    <div class="venn-circle" style="background:var(--accent-2); right:20px; top:20px;"></div>
    <div class="venn-circle" style="background:var(--accent-3); left:105px; top:150px;"></div>
    <div class="venn-label" style="color:var(--accent); left:40px; top:34px;">C</div>
    <div class="venn-label" style="color:#b3a8ff; right:40px; top:34px;">A</div>
    <div class="venn-label" style="color:var(--accent-3); left:255px; top:275px;">P</div>
  </div>
</div>
`);

// 4. Combinaciones - explorer
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-list-ol"></i> Demostrándolo exhaustivamente</span>
  <h2 class="slide-title">Las tres combinaciones posibles</h2>
  <p class="subtitle mb-3">Tocá cada combinación para ver de qué se trata y un ejemplo real.</p>
  <div class="tac-grid" id="gridCombinaciones"></div>
</div>
`);

// 5. Críticas
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-magnifying-glass"></i> Una mirada más matizada</span>
  <h2 class="slide-title">La crítica al "dos de tres"</h2>
  <div class="card-panel">
    <p style="font-size:.98rem; line-height:1.75; margin-bottom:14px;">
      La noción de "dos de tres" ha sido criticada por <strong>simplificar en exceso</strong> la relación entre consistencia, disponibilidad y tolerancia a particiones. En la práctica, esas tensiones son más complejas y matizadas.
    </p>
    <p style="font-size:.98rem; line-height:1.75; margin-bottom:0;">
      Brewer señala que no se puede garantizar consistencia y disponibilidad <strong>perfectas</strong> durante una partición, pero esas situaciones son poco comunes. Los arquitectos siguen teniendo que elegir entre consistencia y disponibilidad cuando ocurre una partición, pero tienen mucha <strong>flexibilidad</strong> en cómo gestionarla y cómo recuperarse de ella —tanto durante la partición como después de superarla—.
    </p>
  </div>
</div>
`);

// 6. Brewer, ACID y BASE
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-link"></i> Conectando los puntos</span>
  <h2 class="slide-title">Brewer, ACID y BASE</h2>
  <div class="card-panel">
    <p style="font-size:1.0rem; line-height:1.75; margin-bottom:0;">
      En la práctica, la tolerancia a particiones de red <strong>no suele ser negociable</strong>: las fallas y divisiones de red son inevitables — suponer lo contrario es caer en las falacias de la computación distribuida. Por eso, la decisión real de los arquitectos está entre <strong>disponibilidad</strong> y <strong>consistencia</strong>.
    </p>
  </div>
  <div class="grid-2 mt-3">
    <div class="compare-col">
      <h4><i class="fa-solid fa-flask" style="color:var(--ok)"></i> Priorizan disponibilidad → BASE</h4>
      <p style="color:var(--text-dim); font-size:.88rem; line-height:1.6; margin:0;">Suelen usar modelos de <strong style="color:var(--text)">consistencia eventual</strong>, propios del paradigma BASE.</p>
    </div>
    <div class="compare-col">
      <h4><i class="fa-solid fa-vial" style="color:var(--accent)"></i> Priorizan consistencia → ACID</h4>
      <p style="color:var(--text-dim); font-size:.88rem; line-height:1.6; margin:0;">Se adhieren a los principios <strong style="color:var(--text)">ACID</strong> para mantener consistencia sólida.</p>
    </div>
  </div>
  <div class="card-panel mt-3">
    <div class="link-row"><i class="fa-solid fa-link" style="color:var(--accent)"></i><a href="https://github.com/ucudal/ANDIS_Conceptos/blob/main/4_Conceptos/4_Falacias_computacion_distribuida.md" target="_blank">Falacias de la computación distribuida</a><span class="ext">github.com</span></div>
    <div class="link-row"><i class="fa-solid fa-link" style="color:var(--accent)"></i><a href="https://github.com/ucudal/ANDIS_Conceptos/blob/main/4_Conceptos/4_BASE.md" target="_blank">BASE — ANDIS_Conceptos</a><span class="ext">github.com</span></div>
    <div class="link-row"><i class="fa-solid fa-link" style="color:var(--accent)"></i><a href="https://github.com/ucudal/ANDIS_Conceptos/blob/main/4_Conceptos/4_ACID.md" target="_blank">ACID — ANDIS_Conceptos</a><span class="ext">github.com</span></div>
  </div>
</div>
`);

// 7. Quiz
slidesHTML.push(`
<div class="slide-inner d-flex flex-column justify-content-center align-items-center text-center" style="min-height:70vh;">
  <span class="eyebrow"><i class="fa-solid fa-brain"></i> Chequeo de comprensión</span>
  <h2 class="slide-title">5 preguntas sobre el Teorema de Brewer</h2>
  <p class="subtitle mb-4">Las tres propiedades, las combinaciones posibles, la crítica al "dos de tres" y su relación con ACID y BASE.</p>
  <button class="check-btn" onclick="lanzarQuiz()"><i class="fa-solid fa-play me-2"></i>Iniciar quiz</button>
</div>
`);

// 8. Cierre
slidesHTML.push(`
<div class="slide-inner d-flex flex-column justify-content-center align-items-center text-center" style="min-height:78vh;">
  <div class="icon-tile mb-3" style="width:72px;height:72px;font-size:2rem;"><i class="fa-solid fa-check"></i></div>
  <span class="eyebrow"><i class="fa-solid fa-flag-checkered"></i> Repaso completo</span>
  <h2 class="slide-title">La partición no se negocia: la elección real es C vs. A</h2>
  <p class="subtitle mb-4" style="max-width:680px;">CAP no es una receta rígida de "elegí dos", sino un recordatorio de que en un mundo donde las redes fallan, cada arquitecto tiene que decidir, de forma consciente, cuánta consistencia sacrifica a cambio de disponibilidad — y viceversa.</p>
</div>
`);

/* ============ MOTOR DE NAVEGACIÓN ============ */
const container = document.getElementById('slidesContainer');
slidesHTML.forEach((html, i)=>{
  const div = document.createElement('div');
  div.className = 'slide' + (i===0 ? ' active' : '');
  div.id = 'slide'+i;
  div.innerHTML = html;
  container.appendChild(div);
});

let current = 0;
const total = slidesHTML.length;
document.getElementById('hudTotal').textContent = total;

const dotsWrap = document.getElementById('navDots');
for(let i=0;i<total;i++){
  const d = document.createElement('div');
  d.className = 'dot' + (i===0?' active':'');
  d.onclick = ()=>goTo(i);
  dotsWrap.appendChild(d);
}

function updateUI(){
  document.querySelectorAll('.slide').forEach((s,i)=>{ s.classList.toggle('active', i===current); });
  document.querySelectorAll('.nav-dots .dot').forEach((d,i)=>{ d.classList.toggle('active', i===current); });
  document.getElementById('hudCurrent').textContent = current+1;
  document.getElementById('progressFill').style.width = ((current+1)/total*100)+'%';
  const active = document.getElementById('slide'+current);
  active.scrollTop = 0;
  const animTarget = active.querySelector('.slide-inner');
  if(animTarget){
    animTarget.classList.remove('animate__fadeIn');
    void animTarget.offsetWidth;
    animTarget.classList.add('animate__animated','animate__fadeIn');
  }
}
function goTo(i){ if(i<0||i>=total) return; current = i; updateUI(); }
document.getElementById('prevBtn').onclick = ()=>goTo(current-1);
document.getElementById('nextBtn').onclick = ()=>goTo(current+1);
document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight') goTo(current+1);
  if(e.key==='ArrowLeft') goTo(current-1);
});
updateUI();

/* ============ LAS 3 COMBINACIONES ============ */
const combinaciones = [
  {icon:'fa-database', n:'CA sin P', d:'Las bases de datos que proporcionan semántica transaccional distribuida solo pueden hacerlo en ausencia de una partición de red que separe las réplicas. En cuanto aparece una partición real, este esquema deja de sostenerse.'},
  {icon:'fa-lock', n:'CP sin A', d:'En caso de una partición, las transacciones posteriores a una base de datos ACID pueden bloquearse hasta que la partición se recupere, para evitar el riesgo de introducir conflictos de sincronización —y por lo tanto inconsistencia—.'},
  {icon:'fa-bolt', n:'AP sin C', d:'El almacenamiento en caché web HTTP proporciona resiliencia de partición cliente-servidor replicando documentos, pero una partición impide verificar si una réplica está vencida. En general: caché con expiración para AP, o réplicas con votación mayoritaria para CP —la minoría queda no disponible—.'}
];
const gridCombinaciones = document.getElementById('gridCombinaciones');
combinaciones.forEach(t=>{
  const tile = document.createElement('div');
  tile.className = 'tac-tile';
  tile.innerHTML = `<i class="fa-solid ${t.icon}"></i><div class="tname">${t.n}</div>`;
  tile.onclick = ()=>{
    Swal.fire({
      title: t.n,
      html: `<p style="text-align:left;">${t.d}</p>`,
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'

/* ============ QUIZ ============ */
const preguntas = [
  {
    texto:'¿Qué establece el teorema de Brewer (CAP)?',
    opciones:{
      a:'Que todo sistema distribuido debe priorizar siempre la disponibilidad sobre la consistencia',
      b:'Que las particiones de red nunca ocurren en sistemas bien diseñados',
      c:'Que entre consistencia fuerte, alta disponibilidad y resiliencia a la partición, solo es posible cumplir dos como máximo, nunca las tres a la vez',
      d:'Que ACID y BASE son equivalentes en cualquier escenario'
    },
    correcta:'c'
  },
  {
    texto:'¿Cuándo ocurre una partición según el teorema de Brewer?',
    opciones:{
      a:'Cuando un conjunto de réplicas queda incomunicado de otro conjunto, aunque ambos sigan atendiendo clientes',
      b:'Cuando un cliente pierde su sesión activa',
      c:'Cuando se agota el espacio en disco de un nodo',
      d:'Cuando dos transacciones concurrentes intentan escribir el mismo dato sin que ningún mecanismo de bloqueo las coordine'
    },
    correcta:'a'
  },
  {
    texto:'En la combinación CP sin A, ¿qué sucede ante una partición?',
    opciones:{
      a:'El sistema descarta automáticamente cualquier dato que no haya sido confirmado por la mayoría de las réplicas antes de la partición',
      b:'Se prioriza siempre servir una respuesta al cliente, aunque esté desactualizada',
      c:'El sistema deja de estar disponible para todos los clientes de forma permanente',
      d:'Las transacciones pueden bloquearse hasta que la partición se recupere, para evitar inconsistencias'
    },
    correcta:'d'
  },
  {
    texto:'¿Por qué se dice que, en la práctica, la tolerancia a particiones no suele ser negociable?',
    opciones:{
      a:'Porque los reguladores lo exigen por ley en la mayoría de los países',
      b:'Porque las fallas y divisiones de red son inevitables, y suponer lo contrario es caer en las falacias de la computación distribuida',
      c:'Porque el hardware moderno eliminó por completo el riesgo de fallas de red',
      d:'Porque todos los proveedores de nube garantizan cero particiones mediante contratos de nivel de servicio'
    },
    correcta:'b'
  },
  {
    texto:'Los sistemas que priorizan la disponibilidad sobre la consistencia durante una partición suelen adherirse a...',
    opciones:{
      a:'Modelos de consistencia eventual, propios del paradigma BASE',
      b:'Los principios ACID de forma estricta, sin excepciones',
      c:'El protocolo PTP para sincronizar sus relojes internos con precisión de microsegundos',
      d:'Algoritmos de consenso como Paxos exclusivamente, sin usar réplicas'
    },
    correcta:'a'
  }
];
let idxPregunta = 0, aciertos = 0;

function lanzarQuiz(){ idxPregunta = 0; aciertos = 0; mostrarPregunta(); }
function mostrarPregunta(){
  if(idxPregunta >= preguntas.length){
    Swal.fire({
      title:'Resultado',
      html:`Acertaste <b>${aciertos}/${preguntas.length}</b>.`,
      icon: aciertos===preguntas.length ? 'success' : 'info',
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    });
    return;
  }
  const p = preguntas[idxPregunta];
  Swal.fire({
    title: p.texto,
    input:'radio',
    inputOptions: p.opciones,
    background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff',
    confirmButtonText:'Responder',
    inputValidator: (value)=> !value && 'Elegí una opción'
  }).then(res=>{
    if(!res.isConfirmed) return;
    const ok = res.value === p.correcta;
    if(ok) aciertos++;
    Swal.fire({
      title: ok ? '¡Correcto!' : 'No es así',
      html: `La respuesta correcta era: <b>${p.opciones[p.correcta]}</b>`,
      icon: ok ? 'success' : 'error',
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    }).then(()=>{ idxPregunta++; mostrarPregunta(); });
  });
}
</script>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANDIS 2 · Teórico — Facilidad de despliegue</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#070b14; --bg-1:#0d1424; --panel:#111a2e; --panel-2:#16223a;
  --accent:#3ec1ff; --accent-2:#7b6bff; --accent-3:#ffb547; --ok:#3ee6a8;
  --text:#e8edf7; --text-dim:#8fa0bd; --border:#22304d;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(1200px 700px at 15% -10%, rgba(62,193,255,.10), transparent 60%),
    radial-gradient(1000px 700px at 110% 10%, rgba(123,107,255,.12), transparent 55%),
    var(--bg-0);
  color:var(--text); font-family:'Inter',sans-serif; overflow:hidden;
}
.mono{font-family:'JetBrains Mono',monospace}
.blueprint{
  position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.35;
  background-image:linear-gradient(rgba(62,193,255,.06) 1px, transparent 1px),linear-gradient(90deg, rgba(62,193,255,.06) 1px, transparent 1px);
  background-size:42px 42px;
}
.progress-track{position:fixed; top:0; left:0; width:100%; height:4px; background:rgba(255,255,255,.06); z-index:50;}
.progress-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--accent-2)); transition:width .4s ease; box-shadow:0 0 12px var(--accent);}
.hud{position:fixed; top:14px; right:18px; z-index:50; background:rgba(17,26,46,.85); border:1px solid var(--border); backdrop-filter:blur(6px); padding:7px 14px; border-radius:999px; font-size:.82rem; color:var(--text-dim); display:flex; align-items:center; gap:8px;}
.hud .unit-tag{color:var(--accent); font-weight:700}
.brand{position:fixed; top:14px; left:18px; z-index:50; font-size:.78rem; color:var(--text-dim); display:flex; align-items:center; gap:8px; letter-spacing:.03em;}
.brand i{color:var(--accent-3)}
.slides-container{position:relative; z-index:1; height:100vh; width:100vw;}
.slide{position:absolute; inset:0; display:none; padding:90px 8vw 110px 8vw; overflow-y:auto;}
.slide.active{display:block}
.slide-inner{max-width:1180px; margin:0 auto;}
.eyebrow{display:inline-flex; align-items:center; gap:8px; font-size:.78rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent); font-weight:700; margin-bottom:14px;}
.eyebrow i{font-size:.9rem}
h1.slide-title{font-size:clamp(1.9rem,3.4vw,3rem); font-weight:800; margin-bottom:.4rem; line-height:1.1;}
h2.slide-title{font-size:clamp(1.5rem,2.6vw,2.2rem); font-weight:800; margin-bottom:.6rem;}
.subtitle{color:var(--text-dim); font-size:1.05rem; max-width:820px;}
.card-panel{background:linear-gradient(180deg, var(--panel), var(--panel-2)); border:1px solid var(--border); border-radius:16px; padding:26px 28px; box-shadow:0 12px 30px rgba(0,0,0,.35);}
.card-panel + .card-panel{margin-top:18px}
.pill{display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:999px; font-size:.76rem; font-weight:700; background:rgba(62,193,255,.12); color:var(--accent); border:1px solid rgba(62,193,255,.35);}
.pill.purple{background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)}
.pill.amber{background:rgba(255,181,71,.14); color:var(--accent-3); border-color:rgba(255,181,71,.4)}
.pill.ok{background:rgba(62,230,168,.12); color:var(--ok); border-color:rgba(62,230,168,.35)}
.icon-tile{width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center; background:rgba(62,193,255,.12); color:var(--accent); font-size:1.3rem; border:1px solid rgba(62,193,255,.3); flex-shrink:0;}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
.grid-4{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
@media (max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}
ul.clean{list-style:none; margin:0; padding:0;}
ul.clean li{position:relative; padding:6px 0 6px 26px; color:var(--text); font-size:.94rem;}
ul.clean li::before{content:"\f105"; font-family:"Font Awesome 6 Free"; font-weight:900; color:var(--accent); position:absolute; left:2px; top:8px; font-size:.85rem;}
.check-btn{border:none; background:linear-gradient(90deg,var(--accent),var(--accent-2)); color:#04101f; font-weight:800; padding:10px 22px; border-radius:10px; font-size:.9rem; box-shadow:0 8px 22px rgba(62,193,255,.25); cursor:pointer;}
.check-btn:hover{filter:brightness(1.08); color:#04101f;}
.nav-controls{position:fixed; bottom:18px; left:0; right:0; z-index:50; display:flex; justify-content:center; gap:14px; align-items:center;}
.nav-btn{width:46px; height:46px; border-radius:50%; border:1px solid var(--border); background:rgba(17,26,46,.9); color:var(--text); display:flex; align-items:center; justify-content:center; font-size:1.1rem; backdrop-filter:blur(6px);}
.nav-btn:hover{border-color:var(--accent); color:var(--accent);}
.nav-dots{display:flex; gap:6px; align-items:center; background:rgba(17,26,46,.9); border:1px solid var(--border); padding:8px 14px; border-radius:999px;}
.nav-dots .dot{width:7px; height:7px; border-radius:50%; background:var(--border); cursor:pointer; transition:.2s;}
.nav-dots .dot.active{background:var(--accent); width:20px; border-radius:4px;}
.footer-note{position:fixed; bottom:20px; right:22px; z-index:50; font-size:.72rem; color:var(--text-dim); font-family:'JetBrains Mono';}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px}

.sub-item{background:var(--panel-2); border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:10px;}
.sub-item .sname{font-weight:700; font-size:.94rem; color:var(--accent); margin-bottom:4px; display:flex; align-items:center; gap:8px;}
.sub-item .sdesc{font-size:.85rem; color:var(--text-dim); margin:0;}

.link-row{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid rgba(255,255,255,.06);}
.link-row:last-child{border-bottom:none;}
.link-row a{color:var(--text); text-decoration:none; font-weight:600;}
.link-row a:hover{color:var(--accent);}
.link-row .ext{margin-left:auto; color:var(--text-dim); font-size:.75rem;}

.pipeline{display:flex; align-items:stretch; gap:8px; flex-wrap:wrap;}
.pipeline .pstage{flex:1; min-width:140px; background:var(--panel-2); border:1px solid var(--border); border-radius:12px; padding:14px; text-align:center;}
.pipeline .pstage .pnum{font-family:'JetBrains Mono'; color:var(--accent); font-weight:800; font-size:.85rem;}
.pipeline .arrow{display:flex; align-items:center; color:var(--text-dim);}

.env-flow{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
.env-flow .estage{flex:1; min-width:150px; border-radius:12px; padding:16px; text-align:center; border:1px solid var(--border);}
.env-flow .arrow{color:var(--text-dim); font-size:1.1rem;}
.env-dev{background:rgba(62,193,255,.10); border-color:rgba(62,193,255,.35);}
.env-ci{background:rgba(123,107,255,.10); border-color:rgba(123,107,255,.35);}
.env-stg{background:rgba(255,181,71,.10); border-color:rgba(255,181,71,.35);}
.env-prod{background:rgba(62,230,168,.10); border-color:rgba(62,230,168,.35);}
</style>
</head>
<body>

<div class="blueprint"></div>
<div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
<div class="brand"><i class="fa-solid fa-cubes"></i> ANDIS 2 · Teórico</div>
<div class="hud"><i class="fa-solid fa-layer-group"></i> <span class="unit-tag" id="hudCurrent">1</span>/<span id="hudTotal">0</span></div>

<div class="slides-container" id="slidesContainer"></div>

<div class="nav-controls">
  <button class="nav-btn" id="prevBtn"><i class="fa-solid fa-chevron-left"></i></button>
  <div class="nav-dots" id="navDots"></div>
  <button class="nav-btn" id="nextBtn"><i class="fa-solid fa-chevron-right"></i></button>
</div>
<div class="footer-note">← → para navegar</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.10.5/sweetalert2.all.min.js"></script>
<script>
const slidesHTML = [];

// 0. Portada
slidesHTML.push(`
<div class="slide-inner d-flex flex-column justify-content-center" style="min-height:78vh;">
  <div class="animate__animated animate__fadeInDown">
    <span class="eyebrow"><i class="fa-solid fa-rocket"></i> Teórico · Unidad 1 · Última lectura</span>
    <h1 class="slide-title">Facilidad de despliegue</h1>
    <p class="subtitle">Deployability: llevar el código del entorno de desarrollo a producción con esfuerzo y demora predecibles — sin sorpresas.</p>
  </div>
</div>
`);

// 1. El proceso de despliegue
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-circle-question"></i> Punto de partida</span>
  <h2 class="slide-title">¿Qué es el proceso de despliegue?</h2>
  <div class="card-panel mt-3">
    <div class="d-flex gap-3">
      <div class="icon-tile"><i class="fa-solid fa-truck-ramp-box"></i></div>
      <p style="font-size:1.02rem; line-height:1.75; margin:0;">
        Es el conjunto de actividades y prácticas involucradas en <strong>entregar un sistema de software</strong>
        desde el entorno de desarrollo hasta el entorno de producción, donde lo usarán los usuarios finales — desde
        compilar y probar el software hasta configurarlo, instalarlo y activarlo.
      </p>
    </div>
  </div>
</div>
`);

// 2. Cinco etapas
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-list-ol"></i> Las cinco etapas</span>
  <h2 class="slide-title">Del código fuente al usuario final</h2>
  <div class="grid-2 mt-3">
    <div class="sub-item"><div class="sname"><i class="fa-solid fa-box"></i>1. Compilación y empaquetado</div><p class="sdesc">Transformar el código fuente en un formato ejecutable: binarios listos para desplegar, o scripts de cambios de base de datos.</p></div>
    <div class="sub-item"><div class="sname"><i class="fa-solid fa-vial"></i>2. Pruebas</div><p class="sdesc">Asegurar que el software funcione correctamente en un entorno que imita al de producción, antes del despliegue real.</p></div>
    <div class="sub-item"><div class="sname"><i class="fa-solid fa-sliders"></i>3. Configuración</div><p class="sdesc">Ajustar software y sistemas relacionados: cadenas de conexión, direcciones IP, URLs, según el entorno de producción.</p></div>
    <div class="sub-item"><div class="sname"><i class="fa-solid fa-arrow-up-from-bracket"></i>4. Implementación</div><p class="sdesc">Transferir el software empaquetado a producción, configurarlo y activarlo para que los usuarios accedan.</p></div>
  </div>
  <div class="sub-item mt-0"><div class="sname"><i class="fa-solid fa-magnifying-glass-chart"></i>5. Verificación y monitoreo</div><p class="sdesc">Comprobar que el software funciona como se esperaba tras el despliegue, y monitorear su rendimiento para detectar problemas.</p></div>
</div>
`);

// 3. Dev vs Ops -> DevOps
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-people-arrows"></i> Quién hace qué</span>
  <h2 class="slide-title">De ahí surge el término DevOps</h2>
  <div class="grid-2 mt-3">
    <div class="card-panel h-100">
      <div class="icon-tile mb-2"><i class="fa-solid fa-code"></i></div>
      <h6 class="fw-bold">Development</h6>
      <p class="small mb-0" style="color:var(--text-dim)">Típicamente realiza la <strong style="color:var(--text)">compilación y empaquetado</strong> — a veces también las pruebas.</p>
    </div>
    <div class="card-panel h-100">
      <div class="icon-tile mb-2" style="background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)"><i class="fa-solid fa-server"></i></div>
      <h6 class="fw-bold">Operations</h6>
      <p class="small mb-0" style="color:var(--text-dim)">Habitualmente se encarga de <strong style="color:var(--text)">configuración, implementación, verificación y monitoreo</strong>.</p>
    </div>
  </div>
  <div class="card-panel mt-3 d-flex gap-3 align-items-center">
    <div class="icon-tile" style="background:rgba(62,230,168,.12); color:var(--ok); border-color:rgba(62,230,168,.35)"><i class="fa-solid fa-infinity"></i></div>
    <div class="small" style="color:var(--text-dim)">La colaboración estrecha entre ambos equipos, a lo largo de todo el proceso, es lo que da origen al término <strong style="color:var(--text)">DevOps</strong>.</div>
  </div>
</div>
`);

// 4. Definición de facilidad de despliegue
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-bullseye"></i> El atributo de calidad</span>
  <h2 class="slide-title">¿Qué es la facilidad de despliegue?</h2>
  <div class="card-panel mt-3">
    <div class="d-flex gap-3">
      <div class="icon-tile"><i class="fa-solid fa-gauge-simple-high"></i></div>
      <p style="font-size:1.05rem; line-height:1.75; margin:0;">
        Es la capacidad de un sistema o componente para ser desplegado <strong>de manera eficiente y segura</strong>
        en entornos de producción, con un <strong>esfuerzo y demora predecibles y aceptables</strong>.
      </p>
    </div>
  </div>
  <div class="card-panel mt-3 d-flex gap-3 align-items-center">
    <div class="icon-tile" style="background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)"><i class="fa-solid fa-sitemap"></i></div>
    <div class="small" style="color:var(--text-dim)">ISO/IEC 25010 tiene un concepto equivalente: <strong style="color:var(--text)">facilidad de instalación</strong> — la facilidad con la que un sistema se puede instalar o desinstalar exitosamente en un entorno determinado.</div>
  </div>
  <div class="card-panel mt-3">
    <p class="small mb-0" style="color:var(--text-dim)">Es crítico en contextos donde las <strong style="color:var(--text)">actualizaciones frecuentes</strong> y los <strong style="color:var(--text)">despliegues rápidos</strong> son necesarios para mantener la competitividad o garantizar la seguridad y el funcionamiento continuo del sistema.</p>
  </div>
</div>
`);

// 5. Dos factores clave
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-scale-balanced"></i> Qué influye</span>
  <h2 class="slide-title">Dos factores clave</h2>
  <div class="grid-2 mt-3">
    <div class="card-panel h-100">
      <div class="icon-tile mb-2"><i class="fa-solid fa-people-group"></i></div>
      <h6 class="fw-bold">Coordinación entre interesados</h6>
      <p class="small mb-0" style="color:var(--text-dim)">El tiempo necesario para coordinar a los distintos interesados antes de implementar un cambio.</p>
    </div>
    <div class="card-panel h-100">
      <div class="icon-tile mb-2" style="background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)"><i class="fa-solid fa-diagram-project"></i></div>
      <h6 class="fw-bold">Deployment pipeline</h6>
      <p class="small mb-0" style="color:var(--text-dim)">El procesamiento del código a través de una cadena de herramientas hasta su despliegue final.</p>
    </div>
  </div>
  <div class="card-panel mt-3">
    <p class="small mb-0" style="color:var(--text-dim)">DevOps busca <strong style="color:var(--text)">automatizar y optimizar</strong> este proceso para reducir riesgos y asegurar consistencia — incluyendo trazabilidad, versionado, actualizaciones sin interrupción del servicio, y la posibilidad de revertir cambios.</p>
  </div>
</div>
`);

// 6. Despliegue continuo y pipeline
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-infinity"></i> Automatizar todo el proceso</span>
  <h2 class="slide-title">Despliegue continuo y deployment pipeline</h2>
  <div class="card-panel mt-3">
    <p style="font-size:1rem; line-height:1.7;">
      Cuando el proceso de despliegue se realiza de forma <strong>completamente automática, sin intervención humana</strong>,
      se lo llama <strong>despliegue continuo</strong>.
    </p>
    <p style="font-size:1rem; line-height:1.7; margin-bottom:0;">
      El <strong>deployment pipeline</strong> es la secuencia de herramientas y actividades que empieza cuando se
      registra el código en un sistema de control de versiones (como GitHub) y termina cuando la aplicación queda
      disponible para los usuarios finales.
    </p>
  </div>
  <div class="pipeline mt-3">
    <div class="pstage"><div class="pnum">01</div>Registro en control de versiones</div>
    <div class="arrow"><i class="fa-solid fa-arrow-right"></i></div>
    <div class="pstage"><div class="pnum">02</div>Integración y pruebas automáticas</div>
    <div class="arrow"><i class="fa-solid fa-arrow-right"></i></div>
    <div class="pstage"><div class="pnum">03</div>Pruebas de rendimiento y seguridad</div>
    <div class="arrow"><i class="fa-solid fa-arrow-right"></i></div>
    <div class="pstage"><div class="pnum">04</div>Despliegue a producción</div>
  </div>
</div>
`);

// 7. Cuatro ambientes
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-layer-group"></i> Los cuatro ambientes</span>
  <h2 class="slide-title">El recorrido del deployment pipeline</h2>
  <div class="env-flow mt-3">
    <div class="estage env-dev"><i class="fa-solid fa-code mb-2 d-block"></i><strong>Desarrollo</strong><div class="small mt-1" style="color:var(--text-dim)">Programación, pruebas unitarias, experimentación.</div></div>
    <div class="arrow"><i class="fa-solid fa-chevron-right"></i></div>
    <div class="estage env-ci"><i class="fa-solid fa-code-merge mb-2 d-block"></i><strong>Integración</strong><div class="small mt-1" style="color:var(--text-dim)">Pruebas automáticas de regresión sobre cambios integrados.</div></div>
    <div class="arrow"><i class="fa-solid fa-chevron-right"></i></div>
    <div class="estage env-stg"><i class="fa-solid fa-flask-vial mb-2 d-block"></i><strong>Preproducción</strong><div class="small mt-1" style="color:var(--text-dim)">Réplica cercana a producción; pruebas de aceptación y validación.</div></div>
    <div class="arrow"><i class="fa-solid fa-chevron-right"></i></div>
    <div class="estage env-prod"><i class="fa-solid fa-globe mb-2 d-block"></i><strong>Producción</strong><div class="small mt-1" style="color:var(--text-dim)">Disponible para usuarios finales; crítico, monitoreado constantemente.</div></div>
  </div>
  <div class="card-panel mt-3 d-flex gap-3 align-items-center">
    <div class="icon-tile" style="background:rgba(255,181,71,.14); color:var(--accent-3); border-color:rgba(255,181,71,.4)"><i class="fa-solid fa-rotate-left"></i></div>
    <div class="small" style="color:var(--text-dim)">Si algo sale mal en producción, suele ser necesario un <strong style="color:var(--text)">rollback</strong>: volver a una versión anterior mientras se soluciona el defecto.</div>
  </div>
</div>
`);

// 8. Calidad del pipeline
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-gauge"></i> Cómo se mide</span>
  <h2 class="slide-title">Calidad del deployment pipeline</h2>
  <div class="grid-3 mt-3">
    <div class="card-panel">
      <div class="icon-tile mb-2"><i class="fa-solid fa-stopwatch"></i></div>
      <h6 class="fw-bold">Tiempo de ciclo</h6>
      <p class="small mb-0" style="color:var(--text-dim)">Cuánto demora el software en atravesar todo el pipeline.</p>
    </div>
    <div class="card-panel">
      <div class="icon-tile mb-2" style="background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)"><i class="fa-solid fa-route"></i></div>
      <h6 class="fw-bold">Trazabilidad</h6>
      <p class="small mb-0" style="color:var(--text-dim)">Saber exactamente de dónde proviene cada artefacto y dónde se genera cada mensaje o error.</p>
    </div>
    <div class="card-panel">
      <div class="icon-tile mb-2" style="background:rgba(62,230,168,.12); color:var(--ok); border-color:rgba(62,230,168,.35)"><i class="fa-solid fa-repeat"></i></div>
      <h6 class="fw-bold">Repetibilidad</h6>
      <p class="small mb-0" style="color:var(--text-dim)">Obtener los mismos resultados al repetir las mismas acciones sobre los mismos artefactos.</p>
    </div>
  </div>
</div>
`);

// 9. Tácticas
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-compass"></i> Cómo se ataca</span>
  <h2 class="slide-title">Tácticas para la facilidad de despliegue</h2>
  <div class="card-panel mt-3">
    <div class="link-row">
      <i class="fa-solid fa-link" style="color:var(--accent)"></i>
      <a href="https://github.com/ucudal/ANDIS_Conceptos/blob/main/2_Tecnicas_y_herramientas/2_05_.Tacticas_arquitectura/2_05_06_Tacticas_facilidad_de_despliegue.md" target="_blank">Tácticas para la facilidad de despliegue — desarrollo completo</a>
      <span class="ext">repositorio</span>
    </div>
  </div>
</div>
`);

// 10. Patrones
slidesHTML.push(`

/* ============ MOTOR DE NAVEGACIÓN ============ */
const container = document.getElementById('slidesContainer');
slidesHTML.forEach((html, i)=>{
  const div = document.createElement('div');
  div.className = 'slide' + (i===0 ? ' active' : '');
  div.id = 'slide'+i;
  div.innerHTML = html;
  container.appendChild(div);
});

let current = 0;
const total = slidesHTML.length;
document.getElementById('hudTotal').textContent = total;

const dotsWrap = document.getElementById('navDots');
for(let i=0;i<total;i++){
  const d = document.createElement('div');
  d.className = 'dot' + (i===0?' active':'');
  d.onclick = ()=>goTo(i);
  dotsWrap.appendChild(d);
}

function updateUI(){
  document.querySelectorAll('.slide').forEach((s,i)=>{ s.classList.toggle('active', i===current); });
  document.querySelectorAll('.nav-dots .dot').forEach((d,i)=>{ d.classList.toggle('active', i===current); });
  document.getElementById('hudCurrent').textContent = current+1;
  document.getElementById('progressFill').style.width = ((current+1)/total*100)+'%';
  const active = document.getElementById('slide'+current);
  active.scrollTop = 0;
  const animTarget = active.querySelector('.slide-inner');
  if(animTarget){
    animTarget.classList.remove('animate__fadeIn');
    void animTarget.offsetWidth;
    animTarget.classList.add('animate__animated','animate__fadeIn');
  }
}
function goTo(i){ if(i<0||i>=total) return; current = i; updateUI(); }
document.getElementById('prevBtn').onclick = ()=>goTo(current-1);
document.getElementById('nextBtn').onclick = ()=>goTo(current+1);
document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight') goTo(current+1);
  if(e.key==='ArrowLeft') goTo(current-1);
});
updateUI();

/* ============ QUIZ — posiciones y longitudes de respuesta variadas ============ */
const preguntas = [
  {
    texto:'¿Qué es la facilidad de despliegue (deployability)?',
    opciones:{
      a:'La cantidad de servidores necesarios para operar el sistema en producción',
      b:'La capacidad de un sistema para ser desplegado de forma eficiente y segura, con esfuerzo y demora predecibles',
      c:'El tiempo que tarda el sistema en responder a una solicitud del usuario',
      d:'La cantidad de pruebas automatizadas que tiene el proyecto'
    },
    correcta:'b'
  },
  {
    texto:'¿Qué etapa del proceso de despliegue consiste en transformar el código fuente en un formato ejecutable?',
    opciones:{
      a:'Configuración',
      b:'Verificación y monitoreo',
      c:'Compilación y empaquetado',
      d:'Implementación'
    },
    correcta:'c'
  },
  {
    texto:'¿De dónde surge el término DevOps, según el texto?',
    opciones:{
      a:'De un producto comercial de gestión de infraestructura',
      b:'De la colaboración entre los equipos de desarrollo (que compilan y prueban) y de operaciones (que configuran, implementan y monitorean)',
      c:'De una metodología ágil específica de gestión de proyectos',
      d:'De un estándar ISO relacionado con la seguridad informática'
    },
    correcta:'b'
  },
  {
    texto:'¿Cuál de los siguientes NO es uno de los cuatro ambientes clave del deployment pipeline?',
    opciones:{
      a:'Desarrollo',
      b:'Preproducción',
      c:'Sandbox de terceros',
      d:'Producción'
    },
    correcta:'c'
  },
  {
    texto:'¿Qué mide la "trazabilidad" como factor de calidad de un deployment pipeline?',
    opciones:{
      a:'El tiempo total que demora el software en atravesar todo el pipeline',
      b:'La capacidad de saber exactamente de dónde proviene cada artefacto y dónde se genera cada mensaje o error',
      c:'La cantidad de ambientes distintos que atraviesa el software',
      d:'La frecuencia con la que se hacen despliegues en un mes'
    },
    correcta:'b'
  }
];
let idxPregunta = 0, aciertos = 0;

function lanzarQuiz(){ idxPregunta = 0; aciertos = 0; mostrarPregunta(); }
function mostrarPregunta(){
  if(idxPregunta >= preguntas.length){
    Swal.fire({
      title:'Resultado',
      html:`Acertaste <b>${aciertos}/${preguntas.length}</b>.`,
      icon: aciertos===preguntas.length ? 'success' : 'info',
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    });
    return;
  }
  const p = preguntas[idxPregunta];
  Swal.fire({
    title: p.texto,
    input:'radio',
    inputOptions: p.opciones,
    background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff',
    confirmButtonText:'Responder',
    inputValidator: (value)=> !value && 'Elegí una opción'
  }).then(res=>{
    if(!res.isConfirmed) return;
    const ok = res.value === p.correcta;
    if(ok) aciertos++;
    Swal.fire({
      title: ok ? '¡Correcto!' : 'No es así',
      html: `La respuesta correcta era: <b>${p.opciones[p.correcta]}</b>`,
      icon: ok ? 'success' : 'error',
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    }).then(()=>{ idxPregunta++; mostrarPregunta(); });
  });
}
</script>

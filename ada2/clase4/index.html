<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANDIS 2 · Teórico — Requerimientos arquitectónicamente significativos</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#070b14; --bg-1:#0d1424; --panel:#111a2e; --panel-2:#16223a;
  --accent:#3ec1ff; --accent-2:#7b6bff; --accent-3:#ffb547; --ok:#3ee6a8;
  --text:#e8edf7; --text-dim:#8fa0bd; --border:#22304d;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(1200px 700px at 15% -10%, rgba(62,193,255,.10), transparent 60%),
    radial-gradient(1000px 700px at 110% 10%, rgba(123,107,255,.12), transparent 55%),
    var(--bg-0);
  color:var(--text); font-family:'Inter',sans-serif; overflow:hidden;
}
.mono{font-family:'JetBrains Mono',monospace}
.blueprint{
  position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.35;
  background-image:linear-gradient(rgba(62,193,255,.06) 1px, transparent 1px),linear-gradient(90deg, rgba(62,193,255,.06) 1px, transparent 1px);
  background-size:42px 42px;
}
.progress-track{position:fixed; top:0; left:0; width:100%; height:4px; background:rgba(255,255,255,.06); z-index:50;}
.progress-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--accent-2)); transition:width .4s ease; box-shadow:0 0 12px var(--accent);}
.hud{position:fixed; top:14px; right:18px; z-index:50; background:rgba(17,26,46,.85); border:1px solid var(--border); backdrop-filter:blur(6px); padding:7px 14px; border-radius:999px; font-size:.82rem; color:var(--text-dim); display:flex; align-items:center; gap:8px;}
.hud .unit-tag{color:var(--accent); font-weight:700}
.brand{position:fixed; top:14px; left:18px; z-index:50; font-size:.78rem; color:var(--text-dim); display:flex; align-items:center; gap:8px; letter-spacing:.03em;}
.brand i{color:var(--accent-3)}
.slides-container{position:relative; z-index:1; height:100vh; width:100vw;}
.slide{position:absolute; inset:0; display:none; padding:90px 8vw 110px 8vw; overflow-y:auto;}
.slide.active{display:block}
.slide-inner{max-width:1180px; margin:0 auto;}
.eyebrow{display:inline-flex; align-items:center; gap:8px; font-size:.78rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent); font-weight:700; margin-bottom:14px;}
.eyebrow i{font-size:.9rem}
h1.slide-title{font-size:clamp(1.9rem,3.4vw,3rem); font-weight:800; margin-bottom:.4rem; line-height:1.1;}
h2.slide-title{font-size:clamp(1.5rem,2.6vw,2.2rem); font-weight:800; margin-bottom:.6rem;}
.subtitle{color:var(--text-dim); font-size:1.05rem; max-width:820px;}
.card-panel{background:linear-gradient(180deg, var(--panel), var(--panel-2)); border:1px solid var(--border); border-radius:16px; padding:26px 28px; box-shadow:0 12px 30px rgba(0,0,0,.35);}
.card-panel + .card-panel{margin-top:18px}
.pill{display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:999px; font-size:.76rem; font-weight:700; background:rgba(62,193,255,.12); color:var(--accent); border:1px solid rgba(62,193,255,.35);}
.pill.purple{background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)}
.pill.amber{background:rgba(255,181,71,.14); color:var(--accent-3); border-color:rgba(255,181,71,.4)}
.pill.ok{background:rgba(62,230,168,.12); color:var(--ok); border-color:rgba(62,230,168,.35)}
.icon-tile{width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center; background:rgba(62,193,255,.12); color:var(--accent); font-size:1.3rem; border:1px solid rgba(62,193,255,.3); flex-shrink:0;}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
.grid-4{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
@media (max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}
ul.clean{list-style:none; margin:0; padding:0;}
ul.clean li{position:relative; padding:6px 0 6px 26px; color:var(--text); font-size:.94rem;}
ul.clean li::before{content:"\f105"; font-family:"Font Awesome 6 Free"; font-weight:900; color:var(--accent); position:absolute; left:2px; top:8px; font-size:.85rem;}
.check-btn{border:none; background:linear-gradient(90deg,var(--accent),var(--accent-2)); color:#04101f; font-weight:800; padding:10px 22px; border-radius:10px; font-size:.9rem; box-shadow:0 8px 22px rgba(62,193,255,.25); cursor:pointer;}
.check-btn:hover{filter:brightness(1.08); color:#04101f;}
.nav-controls{position:fixed; bottom:18px; left:0; right:0; z-index:50; display:flex; justify-content:center; gap:14px; align-items:center;}
.nav-btn{width:46px; height:46px; border-radius:50%; border:1px solid var(--border); background:rgba(17,26,46,.9); color:var(--text); display:flex; align-items:center; justify-content:center; font-size:1.1rem; backdrop-filter:blur(6px);}
.nav-btn:hover{border-color:var(--accent); color:var(--accent);}
.nav-dots{display:flex; gap:6px; align-items:center; background:rgba(17,26,46,.9); border:1px solid var(--border); padding:8px 14px; border-radius:999px;}
.nav-dots .dot{width:7px; height:7px; border-radius:50%; background:var(--border); cursor:pointer; transition:.2s;}
.nav-dots .dot.active{background:var(--accent); width:20px; border-radius:4px;}
.footer-note{position:fixed; bottom:20px; right:22px; z-index:50; font-size:.72rem; color:var(--text-dim); font-family:'JetBrains Mono';}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px}

.sub-item{background:var(--panel-2); border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:10px;}
.sub-item .sname{font-weight:700; font-size:.94rem; color:var(--accent); margin-bottom:4px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.sub-item .sdesc{font-size:.85rem; color:var(--text-dim); margin:0;}

table.ras-table{width:100%; border-collapse:separate; border-spacing:0; font-size:.85rem;}
table.ras-table th{text-align:left; color:var(--accent); text-transform:uppercase; font-size:.66rem; letter-spacing:.06em; padding:10px 12px; border-bottom:1px solid var(--border);}
table.ras-table td{padding:11px 12px; border-bottom:1px solid rgba(255,255,255,.05); vertical-align:top; color:var(--text-dim);}
table.ras-table tr:hover td{background:rgba(62,193,255,.04); color:var(--text);}
table.ras-table td strong{color:var(--text)}
</style>
</head>
<body>

<div class="blueprint"></div>
<div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
<div class="brand"><i class="fa-solid fa-cubes"></i> ANDIS 2 · Teórico</div>
<div class="hud"><i class="fa-solid fa-layer-group"></i> <span class="unit-tag" id="hudCurrent">1</span>/<span id="hudTotal">0</span></div>

<div class="slides-container" id="slidesContainer"></div>

<div class="nav-controls">
  <button class="nav-btn" id="prevBtn"><i class="fa-solid fa-chevron-left"></i></button>
  <div class="nav-dots" id="navDots"></div>
  <button class="nav-btn" id="nextBtn"><i class="fa-solid fa-chevron-right"></i></button>
</div>
<div class="footer-note">← → para navegar</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.10.5/sweetalert2.all.min.js"></script>
<script>
const slidesHTML = [];

// 0. Portada
slidesHTML.push(`
<div class="slide-inner d-flex flex-column justify-content-center" style="min-height:78vh;">
  <div class="animate__animated animate__fadeInDown">
    <span class="eyebrow"><i class="fa-solid fa-star"></i> Teórico · Unidad 1</span>
    <h1 class="slide-title">Requerimientos arquitectónicamente significativos</h1>
    <p class="subtitle">No todos los requerimientos moldean la arquitectura. Aprendé a reconocer los pocos que sí — los RAS — entre explícitos, implícitos y los que nacen de los objetivos del negocio.</p>
  </div>
</div>
`);

// 1. Definición
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-circle-question"></i> Definición</span>
  <h2 class="slide-title">¿Qué es un RAS?</h2>
  <div class="card-panel mt-3">
    <div class="d-flex gap-3">
      <div class="icon-tile"><i class="fa-solid fa-bullseye"></i></div>
      <p style="font-size:1.05rem; line-height:1.75; margin:0;">
        Un <strong>requerimiento arquitectónicamente significativo</strong> (RAS, o ASR por sus siglas en inglés)
        es un requerimiento que tendrá un <strong>efecto profundo en la arquitectura</strong>: si ese requerimiento
        no existiera, la arquitectura podría ser <strong>radicalmente diferente</strong>.
      </p>
    </div>
  </div>
  <div class="card-panel mt-3 d-flex gap-3 align-items-center">
    <div class="icon-tile" style="background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)"><i class="fa-solid fa-link"></i></div>
    <div class="small" style="color:var(--text-dim)">Los RAS <strong style="color:var(--text)">a menudo, pero no siempre</strong>, toman la forma de requerimientos de atributos de calidad: rendimiento, seguridad, facilidad de modificación, disponibilidad, facilidad de uso, etc.</div>
  </div>
</div>
`);

// 2. Fuentes: explícitos
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-file-lines"></i> De dónde salen (1/2)</span>
  <h2 class="slide-title">Fuentes explícitas</h2>
  <div class="card-panel mt-3">
    <p style="font-size:1.02rem; line-height:1.75;">
      Los RAS deberían estar, obviamente, en el documento de especificación de requerimientos, como requerimientos
      atómicos — en particular bajo alguna de estas tres formas:
    </p>
    <div class="grid-3 mt-2">
      <div class="sub-item"><div class="sname"><i class="fa-solid fa-file-signature"></i>Requerimientos no funcionales</div></div>
      <div class="sub-item"><div class="sname"><i class="fa-solid fa-ban"></i>Restricciones de proyecto o diseño</div></div>
      <div class="sub-item"><div class="sname"><i class="fa-solid fa-compass"></i>Impulsores</div></div>
    </div>
  </div>
  <div class="card-panel mt-3 d-flex gap-3 align-items-center">
    <div class="icon-tile" style="background:rgba(255,181,71,.14); color:var(--accent-3); border-color:rgba(255,181,71,.4)"><i class="fa-solid fa-triangle-exclamation"></i></div>
    <div class="small" style="color:var(--text-dim)">En la práctica, <strong style="color:var(--text)">mucha información</strong> en esos documentos <strong style="color:var(--text)">no afecta la arquitectura</strong> — solo la que corresponde a atributos de calidad. Lo documentado explícitamente es <strong style="color:var(--text)">explícito</strong>; el resto es <strong style="color:var(--text)">implícito</strong>.</div>
  </div>
</div>
`);

// 3. Qué buscar: implícitos
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-magnifying-glass"></i> De dónde salen (2/2)</span>
  <h2 class="slide-title">Qué buscar para hallar RAS implícitos</h2>
  <p class="subtitle mb-3">Otros requerimientos funcionales, sin decirlo explícitamente, pueden esconder RAS. Estas son las señales a rastrear.</p>
  <div class="grid-3">
    <div class="sub-item"><div class="sname"><i class="fa-solid fa-users"></i>Uso</div><p class="sdesc">Roles de usuario vs. modos de sistema, internacionalización, distinciones de idioma.</p></div>
    <div class="sub-item"><div class="sname"><i class="fa-solid fa-clock"></i>Tiempo</div><p class="sdesc">Oportunidad y coordinación de elementos.</p></div>
    <div class="sub-item"><div class="sname"><i class="fa-solid fa-plug-circle-bolt"></i>Elementos externos</div><p class="sdesc">Sistemas externos, protocolos, sensores o actuadores, middleware.</p></div>
    <div class="sub-item"><div class="sname"><i class="fa-solid fa-network-wired"></i>Redes</div><p class="sdesc">Propiedades y configuraciones de red, incluidas sus propiedades de seguridad.</p></div>
    <div class="sub-item"><div class="sname"><i class="fa-solid fa-diagram-project"></i>Orquestación</div><p class="sdesc">Pasos de procesamiento, flujos de información.</p></div>
    <div class="sub-item"><div class="sname"><i class="fa-solid fa-key"></i>Propiedades de seguridad</div><p class="sdesc">Roles de usuario, permisos, autenticación.</p></div>
    <div class="sub-item"><div class="sname"><i class="fa-solid fa-database"></i>Datos</div><p class="sdesc">Persistencia y vigencia.</p></div>
    <div class="sub-item"><div class="sname"><i class="fa-solid fa-microchip"></i>Recursos</div><p class="sdesc">Tiempo, concurrencia, memoria, planificación, múltiples usuarios/actividades, dispositivos, energía, buffers, colas, escalabilidad.</p></div>
    <div class="sub-item"><div class="sname"><i class="fa-solid fa-people-group"></i>Gestión de proyectos</div><p class="sdesc">Planes de trabajo en equipo, conjuntos de habilidades, capacitación, coordinación.</p></div>
    <div class="sub-item"><div class="sname"><i class="fa-solid fa-server"></i>Opciones de hardware</div><p class="sdesc">Procesadores, familias de procesadores, su evolución.</p></div>
    <div class="sub-item"><div class="sname"><i class="fa-solid fa-sliders"></i>Flexibilidad</div><p class="sdesc">Funcionalidad, portabilidad, calibraciones, configuraciones.</p></div>
    <div class="sub-item"><div class="sname"><i class="fa-solid fa-tag"></i>Tecnologías con nombre</div><p class="sdesc">Paquetes comerciales específicos.</p></div>
  </div>
</div>
`);

// 4. Talleres con interesados
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-people-arrows"></i> Cuando nadie lo dice</span>
  <h2 class="slide-title">Los interesados no siempre saben qué indicar</h2>
  <div class="card-panel mt-3">
    <div class="d-flex gap-3">
      <div class="icon-tile"><i class="fa-solid fa-comment-dots"></i></div>
      <p style="font-size:1.02rem; line-height:1.75; margin:0;">
        Los interesados pueden no saber cuáles son los requerimientos no funcionales o restricciones de diseño a
        indicar. O pueden asumir que son <strong>obvios</strong> y no hace falta especificarlos.
      </p>
    </div>
  </div>
  <div class="card-panel mt-3 d-flex gap-3 align-items-center">
    <div class="icon-tile" style="background:rgba(62,230,168,.12); color:var(--ok); border-color:rgba(62,230,168,.35)"><i class="fa-solid fa-chalkboard"></i></div>
    <div class="small" style="color:var(--text-dim)">En estos casos, conviene realizar un <strong style="color:var(--text)">taller con los interesados</strong> específicamente orientado a sacar a la luz estos requerimientos implícitos.</div>
  </div>
</div>
`);

// 5-6. Guía de identificación (tabla en 2 partes)
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-list-check"></i> Guía práctica (1/2)</span>
  <h2 class="slide-title">Identificar RAS implícitos en un proceso</h2>
  <div class="card-panel mt-3" style="overflow-x:auto;">
    <table class="ras-table">
      <thead><tr><th>Aspecto</th><th>Descripción</th><th>Atributos de calidad posibles</th></tr></thead>
      <tbody>
        <tr><td><strong>Funciones con alto retorno para el negocio</strong></td><td>Procesos que generan valor considerable y aportan directamente a los objetivos estratégicos.</td><td><span class="pill">Eficiencia de rendimiento</span> <span class="pill purple">Fiabilidad</span></td></tr>
        <tr><td><strong>Operaciones críticas de negocio</strong></td><td>Funciones cuya interrupción afectaría gravemente las operaciones diarias y la continuidad del negocio.</td><td><span class="pill purple">Fiabilidad</span></td></tr>
        <tr><td><strong>Funcionalidades esenciales</strong></td><td>Características fundamentales sin las cuales el sistema no cumpliría su propósito principal.</td><td><span class="pill purple">Fiabilidad</span></td></tr>
        <tr><td><strong>Usuarios influyentes</strong></td><td>Líderes de opinión o clientes clave cuya satisfacción impacta fuerte en la adopción del sistema.</td><td><span class="pill">Adecuación funcional</span> <span class="pill amber">Capacidad de interacción</span></td></tr>
        <tr><td><strong>Usuarios móviles</strong></td><td>Usuarios que acceden desde distintas ubicaciones o dispositivos móviles.</td><td><span class="pill amber">Capacidad de interacción</span></td></tr>
        <tr><td><strong>Cobertura amplia de componentes</strong></td><td>Procesos que interactúan con varios subsistemas, dependiendo de su integración y comunicación efectiva.</td><td><span class="pill ok">Compatibilidad</span></td></tr>
      </tbody>
    </table>
  </div>
</div>
`);

slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-list-check"></i> Guía práctica (2/2)</span>
  <h2 class="slide-title">Seguimos identificando</h2>
  <div class="card-panel mt-3" style="overflow-x:auto;">
    <table class="ras-table">
      <thead><tr><th>Aspecto</th><th>Descripción</th><th>Atributos de calidad posibles</th></tr></thead>
      <tbody>
        <tr><td><strong>Requerimientos de seguridad</strong></td><td>Procesos que manejan información sensible o deben cumplir normativas específicas.</td><td><span class="pill">Seguridad</span> <span class="pill amber">Protección</span></td></tr>
        <tr><td><strong>Complejidad de reglas de negocio</strong></td><td>Procesos con reglas o condiciones complejas que deben cumplirse con precisión.</td><td><span class="pill">Adecuación funcional</span> <span class="pill purple">Facilidad de mantenimiento</span></td></tr>
        <tr><td><strong>Exigencias de desempeño y disponibilidad</strong></td><td>Procesos que operan bajo cargas pesadas o requieren alta disponibilidad.</td><td><span class="pill purple">Fiabilidad</span> <span class="pill">Eficiencia de desempeño</span></td></tr>
        <tr><td><strong>Alto potencial de cambio</strong></td><td>Procesos sujetos a cambios frecuentes que requieren adaptación continua.</td><td><span class="pill purple">Facilidad de mantenimiento</span> <span class="pill ok">Flexibilidad</span></td></tr>
        <tr><td><strong>Sincronización con sistemas externos</strong></td><td>Procesos que dependen de integrarse con otros sistemas internos o externos.</td><td><span class="pill ok">Compatibilidad</span> <span class="pill amber">Protección</span></td></tr>
        <tr><td><strong>Riesgos o problemas identificados</strong></td><td>Procesos con riesgos potenciales o problemas ya detectados en implementaciones anteriores.</td><td><span class="pill amber">Protección</span></td></tr>
      </tbody>
    </table>
  </div>
</div>
`);

// 7. Objetivos del negocio como fuente
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-bullseye"></i> Otra fuente posible</span>
  <h2 class="slide-title">Objetivos del negocio</h2>
  <p class="subtitle mb-3">Los objetivos de negocio pueden —o no— ser fuente de RAS. Hay tres escenarios posibles:</p>
  <div class="grid-3">
    <div class="card-panel">
      <div class="icon-tile mb-2"><i class="fa-solid fa-arrow-right"></i></div>
      <p class="small mb-0" style="color:var(--text-dim)">El objetivo de negocio <strong style="color:var(--text)">deriva</strong> en un requerimiento de atributo de calidad.</p>
    </div>
    <div class="card-panel">
      <div class="icon-tile mb-2" style="background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)"><i class="fa-solid fa-shuffle"></i></div>
      <p class="small mb-0" style="color:var(--text-dim)">El objetivo <strong style="color:var(--text)">afecta la arquitectura</strong> sin implicar ningún atributo de calidad.</p>
    </div>
    <div class="card-panel">
      <div class="icon-tile mb-2" style="background:rgba(255,181,71,.14); color:var(--accent-3); border-color:rgba(255,181,71,.4)"><i class="fa-solid fa-xmark"></i></div>
      <p class="small mb-0" style="color:var(--text-dim)">El objetivo <strong style="color:var(--text)">no tiene ninguna influencia</strong> sobre la arquitectura.</p>
    </div>
  </div>
</div>
`);

// 8. Tabla Richards & Ford
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-table"></i> De negocio a arquitectura</span>
  <h2 class="slide-title">Preocupaciones del dominio → características de arquitectura</h2>
  <p class="subtitle mb-3">Richards y Ford proponen esta traducción directa entre objetivos de negocio y atributos de calidad.</p>
  <div class="card-panel" style="overflow-x:auto;">
    <table class="ras-table">
      <thead><tr><th>Preocupación del dominio</th><th>Características de la arquitectura</th></tr></thead>
      <tbody>
        <tr><td><strong>Fusiones y adquisiciones</strong></td><td>Interoperabilidad, escalabilidad, adaptabilidad, extensibilidad</td></tr>
        <tr><td><strong>Tiempo de comercialización</strong></td><td>Agilidad, capacidad de prueba, capacidad de implementación</td></tr>
        <tr><td><strong>Satisfacción del usuario</strong></td><td>Rendimiento, disponibilidad, tolerancia a fallas, facilidad de ser probado, capacidad de implementación, agilidad, seguridad</td></tr>
        <tr><td><strong>Ventaja competitiva</strong></td><td>Agilidad, facilidad de ser probado, capacidad de implementación, escalabilidad, disponibilidad, tolerancia a fallas</td></tr>
        <tr><td><strong>Tiempo y presupuesto</strong></td><td>Simplicidad, viabilidad</td></tr>
      </tbody>
    </table>
  </div>

/* ============ MOTOR DE NAVEGACIÓN ============ */
const container = document.getElementById('slidesContainer');
slidesHTML.forEach((html, i)=>{
  const div = document.createElement('div');
  div.className = 'slide' + (i===0 ? ' active' : '');
  div.id = 'slide'+i;
  div.innerHTML = html;
  container.appendChild(div);
});

let current = 0;
const total = slidesHTML.length;
document.getElementById('hudTotal').textContent = total;

const dotsWrap = document.getElementById('navDots');
for(let i=0;i<total;i++){
  const d = document.createElement('div');
  d.className = 'dot' + (i===0?' active':'');
  d.onclick = ()=>goTo(i);
  dotsWrap.appendChild(d);
}

function updateUI(){
  document.querySelectorAll('.slide').forEach((s,i)=>{ s.classList.toggle('active', i===current); });
  document.querySelectorAll('.nav-dots .dot').forEach((d,i)=>{ d.classList.toggle('active', i===current); });
  document.getElementById('hudCurrent').textContent = current+1;
  document.getElementById('progressFill').style.width = ((current+1)/total*100)+'%';
  const active = document.getElementById('slide'+current);
  active.scrollTop = 0;
  const animTarget = active.querySelector('.slide-inner');
  if(animTarget){
    animTarget.classList.remove('animate__fadeIn');
    void animTarget.offsetWidth;
    animTarget.classList.add('animate__animated','animate__fadeIn');
  }
}
function goTo(i){ if(i<0||i>=total) return; current = i; updateUI(); }
document.getElementById('prevBtn').onclick = ()=>goTo(current-1);
document.getElementById('nextBtn').onclick = ()=>goTo(current+1);
document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight') goTo(current+1);
  if(e.key==='ArrowLeft') goTo(current-1);
});
updateUI();

/* ============ QUIZ — posiciones y longitudes de respuesta variadas ============ */
const preguntas = [
  {
    texto:'¿Qué distingue a un requerimiento arquitectónicamente significativo (RAS)?',
    opciones:{
      a:'Es cualquier requerimiento que el equipo decida documentar formalmente',
      b:'Su ausencia podría hacer que la arquitectura resultara radicalmente distinta',
      c:'Siempre se redacta como requerimiento no funcional',
      d:'Solo lo identifican los interesados del área de negocio'
    },
    correcta:'b'
  },
  {
    texto:'Según el texto, ¿qué relación existe entre los RAS y los requerimientos de atributos de calidad?',
    opciones:{
      a:'Son exactamente lo mismo en todos los casos',
      b:'No guardan ninguna relación entre sí',
      c:'A menudo los RAS toman esa forma, pero no siempre',
      d:'Los atributos de calidad excluyen por definición a los RAS'
    },
    correcta:'c'
  },
  {
    texto:'¿Cuál de las siguientes NO aparece en el texto como fuente explícita típica de un RAS?',
    opciones:{
      a:'Actas de reuniones de directorio',
      b:'Requerimientos no funcionales',
      c:'Restricciones de proyecto o de diseño',
      d:'Impulsores'
    },
    correcta:'a'
  },
  {
    texto:'Según la guía práctica, ¿qué atributo de calidad se asocia a "operaciones críticas de negocio"?',
    opciones:{
      a:'Compatibilidad',
      b:'Capacidad de interacción',
      c:'Facilidad de mantenimiento',
      d:'Fiabilidad'
    },
    correcta:'d'
  },
  {
    texto:'¿Qué propone aplicar la regla del 80/20 a los RAS?',
    opciones:{
      a:'Automatizar el 80% de las pruebas de arquitectura del sistema',
      b:'Enfocarse en el 20% de los requerimientos que cubren el 80% de la actividad de los usuarios',
      c:'Documentar como implícito al 80% de los requerimientos relevados',
      d:'Reservar el 20% del presupuesto para atributos de calidad'
    },
    correcta:'b'
  }
];
let idxPregunta = 0, aciertos = 0;

function lanzarQuiz(){ idxPregunta = 0; aciertos = 0; mostrarPregunta(); }
function mostrarPregunta(){
  if(idxPregunta >= preguntas.length){
    Swal.fire({
      title:'Resultado',
      html:`Acertaste <b>${aciertos}/${preguntas.length}</b>.`,
      icon: aciertos===preguntas.length ? 'success' : 'info',
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    });
    return;
  }
  const p = preguntas[idxPregunta];
  Swal.fire({
    title: p.texto,
    input:'radio',
    inputOptions: p.opciones,
    background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff',
    confirmButtonText:'Responder',
    inputValidator: (value)=> !value && 'Elegí una opción'
  }).then(res=>{
    if(!res.isConfirmed) return;
    const ok = res.value === p.correcta;
    if(ok) aciertos++;
    Swal.fire({
      title: ok ? '¡Correcto!' : 'No es así',
      html: `La respuesta correcta era: <b>${p.opciones[p.correcta]}</b>`,
      icon: ok ? 'success' : 'error',
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    }).then(()=>{ idxPregunta++; mostrarPregunta(); });
  });
}
</script>

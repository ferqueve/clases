<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANDIS 2 · Unidad 2 — Tácticas para la facilidad de despliegue</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#070b14; --bg-1:#0d1424; --panel:#111a2e; --panel-2:#16223a;
  --accent:#3ec1ff; --accent-2:#7b6bff; --accent-3:#ffb547; --ok:#3ee6a8;
  --text:#e8edf7; --text-dim:#8fa0bd; --border:#22304d;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(1200px 700px at 15% -10%, rgba(62,193,255,.10), transparent 60%),
    radial-gradient(1000px 700px at 110% 10%, rgba(123,107,255,.12), transparent 55%),
    var(--bg-0);
  color:var(--text); font-family:'Inter',sans-serif; overflow:hidden;
}
.mono{font-family:'JetBrains Mono',monospace}
.blueprint{
  position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.35;
  background-image:linear-gradient(rgba(62,193,255,.06) 1px, transparent 1px),linear-gradient(90deg, rgba(62,193,255,.06) 1px, transparent 1px);
  background-size:42px 42px;
}
.progress-track{position:fixed; top:0; left:0; width:100%; height:4px; background:rgba(255,255,255,.06); z-index:50;}
.progress-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--accent-2)); transition:width .4s ease; box-shadow:0 0 12px var(--accent);}
.hud{position:fixed; top:14px; right:18px; z-index:50; background:rgba(17,26,46,.85); border:1px solid var(--border); backdrop-filter:blur(6px); padding:7px 14px; border-radius:999px; font-size:.82rem; color:var(--text-dim); display:flex; align-items:center; gap:8px;}
.hud .unit-tag{color:var(--accent); font-weight:700}
.brand{position:fixed; top:14px; left:18px; z-index:50; font-size:.78rem; color:var(--text-dim); display:flex; align-items:center; gap:8px; letter-spacing:.03em;}
.brand i{color:var(--accent-3)}
.slides-container{position:relative; z-index:1; height:100vh; width:100vw;}
.slide{position:absolute; inset:0; display:none; padding:90px 8vw 110px 8vw; overflow-y:auto;}
.slide.active{display:block}
.slide-inner{max-width:1180px; margin:0 auto;}
.eyebrow{display:inline-flex; align-items:center; gap:8px; font-size:.78rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent); font-weight:700; margin-bottom:14px;}
.eyebrow i{font-size:.9rem}
h1.slide-title{font-size:clamp(1.9rem,3.4vw,3rem); font-weight:800; margin-bottom:.4rem; line-height:1.1;}
h2.slide-title{font-size:clamp(1.5rem,2.6vw,2.2rem); font-weight:800; margin-bottom:.6rem;}
.subtitle{color:var(--text-dim); font-size:1.05rem; max-width:820px;}
.card-panel{background:linear-gradient(180deg, var(--panel), var(--panel-2)); border:1px solid var(--border); border-radius:16px; padding:26px 28px; box-shadow:0 12px 30px rgba(0,0,0,.35);}
.card-panel + .card-panel{margin-top:18px}
.pill{display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:999px; font-size:.76rem; font-weight:700; background:rgba(62,193,255,.12); color:var(--accent); border:1px solid rgba(62,193,255,.35);}
.pill.purple{background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)}
.pill.amber{background:rgba(255,181,71,.14); color:var(--accent-3); border-color:rgba(255,181,71,.4)}
.pill.ok{background:rgba(62,230,168,.12); color:var(--ok); border-color:rgba(62,230,168,.35)}
.icon-tile{width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center; background:rgba(62,193,255,.12); color:var(--accent); font-size:1.3rem; border:1px solid rgba(62,193,255,.3); flex-shrink:0;}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
@media (max-width:900px){.grid-2,.grid-3{grid-template-columns:1fr;}}
ul.clean{list-style:none; margin:0; padding:0;}
ul.clean li{position:relative; padding:6px 0 6px 26px; color:var(--text); font-size:.94rem;}
ul.clean li::before{content:"\f105"; font-family:"Font Awesome 6 Free"; font-weight:900; color:var(--accent); position:absolute; left:2px; top:8px; font-size:.85rem;}
.check-btn{border:none; background:linear-gradient(90deg,var(--accent),var(--accent-2)); color:#04101f; font-weight:800; padding:10px 22px; border-radius:10px; font-size:.9rem; box-shadow:0 8px 22px rgba(62,193,255,.25); cursor:pointer;}
.check-btn:hover{filter:brightness(1.08); color:#04101f;}
.nav-controls{position:fixed; bottom:18px; left:0; right:0; z-index:50; display:flex; justify-content:center; gap:14px; align-items:center;}
.nav-btn{width:46px; height:46px; border-radius:50%; border:1px solid var(--border); background:rgba(17,26,46,.9); color:var(--text); display:flex; align-items:center; justify-content:center; font-size:1.1rem; backdrop-filter:blur(6px);}
.nav-btn:hover{border-color:var(--accent); color:var(--accent);}
.nav-dots{display:flex; gap:6px; align-items:center; background:rgba(17,26,46,.9); border:1px solid var(--border); padding:8px 14px; border-radius:999px;}
.nav-dots .dot{width:7px; height:7px; border-radius:50%; background:var(--border); cursor:pointer; transition:.2s;}
.nav-dots .dot.active{background:var(--accent); width:20px; border-radius:4px;}
.footer-note{position:fixed; bottom:20px; right:22px; z-index:50; font-size:.72rem; color:var(--text-dim); font-family:'JetBrains Mono';}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px}

.tac-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
@media (max-width:900px){.tac-grid{grid-template-columns:repeat(2,1fr);}}
.tac-tile{
  background:var(--panel-2); border:1px solid var(--border); border-radius:14px; padding:16px;
  cursor:pointer; transition:.2s; text-align:center;
}
.tac-tile:hover{transform:translateY(-4px); border-color:var(--accent); box-shadow:0 10px 24px rgba(62,193,255,.15);}
.tac-tile i{font-size:1.3rem; color:var(--accent); margin-bottom:6px; display:block;}
.tac-tile .tname{font-size:.82rem; font-weight:700;}
.tac-tile .badge-reused{display:block; font-size:.62rem; color:var(--ok); margin-top:3px;}

.link-row{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid rgba(255,255,255,.06);}
.link-row:last-child{border-bottom:none;}
.link-row a{color:var(--text); text-decoration:none; font-weight:600;}
.link-row a:hover{color:var(--accent);}
.link-row .ext{margin-left:auto; color:var(--text-dim); font-size:.75rem;}

.tree{display:flex; gap:14px; flex-wrap:wrap; justify-content:center;}
.tree .branch{flex:1; min-width:220px; border-radius:14px; padding:18px; text-align:center; border:1px solid var(--border);}
.branch-a{background:rgba(62,193,255,.10); border-color:rgba(62,193,255,.35);}
.branch-b{background:rgba(123,107,255,.10); border-color:rgba(123,107,255,.35);}

/* rollout diagram */
.rollout-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
.rollout-bar{flex:1; height:26px; border-radius:8px; background:var(--panel-2); border:1px solid var(--border); overflow:hidden; position:relative;}
.rollout-fill{height:100%; background:linear-gradient(90deg,var(--accent),var(--accent-2));}
.rollout-label{width:110px; font-size:.78rem; color:var(--text-dim); text-align:right;}
</style>
</head>
<body>

<div class="blueprint"></div>
<div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
<div class="brand"><i class="fa-solid fa-cubes"></i> ANDIS 2 · Unidad 2</div>
<div class="hud"><i class="fa-solid fa-layer-group"></i> <span class="unit-tag" id="hudCurrent">1</span>/<span id="hudTotal">0</span></div>

<div class="slides-container" id="slidesContainer"></div>

<div class="nav-controls">
  <button class="nav-btn" id="prevBtn"><i class="fa-solid fa-chevron-left"></i></button>
  <div class="nav-dots" id="navDots"></div>
  <button class="nav-btn" id="nextBtn"><i class="fa-solid fa-chevron-right"></i></button>
</div>
<div class="footer-note">← → para navegar</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.10.5/sweetalert2.all.min.js"></script>
<script>
const slidesHTML = [];

// 0. Portada
slidesHTML.push(`
<div class="slide-inner d-flex flex-column justify-content-center" style="min-height:78vh;">
  <div class="animate__animated animate__fadeInDown">
    <span class="eyebrow"><i class="fa-solid fa-toolbox"></i> Unidad 2 · Tácticas de arquitectura</span>
    <h1 class="slide-title">Tácticas para la facilidad de despliegue</h1>
    <p class="subtitle">El catálogo más corto de la unidad — y el que más se conecta con lo que ya conocés de DevOps, deployment pipeline y ambientes.</p>
  </div>
</div>
`);

// 1. Introducción
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-circle-question"></i> Punto de partida</span>
  <h2 class="slide-title">Dos propósitos</h2>
  <div class="card-panel mt-3">
    <p style="font-size:1.02rem; line-height:1.75;">
      Las tácticas para facilidad de despliegue buscan <strong>gestionar el pipeline de despliegue</strong> o
      <strong>gestionar el sistema ya desplegado</strong>.
    </p>
  </div>
  <div class="card-panel mt-3 d-flex gap-3 align-items-center">
    <div class="icon-tile" style="background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)"><i class="fa-solid fa-diagram-project"></i></div>
    <div class="small" style="color:var(--text-dim)">Esto conecta directo con lo que ya viste en la Unidad 1: el <strong style="color:var(--text)">deployment pipeline</strong> y sus 4 ambientes (desarrollo, integración, preproducción, producción). Estas tácticas son las herramientas concretas para que ese pipeline funcione bien.</div>
  </div>
</div>
`);

// 2. Taxonomía
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-sitemap"></i> El mapa completo</span>
  <h2 class="slide-title">Dos ramas, seis tácticas</h2>
  <div class="tree mt-3">
    <div class="branch branch-a"><i class="fa-solid fa-diagram-project mb-2 d-block" style="color:var(--accent)"></i><strong>Gestionar el pipeline de despliegue</strong><div class="small mt-1" style="color:var(--text-dim)">3 tácticas</div></div>
    <div class="branch branch-b"><i class="fa-solid fa-server mb-2 d-block" style="color:#b3a8ff"></i><strong>Gestionar el sistema desplegado</strong><div class="small mt-1" style="color:var(--text-dim)">3 tácticas</div></div>
  </div>
</div>
`);

// 3. Explorador: pipeline
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-diagram-project"></i> Rama 1</span>
  <h2 class="slide-title">Gestionar el pipeline de despliegue</h2>
  <p class="subtitle mb-3">Cómo llevar el código de forma segura y controlada hasta producción.</p>
  <div class="tac-grid" id="gridPipeline"></div>
</div>
`);

// 4. Explorador: sistema desplegado
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-server"></i> Rama 2</span>
  <h2 class="slide-title">Gestionar el sistema desplegado</h2>
  <p class="subtitle mb-3">Una vez que el sistema ya está corriendo en producción.</p>
  <div class="tac-grid" id="gridDesplegado"></div>
</div>
`);

// 5. Despliegue escalonado en detalle
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-chart-line"></i> Un caso destacado</span>
  <h2 class="slide-title">Despliegue escalonado, paso a paso</h2>
  <div class="card-panel mt-3">
    <p style="font-size:1rem; line-height:1.7;">
      La nueva versión se libera a un subconjunto controlado de usuarios. Si el monitoreo confirma que funciona bien,
      el subconjunto se amplía gradualmente hasta cubrir a toda la base de usuarios.
    </p>
    <div class="rollout-row"><div class="rollout-label">Paso 1</div><div class="rollout-bar"><div class="rollout-fill" style="width:5%"></div></div></div>
    <div class="rollout-row"><div class="rollout-label">Paso 2 ✓ ok</div><div class="rollout-bar"><div class="rollout-fill" style="width:25%"></div></div></div>
    <div class="rollout-row"><div class="rollout-label">Paso 3 ✓ ok</div><div class="rollout-bar"><div class="rollout-fill" style="width:60%"></div></div></div>
    <div class="rollout-row"><div class="rollout-label">Paso 4 ✓ ok</div><div class="rollout-bar"><div class="rollout-fill" style="width:100%"></div></div></div>
  </div>
  <div class="card-panel mt-3 d-flex gap-3 align-items-center">
    <div class="icon-tile" style="background:rgba(255,181,71,.14); color:var(--accent-3); border-color:rgba(255,181,71,.4)"><i class="fa-solid fa-triangle-exclamation"></i></div>
    <div class="small" style="color:var(--text-dim)">Si en cualquier paso el monitoreo detecta un problema, se detiene la expansión — y ahí entra la táctica de <strong style="color:var(--text)">rollback</strong>.</div>
  </div>
</div>
`);

// 6. Para profundizar
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-book-open-reader"></i> Para profundizar</span>
  <h2 class="slide-title">Infrastructure as Code</h2>
  <div class="card-panel mt-3">
    <div class="link-row">
      <i class="fa-solid fa-link" style="color:var(--accent)"></i>
      <a href="https://www.akamai.com/glossary/what-is-infrastructure-as-code" target="_blank">What Is Infrastructure as Code?</a>
      <span class="ext">Akamai</span>
    </div>
    <div class="link-row">
      <i class="fa-solid fa-link" style="color:var(--accent)"></i>
      <a href="https://learn.microsoft.com/en-us/devops/deliver/what-is-infrastructure-as-code" target="_blank">What is infrastructure as code?</a>
      <span class="ext">Microsoft DevOps</span>
    </div>
  </div>
</div>
`);

// 7. Quiz
slidesHTML.push(`
<div class="slide-inner d-flex flex-column justify-content-center align-items-center text-center" style="min-height:70vh;">
  <span class="eyebrow"><i class="fa-solid fa-brain"></i> Chequeo de comprensión</span>
  <h2 class="slide-title">5 preguntas sobre facilidad de despliegue</h2>
  <p class="subtitle mb-4">Los 2 propósitos y sus 6 tácticas.</p>
  <button class="check-btn" onclick="lanzarQuiz()"><i class="fa-solid fa-play me-2"></i>Iniciar quiz</button>
</div>
`);

// 8. Cierre
slidesHTML.push(`
<div class="slide-inner d-flex flex-column justify-content-center align-items-center text-center" style="min-height:78vh;">
  <div class="icon-tile mb-3" style="width:72px;height:72px;font-size:2rem;"><i class="fa-solid fa-check"></i></div>
  <span class="eyebrow"><i class="fa-solid fa-flag-checkered"></i> Repaso completo</span>
  <h2 class="slide-title">Desplegar sin miedo</h2>
  <p class="subtitle mb-4" style="max-width:640px;">Un pipeline bien gestionado y un sistema desplegado bien administrado son la diferencia entre "cruzar los dedos" y desplegar con confianza, todos los días.</p>
</div>
`);

/* ============ MOTOR DE NAVEGACIÓN ============ */
const container = document.getElementById('slidesContainer');
slidesHTML.forEach((html, i)=>{
  const div = document.createElement('div');
  div.className = 'slide' + (i===0 ? ' active' : '');
  div.id = 'slide'+i;
  div.innerHTML = html;
  container.appendChild(div);
});

let current = 0;
const total = slidesHTML.length;
document.getElementById('hudTotal').textContent = total;

const dotsWrap = document.getElementById('navDots');
for(let i=0;i<total;i++){
  const d = document.createElement('div');
  d.className = 'dot' + (i===0?' active':'');
  d.onclick = ()=>goTo(i);
  dotsWrap.appendChild(d);
}

function updateUI(){
  document.querySelectorAll('.slide').forEach((s,i)=>{ s.classList.toggle('active', i===current); });
  document.querySelectorAll('.nav-dots .dot').forEach((d,i)=>{ d.classList.toggle('active', i===current); });
  document.getElementById('hudCurrent').textContent = current+1;
  document.getElementById('progressFill').style.width = ((current+1)/total*100)+'%';
  const active = document.getElementById('slide'+current);
  active.scrollTop = 0;
  const animTarget = active.querySelector('.slide-inner');
  if(animTarget){
    animTarget.classList.remove('animate__fadeIn');
    void animTarget.offsetWidth;
    animTarget.classList.add('animate__animated','animate__fadeIn');
  }
}
function goTo(i){ if(i<0||i>=total) return; current = i; updateUI(); }
document.getElementById('prevBtn').onclick = ()=>goTo(current-1);
document.getElementById('nextBtn').onclick = ()=>goTo(current+1);
document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight') goTo(current+1);
  if(e.key==='ArrowLeft') goTo(current-1);
});
updateUI();

/* ============ DATOS DE TÁCTICAS ============ */
const pipeline = [
  {icon:'fa-chart-line', n:'Despliegue escalonado', d:'Desplegar la nueva versión gradualmente a un subconjunto controlado de usuarios. Si el monitoreo confirma que funciona bien, se amplía paulatinamente hasta cubrir a todos — minimizando el impacto de un posible problema.'},
  {icon:'fa-file-code', n:'Scripts para la implementación', d:'Usar scripts automatizados para manejar el despliegue: configuración del entorno, instalación de dependencias y activación de servicios. Mejora la consistencia, reduce errores humanos y facilita la repetibilidad.'},
  {icon:'fa-rotate-left', n:'Rollback', d:'Revertir un cambio a un estado anterior si se detectan problemas, restaurando datos y configuraciones.', reused:true}
];

const desplegado = [
  {icon:'fa-people-arrows', n:'Gestionar las interacciones entre servicios', d:'Necesario cuando, en un despliegue escalonado, conviven versiones distintas de varios componentes y hay que asegurar compatibilidad. Puede requerir un mediador que enrute el tráfico a la versión correcta según la solicitud.'},
  {icon:'fa-box-open', n:'Empaquetar también las dependencias', d:'Incluir en el mismo paquete de despliegue todas las dependencias necesarias, para que el componente funcione de forma consistente sin importar el entorno.'},
  {icon:'fa-toggle-on', n:'Apagar y encender características', d:'Habilitar o deshabilitar funcionalidades en tiempo de ejecución, sin redesplegar ni detener el componente — feature flags que dan flexibilidad para activar novedades o desactivar lo problemático.'}
];

function renderGrid(containerId, items){
  const grid = document.getElementById(containerId);
  items.forEach(t=>{
    const tile = document.createElement('div');
    tile.className = 'tac-tile';
    const badge = t.reused ? '<span class="badge-reused"><i class="fa-solid fa-recycle"></i> ya vista</span>' : '';
    tile.innerHTML = `<i class="fa-solid ${t.icon}"></i><div class="tname">${t.n}</div>${badge}`;
    tile.onclick = ()=>{
      Swal.fire({
        title: t.n,
        html: `<p style="text-align:left;">${t.d}</p>`,
        background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
      });
    };
    grid.appendChild(tile);
  });
}
renderGrid('gridPipeline', pipeline);
renderGrid('gridDesplegado', desplegado);

/* ============ QUIZ ============ */
const preguntas = [
  {
    texto:'¿Cuáles son los dos propósitos de las tácticas de facilidad de despliegue?',
    opciones:{
      a:'Gestionar el pipeline de despliegue y gestionar el sistema desplegado',
      b:'Reducir costos de infraestructura y aumentar la seguridad',
      c:'Automatizar pruebas unitarias y pruebas de integración',
      d:'Escalar horizontalmente y verticalmente los servidores'
    },
    correcta:'a'
  },
  {
    texto:'¿Qué caracteriza al despliegue escalonado?',
    opciones:{
      a:'Se libera la nueva versión a un subconjunto controlado de usuarios, y se amplía gradualmente si el monitoreo confirma que funciona bien',
      b:'Se apaga todo el sistema durante el despliegue hasta que termina',
      c:'Todos los usuarios reciben la nueva versión al mismo tiempo, sin excepción',
      d:'Solo se aplica a componentes de base de datos, nunca a servicios web'
    },
    correcta:'a'
  },
  {
    texto:'¿Por qué puede ser necesario un mediador que enrute el tráfico según alguna característica de la solicitud?',
    opciones:{
      a:'Para reducir el consumo de energía del sistema',
      b:'Porque en un despliegue escalonado coexisten versiones distintas de componentes y hay que asegurar la compatibilidad entre ellas',
      c:'Para cifrar los datos en tránsito entre servicios',
      d:'Para autenticar a los usuarios antes de acceder al sistema'
    },
    correcta:'b'
  },
  {
    texto:'¿Qué logra la táctica de "empaquetar también las dependencias"?',
    opciones:{
      a:'Que el componente se ejecute de forma consistente sin importar el entorno donde se despliegue, al incluir todas sus dependencias en el mismo paquete',
      b:'Que el sistema pueda revertirse a una versión anterior ante un problema',
      c:'Que se pueda habilitar o deshabilitar una funcionalidad sin redesplegar',
      d:'Que distintas versiones de un componente convivan sin conflictos'
    },
    correcta:'a'
  },
  {
    texto:'¿Qué permite la táctica "apagar y encender características" (feature flags)?',
    opciones:{
      a:'Reducir el tamaño del paquete de despliegue',
      b:'Habilitar o deshabilitar funcionalidades en tiempo de ejecución, sin necesidad de volver a desplegar o detener el componente',
      c:'Aumentar automáticamente los recursos asignados a un servicio',
      d:'Registrar quién realizó cada cambio en el sistema'
    },
    correcta:'b'
  }
];
let idxPregunta = 0, aciertos = 0;

function lanzarQuiz(){ idxPregunta = 0; aciertos = 0; mostrarPregunta(); }
function mostrarPregunta(){
  if(idxPregunta >= preguntas.length){
    Swal.fire({
      title:'Resultado',
      html:`Acertaste <b>${aciertos}/${preguntas.length}</b>.`,
      icon: aciertos===preguntas.length ? 'success' : 'info',
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    });
    return;
  }
  const p = preguntas[idxPregunta];
  Swal.fire({
    title: p.texto,
    input:'radio',
    inputOptions: p.opciones,
    background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff',
    confirmButtonText:'Responder',
    inputValidator: (value)=> !value && 'Elegí una opción'
  }).then(res=>{
    if(!res.isConfirmed) return;
    const ok = res.value === p.correcta;
    if(ok) aciertos++;
    Swal.fire({
      title: ok ? '¡Correcto!' : 'No es así',
      html: `La respuesta correcta era: <b>${p.opciones[p.correcta]}</b>`,
      icon: ok ? 'success' : 'error',
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    }).then(()=>{ idxPregunta++; mostrarPregunta(); });
  });
}
</script>

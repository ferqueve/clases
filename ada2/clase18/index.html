<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANDIS 2 · Unidad 3 — Componentes</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#070b14; --bg-1:#0d1424; --panel:#111a2e; --panel-2:#16223a;
  --accent:#3ec1ff; --accent-2:#7b6bff; --accent-3:#ffb547; --ok:#3ee6a8;
  --text:#e8edf7; --text-dim:#8fa0bd; --border:#22304d;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(1200px 700px at 15% -10%, rgba(62,193,255,.10), transparent 60%),
    radial-gradient(1000px 700px at 110% 10%, rgba(123,107,255,.12), transparent 55%),
    var(--bg-0);
  color:var(--text); font-family:'Inter',sans-serif; overflow:hidden;
}
.mono{font-family:'JetBrains Mono',monospace}
.blueprint{
  position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.35;
  background-image:linear-gradient(rgba(62,193,255,.06) 1px, transparent 1px),linear-gradient(90deg, rgba(62,193,255,.06) 1px, transparent 1px);
  background-size:42px 42px;
}
.progress-track{position:fixed; top:0; left:0; width:100%; height:4px; background:rgba(255,255,255,.06); z-index:50;}
.progress-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--accent-2)); transition:width .4s ease; box-shadow:0 0 12px var(--accent);}
.hud{position:fixed; top:14px; right:18px; z-index:50; background:rgba(17,26,46,.85); border:1px solid var(--border); backdrop-filter:blur(6px); padding:7px 14px; border-radius:999px; font-size:.82rem; color:var(--text-dim); display:flex; align-items:center; gap:8px;}
.hud .unit-tag{color:var(--accent); font-weight:700}
.brand{position:fixed; top:14px; left:18px; z-index:50; font-size:.78rem; color:var(--text-dim); display:flex; align-items:center; gap:8px; letter-spacing:.03em;}
.brand i{color:var(--accent-3)}
.slides-container{position:relative; z-index:1; height:100vh; width:100vw;}
.slide{position:absolute; inset:0; display:none; padding:90px 8vw 110px 8vw; overflow-y:auto;}
.slide.active{display:block}
.slide-inner{max-width:1180px; margin:0 auto;}
.eyebrow{display:inline-flex; align-items:center; gap:8px; font-size:.78rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent); font-weight:700; margin-bottom:14px;}
.eyebrow i{font-size:.9rem}
h1.slide-title{font-size:clamp(1.9rem,3.4vw,3rem); font-weight:800; margin-bottom:.4rem; line-height:1.1;}
h2.slide-title{font-size:clamp(1.5rem,2.6vw,2.2rem); font-weight:800; margin-bottom:.6rem;}
.subtitle{color:var(--text-dim); font-size:1.05rem; max-width:820px;}
.card-panel{background:linear-gradient(180deg, var(--panel), var(--panel-2)); border:1px solid var(--border); border-radius:16px; padding:26px 28px; box-shadow:0 12px 30px rgba(0,0,0,.35);}
.card-panel + .card-panel{margin-top:18px}
.pill{display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:999px; font-size:.76rem; font-weight:700; background:rgba(62,193,255,.12); color:var(--accent); border:1px solid rgba(62,193,255,.35);}
.pill.purple{background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)}
.pill.amber{background:rgba(255,181,71,.14); color:var(--accent-3); border-color:rgba(255,181,71,.4)}
.pill.ok{background:rgba(62,230,168,.12); color:var(--ok); border-color:rgba(62,230,168,.35)}
.pill.bad{background:rgba(255,107,107,.12); color:#ff6b6b; border-color:rgba(255,107,107,.35)}
.icon-tile{width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center; background:rgba(62,193,255,.12); color:var(--accent); font-size:1.3rem; border:1px solid rgba(62,193,255,.3); flex-shrink:0;}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
@media (max-width:900px){.grid-2,.grid-3{grid-template-columns:1fr;}}
ul.clean{list-style:none; margin:0; padding:0;}
ul.clean li{position:relative; padding:6px 0 6px 26px; color:var(--text); font-size:.94rem;}
ul.clean li::before{content:"\f105"; font-family:"Font Awesome 6 Free"; font-weight:900; color:var(--accent); position:absolute; left:2px; top:8px; font-size:.85rem;}
ul.clean.bad li::before{content:"\f00d"; color:#ff6b6b;}
.check-btn{border:none; background:linear-gradient(90deg,var(--accent),var(--accent-2)); color:#04101f; font-weight:800; padding:10px 22px; border-radius:10px; font-size:.9rem; box-shadow:0 8px 22px rgba(62,193,255,.25); cursor:pointer;}
.check-btn:hover{filter:brightness(1.08); color:#04101f;}
.nav-controls{position:fixed; bottom:18px; left:0; right:0; z-index:50; display:flex; justify-content:center; gap:14px; align-items:center;}
.nav-btn{width:46px; height:46px; border-radius:50%; border:1px solid var(--border); background:rgba(17,26,46,.9); color:var(--text); display:flex; align-items:center; justify-content:center; font-size:1.1rem; backdrop-filter:blur(6px);}
.nav-btn:hover{border-color:var(--accent); color:var(--accent);}
.nav-dots{display:flex; gap:6px; align-items:center; background:rgba(17,26,46,.9); border:1px solid var(--border); padding:8px 14px; border-radius:999px;}
.nav-dots .dot{width:7px; height:7px; border-radius:50%; background:var(--border); cursor:pointer; transition:.2s;}
.nav-dots .dot.active{background:var(--accent); width:20px; border-radius:4px;}
.footer-note{position:fixed; bottom:20px; right:22px; z-index:50; font-size:.72rem; color:var(--text-dim); font-family:'JetBrains Mono';}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px}

.tac-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
@media (max-width:900px){.tac-grid{grid-template-columns:repeat(2,1fr);}}
.tac-tile{
  background:var(--panel-2); border:1px solid var(--border); border-radius:14px; padding:16px;
  cursor:pointer; transition:.2s; text-align:center;
}
.tac-tile:hover{transform:translateY(-4px); border-color:var(--accent); box-shadow:0 10px 24px rgba(62,193,255,.15);}
.tac-tile i{font-size:1.3rem; color:var(--accent); margin-bottom:6px; display:block;}
.tac-tile .tname{font-size:.82rem; font-weight:700;}

.link-row{display:flex; align-items:center; gap:12px; padding:9px 0; border-bottom:1px solid rgba(255,255,255,.06); font-size:.88rem;}
.link-row:last-child{border-bottom:none;}
.link-row a{color:var(--text); text-decoration:none; font-weight:600;}
.link-row a:hover{color:var(--accent);}
.link-row .ext{margin-left:auto; color:var(--text-dim); font-size:.7rem;}

.diagram-box{border:1px solid var(--border); border-radius:12px; padding:14px; background:var(--bg-1);}
.layer-row{background:var(--panel-2); border:1px solid var(--border); border-radius:8px; padding:8px 12px; margin-bottom:6px; text-align:center; font-size:.82rem;}
.domain-col{flex:1; background:var(--panel-2); border:1px solid var(--border); border-radius:8px; padding:10px; text-align:center; font-size:.8rem;}
.domain-row{display:flex; gap:8px;}
.cart-highlight{outline:2px solid var(--accent-3); outline-offset:2px;}

.ref-num{
  width:28px;height:28px;border-radius:8px;background:rgba(62,193,255,.12); color:var(--accent); border:1px solid rgba(62,193,255,.3);
  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:.8rem; flex-shrink:0;
}
</style>
</head>
<body>

<div class="blueprint"></div>
<div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
<div class="brand"><i class="fa-solid fa-cubes"></i> ANDIS 2 · Unidad 3</div>
<div class="hud"><i class="fa-solid fa-layer-group"></i> <span class="unit-tag" id="hudCurrent">1</span>/<span id="hudTotal">0</span></div>

<div class="slides-container" id="slidesContainer"></div>

<div class="nav-controls">
  <button class="nav-btn" id="prevBtn"><i class="fa-solid fa-chevron-left"></i></button>
  <div class="nav-dots" id="navDots"></div>
  <button class="nav-btn" id="nextBtn"><i class="fa-solid fa-chevron-right"></i></button>
</div>
<div class="footer-note">← → para navegar</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.10.5/sweetalert2.all.min.js"></script>
<script>
const slidesHTML = [];

// 0. Portada
slidesHTML.push(`
<div class="slide-inner d-flex flex-column justify-content-center" style="min-height:78vh;">
  <div class="animate__animated animate__fadeInDown">
    <span class="eyebrow"><i class="fa-solid fa-cubes"></i> Unidad 3 · Soluciones arquitectónicas</span>
    <h1 class="slide-title">Componentes</h1>
    <p class="subtitle">El bloque de construcción modular fundamental de cualquier arquitectura — y una de las primeras grandes decisiones que toma un arquitecto: cómo particionarlos.</p>
  </div>
</div>
`);

// 1. ¿Qué es un componente? + explorador de definiciones
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-circle-question"></i> Cinco autores, una idea consistente</span>
  <h2 class="slide-title">¿Qué es un componente?</h2>
  <div class="card-panel mt-3">
    <p style="font-size:1.02rem; line-height:1.75; margin:0;">
      Existen varias definiciones de componente en arquitectura de software, todas relativamente consistentes:
      son <strong>unidades modulares con interfaces bien definidas</strong>, que <strong>encapsulan funciones específicas</strong>
      y pueden <strong>interactuar con otros componentes</strong>, permitiendo la <strong>reutilización</strong> y la
      <strong>independencia</strong> en la construcción y el despliegue.
    </p>
  </div>
  <p class="subtitle mt-3 mb-2">Tocá cada tarjeta para ver la definición de cada autor.</p>
  <div class="tac-grid" id="gridDefiniciones"></div>
</div>
`);

// 2. Alcance de los componentes
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-arrows-left-right"></i> De la biblioteca al microservicio</span>
  <h2 class="slide-title">Alcance de los componentes</h2>
  <div class="grid-2 mt-3">
    <div class="card-panel h-100">
      <div class="icon-tile mb-2"><i class="fa-solid fa-book"></i></div>
      <h6 class="fw-bold">Mismo espacio de memoria</h6>
      <p class="small mb-1" style="color:var(--text-dim)">El componente envuelve el código a un nivel superior de modularidad que las clases o funciones. Habitualmente se lo llama <strong style="color:var(--text)">biblioteca (library)</strong>: sus elementos se ejecutan en el mismo espacio de memoria y se comunican mediante llamados a funciones del lenguaje.</p>
      <p class="small mb-0" style="color:var(--text-dim)">Ejemplos: cada capa de una arquitectura en capas, cada filtro en pipes and filters, el núcleo y complementos en microkernel.</p>
    </div>
    <div class="card-panel h-100">
      <div class="icon-tile mb-2" style="background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)"><i class="fa-solid fa-network-wired"></i></div>
      <h6 class="fw-bold">Espacios de memoria distintos</h6>
      <p class="small mb-1" style="color:var(--text-dim)">El componente también puede ser un <strong style="color:var(--text)">servicio</strong> (service-based) o un <strong style="color:var(--text)">micro-servicio</strong> (microservices), o de cualquier arquitectura distribuida.</p>
      <p class="small mb-0" style="color:var(--text-dim)">Cada uno ejecuta en su propio espacio de memoria y se comunica por protocolos de red de bajo nivel (TCP/IP) o de más alto nivel (REST, colas de mensajes).</p>
    </div>
  </div>
</div>
`);

// 3. Componentes y el rol del arquitecto
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-user-tie"></i> Dónde termina el trabajo del arquitecto</span>
  <h2 class="slide-title">Componentes y el rol del arquitecto</h2>
  <div class="card-panel mt-3">
    <div class="d-flex gap-3">
      <div class="icon-tile"><i class="fa-solid fa-cube"></i></div>
      <p style="font-size:1.02rem; line-height:1.75; margin:0;">
        Los componentes son el bloque de construcción modular fundamental de la arquitectura. Por eso, una de las
        decisiones principales del arquitecto es la <strong>partición de alto nivel</strong> de los componentes.
      </p>
    </div>
  </div>
  <div class="card-panel mt-3 d-flex gap-3 align-items-center">
    <div class="icon-tile" style="background:rgba(255,181,71,.14); color:var(--accent-3); border-color:rgba(255,181,71,.4)"><i class="fa-solid fa-arrows-down-to-line"></i></div>
    <div class="small" style="color:var(--text-dim)">El componente es, habitualmente, el <strong style="color:var(--text)">nivel más bajo</strong> con el que interactúa directamente un arquitecto — salvo, quizás, métricas que afectan atributos de calidad en las bases del código. Las clases, funciones o procedimientos <strong style="color:var(--text)">dentro</strong> de un componente son responsabilidad de los desarrolladores.</div>
  </div>
</div>
`);

// 4. Dos formas de particionar (intro + comparación)
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-code-branch"></i> La gran decisión</span>
  <h2 class="slide-title">Dos formas de particionar los componentes</h2>
  <p class="subtitle mb-3">El reparto de componentes de alto nivel condiciona más que cualquier otro la arquitectura resultante. Ninguna alternativa es mejor que la otra — pero la elección inicial tiene consecuencias.</p>

  <div class="grid-2">
    <div class="card-panel">
      <span class="pill"><i class="fa-solid fa-layer-group"></i> Partición técnica</span>
      <p class="small mt-2 mb-2" style="color:var(--text-dim)">El criterio se basa en capacidades técnicas, independiente del dominio del problema. Es la partición predeterminada en muchas organizaciones y frameworks.</p>
      <div class="diagram-box">
        <div class="layer-row">Presentación</div>
        <div class="layer-row">Lógica de negocio</div>
        <div class="layer-row">Servicios</div>
        <div class="layer-row">Persistencia</div>
      </div>
      <ul class="clean mt-2"><li>Separa claramente el código de personalización</li><li>Alineada con el estilo en capas</li></ul>
      <ul class="clean bad mt-1"><li>Mayor acoplamiento global</li><li>Un cambio afecta a los demás componentes dependientes</li><li>Puede duplicar reglas de negocio entre componentes</li></ul>
    </div>
    <div class="card-panel">
      <span class="pill purple"><i class="fa-solid fa-sitemap"></i> Partición por el dominio</span>
      <p class="small mt-2 mb-2" style="color:var(--text-dim)">Inspirada en Domain-Driven Design (Eric Evans): el criterio son los dominios o flujos de trabajo, no las capacidades técnicas.</p>
      <div class="diagram-box">
        <div class="domain-row">
          <div class="domain-col">Catálogo</div>
          <div class="domain-col cart-highlight">Checkout</div>
          <div class="domain-col">Envíos</div>
        </div>
      </div>
      <ul class="clean mt-2"><li>Modelado más cercano al negocio real</li><li>Facilita equipos multidisciplinarios por dominio</li><li>Alineada con monolito modular y microservicios</li></ul>
      <ul class="clean bad mt-1"><li>El código de personalización aparece en múltiples lugares</li></ul>
    </div>
  </div>
</div>
`);

// 5. Carrito de compras + redundancia
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-cart-shopping"></i> Un mismo ejemplo, dos resultados</span>
  <h2 class="slide-title">El caso del carrito de compras</h2>
  <div class="grid-2 mt-3">
    <div class="card-panel h-100">
      <span class="pill"><i class="fa-solid fa-layer-group"></i> Partición técnica</span>
      <p class="small mt-2 mb-0" style="color:var(--text-dim)">La funcionalidad del carrito de compras <strong style="color:var(--text)">aparece dispersa</strong> en todos los componentes técnicos (presentación, negocio, servicios, persistencia).</p>
    </div>
    <div class="card-panel h-100">
      <span class="pill purple"><i class="fa-solid fa-sitemap"></i> Partición por dominio</span>
      <p class="small mt-2 mb-0" style="color:var(--text-dim)">La misma funcionalidad queda <strong style="color:var(--text)">contenida por completo</strong> en un único componente: Catalog Checkout.</p>
    </div>
  </div>
  <div class="card-panel mt-3 d-flex gap-3 align-items-center">
    <div class="icon-tile" style="background:rgba(62,230,168,.12); color:var(--ok); border-color:rgba(62,230,168,.35)"><i class="fa-solid fa-scale-balanced"></i></div>
    <div class="small" style="color:var(--text-dim)">Consecuencia práctica: si hace falta <strong style="color:var(--text)">redundancia</strong> para lograr disponibilidad o rendimiento en un flujo específico (el carrito de compras en fiestas de fin de año), es <strong style="color:var(--text)">más fácil</strong> lograrlo con partición por dominio — asumiendo que esa funcionalidad está contenida en un solo componente. Con partición técnica, no.</div>
  </div>
  <div class="card-panel mt-3 d-flex gap-3 align-items-center">
    <div class="icon-tile" style="background:rgba(255,181,71,.14); color:var(--accent-3); border-color:rgba(255,181,71,.4)"><i class="fa-solid fa-database"></i></div>
    <div class="small" style="color:var(--text-dim)">En microservicios, la partición por dominio es la apropiada — pero a diferencia del ejemplo genérico, <strong style="color:var(--text)">cada micro-servicio tiene su propia base de datos</strong>. Y un componente de dominio puede estar compuesto internamente por componentes técnicos — nunca al revés.</div>
  </div>
</div>
`);

// 6. Ciclo de identificación de componentes
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-arrows-spin"></i> Cómo se hace, en la práctica</span>
  <h2 class="slide-title">Ciclo de identificación de componentes</h2>
  <div class="card-panel mt-3">
    <p style="font-size:1.02rem; line-height:1.75; margin-bottom:0;">
      Identificar los componentes de una arquitectura no es un paso único: es un proceso <strong>iterativo</strong>.
      El ciclo de identificación de componentes es el marco que guía ese proceso paso a paso.
    </p>
  </div>
  <div class="card-panel mt-3">
    <div class="link-row">
      <i class="fa-solid fa-link" style="color:var(--accent)"></i>
      <a href="https://github.com/ucudal/ANDIS_Conceptos/blob/main/2_Tecnicas_y_herramientas/2_02_.Arquitectura/2_02_02_Ciclo_identificacion_componentes.md" target="_blank">Ciclo de identificación de componentes</a>
      <span class="ext">repositorio — lectura obligatoria</span>
    </div>
  </div>
</div>
`);

// 7. Lecturas de la unidad
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-book-open-reader"></i> Toda la Unidad 3</span>
  <h2 class="slide-title">Lecturas de Soluciones arquitectónicas</h2>
  <div class="card-panel mt-3">
    <div class="link-row"><i class="fa-solid fa-link" style="color:var(--accent)"></i><a href="https://github.com/ucudal/ANDIS_Conceptos/blob/main/4_Conceptos/4_Componente.md" target="_blank">Componentes</a><span class="ext">✓ visto hoy</span></div>
    <div class="link-row"><i class="fa-solid fa-link" style="color:var(--accent)"></i><a href="https://github.com/ucudal/ANDIS_Conceptos/blob/main/4_Conceptos/4_Modularidad.md" target="_blank">Modularidad</a></div>
    <div class="link-row"><i class="fa-solid fa-link" style="color:var(--accent)"></i><a href="https://github.com/ucudal/ANDIS_Conceptos/blob/main/4_Conceptos/4_Cohesion.md" target="_blank">Cohesión</a></div>
    <div class="link-row"><i class="fa-solid fa-link" style="color:var(--accent)"></i><a href="https://github.com/ucudal/ANDIS_Conceptos/blob/main/4_Conceptos/4_Acoplamiento.md" target="_blank">Acoplamiento</a></div>
    <div class="link-row"><i class="fa-solid fa-link" style="color:var(--accent)"></i><a href="https://github.com/ucudal/ANDIS_Conceptos/blob/main/4_Conceptos/4_Connascence.md" target="_blank">Co-nascencia (connascence)</a></div>
    <div class="link-row"><i class="fa-solid fa-link" style="color:var(--accent)"></i><a href="https://github.com/ucudal/ANDIS_Conceptos/blob/main/4_Conceptos/4_REP.md" target="_blank">REP</a></div>
    <div class="link-row"><i class="fa-solid fa-link" style="color:var(--accent)"></i><a href="https://github.com/ucudal/ANDIS_Conceptos/blob/main/4_Conceptos/4_CCP.md" target="_blank">CCP</a></div>
    <div class="link-row"><i class="fa-solid fa-link" style="color:var(--accent)"></i><a href="https://github.com/ucudal/ANDIS_Conceptos/blob/main/4_Conceptos/4_CRP.md" target="_blank">CRP</a></div>

/* ============ MOTOR DE NAVEGACIÓN ============ */
const container = document.getElementById('slidesContainer');
slidesHTML.forEach((html, i)=>{
  const div = document.createElement('div');
  div.className = 'slide' + (i===0 ? ' active' : '');
  div.id = 'slide'+i;
  div.innerHTML = html;
  container.appendChild(div);
});

let current = 0;
const total = slidesHTML.length;
document.getElementById('hudTotal').textContent = total;

const dotsWrap = document.getElementById('navDots');
for(let i=0;i<total;i++){
  const d = document.createElement('div');
  d.className = 'dot' + (i===0?' active':'');
  d.onclick = ()=>goTo(i);
  dotsWrap.appendChild(d);
}

function updateUI(){
  document.querySelectorAll('.slide').forEach((s,i)=>{ s.classList.toggle('active', i===current); });
  document.querySelectorAll('.nav-dots .dot').forEach((d,i)=>{ d.classList.toggle('active', i===current); });
  document.getElementById('hudCurrent').textContent = current+1;
  document.getElementById('progressFill').style.width = ((current+1)/total*100)+'%';
  const active = document.getElementById('slide'+current);
  active.scrollTop = 0;
  const animTarget = active.querySelector('.slide-inner');
  if(animTarget){
    animTarget.classList.remove('animate__fadeIn');
    void animTarget.offsetWidth;
    animTarget.classList.add('animate__animated','animate__fadeIn');
  }
}
function goTo(i){ if(i<0||i>=total) return; current = i; updateUI(); }
document.getElementById('prevBtn').onclick = ()=>goTo(current-1);
document.getElementById('nextBtn').onclick = ()=>goTo(current+1);
document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight') goTo(current+1);
  if(e.key==='ArrowLeft') goTo(current-1);
});
updateUI();

  {icon:'fa-plug', n:'Bass, Clements & Kazman', d:'Un módulo de software con una interfaz claramente definida, que interactúa con otros componentes a través de conexiones explícitas, y encapsula un comportamiento bien especificado y controlado. Puede reutilizarse y, en muchos casos, desplegarse de forma independiente.'},
  {icon:'fa-shapes', n:'ISO/IEC/IEEE 42010', d:'Una parte de un sistema que interactúa con otras partes a través de interfaces. Es la unidad que implementa una función específica dentro de un sistema más grande.'},

  {icon:'fa-globe', n:'Fielding', d:'En el contexto de arquitecturas REST, una unidad abstracta que interactúa con otros componentes a través de una interfaz uniforme, facilitando la comunicación y la reutilización de comportamientos.'}

/* ============ QUIZ ============ */
const preguntas = [
  {
    texto:'¿Qué elementos comunes comparten las distintas definiciones de "componente" según el texto?',
    opciones:{
      a:'Ser siempre archivos .jar o .dll, sin excepción',
      b:'Ser unidades modulares con interfaces bien definidas que encapsulan funciones específicas y permiten reutilización e independencia',
      c:'Ejecutar siempre en un espacio de memoria distinto al del resto del sistema',
      d:'Depender siempre de un framework de programación orientada a objetos'
    },
    correcta:'b'
  },
  {
    texto:'¿Qué caracteriza a un componente de tipo "biblioteca" frente a uno de tipo "servicio"?',
    opciones:{
      a:'La biblioteca ejecuta en el mismo espacio de memoria y se comunica por llamados a funciones; el servicio ejecuta en su propio espacio de memoria y se comunica por protocolos de red',
      b:'No hay ninguna diferencia real entre ambos tipos',
      c:'Los servicios siempre son más rápidos que las bibliotecas',
      d:'Las bibliotecas solo existen en arquitecturas de microservicios'
    },
    correcta:'a'
  },
  {
    texto:'Según el texto, ¿cuál es habitualmente el nivel más bajo con el que interactúa directamente un arquitecto?',
    opciones:{
      a:'Las líneas de código individuales',
      b:'Las variables y estructuras de datos internas',
      c:'El componente',
      d:'Los comentarios del código fuente'
    },
    correcta:'c'
  },
  {
    texto:'¿Qué criterio usa la partición por el dominio para definir los componentes de alto nivel?',
    opciones:{
      a:'Las capacidades técnicas del sistema, como presentación o persistencia',
      b:'Los dominios o flujos de trabajo del negocio, inspirados en Domain-Driven Design',
      c:'La cantidad de líneas de código de cada módulo',
      d:'El lenguaje de programación utilizado en cada parte del sistema'
    },
    correcta:'b'
  },
  {
    texto:'¿Por qué es más fácil lograr redundancia para disponibilidad o rendimiento del carrito de compras con partición por dominio que con partición técnica?',
    opciones:{
      a:'Porque la partición técnica no permite replicar ningún componente',
      b:'Porque con partición por dominio esa funcionalidad está contenida en un solo componente, mientras que con partición técnica está dispersa entre varios',
      c:'Porque la partición por dominio siempre usa menos servidores',
      d:'Porque la partición técnica no admite bases de datos separadas'
    },
    correcta:'b'
  }
];
let idxPregunta = 0, aciertos = 0;

function lanzarQuiz(){ idxPregunta = 0; aciertos = 0; mostrarPregunta(); }
function mostrarPregunta(){
  if(idxPregunta >= preguntas.length){
    Swal.fire({
      title:'Resultado',
      html:`Acertaste <b>${aciertos}/${preguntas.length}</b>.`,
      icon: aciertos===preguntas.length ? 'success' : 'info',
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    });
    return;
  }
  const p = preguntas[idxPregunta];
  Swal.fire({
    title: p.texto,
    input:'radio',
    inputOptions: p.opciones,
    background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff',
    confirmButtonText:'Responder',
    inputValidator: (value)=> !value && 'Elegí una opción'
  }).then(res=>{
    if(!res.isConfirmed) return;
    const ok = res.value === p.correcta;
    if(ok) aciertos++;
    Swal.fire({
      title: ok ? '¡Correcto!' : 'No es así',
      html: `La respuesta correcta era: <b>${p.opciones[p.correcta]}</b>`,
      icon: ok ? 'success' : 'error',
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    }).then(()=>{ idxPregunta++; mostrarPregunta(); });
  });
}

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANDIS 2 · Taller — Identificar impulsores de la arquitectura</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#070b14; --bg-1:#0d1424; --panel:#111a2e; --panel-2:#16223a;
  --accent:#3ec1ff; --accent-2:#7b6bff; --accent-3:#ffb547; --ok:#3ee6a8; --bad:#ff6b6b;
  --text:#e8edf7; --text-dim:#8fa0bd; --border:#22304d;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(1200px 700px at 15% -10%, rgba(62,193,255,.10), transparent 60%),
    radial-gradient(1000px 700px at 110% 10%, rgba(123,107,255,.12), transparent 55%),
    var(--bg-0);
  color:var(--text); font-family:'Inter',sans-serif; overflow:hidden;
}
.mono{font-family:'JetBrains Mono',monospace}
.blueprint{
  position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.35;
  background-image:linear-gradient(rgba(62,193,255,.06) 1px, transparent 1px),linear-gradient(90deg, rgba(62,193,255,.06) 1px, transparent 1px);
  background-size:42px 42px;
}
.progress-track{position:fixed; top:0; left:0; width:100%; height:4px; background:rgba(255,255,255,.06); z-index:50;}
.progress-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--accent-2)); transition:width .4s ease; box-shadow:0 0 12px var(--accent);}
.hud{position:fixed; top:14px; right:18px; z-index:50; background:rgba(17,26,46,.85); border:1px solid var(--border); backdrop-filter:blur(6px); padding:7px 14px; border-radius:999px; font-size:.82rem; color:var(--text-dim); display:flex; align-items:center; gap:8px;}
.hud .unit-tag{color:var(--accent); font-weight:700}
.brand{position:fixed; top:14px; left:18px; z-index:50; font-size:.78rem; color:var(--text-dim); display:flex; align-items:center; gap:8px; letter-spacing:.03em;}
.brand i{color:var(--accent-3)}
.slides-container{position:relative; z-index:1; height:100vh; width:100vw;}
.slide{position:absolute; inset:0; display:none; padding:90px 8vw 110px 8vw; overflow-y:auto;}
.slide.active{display:block}
.slide-inner{max-width:1180px; margin:0 auto;}
.eyebrow{display:inline-flex; align-items:center; gap:8px; font-size:.78rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent); font-weight:700; margin-bottom:14px;}
.eyebrow i{font-size:.9rem}
h1.slide-title{font-size:clamp(1.9rem,3.4vw,3rem); font-weight:800; margin-bottom:.4rem; line-height:1.1;}
h2.slide-title{font-size:clamp(1.5rem,2.6vw,2.2rem); font-weight:800; margin-bottom:.6rem;}
.subtitle{color:var(--text-dim); font-size:1.05rem; max-width:820px;}
.card-panel{background:linear-gradient(180deg, var(--panel), var(--panel-2)); border:1px solid var(--border); border-radius:16px; padding:26px 28px; box-shadow:0 12px 30px rgba(0,0,0,.35);}
.card-panel + .card-panel{margin-top:18px}
.pill{display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:999px; font-size:.76rem; font-weight:700; background:rgba(62,193,255,.12); color:var(--accent); border:1px solid rgba(62,193,255,.35);}
.pill.purple{background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)}
.pill.amber{background:rgba(255,181,71,.14); color:var(--accent-3); border-color:rgba(255,181,71,.4)}
.pill.ok{background:rgba(62,230,168,.12); color:var(--ok); border-color:rgba(62,230,168,.35)}
.pill.bad{background:rgba(255,107,107,.12); color:var(--bad); border-color:rgba(255,107,107,.35)}
.icon-tile{width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center; background:rgba(62,193,255,.12); color:var(--accent); font-size:1.3rem; border:1px solid rgba(62,193,255,.3); flex-shrink:0;}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
.grid-4{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
@media (max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}
ul.clean{list-style:none; margin:0; padding:0;}
ul.clean li{position:relative; padding:6px 0 6px 26px; color:var(--text); font-size:.96rem;}
ul.clean li::before{content:"\f105"; font-family:"Font Awesome 6 Free"; font-weight:900; color:var(--accent); position:absolute; left:2px; top:8px; font-size:.85rem;}
.badge-hours{font-family:'JetBrains Mono'; font-size:.78rem; background:rgba(255,181,71,.12); color:var(--accent-3); border:1px solid rgba(255,181,71,.3); padding:3px 10px; border-radius:8px; display:inline-block;}
.check-btn{border:none; background:linear-gradient(90deg,var(--accent),var(--accent-2)); color:#04101f; font-weight:800; padding:10px 22px; border-radius:10px; font-size:.9rem; box-shadow:0 8px 22px rgba(62,193,255,.25); cursor:pointer;}
.check-btn:hover{filter:brightness(1.08); color:#04101f;}
.check-btn.ghost{background:transparent; border:1px solid var(--border); color:var(--text); box-shadow:none;}
.check-btn.ghost:hover{border-color:var(--accent); color:var(--accent);}
.nav-controls{position:fixed; bottom:18px; left:0; right:0; z-index:50; display:flex; justify-content:center; gap:14px; align-items:center;}
.nav-btn{width:46px; height:46px; border-radius:50%; border:1px solid var(--border); background:rgba(17,26,46,.9); color:var(--text); display:flex; align-items:center; justify-content:center; font-size:1.1rem; backdrop-filter:blur(6px);}
.nav-btn:hover{border-color:var(--accent); color:var(--accent);}
.nav-dots{display:flex; gap:6px; align-items:center; background:rgba(17,26,46,.9); border:1px solid var(--border); padding:8px 14px; border-radius:999px;}
.nav-dots .dot{width:7px; height:7px; border-radius:50%; background:var(--border); cursor:pointer; transition:.2s;}
.nav-dots .dot.active{background:var(--accent); width:20px; border-radius:4px;}
.footer-note{position:fixed; bottom:20px; right:22px; z-index:50; font-size:.72rem; color:var(--text-dim); font-family:'JetBrains Mono';}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px}

/* voice card */
.voice-card{background:var(--panel-2); border:1px solid var(--border); border-radius:14px; padding:18px 20px; margin-bottom:14px;}
.voice-head{display:flex; gap:12px; align-items:flex-start; margin-bottom:10px;}
.voice-role{font-weight:700; font-size:.9rem;}
.voice-quote{color:var(--text-dim); font-size:.92rem; font-style:italic; margin:0;}
.voice-input{
  width:100%; background:var(--bg-1); border:1px solid var(--border); border-radius:10px; color:var(--text);
  padding:10px 12px; font-size:.86rem; resize:vertical; min-height:44px;
}
.voice-input:focus{outline:none; border-color:var(--accent);}
.voice-actions{display:flex; justify-content:flex-end; margin-top:8px;}

/* quadrant */
.quad-grid{display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:12px; height:340px;}
.quad{border-radius:14px; padding:16px; display:flex; flex-direction:column; justify-content:space-between; border:1px solid var(--border);}
.quad h6{margin:0; font-weight:800;}
.quad p{font-size:.78rem; color:var(--text-dim); margin:0;}
.quad.q1{background:rgba(62,230,168,.10); border-color:rgba(62,230,168,.35);}
.quad.q2{background:rgba(62,193,255,.10); border-color:rgba(62,193,255,.35);}
.quad.q3{background:rgba(255,181,71,.10); border-color:rgba(255,181,71,.35);}
.quad.q4{background:rgba(255,107,107,.10); border-color:rgba(255,107,107,.35);}

.axis-label{font-size:.72rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:.08em; text-align:center;}

table.rubrica{width:100%; border-collapse:separate; border-spacing:0; font-size:.86rem;}
table.rubrica th{text-align:left; color:var(--accent); text-transform:uppercase; font-size:.68rem; letter-spacing:.06em; padding:10px 12px; border-bottom:1px solid var(--border);}
table.rubrica td{padding:11px 12px; border-bottom:1px solid rgba(255,255,255,.05); vertical-align:top; color:var(--text-dim);}
table.rubrica tr:hover td{background:rgba(62,193,255,.04); color:var(--text);}
table.rubrica td strong{color:var(--text)}
</style>
</head>
<body>

<div class="blueprint"></div>
<div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
<div class="brand"><i class="fa-solid fa-cubes"></i> ANDIS 2 · Taller Unidad 1</div>
<div class="hud"><i class="fa-solid fa-layer-group"></i> <span class="unit-tag" id="hudCurrent">1</span>/<span id="hudTotal">0</span></div>

<div class="slides-container" id="slidesContainer"></div>

<div class="nav-controls">
  <button class="nav-btn" id="prevBtn"><i class="fa-solid fa-chevron-left"></i></button>
  <div class="nav-dots" id="navDots"></div>
  <button class="nav-btn" id="nextBtn"><i class="fa-solid fa-chevron-right"></i></button>
</div>
<div class="footer-note">← → para navegar</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.10.5/sweetalert2.all.min.js"></script>
<script>
const slidesHTML = [];

// 0. Portada
slidesHTML.push(`
<div class="slide-inner d-flex flex-column justify-content-center" style="min-height:78vh;">
  <div class="animate__animated animate__fadeInDown">
    <span class="eyebrow"><i class="fa-solid fa-flask"></i> Taller práctico · Unidad 1</span>
    <h1 class="slide-title">Identificar impulsores de la arquitectura</h1>
    <p class="subtitle">Un caso real (ficticio), voces de distintos interesados, y la tarea de separar el ruido de las decisiones que de verdad van a moldear el diseño.</p>
  </div>
  <div class="row mt-5 animate__animated animate__fadeInUp animate__delay-1s">
    <div class="col-md-4 mb-3">
      <div class="card-panel text-center py-4">
        <i class="fa-solid fa-users mb-2" style="font-size:1.5rem;color:var(--accent)"></i>
        <div class="fw-bold">Trabajo en equipo</div>
        <div class="small" style="color:var(--text-dim)">Grupos de 3-4 personas</div>
      </div>
    </div>
    <div class="col-md-4 mb-3">
      <div class="card-panel text-center py-4">
        <i class="fa-solid fa-hourglass-half mb-2" style="font-size:1.5rem;color:var(--accent-2)"></i>
        <div class="fw-bold">~40 minutos</div>
        <div class="small" style="color:var(--text-dim)">análisis + puesta en común</div>
      </div>
    </div>
    <div class="col-md-4 mb-3">
      <div class="card-panel text-center py-4">
        <i class="fa-solid fa-comments mb-2" style="font-size:1.5rem;color:var(--accent-3)"></i>
        <div class="fw-bold">8 voces</div>
        <div class="small" style="color:var(--text-dim)">de interesados del caso</div>
      </div>
    </div>
  </div>
</div>
`);

// 1. Instrucciones
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-list-ol"></i> Cómo trabajamos</span>
  <h2 class="slide-title">Instrucciones del taller</h2>
  <div class="card-panel mt-3">
    <div class="d-flex gap-3 mb-3">
      <div class="icon-tile">1</div>
      <div><strong>Leé el caso</strong><p class="small mb-0" style="color:var(--text-dim)">MediSalud, la plataforma de telemedicina que vamos a usar como caso de estudio.</p></div>
    </div>
    <div class="d-flex gap-3 mb-3">
      <div class="icon-tile" style="background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)">2</div>
      <div><strong>Leé cada voz de interesado</strong><p class="small mb-0" style="color:var(--text-dim)">Ocho frases reales de un taller de relevamiento. Para cada una, escribí: ¿es un impulsor arquitectónico? ¿de qué tipo? ¿de qué categoría ISO 25010?</p></div>
    </div>
    <div class="d-flex gap-3 mb-3">
      <div class="icon-tile" style="background:rgba(255,181,71,.14); color:var(--accent-3); border-color:rgba(255,181,71,.4)">3</div>
      <div><strong>Contrastá con el análisis experto</strong><p class="small mb-0" style="color:var(--text-dim)">Cada tarjeta tiene un botón para revelar el análisis esperado. Usalo recién <em>después</em> de responder en equipo.</p></div>
    </div>
    <div class="d-flex gap-3">
      <div class="icon-tile" style="background:rgba(62,230,168,.12); color:var(--ok); border-color:rgba(62,230,168,.35)">4</div>
      <div><strong>Priorizá</strong><p class="small mb-0" style="color:var(--text-dim)">De los drivers identificados, ubicá los 3 más críticos en la matriz de priorización.</p></div>
    </div>
  </div>
  <div class="card-panel mt-3 d-flex gap-3 align-items-center">
    <div class="icon-tile"><i class="fa-solid fa-triangle-exclamation"></i></div>
    <div class="small" style="color:var(--text-dim)">Ojo: no todas las frases esconden un impulsor arquitectónico. Alguna es un <strong style="color:var(--text)">requerimiento funcional común</strong> — parte del ejercicio es saber distinguirlo.</div>
  </div>
</div>
`);

// 2. El caso
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-briefcase-medical"></i> Caso de estudio</span>
  <h2 class="slide-title">MediSalud</h2>
  <div class="card-panel mt-3">
    <div class="d-flex gap-3">
      <div class="icon-tile"><i class="fa-solid fa-house-medical"></i></div>
      <p style="font-size:1.02rem; line-height:1.75; margin:0;">
        MediSalud es una plataforma de <strong>telemedicina</strong> que conecta pacientes con médicos de guardia y de
        especialidades, integra <strong>historias clínicas electrónicas</strong>, agenda turnos y factura contra distintas
        obras sociales. Opera en clínicas urbanas y en <strong>postas rurales</strong> con conectividad limitada.
        La empresa acaba de cerrar una ronda de inversión para escalar a nivel regional y necesita repensar su arquitectura
        antes de crecer.
      </p>
    </div>
  </div>
</div>
`);

// 3 y 4. Voces de los interesados (helper)
function voiceCard(id, rol, icon, cita){
  return `
  <div class="voice-card" id="voice-${id}">
    <div class="voice-head">
      <div class="icon-tile" style="width:40px;height:40px;font-size:1rem;"><i class="fa-solid ${icon}"></i></div>
      <div>
        <div class="voice-role">${rol}</div>
        <p class="voice-quote">"${cita}"</p>
      </div>
    </div>
    <textarea class="voice-input" placeholder="¿Es un impulsor? ¿Atributo de calidad o RAS? ¿Categoría ISO 25010?"></textarea>
    <div class="voice-actions">
      <button class="check-btn ghost" onclick="verAnalisis(${id})"><i class="fa-solid fa-eye me-2"></i>Ver análisis esperado</button>
    </div>
  </div>`;
}

slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-comments"></i> Voces de los interesados (1/2)</span>
  <h2 class="slide-title">¿Qué impulsor esconde cada frase?</h2>
  ${voiceCard(0,'CEO','fa-user-tie','Si el sistema cae más de un par de minutos durante un pico de teleconsultas, perdemos pacientes y confianza.')}
  ${voiceCard(1,'Médica de guardia','fa-user-doctor','Necesito que la videollamada no tenga cortes ni demoras, sobre todo cuando reviso signos vitales en tiempo real.')}
  ${voiceCard(2,'Jefe de seguridad de la información','fa-user-shield','Los datos clínicos deben estar cifrados y accesibles solo con autorización explícita; tenemos que poder demostrar quién accedió a cada historia clínica.')}
  ${voiceCard(3,'Gerente de operaciones (DevOps)','fa-user-gear','Publicamos actualizaciones cada dos semanas y no podemos permitirnos un downtime largo en cada release.')}
</div>
`);

slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-comments"></i> Voces de los interesados (2/2)</span>
  <h2 class="slide-title">Seguimos identificando</h2>
  ${voiceCard(4,'Directora médica','fa-user-nurse','Si el sistema recomienda mal una dosis o pierde una alerta crítica, puede haber consecuencias graves para el paciente.')}
  ${voiceCard(5,'Gerente comercial','fa-user-tie','El año que viene queremos sumar tres obras sociales nuevas; el sistema tiene que poder incorporar esas reglas sin rehacer el módulo de facturación.')}
  ${voiceCard(6,'Paciente (usuario)','fa-user','Quiero poder sacar un turno o iniciar una consulta desde el celular sin tener que llamar por teléfono.')}
  ${voiceCard(7,'Jefe de infraestructura','fa-user-cog','Muchas de nuestras postas rurales tienen cortes de luz frecuentes; el equipamiento tiene que andar con el menor consumo posible.')}
</div>
`);

// 5. Plantilla de registro
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-table-list"></i> Para tu informe</span>
  <h2 class="slide-title">Plantilla de registro</h2>
  <p class="subtitle mb-3">Volcá tu análisis de las 8 voces en una tabla con estas columnas — es lo que vas a entregar al final del taller.</p>
  <div class="card-panel" style="overflow-x:auto;">
    <table class="rubrica">
      <thead><tr><th>Interesado</th><th>¿Es un impulsor?</th><th>Tipo</th><th>Categoría ISO 25010</th><th>Justificación</th></tr></thead>
      <tbody>
        <tr><td>CEO</td><td>…</td><td>…</td><td>…</td><td>…</td></tr>
        <tr><td>Médica de guardia</td><td>…</td><td>…</td><td>…</td><td>…</td></tr>
        <tr><td>Jefe de seguridad</td><td>…</td><td>…</td><td>…</td><td>…</td></tr>
        <tr><td>...</td><td>…</td><td>…</td><td>…</td><td>…</td></tr>
      </tbody>
    </table>
  </div>
  <div class="card-panel mt-3 d-flex gap-3 align-items-center">
    <div class="icon-tile" style="background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)"><i class="fa-solid fa-lightbulb"></i></div>
    <div class="small" style="color:var(--text-dim)">"Tipo" puede ser: <strong style="color:var(--text)">atributo de calidad</strong>, <strong style="color:var(--text)">RAS</strong>, o <strong style="color:var(--text)">requerimiento funcional</strong> (si no es un impulsor arquitectónico).</div>
  </div>
</div>
`);

// 6. Matriz de priorización
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-chart-simple"></i> Último paso</span>
  <h2 class="slide-title">Priorizá los 3 drivers más críticos</h2>
  <p class="subtitle mb-3">Ubicá cada driver identificado según su <strong>impacto en el negocio</strong> y su <strong>dificultad de implementación</strong>.</p>
  <div class="quad-grid">
    <div class="quad q2"><h6><i class="fa-solid fa-star me-1"></i>Grandes apuestas</h6><p>Alto impacto · alta dificultad. Requieren decisión temprana del arquitecto.</p></div>
    <div class="quad q1"><h6><i class="fa-solid fa-bolt me-1"></i>Quick wins</h6><p>Alto impacto · baja dificultad. Resolverlos primero da tracción rápida.</p></div>
    <div class="quad q4"><h6><i class="fa-solid fa-circle-question me-1"></i>Cuestionar</h6><p>Bajo impacto · alta dificultad. ¿Vale la pena el esfuerzo? Negociar con el interesado.</p></div>
    <div class="quad q3"><h6><i class="fa-solid fa-box-archive me-1"></i>Relleno</h6><p>Bajo impacto · baja dificultad. Se resuelven, pero no definen la arquitectura.</p></div>
  </div>
  <div class="row mt-2">
    <div class="col-6 axis-label">← Baja dificultad · Alta dificultad →</div>
    <div class="col-6 axis-label">← Baja dificultad · Alta dificultad →</div>
  </div>
</div>
`);

// 7. Rúbrica
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-clipboard-check"></i> Qué se observa</span>
  <h2 class="slide-title">Rúbrica del taller</h2>
  <div class="card-panel mt-3" style="overflow-x:auto;">
    <table class="rubrica">
      <thead><tr><th>Criterio</th><th>Insuficiente</th><th>Aceptable</th><th>Destacado</th></tr></thead>
      <tbody>
        <tr><td><strong>Identificación de drivers</strong></td><td>Confunde requerimientos funcionales con impulsores</td><td>Identifica la mayoría de los drivers correctamente</td><td>Identifica todos los drivers y detecta el/los distractor(es)</td></tr>
        <tr><td><strong>Clasificación ISO 25010</strong></td><td>Categorías incorrectas o ausentes</td><td>Categoriza correctamente la mayoría</td><td>Clasifica con precisión y justifica cada elección</td></tr>
        <tr><td><strong>Atributo vs. RAS</strong></td><td>No distingue ambos conceptos</td><td>Distingue en la mayoría de los casos</td><td>Argumenta con claridad por qué cada driver es o no un RAS</td></tr>
        <tr><td><strong>Priorización</strong></td><td>No fundamenta la matriz</td><td>Prioriza con criterio parcial</td><td>Prioriza con argumentos sólidos de impacto/dificultad</td></tr>
      </tbody>
    </table>
  </div>
</div>
`);

// 8. Cierre
slidesHTML.push(`
<div class="slide-inner d-flex flex-column justify-content-center align-items-center text-center" style="min-height:78vh;">
  <div class="icon-tile mb-3" style="width:72px;height:72px;font-size:2rem;"><i class="fa-solid fa-handshake"></i></div>
  <span class="eyebrow"><i class="fa-solid fa-flag-checkered"></i> Puesta en común</span>
  <h2 class="slide-title">Compartimos hallazgos</h2>
  <p class="subtitle mb-4" style="max-width:640px;">Cada equipo presenta sus 3 drivers priorizados y por qué. Discutimos en plenario los casos donde hubo diferencias de criterio — ahí suele estar lo más interesante.</p>
  <button class="check-btn" onclick="Swal.fire({title:'¡A compartir!',html:'Preparen 2 minutos por equipo para presentar sus 3 drivers priorizados.',icon:'info',background:'#111a2e',color:'#e8edf7',confirmButtonColor:'#3ec1ff'})">
    <i class="fa-solid fa-microphone me-2"></i>Empezar puesta en común
  </button>
</div>
`);

/* ============ MOTOR DE NAVEGACIÓN ============ */
const container = document.getElementById('slidesContainer');
slidesHTML.forEach((html, i)=>{
  const div = document.createElement('div');
  div.className = 'slide' + (i===0 ? ' active' : '');
  div.id = 'slide'+i;
  div.innerHTML = html;
  container.appendChild(div);
});

let current = 0;
const total = slidesHTML.length;
document.getElementById('hudTotal').textContent = total;

const dotsWrap = document.getElementById('navDots');
for(let i=0;i<total;i++){
  const d = document.createElement('div');
  d.className = 'dot' + (i===0?' active':'');
  d.onclick = ()=>goTo(i);
  dotsWrap.appendChild(d);
}

function updateUI(){
  document.querySelectorAll('.slide').forEach((s,i)=>{ s.classList.toggle('active', i===current); });
  document.querySelectorAll('.nav-dots .dot').forEach((d,i)=>{ d.classList.toggle('active', i===current); });
  document.getElementById('hudCurrent').textContent = current+1;
  document.getElementById('progressFill').style.width = ((current+1)/total*100)+'%';
  const active = document.getElementById('slide'+current);
  active.scrollTop = 0;
  const animTarget = active.querySelector('.slide-inner');
  if(animTarget){
    animTarget.classList.remove('animate__fadeIn');
    void animTarget.offsetWidth;
    animTarget.classList.add('animate__animated','animate__fadeIn');
  }
}
function goTo(i){ if(i<0||i>=total) return; current = i; updateUI(); }
document.getElementById('prevBtn').onclick = ()=>goTo(current-1);
document.getElementById('nextBtn').onclick = ()=>goTo(current+1);
document.addEventListener('keydown', (e)=>{
  const tag = document.activeElement.tagName;
  if(tag==='TEXTAREA' || tag==='INPUT') return;
  if(e.key==='ArrowRight') goTo(current+1);
  if(e.key==='ArrowLeft') goTo(current-1);
});
updateUI();

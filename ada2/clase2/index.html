<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANDIS 2 · Unidad 1 — Impulsores de la arquitectura</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#070b14; --bg-1:#0d1424; --panel:#111a2e; --panel-2:#16223a;
  --accent:#3ec1ff; --accent-2:#7b6bff; --accent-3:#ffb547; --ok:#3ee6a8;
  --text:#e8edf7; --text-dim:#8fa0bd; --border:#22304d;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(1200px 700px at 15% -10%, rgba(62,193,255,.10), transparent 60%),
    radial-gradient(1000px 700px at 110% 10%, rgba(123,107,255,.12), transparent 55%),
    var(--bg-0);
  color:var(--text); font-family:'Inter',sans-serif; overflow:hidden;
}
.mono{font-family:'JetBrains Mono',monospace}
.blueprint{
  position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.35;
  background-image:linear-gradient(rgba(62,193,255,.06) 1px, transparent 1px),linear-gradient(90deg, rgba(62,193,255,.06) 1px, transparent 1px);
  background-size:42px 42px;
}
.progress-track{position:fixed; top:0; left:0; width:100%; height:4px; background:rgba(255,255,255,.06); z-index:50;}
.progress-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--accent-2)); transition:width .4s ease; box-shadow:0 0 12px var(--accent);}
.hud{position:fixed; top:14px; right:18px; z-index:50; background:rgba(17,26,46,.85); border:1px solid var(--border); backdrop-filter:blur(6px); padding:7px 14px; border-radius:999px; font-size:.82rem; color:var(--text-dim); display:flex; align-items:center; gap:8px;}
.hud .unit-tag{color:var(--accent); font-weight:700}
.brand{position:fixed; top:14px; left:18px; z-index:50; font-size:.78rem; color:var(--text-dim); display:flex; align-items:center; gap:8px; letter-spacing:.03em;}
.brand i{color:var(--accent-3)}
.slides-container{position:relative; z-index:1; height:100vh; width:100vw;}
.slide{position:absolute; inset:0; display:none; padding:90px 8vw 110px 8vw; overflow-y:auto;}
.slide.active{display:block}
.slide-inner{max-width:1180px; margin:0 auto;}
.eyebrow{display:inline-flex; align-items:center; gap:8px; font-size:.78rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent); font-weight:700; margin-bottom:14px;}
.eyebrow i{font-size:.9rem}
h1.slide-title{font-size:clamp(1.9rem,3.4vw,3rem); font-weight:800; margin-bottom:.4rem; line-height:1.1;}
h2.slide-title{font-size:clamp(1.5rem,2.6vw,2.2rem); font-weight:800; margin-bottom:.6rem;}
.subtitle{color:var(--text-dim); font-size:1.05rem; max-width:820px;}
.card-panel{background:linear-gradient(180deg, var(--panel), var(--panel-2)); border:1px solid var(--border); border-radius:16px; padding:26px 28px; box-shadow:0 12px 30px rgba(0,0,0,.35);}
.card-panel + .card-panel{margin-top:18px}
.pill{display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:999px; font-size:.76rem; font-weight:700; background:rgba(62,193,255,.12); color:var(--accent); border:1px solid rgba(62,193,255,.35);}
.pill.purple{background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)}
.pill.amber{background:rgba(255,181,71,.14); color:var(--accent-3); border-color:rgba(255,181,71,.4)}
.pill.ok{background:rgba(62,230,168,.12); color:var(--ok); border-color:rgba(62,230,168,.35)}
.icon-tile{width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center; background:rgba(62,193,255,.12); color:var(--accent); font-size:1.3rem; border:1px solid rgba(62,193,255,.3); flex-shrink:0;}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
@media (max-width:900px){.grid-2,.grid-3{grid-template-columns:1fr;}}
ul.clean{list-style:none; margin:0; padding:0;}
ul.clean li{position:relative; padding:6px 0 6px 26px; color:var(--text); font-size:.96rem;}
ul.clean li::before{content:"\f105"; font-family:"Font Awesome 6 Free"; font-weight:900; color:var(--accent); position:absolute; left:2px; top:8px; font-size:.85rem;}
.badge-hours{font-family:'JetBrains Mono'; font-size:.78rem; background:rgba(255,181,71,.12); color:var(--accent-3); border:1px solid rgba(255,181,71,.3); padding:3px 10px; border-radius:8px; display:inline-block;}
.check-btn{border:none; background:linear-gradient(90deg,var(--accent),var(--accent-2)); color:#04101f; font-weight:800; padding:10px 22px; border-radius:10px; font-size:.9rem; box-shadow:0 8px 22px rgba(62,193,255,.25);}
.check-btn:hover{filter:brightness(1.08); color:#04101f;}
.nav-controls{position:fixed; bottom:18px; left:0; right:0; z-index:50; display:flex; justify-content:center; gap:14px; align-items:center;}
.nav-btn{width:46px; height:46px; border-radius:50%; border:1px solid var(--border); background:rgba(17,26,46,.9); color:var(--text); display:flex; align-items:center; justify-content:center; font-size:1.1rem; backdrop-filter:blur(6px);}
.nav-btn:hover{border-color:var(--accent); color:var(--accent);}
.nav-dots{display:flex; gap:6px; align-items:center; background:rgba(17,26,46,.9); border:1px solid var(--border); padding:8px 14px; border-radius:999px;}
.nav-dots .dot{width:7px; height:7px; border-radius:50%; background:var(--border); cursor:pointer; transition:.2s;}
.nav-dots .dot.active{background:var(--accent); width:20px; border-radius:4px;}
.footer-note{position:fixed; bottom:20px; right:22px; z-index:50; font-size:.72rem; color:var(--text-dim); font-family:'JetBrains Mono';}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px}

/* ISO explorer tiles */
.iso-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
@media (max-width:900px){.iso-grid{grid-template-columns:repeat(2,1fr);}}
.iso-tile{
  background:var(--panel-2); border:1px solid var(--border); border-radius:14px; padding:18px;
  cursor:pointer; transition:.2s; text-align:center;
}
.iso-tile:hover{transform:translateY(-4px); border-color:var(--accent); box-shadow:0 10px 24px rgba(62,193,255,.15);}
.iso-tile i{font-size:1.5rem; color:var(--accent); margin-bottom:8px; display:block;}
.iso-tile .iname{font-size:.86rem; font-weight:700;}
.iso-tile .isub{font-size:.68rem; color:var(--text-dim); margin-top:3px;}

.attr-card{display:flex; gap:16px; align-items:flex-start;}
.link-row{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid rgba(255,255,255,.06);}
.link-row:last-child{border-bottom:none;}
.link-row a{color:var(--text); text-decoration:none; font-weight:600;}
.link-row a:hover{color:var(--accent);}
.link-row .ext{margin-left:auto; color:var(--text-dim); font-size:.75rem;}

.ref-num{
  width:30px;height:30px;border-radius:8px;background:rgba(62,193,255,.12); color:var(--accent); border:1px solid rgba(62,193,255,.3);
  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:.85rem; flex-shrink:0;
}
</style>
</head>
<body>

<div class="blueprint"></div>
<div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
<div class="brand"><i class="fa-solid fa-cubes"></i> ANDIS 2 · Unidad 1</div>
<div class="hud"><i class="fa-solid fa-layer-group"></i> <span class="unit-tag" id="hudCurrent">1</span>/<span id="hudTotal">0</span></div>

<div class="slides-container" id="slidesContainer"></div>

<div class="nav-controls">
  <button class="nav-btn" id="prevBtn"><i class="fa-solid fa-chevron-left"></i></button>
  <div class="nav-dots" id="navDots"></div>
  <button class="nav-btn" id="nextBtn"><i class="fa-solid fa-chevron-right"></i></button>
</div>
<div class="footer-note">← → para navegar</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.10.5/sweetalert2.all.min.js"></script>
<script>
const slidesHTML = [];

// 0. Portada
slidesHTML.push(`
<div class="slide-inner d-flex flex-column justify-content-center" style="min-height:78vh;">
  <div class="animate__animated animate__fadeInDown">
    <span class="eyebrow"><i class="fa-solid fa-compass-drafting"></i> Unidad 1 · ANDIS 2</span>
    <h1 class="slide-title">Impulsores o drivers de la arquitectura</h1>
    <p class="subtitle">Lo primero que hace un arquitecto no es dibujar cajas: es entender qué fuerzas van a moldear ese diseño. Esas fuerzas son los <strong>atributos de calidad</strong> y los <strong>requerimientos arquitectónicamente significativos</strong>.</p>
  </div>
  <div class="row mt-5 animate__animated animate__fadeInUp animate__delay-1s">
    <div class="col-md-4 mb-3">
      <div class="card-panel text-center py-4">
        <i class="fa-solid fa-list-check mb-2" style="font-size:1.5rem;color:var(--accent)"></i>
        <div class="fw-bold">Atributos de calidad</div>
        <div class="small" style="color:var(--text-dim)">Qué son y por qué importan</div>
      </div>
    </div>
    <div class="col-md-4 mb-3">
      <div class="card-panel text-center py-4">
        <i class="fa-solid fa-sitemap mb-2" style="font-size:1.5rem;color:var(--accent-2)"></i>
        <div class="fw-bold">ISO/IEC 25010</div>
        <div class="small" style="color:var(--text-dim)">El mapa completo de características</div>
      </div>
    </div>
    <div class="col-md-4 mb-3">
      <div class="card-panel text-center py-4">
        <i class="fa-solid fa-star mb-2" style="font-size:1.5rem;color:var(--accent-3)"></i>
        <div class="fw-bold">RAS</div>
        <div class="small" style="color:var(--text-dim)">Los pocos que de verdad importan acá</div>
      </div>
    </div>
  </div>
</div>
`);

// 1. ¿Qué es un atributo de calidad?
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-circle-question"></i> Concepto central</span>
  <h2 class="slide-title">¿Qué es un atributo de calidad?</h2>
  <div class="card-panel mt-3">
    <div class="attr-card">
      <div class="icon-tile"><i class="fa-solid fa-ruler-combined"></i></div>
      <p style="font-size:1.05rem; line-height:1.7; margin:0;">
        Es una <strong>propiedad medible o comprobable</strong> de un sistema, que indica qué tan bien ese sistema
        satisface las necesidades de los interesados <strong>más allá de su funcionalidad básica</strong>.
      </p>
    </div>
  </div>
  <div class="grid-2 mt-3">
    <div class="card-panel">
      <span class="pill"><i class="fa-solid fa-tag"></i> También se los llama</span>
      <ul class="clean mt-2">
        <li>Características arquitectónicas</li>
        <li>Requerimientos no funcionales</li>
        <li>"Ilities" (availability, deployability, integrability...)</li>
      </ul>
    </div>
    <div class="card-panel">
      <span class="pill amber"><i class="fa-solid fa-user-tie"></i> Rol del arquitecto</span>
      <p class="small mb-0" style="color:var(--text-dim)">Puede colaborar en el análisis de requerimientos, pero es responsable directo de <strong style="color:var(--text)">definir, descubrir y analizar</strong> los atributos de calidad: todo lo que el sistema debe hacer que no pertenece al dominio del problema.</p>
    </div>
  </div>
</div>
`);

// 2. Características de un atributo de calidad
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-fingerprint"></i> Cómo reconocerlo</span>
  <h2 class="slide-title">Tres rasgos de un atributo de calidad</h2>
  <div class="card-panel mt-3">
    <div class="d-flex gap-3">
      <div class="icon-tile">1</div>
      <div>
        <h6 class="fw-bold mb-1">No pertenece al dominio del problema</h6>
        <p class="small mb-0" style="color:var(--text-dim)">Los requerimientos dicen <em>qué</em> debe hacer el producto; el atributo de calidad dice <em>cómo</em> de bien y <em>por qué</em> diseñarlo de cierta forma. El rendimiento casi nunca aparece en el documento de requerimientos, y "prevenir la deuda técnica" tampoco — pero son consideraciones de diseño constantes.</p>
      </div>
    </div>
  </div>
  <div class="card-panel">
    <div class="d-flex gap-3">
      <div class="icon-tile" style="background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)">2</div>
      <div>
        <h6 class="fw-bold mb-1">Influye en un aspecto estructural del diseño</h6>
        <p class="small mb-0" style="color:var(--text-dim)">La pregunta clave del arquitecto: ¿esta característica exige una consideración estructural especial? La seguridad preocupa en todo proyecto, pero se vuelve un atributo de calidad recién cuando el arquitecto necesita diseñar algo especial para lograrla.</p>
      </div>
    </div>
  </div>
  <div class="card-panel">
    <div class="d-flex gap-3">
      <div class="icon-tile" style="background:rgba(255,181,71,.14); color:var(--accent-3); border-color:rgba(255,181,71,.4)">3</div>
      <div>
        <h6 class="fw-bold mb-1">Es crítico para el éxito del producto</h6>
        <p class="small mb-0" style="color:var(--text-dim)">Un producto podría "admitir" decenas de atributos, pero no debería: cada uno agrega complejidad. La tarea del arquitecto es elegir <strong style="color:var(--text)">la menor cantidad posible</strong>, no la mayor.</p>
      </div>
    </div>
  </div>
</div>
`);

// 3. Taxonomía ISO/IEC 25010 - explorer
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-sitemap"></i> El mapa completo</span>
  <h2 class="slide-title">Taxonomía ISO/IEC 25010</h2>
  <p class="subtitle mb-3">Cualquier clasificación de atributos de calidad es necesariamente incompleta — pero esta es la referencia estándar. Tocá cada categoría para ver sus subcaracterísticas.</p>
  <div class="iso-grid" id="isoGrid"></div>
</div>
`);

// 4. Los atributos que trabajamos en este curso
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-star"></i> Foco de ANDIS 2</span>
  <h2 class="slide-title">Los atributos que vamos a diseñar</h2>
  <p class="subtitle mb-3">De las decenas de subcaracterísticas de ISO 25010, el curso se concentra en siete, agrupadas dentro de sus categorías padre.</p>
  <div class="grid-2">
    <div class="card-panel">
      <div class="d-flex gap-3 align-items-start">
        <div class="icon-tile"><i class="fa-solid fa-power-off"></i></div>
        <div>
          <div class="d-flex align-items-center gap-2 flex-wrap"><h6 class="fw-bold mb-0">Disponibilidad</h6><span class="pill">Fiabilidad</span></div>
          <p class="small mb-0 mt-1" style="color:var(--text-dim)">Capacidad del sistema de estar operativo y accesible cuando se lo necesita.</p>
        </div>
      </div>
    </div>
    <div class="card-panel">
      <div class="d-flex gap-3 align-items-start">
        <div class="icon-tile" style="background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)"><i class="fa-solid fa-gauge-high"></i></div>
        <div>
          <div class="d-flex align-items-center gap-2 flex-wrap"><h6 class="fw-bold mb-0">Rendimiento</h6><span class="pill purple">Eficiencia de desempeño</span></div>
          <p class="small mb-0 mt-1" style="color:var(--text-dim)">Tiempo de respuesta, uso de recursos y capacidad bajo condiciones especificadas.</p>
        </div>
      </div>
    </div>
    <div class="card-panel">
      <div class="d-flex gap-3 align-items-start">
        <div class="icon-tile" style="background:rgba(255,181,71,.14); color:var(--accent-3); border-color:rgba(255,181,71,.4)"><i class="fa-solid fa-shield-heart"></i></div>
        <div>
          <div class="d-flex align-items-center gap-2 flex-wrap"><h6 class="fw-bold mb-0">Protección</h6><span class="pill amber">Categoría propia</span></div>
          <p class="small mb-0 mt-1" style="color:var(--text-dim)">Evitar que el sistema ponga en peligro vidas, propiedad o el medio ambiente.</p>
        </div>
      </div>
    </div>
    <div class="card-panel">
      <div class="d-flex gap-3 align-items-start">
        <div class="icon-tile"><i class="fa-solid fa-lock"></i></div>
        <div>
          <div class="d-flex align-items-center gap-2 flex-wrap"><h6 class="fw-bold mb-0">Seguridad</h6><span class="pill">Categoría propia</span></div>
          <p class="small mb-0 mt-1" style="color:var(--text-dim)">Confidencialidad, integridad y autenticidad de datos frente a agentes malintencionados.</p>
        </div>
      </div>
    </div>
    <div class="card-panel">
      <div class="d-flex gap-3 align-items-start">
        <div class="icon-tile" style="background:rgba(62,230,168,.12); color:var(--ok); border-color:rgba(62,230,168,.35)"><i class="fa-solid fa-leaf"></i></div>
        <div>
          <div class="d-flex align-items-center gap-2 flex-wrap"><h6 class="fw-bold mb-0">Eficiencia energética</h6><span class="pill ok">Lectura dedicada</span></div>
          <p class="small mb-0 mt-1" style="color:var(--text-dim)">Consumo de energía del sistema como restricción de diseño de primer orden.</p>
        </div>
      </div>
    </div>
    <div class="card-panel">
      <div class="d-flex gap-3 align-items-start">
        <div class="icon-tile" style="background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)"><i class="fa-solid fa-pen-ruler"></i></div>
        <div>
          <div class="d-flex align-items-center gap-2 flex-wrap"><h6 class="fw-bold mb-0">Facilidad de modificación</h6><span class="pill purple">Facilidad de mantenimiento</span></div>
          <p class="small mb-0 mt-1" style="color:var(--text-dim)">Poder modificar el sistema de forma efectiva y eficiente sin introducir defectos.</p>
        </div>
      </div>
    </div>
  </div>
  <div class="card-panel mt-3">
    <div class="d-flex gap-3 align-items-start">
      <div class="icon-tile" style="background:rgba(255,181,71,.14); color:var(--accent-3); border-color:rgba(255,181,71,.4)"><i class="fa-solid fa-rocket"></i></div>
      <div>
        <div class="d-flex align-items-center gap-2 flex-wrap"><h6 class="fw-bold mb-0">Facilidad de despliegue</h6><span class="pill amber">Flexibilidad → Facilidad de instalación</span></div>
        <p class="small mb-0 mt-1" style="color:var(--text-dim)">Facilidad con la que el sistema se puede instalar, desinstalar o reemplazar en un entorno determinado.</p>
      </div>
    </div>
  </div>
</div>
`);

// 5. RAS
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-crosshairs"></i> El otro impulsor</span>
  <h2 class="slide-title">Requerimientos arquitectónicamente significativos (RAS)</h2>
  <div class="card-panel mt-3">
    <div class="attr-card">
      <div class="icon-tile"><i class="fa-solid fa-filter"></i></div>
      <div>
        <p style="font-size:1.02rem; line-height:1.7;">
          No todos los requerimientos —funcionales o de calidad— tienen el mismo peso sobre el diseño. Los <strong>RAS</strong>
          son ese subconjunto que realmente <strong>condiciona la estructura</strong> del sistema: obligan a tomar decisiones
          de arquitectura que serían costosas de revertir más adelante.
        </p>
        <p class="small mb-0" style="color:var(--text-dim)">Identificarlos es el primer paso del proceso de diseño dirigido por atributos (ADD), que vamos a ver en la Unidad 6. Por ahora, el objetivo es aprender a distinguir un RAS de un requerimiento "más de lo mismo".</p>
      </div>
    </div>
  </div>
</div>
`);

// 6. Chequeo interactivo
slidesHTML.push(`
<div class="slide-inner d-flex flex-column justify-content-center align-items-center text-center" style="min-height:70vh;">
  <span class="eyebrow"><i class="fa-solid fa-brain"></i> Chequeo rápido</span>
  <h2 class="slide-title">¿A qué categoría ISO 25010 pertenece?</h2>
  <p class="subtitle mb-4">Ubicá cada atributo dentro de su categoría padre.</p>
  <button class="check-btn" onclick="lanzarQuiz()"><i class="fa-solid fa-play me-2"></i>Iniciar chequeo</button>
</div>
`);

// 7. Lecturas obligatorias
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-book-open-reader"></i> Antes de la próxima clase</span>
  <h2 class="slide-title">Lecturas</h2>

/* ============ MOTOR DE NAVEGACIÓN ============ */
const container = document.getElementById('slidesContainer');
slidesHTML.forEach((html, i)=>{
  const div = document.createElement('div');
  div.className = 'slide' + (i===0 ? ' active' : '');
  div.id = 'slide'+i;
  div.innerHTML = html;
  container.appendChild(div);
});

let current = 0;
const total = slidesHTML.length;
document.getElementById('hudTotal').textContent = total;

const dotsWrap = document.getElementById('navDots');
for(let i=0;i<total;i++){
  const d = document.createElement('div');
  d.className = 'dot' + (i===0?' active':'');
  d.onclick = ()=>goTo(i);
  dotsWrap.appendChild(d);
}

function updateUI(){
  document.querySelectorAll('.slide').forEach((s,i)=>{ s.classList.toggle('active', i===current); });
  document.querySelectorAll('.nav-dots .dot').forEach((d,i)=>{ d.classList.toggle('active', i===current); });
  document.getElementById('hudCurrent').textContent = current+1;
  document.getElementById('progressFill').style.width = ((current+1)/total*100)+'%';
  const active = document.getElementById('slide'+current);
  active.scrollTop = 0;
  const animTarget = active.querySelector('.slide-inner');
  if(animTarget){
    animTarget.classList.remove('animate__fadeIn');
    void animTarget.offsetWidth;
    animTarget.classList.add('animate__animated','animate__fadeIn');
  }
}
function goTo(i){ if(i<0||i>=total) return; current = i; updateUI(); }
document.getElementById('prevBtn').onclick = ()=>goTo(current-1);
document.getElementById('nextBtn').onclick = ()=>goTo(current+1);
document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight') goTo(current+1);
  if(e.key==='ArrowLeft') goTo(current-1);
});
updateUI();

/* ============ QUIZ INTERACTIVO ============ */
const preguntas = [
  {texto:'Disponibilidad', opciones:{'fiabilidad':'Fiabilidad','seguridad':'Seguridad','flexibilidad':'Flexibilidad','proteccion':'Protección'}, correcta:'fiabilidad'},
  {texto:'Escalabilidad', opciones:{'fiabilidad':'Fiabilidad','flexibilidad':'Flexibilidad','compatibilidad':'Compatibilidad','desempeno':'Eficiencia de desempeño'}, correcta:'flexibilidad'},
  {texto:'Facilidad de modificación', opciones:{'mantenimiento':'Facilidad de mantenimiento','interaccion':'Capacidad de interacción','proteccion':'Protección','seguridad':'Seguridad'}, correcta:'mantenimiento'},
  {texto:'Confidencialidad', opciones:{'seguridad':'Seguridad','fiabilidad':'Fiabilidad','proteccion':'Protección','desempeno':'Eficiencia de desempeño'}, correcta:'seguridad'}
];
let idxPregunta = 0, aciertos = 0;

function lanzarQuiz(){ idxPregunta = 0; aciertos = 0; mostrarPregunta(); }
function mostrarPregunta(){
  if(idxPregunta >= preguntas.length){
    Swal.fire({
      title:'Resultado',
      html:`Acertaste <b>${aciertos}/${preguntas.length}</b>.`,
      icon: aciertos===preguntas.length ? 'success' : 'info',
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    });
    return;
  }
  const p = preguntas[idxPregunta];
  Swal.fire({
    title: `¿De qué categoría es "${p.texto}"?`,
    input: 'radio',
    inputOptions: p.opciones,
    background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff',
    confirmButtonText: 'Responder',
    inputValidator: (value)=> !value && 'Elegí una opción'
  }).then(res=>{
    if(!res.isConfirmed) return;
    const ok = res.value === p.correcta;
    if(ok) aciertos++;
    Swal.fire({
      title: ok ? '¡Correcto!' : 'No es así',
      html: `Pertenece a <b>${p.opciones[p.correcta]}</b>.`,
      icon: ok ? 'success' : 'error',
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    }).then(()=>{ idxPregunta++; mostrarPregunta(); });
  });
}
</script>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANDIS 2 · Unidad 4 — Patrones de disponibilidad</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#070b14; --bg-1:#0d1424; --panel:#111a2e; --panel-2:#16223a;
  --accent:#3ec1ff; --accent-2:#7b6bff; --accent-3:#ffb547; --ok:#3ee6a8; --bad:#ff6b6b;
  --text:#e8edf7; --text-dim:#8fa0bd; --border:#22304d;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(1200px 700px at 15% -10%, rgba(62,193,255,.10), transparent 60%),radial-gradient(1000px 700px at 110% 10%, rgba(123,107,255,.12), transparent 55%),var(--bg-0);color:var(--text);font-family:'Inter',sans-serif;overflow:hidden;}
.mono{font-family:'JetBrains Mono',monospace}
.blueprint{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.35;background-image:linear-gradient(rgba(62,193,255,.06) 1px, transparent 1px),linear-gradient(90deg, rgba(62,193,255,.06) 1px, transparent 1px);background-size:42px 42px;}
.progress-track{position:fixed;top:0;left:0;width:100%;height:4px;background:rgba(255,255,255,.06);z-index:50;}
.progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .4s ease;box-shadow:0 0 12px var(--accent);}
.hud{position:fixed;top:14px;right:18px;z-index:50;background:rgba(17,26,46,.85);border:1px solid var(--border);backdrop-filter:blur(6px);padding:7px 14px;border-radius:999px;font-size:.82rem;color:var(--text-dim);display:flex;align-items:center;gap:8px;}
.hud .unit-tag{color:var(--accent);font-weight:700}
.brand{position:fixed;top:14px;left:18px;z-index:50;font-size:.78rem;color:var(--text-dim);display:flex;align-items:center;gap:8px;letter-spacing:.03em;}
.brand i{color:var(--accent-3)}
.slides-container{position:relative;z-index:1;height:100vh;width:100vw;}
.slide{position:absolute;inset:0;display:none;padding:90px 8vw 110px 8vw;overflow-y:auto;}
.slide.active{display:block}
.slide-inner{max-width:1180px;margin:0 auto;}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);font-weight:700;margin-bottom:14px;}
h1.slide-title{font-size:clamp(1.9rem,3.4vw,3rem);font-weight:800;margin-bottom:.4rem;line-height:1.1;}
h2.slide-title{font-size:clamp(1.5rem,2.6vw,2.2rem);font-weight:800;margin-bottom:.6rem;}
.subtitle{color:var(--text-dim);font-size:1.05rem;max-width:820px;}
.card-panel{background:linear-gradient(180deg, var(--panel), var(--panel-2));border:1px solid var(--border);border-radius:16px;padding:26px 28px;box-shadow:0 12px 30px rgba(0,0,0,.35);}
.card-panel + .card-panel{margin-top:18px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:.76rem;font-weight:700;background:rgba(62,193,255,.12);color:var(--accent);border:1px solid rgba(62,193,255,.35);}
.pill.amber{background:rgba(255,181,71,.14);color:var(--accent-3);border-color:rgba(255,181,71,.4)}
.pill.ok{background:rgba(62,230,168,.12);color:var(--ok);border-color:rgba(62,230,168,.35)}
.pill.bad{background:rgba(255,107,107,.12);color:#ff6b6b;border-color:rgba(255,107,107,.35)}
.icon-tile{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:rgba(62,193,255,.12);color:var(--accent);font-size:1.3rem;border:1px solid rgba(62,193,255,.3);flex-shrink:0;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
@media (max-width:900px){.grid-2,.grid-3{grid-template-columns:1fr;}}
ul.clean{list-style:none;margin:0;padding:0;}
ul.clean li{position:relative;padding:6px 0 6px 26px;color:var(--text);font-size:.94rem;}
ul.clean li::before{content:"\f105";font-family:"Font Awesome 6 Free";font-weight:900;color:var(--accent);position:absolute;left:2px;top:8px;font-size:.85rem;}
ul.clean.bad li::before{content:"\f00d";color:var(--bad);}
ul.clean.ok li::before{content:"\f00c";color:var(--ok);}
.check-btn{border:none;background:linear-gradient(90deg,var(--accent),var(--accent-2));color:#04101f;font-weight:800;padding:10px 22px;border-radius:10px;font-size:.9rem;box-shadow:0 8px 22px rgba(62,193,255,.25);cursor:pointer;}
.check-btn:hover{filter:brightness(1.08);color:#04101f;}
.sim-btn{border:1px solid var(--border);background:var(--panel-2);color:var(--text);font-weight:700;padding:8px 14px;border-radius:10px;font-size:.84rem;cursor:pointer;transition:.2s;}
.sim-btn:hover{border-color:var(--accent);color:var(--accent);}
.sim-btn.ok:hover{border-color:var(--ok);color:var(--ok);} .sim-btn.bad:hover{border-color:var(--bad);color:var(--bad);}
.nav-controls{position:fixed;bottom:18px;left:0;right:0;z-index:50;display:flex;justify-content:center;gap:14px;align-items:center;}
.nav-btn{width:46px;height:46px;border-radius:50%;border:1px solid var(--border);background:rgba(17,26,46,.9);color:var(--text);display:flex;align-items:center;justify-content:center;font-size:1.1rem;backdrop-filter:blur(6px);}
.nav-btn:hover{border-color:var(--accent);color:var(--accent);}
.nav-dots{display:flex;gap:6px;align-items:center;background:rgba(17,26,46,.9);border:1px solid var(--border);padding:8px 14px;border-radius:999px;}
.nav-dots .dot{width:7px;height:7px;border-radius:50%;background:var(--border);cursor:pointer;transition:.2s;}
.nav-dots .dot.active{background:var(--accent);width:20px;border-radius:4px;}
.footer-note{position:fixed;bottom:20px;right:22px;z-index:50;font-size:.72rem;color:var(--text-dim);font-family:'JetBrains Mono';}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}
.tac-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.tac-grid.cols4{grid-template-columns:repeat(4,1fr);}
@media (max-width:900px){.tac-grid,.tac-grid.cols4{grid-template-columns:1fr;}}
.tac-tile{background:var(--panel-2);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;text-align:center;}
.tac-tile:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 10px 24px rgba(62,193,255,.15);}
.tac-tile i{font-size:1.3rem;color:var(--accent);margin-bottom:6px;display:block;}
.tac-tile .tname{font-size:.86rem;font-weight:700;}
.tac-tile .tsub{font-size:.72rem;color:var(--text-dim);margin-top:3px;}
.example-box{background:rgba(62,193,255,.07);border:1px dashed rgba(62,193,255,.35);border-radius:12px;padding:14px 16px;margin-top:10px;font-size:.93rem;line-height:1.6;}
.example-box .ex-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:6px;}
.example-box.amber{background:rgba(255,181,71,.07);border-color:rgba(255,181,71,.4);}
.example-box.amber .ex-label{color:var(--accent-3);}
.fig-img{max-width:100%;border-radius:12px;border:1px solid var(--border);background:#fff;padding:14px;display:block;margin:0 auto;}
.fig-img.sm{max-width:520px;} .fig-img.md{max-width:680px;}
.fig-cap{text-align:center;font-size:.78rem;color:var(--text-dim);margin-top:8px;}
.compare-col{background:var(--panel-2);border:1px solid var(--border);border-radius:14px;padding:20px;}
.compare-col h4{font-weight:800;font-size:1.02rem;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.link-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.06);}
.link-row:last-child{border-bottom:none;}
.link-row a{color:var(--text);text-decoration:none;font-weight:600;}
.link-row a:hover{color:var(--accent);}
.link-row .ext{margin-left:auto;color:var(--text-dim);font-size:.75rem;}
.chain{display:flex;align-items:stretch;gap:10px;flex-wrap:wrap;}
.chain .node{flex:1;min-width:190px;background:var(--panel-2);border:1px solid var(--border);border-radius:14px;padding:16px;}
.chain .node .lvl{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:800;}
.chain .node .nm{font-size:1.1rem;font-weight:800;margin:4px 0;}
.chain .node .ex{font-size:.82rem;color:var(--text-dim);line-height:1.5;}
.chain .arrow{display:flex;align-items:center;color:var(--accent-3);font-size:1.3rem;}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:.86rem;}
.tbl th{background:var(--panel-2);color:var(--accent);text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);font-size:.76rem;text-transform:uppercase;letter-spacing:.06em;}
.tbl td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.06);vertical-align:top;line-height:1.5;}
.tbl td:first-child{font-weight:800;white-space:nowrap;}
.tbl tr:hover td{background:rgba(62,193,255,.04);}
.sim{background:#0a1020;border:1px solid var(--border);border-radius:14px;padding:16px;}
.sim .log{font-family:'JetBrains Mono',monospace;font-size:.78rem;color:var(--text-dim);min-height:90px;max-height:150px;overflow-y:auto;margin-top:10px;line-height:1.7;}
.state-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
.state-box{flex:1;min-width:110px;text-align:center;padding:12px 8px;border-radius:12px;border:1px solid var(--border);background:var(--panel-2);font-weight:800;font-size:.9rem;opacity:.45;transition:.25s;}
.state-box.on.closed{opacity:1;border-color:var(--ok);color:var(--ok);box-shadow:0 0 18px rgba(62,230,168,.25);}
.state-box.on.open{opacity:1;border-color:var(--bad);color:var(--bad);box-shadow:0 0 18px rgba(255,107,107,.25);}
.state-box.on.half{opacity:1;border-color:var(--accent-3);color:var(--accent-3);box-shadow:0 0 18px rgba(255,181,71,.25);}
.lines{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.prov{background:var(--panel-2);border:1px solid var(--border);border-radius:12px;padding:10px;text-align:center;}
.prov .pn{font-weight:800;font-size:.85rem;margin-bottom:6px;}
.prov .ln{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;}
.prov .ln span{width:20px;height:20px;border-radius:5px;background:rgba(62,230,168,.25);border:1px solid var(--ok);}
.prov .ln span.wait{background:rgba(255,107,107,.3);border-color:var(--bad);}
.prov .ln span.free{background:transparent;border-color:var(--border);}
.ev{display:flex;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:8px 12px;margin-bottom:8px;font-size:.86rem;}
.ev .n{font-family:'JetBrains Mono';color:var(--text-dim);font-size:.75rem;width:26px;}
.ev .amt{margin-left:auto;font-family:'JetBrains Mono';font-weight:800;}
.ev.dep .amt{color:var(--ok)} .ev.ret .amt{color:var(--bad)}
.ev.snap{border-color:var(--accent-3);background:rgba(255,181,71,.08);}
</style>
</head>

slidesHTML.push(`
<div class="slide-inner">

  <p class="subtitle">En vez de guardar solo el <em>estado actual</em>, se guarda la <strong>secuencia inmutable de eventos</strong> que lo produjo.</p>

      <p style="font-size:.86rem; color:var(--text-dim); line-height:1.6; margin:8px 0 0;">Solo queda el <strong style="color:var(--text)">estado final</strong>. Cada actualización pisa el valor anterior: se pierde el historial. Según el material, esto trae problemas de <strong style="color:var(--text)">rendimiento, escalabilidad y auditabilidad</strong>.</p>
    </div>
    <div class="compare-col">
      <h4><i class="fa-solid fa-list-ol" style="color:var(--ok)"></i> Event Sourcing</h4>
      <div class="ev dep"><span class="n">#1</span><span>Depósito</span><span class="amt">+100</span></div>
      <div class="ev ret"><span class="n">#2</span><span>Retiro</span><span class="amt">−30</span></div>
      <div class="ev dep"><span class="n">#3</span><span>Depósito</span><span class="amt">+50</span></div>
      <div class="ev snap"><span class="n">★</span><span>Saldo calculado reproduciendo los eventos</span><span class="amt" style="color:var(--accent-3)">= 120</span></div>
    </div>

  <div class="grid-2 mt-3" style="margin-top:16px;">

        <li>El saldo se obtiene con un <strong style="color:var(--text)">replay</strong>, desde el <strong style="color:var(--text)">último snapshot</strong> (una "foto" periódica del estado) para no recorrer todo el historial.</li>

</div>

</div>

let bhMode=null;
function bhSim(mode){
  bhMode=mode;
  const view=document.getElementById('bhView');
  const provs=['A','B','C'];
  let html='',msg='';
  if(mode==='shared'){
    // 9 líneas compartidas: B cuelga las 9
    html=`<div class="prov" style="grid-column:1/-1"><div class="pn">Pool compartido (9 líneas)</div><div class="ln">${'<span class="wait"></span>'.repeat(9)}</div></div>`;
    msg='<span style="color:#ff6b6b;"><i class="fa-solid fa-triangle-exclamation"></i> Las 9 líneas quedaron esperando a B. No se puede llamar ni a A ni a C: la falla de uno se contagió a todos.</span>';
  }else{
    html=provs.map(p=>{
      const bad=p==='B';
      return `<div class="prov"><div class="pn">Proveedor ${p}${bad?' (caído)':''}</div><div class="ln">${(bad?'<span class="wait"></span>':'<span></span>').repeat(3)}</div></div>`;
    }).join('');
    msg='<span style="color:#3ee6a8;"><i class="fa-solid fa-circle-check"></i> Solo las 3 líneas de B (rojas) se quedaron esperando. Las verdes de A y C siguen disponibles. El costo: si B no recibe llamadas, sus líneas quedan sin usar (menos eficiencia).</span>';
  }
  view.innerHTML=html;
  document.getElementById('bhMsg').innerHTML=msg;
}

let cb={state:'closed',fails:0,succ:0};
const CB_FAIL=3,CB_SUCC=2;
function cbLog(t,c){const l=document.getElementById('cbLog');if(!l)return;l.innerHTML+=`<div style="color:${c||'inherit'}">${t}</div>`;l.scrollTop=l.scrollHeight;}
function cbRender(){
  ['Closed','Open','Half'].forEach(n=>{
    const el=document.getElementById('cb'+n);
    el.classList.toggle('on',cb.state===n.toLowerCase());
  });
  document.getElementById('cbCounters').textContent=`fallas: ${cb.fails}/${CB_FAIL} · éxitos en half-open: ${cb.succ}/${CB_SUCC}`;
}
function cbCall(ok){
  if(cb.state==='open'){cbLog('→ OPEN: falla rápida, no se llamó al servicio','#ff6b6b');return;}
  if(cb.state==='closed'){
    if(ok){cb.fails=0;cbLog('→ éxito, contador de fallas en 0','#3ee6a8');}
    else{cb.fails++;cbLog(`→ falla (${cb.fails}/${CB_FAIL})`,'#ff6b6b');
      if(cb.fails>=CB_FAIL){cb.state='open';cbLog('⚡ umbral alcanzado: el circuito se ABRE','#ffb547');}}
  }else if(cb.state==='half'){
    if(ok){cb.succ++;cbLog(`→ éxito de prueba (${cb.succ}/${CB_SUCC})`,'#3ee6a8');
      if(cb.succ>=CB_SUCC){cb.state='closed';cb.fails=0;cb.succ=0;cbLog('✔ servicio recuperado: el circuito se CIERRA','#3ee6a8');}}
    else{cb.state='open';cb.succ=0;cbLog('✖ falló la prueba: vuelve a OPEN','#ff6b6b');}
  }
  cbRender();
}
function cbTimeout(){
  if(cb.state!=='open'){cbLog('(el timeout solo importa cuando está OPEN)');return;}
  cb.state='half';cb.succ=0;cbLog('⏱ venció el timeout: pasa a HALF-OPEN, se permiten llamadas de prueba','#ffb547');cbRender();
}
function cbReset(){cb={state:'closed',fails:0,succ:0};const l=document.getElementById('cbLog');if(l)l.innerHTML='';cbRender();}

const RL_MAX=5;let rlCount=0;
function rlRender(){
  const b=document.getElementById('rlBar');if(!b)return;

}
function rlLog(t,c){const l=document.getElementById('rlLog');l.innerHTML+=`<div style="color:${c}">${t}</div>`;l.scrollTop=l.scrollHeight;}
function rlSend(){
  if(rlCount<RL_MAX){rlCount++;rlLog(`200 OK · solicitud ${rlCount}/${RL_MAX}`,'#3ee6a8');}
  else rlLog('429 Too Many Requests · cuota agotada, esperar la próxima ventana','#ff6b6b');
  rlRender();
}

let idxPregunta=0,aciertos=0;
function lanzarQuiz(){idxPregunta=0;aciertos=0;mostrarPregunta();}
function mostrarPregunta(){
  if(idxPregunta>=preguntas.length){
    Swal.fire({title:'Resultado',html:`Acertaste <b>${aciertos}/${preguntas.length}</b>.`,icon:aciertos===preguntas.length?'success':'info',...SW});
    return;
  }
  const p=preguntas[idxPregunta];
  Swal.fire({
    title:p.texto,input:'radio',inputOptions:p.opciones,...SW,
    confirmButtonText:'Responder',
    inputValidator:(value)=>!value&&'Elegí una opción'
  }).then(res=>{
    if(!res.isConfirmed)return;
    const ok=res.value===p.correcta;
    if(ok)aciertos++;
    Swal.fire({
      title:ok?'¡Correcto!':'No es así',
      html:`La respuesta correcta era: <b>${p.opciones[p.correcta]}</b>`,
      icon:ok?'success':'error',...SW
    }).then(()=>{idxPregunta++;mostrarPregunta();});
  });
}

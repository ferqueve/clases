<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANDIS 2 · Unidad 5 — Microservicios</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#070b14; --bg-1:#0d1424; --panel:#111a2e; --panel-2:#16223a;
  --accent:#3ec1ff; --accent-2:#7b6bff; --accent-3:#ffb547; --ok:#3ee6a8; --bad:#ff6b6b;
  --text:#e8edf7; --text-dim:#8fa0bd; --border:#22304d;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(1200px 700px at 15% -10%, rgba(62,193,255,.10), transparent 60%),radial-gradient(1000px 700px at 110% 10%, rgba(123,107,255,.12), transparent 55%),var(--bg-0);color:var(--text);font-family:'Inter',sans-serif;overflow:hidden;}
.mono{font-family:'JetBrains Mono',monospace}
.blueprint{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.35;background-image:linear-gradient(rgba(62,193,255,.06) 1px, transparent 1px),linear-gradient(90deg, rgba(62,193,255,.06) 1px, transparent 1px);background-size:42px 42px;}
.progress-track{position:fixed;top:0;left:0;width:100%;height:4px;background:rgba(255,255,255,.06);z-index:50;}
.progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .4s ease;box-shadow:0 0 12px var(--accent);}
.hud{position:fixed;top:14px;right:18px;z-index:50;background:rgba(17,26,46,.85);border:1px solid var(--border);backdrop-filter:blur(6px);padding:7px 14px;border-radius:999px;font-size:.82rem;color:var(--text-dim);display:flex;align-items:center;gap:8px;}
.hud .unit-tag{color:var(--accent);font-weight:700}
.brand{position:fixed;top:14px;left:18px;z-index:50;font-size:.78rem;color:var(--text-dim);display:flex;align-items:center;gap:8px;letter-spacing:.03em;}
.brand i{color:var(--accent-3)}
.slides-container{position:relative;z-index:1;height:100vh;width:100vw;}
.slide{position:absolute;inset:0;display:none;padding:90px 8vw 110px 8vw;overflow-y:auto;}
.slide.active{display:block}
.slide-inner{max-width:1180px;margin:0 auto;}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);font-weight:700;margin-bottom:14px;}
h1.slide-title{font-size:clamp(1.9rem,3.4vw,3rem);font-weight:800;margin-bottom:.4rem;line-height:1.1;}
h2.slide-title{font-size:clamp(1.5rem,2.6vw,2.2rem);font-weight:800;margin-bottom:.6rem;}
.subtitle{color:var(--text-dim);font-size:1.05rem;max-width:820px;}
.card-panel{background:linear-gradient(180deg, var(--panel), var(--panel-2));border:1px solid var(--border);border-radius:16px;padding:26px 28px;box-shadow:0 12px 30px rgba(0,0,0,.35);}
.card-panel + .card-panel{margin-top:18px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:.76rem;font-weight:700;background:rgba(62,193,255,.12);color:var(--accent);border:1px solid rgba(62,193,255,.35);}
.pill.amber{background:rgba(255,181,71,.14);color:var(--accent-3);border-color:rgba(255,181,71,.4)}
.pill.ok{background:rgba(62,230,168,.12);color:var(--ok);border-color:rgba(62,230,168,.35)}
.pill.bad{background:rgba(255,107,107,.12);color:#ff6b6b;border-color:rgba(255,107,107,.35)}
.icon-tile{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:rgba(62,193,255,.12);color:var(--accent);font-size:1.3rem;border:1px solid rgba(62,193,255,.3);flex-shrink:0;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
@media (max-width:900px){.grid-2,.grid-3{grid-template-columns:1fr;}}
ul.clean{list-style:none;margin:0;padding:0;}
ul.clean li{position:relative;padding:6px 0 6px 26px;color:var(--text);font-size:.94rem;}
ul.clean li::before{content:"\f105";font-family:"Font Awesome 6 Free";font-weight:900;color:var(--accent);position:absolute;left:2px;top:8px;font-size:.85rem;}
ul.clean.bad li::before{content:"\f00d";color:var(--bad);}
ul.clean.ok li::before{content:"\f00c";color:var(--ok);}
.check-btn{border:none;background:linear-gradient(90deg,var(--accent),var(--accent-2));color:#04101f;font-weight:800;padding:10px 22px;border-radius:10px;font-size:.9rem;box-shadow:0 8px 22px rgba(62,193,255,.25);cursor:pointer;}
.check-btn:hover{filter:brightness(1.08);color:#04101f;}
.sim-btn{border:1px solid var(--border);background:var(--panel-2);color:var(--text);font-weight:700;padding:8px 14px;border-radius:10px;font-size:.84rem;cursor:pointer;transition:.2s;}
.sim-btn:hover{border-color:var(--accent);color:var(--accent);}
.sim-btn.ok:hover{border-color:var(--ok);color:var(--ok);} .sim-btn.bad:hover{border-color:var(--bad);color:var(--bad);}
.nav-controls{position:fixed;bottom:18px;left:0;right:0;z-index:50;display:flex;justify-content:center;gap:14px;align-items:center;}
.nav-btn{width:46px;height:46px;border-radius:50%;border:1px solid var(--border);background:rgba(17,26,46,.9);color:var(--text);display:flex;align-items:center;justify-content:center;font-size:1.1rem;backdrop-filter:blur(6px);}
.nav-btn:hover{border-color:var(--accent);color:var(--accent);}
.nav-dots{display:flex;gap:6px;align-items:center;background:rgba(17,26,46,.9);border:1px solid var(--border);padding:8px 14px;border-radius:999px;}
.nav-dots .dot{width:7px;height:7px;border-radius:50%;background:var(--border);cursor:pointer;transition:.2s;}
.nav-dots .dot.active{background:var(--accent);width:20px;border-radius:4px;}
.footer-note{position:fixed;bottom:20px;right:22px;z-index:50;font-size:.72rem;color:var(--text-dim);font-family:'JetBrains Mono';}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}
.tac-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.tac-grid.cols4{grid-template-columns:repeat(4,1fr);}
@media (max-width:900px){.tac-grid,.tac-grid.cols4{grid-template-columns:1fr;}}
.tac-tile{background:var(--panel-2);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;text-align:center;}
.tac-tile:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 10px 24px rgba(62,193,255,.15);}
.tac-tile i{font-size:1.3rem;color:var(--accent);margin-bottom:6px;display:block;}
.tac-tile .tname{font-size:.86rem;font-weight:700;}
.tac-tile .tsub{font-size:.72rem;color:var(--text-dim);margin-top:3px;}
.example-box{background:rgba(62,193,255,.07);border:1px dashed rgba(62,193,255,.35);border-radius:12px;padding:14px 16px;margin-top:10px;font-size:.93rem;line-height:1.6;}
.example-box .ex-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:6px;}
.example-box.amber{background:rgba(255,181,71,.07);border-color:rgba(255,181,71,.4);}
.example-box.amber .ex-label{color:var(--accent-3);}
.fig-img{max-width:100%;border-radius:12px;border:1px solid var(--border);background:#fff;padding:14px;display:block;margin:0 auto;}
.fig-img.sm{max-width:520px;} .fig-img.md{max-width:680px;}
.fig-cap{text-align:center;font-size:.78rem;color:var(--text-dim);margin-top:8px;}
.compare-col{background:var(--panel-2);border:1px solid var(--border);border-radius:14px;padding:20px;}
.compare-col h4{font-weight:800;font-size:1.02rem;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.link-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.06);}
.link-row:last-child{border-bottom:none;}
.link-row a{color:var(--text);text-decoration:none;font-weight:600;}
.link-row a:hover{color:var(--accent);}
.link-row .ext{margin-left:auto;color:var(--text-dim);font-size:.75rem;}
.chain{display:flex;align-items:stretch;gap:10px;flex-wrap:wrap;}
.chain .node{flex:1;min-width:190px;background:var(--panel-2);border:1px solid var(--border);border-radius:14px;padding:16px;}
.chain .node .lvl{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:800;}
.chain .node .nm{font-size:1.1rem;font-weight:800;margin:4px 0;}
.chain .node .ex{font-size:.82rem;color:var(--text-dim);line-height:1.5;}
.chain .arrow{display:flex;align-items:center;color:var(--accent-3);font-size:1.3rem;}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:.86rem;}
.tbl th{background:var(--panel-2);color:var(--accent);text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);font-size:.76rem;text-transform:uppercase;letter-spacing:.06em;}
.tbl td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.06);vertical-align:top;line-height:1.5;}
.tbl td:first-child{font-weight:800;white-space:nowrap;}
.tbl tr:hover td{background:rgba(62,193,255,.04);}
.sim{background:#0a1020;border:1px solid var(--border);border-radius:14px;padding:16px;}
.sim .log{font-family:'JetBrains Mono',monospace;font-size:.78rem;color:var(--text-dim);min-height:90px;max-height:150px;overflow-y:auto;margin-top:10px;line-height:1.7;}
.state-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
.state-box{flex:1;min-width:110px;text-align:center;padding:12px 8px;border-radius:12px;border:1px solid var(--border);background:var(--panel-2);font-weight:800;font-size:.9rem;opacity:.45;transition:.25s;}
.state-box.on.closed{opacity:1;border-color:var(--ok);color:var(--ok);box-shadow:0 0 18px rgba(62,230,168,.25);}
.state-box.on.open{opacity:1;border-color:var(--bad);color:var(--bad);box-shadow:0 0 18px rgba(255,107,107,.25);}
.state-box.on.half{opacity:1;border-color:var(--accent-3);color:var(--accent-3);box-shadow:0 0 18px rgba(255,181,71,.25);}
.lines{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.prov{background:var(--panel-2);border:1px solid var(--border);border-radius:12px;padding:10px;text-align:center;}
.prov .pn{font-weight:800;font-size:.85rem;margin-bottom:6px;}
.prov .ln{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;}
.prov .ln span{width:20px;height:20px;border-radius:5px;background:rgba(62,230,168,.25);border:1px solid var(--ok);}
.prov .ln span.wait{background:rgba(255,107,107,.3);border-color:var(--bad);}
.prov .ln span.free{background:transparent;border-color:var(--border);}
.ev{display:flex;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:8px 12px;margin-bottom:8px;font-size:.86rem;}
.ev .n{font-family:'JetBrains Mono';color:var(--text-dim);font-size:.75rem;width:26px;}
.ev .amt{margin-left:auto;font-family:'JetBrains Mono';font-weight:800;}
.ev.dep .amt{color:var(--ok)} .ev.ret .amt{color:var(--bad)}
.ev.snap{border-color:var(--accent-3);background:rgba(255,181,71,.08);}
.vs{display:flex;gap:14px;align-items:flex-end;justify-content:center;margin:10px 0;}
.srv{background:var(--panel-2);border:1px solid var(--accent);border-radius:8px;text-align:center;font-size:.7rem;padding:6px 10px;color:var(--accent);font-weight:700;}
.qbar{display:flex;gap:4px;flex-wrap:wrap;min-height:26px;margin-top:8px;}
.qbar span{width:20px;height:20px;border-radius:5px;background:var(--accent-3);opacity:.9;}
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0;}
.flow .bx{background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-size:.8rem;font-weight:700;text-align:center;}
.flow .bx.w{border-color:var(--bad);color:var(--bad)} .flow .bx.r{border-color:var(--ok);color:var(--ok)} .flow .bx.m{border-color:var(--accent-3);color:var(--accent-3)}
.flow .ar{color:var(--text-dim)}
.subr.hit{border-color:var(--ok);box-shadow:0 0 14px rgba(62,230,168,.3)}
.subr{background:var(--panel-2);border:1px solid var(--border);border-radius:12px;padding:10px;text-align:center;font-size:.84rem;font-weight:700;transition:.2s;}
.step{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--border);border-radius:10px;margin-bottom:6px;background:var(--panel-2);opacity:.45;transition:.25s;font-size:.84rem;line-height:1.5;}
.step.on{opacity:1;border-color:var(--accent);box-shadow:0 0 14px rgba(62,193,255,.2);}
.step .sn{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#04101f;font-weight:800;font-size:.75rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.impl{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px;}
.impl div{background:rgba(255,107,107,.12);border:1px solid var(--bad);border-radius:6px;font-size:.62rem;text-align:center;padding:4px 2px;color:var(--bad);font-weight:700;}
.impl.ok div{background:rgba(62,230,168,.12);border-color:var(--ok);color:var(--ok);}
.zone{border:1px dashed var(--border);border-radius:12px;padding:10px;text-align:center;}
.zone .zt{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);margin-bottom:6px;font-weight:800;}
pre.code{background:#0a1020;border:1px solid var(--border);border-radius:12px;padding:14px;font-family:'JetBrains Mono',monospace;font-size:.78rem;color:#cfe3ff;overflow-x:auto;margin:0;line-height:1.6;}
.inst{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin:8px 0;}
.inst div{height:26px;border-radius:6px;border:1px solid var(--border);font-size:.6rem;display:flex;align-items:center;justify-content:center;font-weight:800;}
.inst .v1{background:rgba(62,193,255,.18);border-color:var(--accent);color:var(--accent);}
.inst .v2{background:rgba(62,230,168,.2);border-color:var(--ok);color:var(--ok);}
.inst .off{background:rgba(255,107,107,.12);border-color:var(--bad);color:var(--bad);}
.inst .idle{background:transparent;border-style:dashed;color:var(--text-dim);}
.tbar{height:14px;border-radius:7px;background:var(--accent);overflow:hidden;margin-top:6px;border:1px solid var(--border);}
.tbar div{height:100%;background:var(--ok);transition:width .3s;}
.stamp{background:var(--panel-2);border:1px solid var(--border);border-radius:12px;padding:10px;}
.stamp.down{border-color:var(--bad);background:rgba(255,107,107,.08);}
.stamp .st{font-size:.72rem;font-weight:800;margin-bottom:6px;}
.chip{display:inline-block;background:rgba(62,193,255,.15);border:1px solid var(--accent);color:var(--accent);border-radius:6px;padding:2px 7px;font-size:.68rem;margin:2px;font-weight:700;}
.stamp.down .chip{background:rgba(255,107,107,.15);border-color:var(--bad);color:var(--bad);}
</style>
</head>
<body>
<div class="blueprint"></div>
<div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
<div class="brand"><i class="fa-solid fa-diagram-project"></i> ANDIS 2 · Unidad 5</div>
<div class="hud"><i class="fa-solid fa-layer-group"></i> <span class="unit-tag" id="hudCurrent">1</span>/<span id="hudTotal">0</span></div>
<div class="slides-container" id="slidesContainer"></div>
<div class="nav-controls">
  <button class="nav-btn" id="prevBtn"><i class="fa-solid fa-chevron-left"></i></button>
  <div class="nav-dots" id="navDots"></div>
  <button class="nav-btn" id="nextBtn"><i class="fa-solid fa-chevron-right"></i></button>
</div>
<div class="footer-note">← → para navegar</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.10.5/sweetalert2.all.min.js"></script>
<script>
const SW={background:'#111a2e',color:'#e8edf7',confirmButtonColor:'#3ec1ff'};
const slidesHTML=[];

const NODE=(x,y,w,h,st,nm,col,arts)=>{const d=10;const c=col||'#3ec1ff';
 return `<g><polygon points="${x},${y} ${x+d},${y-d} ${x+w+d},${y-d} ${x+w},${y}" fill="#16223a" stroke="${c}"/><polygon points="${x+w},${y} ${x+w+d},${y-d} ${x+w+d},${y+h-d} ${x+w},${y+h}" fill="#0e1729" stroke="${c}"/><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#111a2e" stroke="${c}"/><text x="${x+w/2}" y="${y+14}" text-anchor="middle" font-size="9" fill="#8fa0bd" font-style="italic">«${st}»</text><text x="${x+w/2}" y="${y+28}" text-anchor="middle" font-size="11" font-weight="700" fill="#e8edf7">${nm}</text>${(arts||[]).map((a,i)=>`<rect x="${x+8}" y="${y+36+i*20}" width="${w-16}" height="16" rx="3" fill="rgba(62,193,255,.10)" stroke="${c}" stroke-dasharray="3 2"/><text x="${x+w/2}" y="${y+48+i*20}" text-anchor="middle" font-size="9" fill="${c}">${a}</text>`).join('')}</g>`;};
const LN=(x1,y1,x2,y2,lb,c)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c||'#7b6bff'}" stroke-width="1.6"/>${lb?`<text x="${(x1+x2)/2}" y="${(y1+y2)/2-4}" text-anchor="middle" font-size="9" fill="#ffb547">${lb}</text>`:''}`;

// 0
slidesHTML.push(`
<div class="slide-inner d-flex flex-column justify-content-center" style="min-height:78vh;">
  <div class="animate__animated animate__fadeInDown">
    <span class="eyebrow"><i class="fa-solid fa-cubes"></i> Unidad 5 · Estilos de arquitectura</span>
    <h1 class="slide-title"><span style="color:var(--accent)">Microservicios</span></h1>
    <p class="subtitle">Un estilo para sistemas que cambian y se despliegan seguido: servicios pequeños, autónomos, con sus propios datos. Base teórica para el práctico UT5-TA5.</p>
    <div class="mt-3 d-flex gap-2 flex-wrap">
      <span class="pill"><i class="fa-solid fa-puzzle-piece"></i> Bounded contexts</span>
      <span class="pill"><i class="fa-solid fa-database"></i> Base por servicio</span>
      <span class="pill"><i class="fa-solid fa-rotate-left"></i> Saga</span>
      <span class="pill amber"><i class="fa-solid fa-door-open"></i> API Gateway</span>
      <span class="pill amber"><i class="fa-solid fa-eye"></i> Observabilidad</span>
      <span class="pill amber"><i class="fa-solid fa-infinity"></i> CI/CD</span>
      <span class="pill amber"><i class="fa-solid fa-server"></i> Diagrama de despliegue</span>
    </div>
  </div>
</div>
`);

// 1
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-circle-info"></i> Concepto</span>
  <h2 class="slide-title">Qué es una arquitectura de microservicios</h2>
  <div class="grid-2">
    <div>
      <div class="card-panel">
        <p style="margin:0 0 10px; line-height:1.7; font-size:.95rem;">Es un estilo que construye una aplicación como un <strong>conjunto de servicios pequeños</strong>, cada uno corriendo en su propio proceso, organizados alrededor de <strong>capacidades de negocio</strong> y que se <strong>despliegan de forma independiente</strong>.</p>
        <p style="margin:0; line-height:1.7; font-size:.95rem;">Se comunican mediante mecanismos livianos (APIs HTTP o mensajes). Cada servicio es dueño de sus datos y puede evolucionar, escalar y fallar sin arrastrar al resto.</p>
      </div>
      <div class="example-box">
        <div class="ex-label"><i class="fa-solid fa-store"></i> Analogía: una feria de puestos</div>
        Cada puesto tiene su dueño, su stock y su caja. Si un puesto cierra o cambia su menú, la feria sigue. A cambio, hace falta coordinar la entrada, la limpieza y los carteles comunes.
      </div>
    </div>
    <div class="compare-col">
      <h4><i class="fa-solid fa-scale-balanced" style="color:var(--accent)"></i> Monolito vs. microservicios</h4>
      <table class="tbl" style="font-size:.8rem;">
        <tr><th></th><th>Monolito</th><th>Microservicios</th></tr>
        <tr><td>Despliegue</td><td>Todo junto</td><td>Por servicio</td></tr>
        <tr><td>Datos</td><td>Una base compartida</td><td>Una por servicio</td></tr>
        <tr><td>Escala</td><td>Toda la aplicación</td><td>Solo lo que lo necesita</td></tr>
        <tr><td>Falla</td><td>Puede caer todo</td><td>Más acotada</td></tr>
        <tr><td>Complejidad</td><td>En el código</td><td>En la red y la operación</td></tr>
      </table>
    </div>
  </div>
</div>
`);

  <div class="grid-2">
    <div>
      <div class="card-panel">
        <p style="margin:0 0 10px; line-height:1.7; font-size:.95rem;">Un <strong>bounded context</strong> (contexto delimitado) es el límite dentro del cual un modelo y su lenguaje tienen un significado único. El mismo término puede significar cosas distintas en contextos distintos, y está bien.</p>
        <p style="margin:0; line-height:1.7; font-size:.95rem;">En microservicios, lo habitual es <strong>un servicio por bounded context</strong>: cada uno modela lo que necesita y no comparte su modelo interno con los demás.</p>
      </div>

// 6 saga

<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-rotate-left"></i> Consistencia</span>

  <div class="grid-2">
    <div>
      <div class="card-panel">
        <p style="margin:0 0 10px; line-height:1.7; font-size:.95rem;">Un caso de uso que toca varios servicios se divide en <strong>pasos locales</strong>, cada uno una transacción dentro de un servicio. Si un paso falla, se ejecutan <strong>compensaciones</strong> de los anteriores. Eso es una <strong>saga</strong>.</p>
        <p style="margin:0; line-height:1.7; font-size:.95rem;">Dos formas: <strong>coreografía</strong> (cada servicio reacciona a eventos del anterior) u <strong>orquestación</strong> (un coordinador dice qué sigue). Los pasos y las compensaciones deben ser <strong>idempotentes</strong>, porque los mensajes pueden llegar repetidos.</p>
      </div>
      <div class="example-box"><div class="ex-label"><i class="fa-solid fa-bicycle"></i> Ejemplo: alquiler de bicicletas</div>Reservar bici → cobrar → desbloquear candado. Si el cobro falla, se libera la reserva. Si el desbloqueo falla, se reembolsa y se libera.</div>

</div>
`);

/* sync vs async */
function syReset(){clearLog('syLog');addLog('syLog','Servicio de pedidos y servicio de notificaciones (caído).');}
function syRun(m){
  clearLog('syLog');
  addLog('syLog','Cliente confirma un pedido.');

  } else {

}

/* saga */
const SG=['Reservar bicicleta','Cobrar alquiler','Desbloquear candado'];
const SGC=['Liberar reserva','Reembolsar'];
function sgRun(f){
  clearLog('sgLog');
  if(f===3){
    addLog('sgLog','Llega el mensaje "Cobrar alquiler #88".','#3ec1ff');
    addLog('sgLog','✓ Cobrado y registrado como procesado (clave de idempotencia: #88).','#3ee6a8');
    addLog('sgLog','El broker reentrega el mismo mensaje (entrega "al menos una vez").','#ffb547');
    addLog('sgLog','↺ Ya estaba procesado #88: se ignora. No hay doble cobro.','#3ee6a8');return;
  }
  const fall=[null,1,2][f];
  for(let i=0;i<SG.length;i++){
    if(fall===i){addLog('sgLog',`✗ Paso ${i+1} (${SG[i]}) falla`,'#ff6b6b');
      for(let j=i-1;j>=0;j--)addLog('sgLog',`↩ Compensación: ${SGC[j]}`,'#ffb547');
      addLog('sgLog','Estado final consistente: sin cobros ni reservas colgadas.','#3ee6a8');return;}
    addLog('sgLog',`✓ Paso ${i+1}: ${SG[i]}`,'#3ee6a8');
  }
  addLog('sgLog','Saga completada.','#3ec1ff');
}

/* rate limiting */
let rl={t:5};
function rlRender(){document.getElementById('rlBar').innerHTML=Array.from({length:5},(_,i)=>`<span style="${i<rl.t?'':'opacity:.15'}"></span>`).join('');}
function rlReset(){rl={t:5};clearLog('rlLog');rlRender();addLog('rlLog','Cubeta llena: 5 tokens.');}
function rlSend(){if(rl.t>0){rl.t--;addLog('rlLog',`200 OK — quedan ${rl.t} tokens`,'#3ee6a8');}else addLog('rlLog','429 Too Many Requests — sin tokens, reintentar luego','#ff6b6b');rlRender();}
function rlTick(){rl.t=Math.min(5,rl.t+2);addLog('rlLog',`⏱ Pasó 1 s: tokens = ${rl.t}`,'#ffb547');rlRender();}

/* pipeline */
const PL=['Commit','Pruebas unitarias','Prueba de contrato','Imagen de contenedor','Despliegue canary','Producción'];
function plRender(done,fail){document.getElementById('plSteps').innerHTML=PL.map((s,i)=>`<div class="step ${i<done?'on':''}" style="${i===fail?'border-color:#ff6b6b;opacity:1;':''}"><div class="sn" style="${i===fail?'background:#ff6b6b':''}">${i+1}</div><div>${s}${i===fail?' ✗':''}</div></div>`).join('');}
function plRun(f){
  clearLog('plLog');
  const n=f<0?PL.length:f;plRender(n,f<0?-1:f);
  if(f<0)addLog('plLog','Todo pasó: la versión llega a producción sin intervención manual.','#3ee6a8');
  else addLog('plLog',`Falla en "${PL[f]}": el pipeline se detiene y la versión <b>no avanza</b>.${f===2?' La prueba de contrato detectó que el cambio rompe a un consumidor.':''}${f===4?' El canary revierte automáticamente.':''}`,'#ff6b6b');
}

  {texto:'¿En cuál de estos casos probablemente NO conviene adoptar microservicios?',
   opciones:{a:'Un producto con equipos independientes que despliegan varias veces por día',b:'Un sistema donde un módulo recibe diez veces más carga que todos los demás juntos',c:'Una aplicación simple, de un equipo pequeño, sin necesidad de escalar por partes',d:'Una plataforma con dominios de negocio bien separados y con automatización de despliegue'},correcta:'c'},
  {texto:'El broker puede entregar un mismo mensaje dos veces. ¿Qué significa que el consumidor sea idempotente?',
   opciones:{a:'Procesar dos veces el mismo mensaje da el mismo resultado que procesarlo una vez',b:'Procesar cada mensaje en un hilo distinto, para ganar velocidad frente a la cola',c:'Descartar todos los mensajes que lleguen más de una vez, sin analizarlos',d:'Guardar cada mensaje cifrado antes de procesarlo para proteger su contenido original'},correcta:'a'},
  {texto:'Dos servicios se despliegan siempre juntos y comparten una base de datos. ¿Cómo se llama esta situación?',
   opciones:{a:'Un bounded context bien definido, porque ambos comparten el mismo contexto de negocio',b:'Un patrón Strangler Fig, porque un servicio va reemplazando al otro con el tiempo',c:'Un API Gateway, porque ambos servicios reciben todas las solicitudes desde el mismo punto',d:'Un monolito distribuido: se pagan los costos de microservicios sin sus beneficios'},correcta:'d'}
];
let idxPregunta=0,aciertos=0;
function lanzarQuiz(){idxPregunta=0;aciertos=0;mostrarPregunta();}
function mostrarPregunta(){
  if(idxPregunta>=preguntas.length){
    Swal.fire({title:'Resultado',html:`Acertaste <b>${aciertos}/${preguntas.length}</b>.`,icon:aciertos===preguntas.length?'success':'info',...SW});
    return;
  }
  const p=preguntas[idxPregunta];
  Swal.fire({
    title:p.texto,input:'radio',inputOptions:p.opciones,...SW,
    confirmButtonText:'Responder',
    inputValidator:(value)=>!value&&'Elegí una opción'
  }).then(res=>{
    if(!res.isConfirmed)return;
    const ok=res.value===p.correcta;
    if(ok)aciertos++;
    Swal.fire({
      title:ok?'¡Correcto!':'No es así',
      html:`La respuesta correcta era: <b>${p.opciones[p.correcta]}</b>`,
      icon:ok?'success':'error',...SW
    }).then(()=>{idxPregunta++;mostrarPregunta();});
  });
}
</script>

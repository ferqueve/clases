<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANDIS 2 · Unidad 3 — Computación en la nube</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#070b14; --bg-1:#0d1424; --panel:#111a2e; --panel-2:#16223a;
  --accent:#3ec1ff; --accent-2:#7b6bff; --accent-3:#ffb547; --ok:#3ee6a8;
  --text:#e8edf7; --text-dim:#8fa0bd; --border:#22304d;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(1200px 700px at 15% -10%, rgba(62,193,255,.10), transparent 60%),
    radial-gradient(1000px 700px at 110% 10%, rgba(123,107,255,.12), transparent 55%),
    var(--bg-0);
  color:var(--text); font-family:'Inter',sans-serif; overflow:hidden;
}
.mono{font-family:'JetBrains Mono',monospace}
.blueprint{
  position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.35;
  background-image:linear-gradient(rgba(62,193,255,.06) 1px, transparent 1px),linear-gradient(90deg, rgba(62,193,255,.06) 1px, transparent 1px);
  background-size:42px 42px;
}
.progress-track{position:fixed; top:0; left:0; width:100%; height:4px; background:rgba(255,255,255,.06); z-index:50;}
.progress-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--accent-2)); transition:width .4s ease; box-shadow:0 0 12px var(--accent);}
.hud{position:fixed; top:14px; right:18px; z-index:50; background:rgba(17,26,46,.85); border:1px solid var(--border); backdrop-filter:blur(6px); padding:7px 14px; border-radius:999px; font-size:.82rem; color:var(--text-dim); display:flex; align-items:center; gap:8px;}
.hud .unit-tag{color:var(--accent); font-weight:700}
.brand{position:fixed; top:14px; left:18px; z-index:50; font-size:.78rem; color:var(--text-dim); display:flex; align-items:center; gap:8px; letter-spacing:.03em;}
.brand i{color:var(--accent-3)}
.slides-container{position:relative; z-index:1; height:100vh; width:100vw;}
.slide{position:absolute; inset:0; display:none; padding:90px 8vw 110px 8vw; overflow-y:auto;}
.slide.active{display:block}
.slide-inner{max-width:1180px; margin:0 auto;}
.eyebrow{display:inline-flex; align-items:center; gap:8px; font-size:.78rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent); font-weight:700; margin-bottom:14px;}
.eyebrow i{font-size:.9rem}
h1.slide-title{font-size:clamp(1.9rem,3.4vw,3rem); font-weight:800; margin-bottom:.4rem; line-height:1.1;}
h2.slide-title{font-size:clamp(1.5rem,2.6vw,2.2rem); font-weight:800; margin-bottom:.6rem;}
.subtitle{color:var(--text-dim); font-size:1.05rem; max-width:820px;}
.card-panel{background:linear-gradient(180deg, var(--panel), var(--panel-2)); border:1px solid var(--border); border-radius:16px; padding:26px 28px; box-shadow:0 12px 30px rgba(0,0,0,.35);}
.card-panel + .card-panel{margin-top:18px}
.pill{display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:999px; font-size:.76rem; font-weight:700; background:rgba(62,193,255,.12); color:var(--accent); border:1px solid rgba(62,193,255,.35);}
.pill.purple{background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)}
.pill.amber{background:rgba(255,181,71,.14); color:var(--accent-3); border-color:rgba(255,181,71,.4)}
.pill.ok{background:rgba(62,230,168,.12); color:var(--ok); border-color:rgba(62,230,168,.35)}
.pill.bad{background:rgba(255,107,107,.12); color:#ff6b6b; border-color:rgba(255,107,107,.35)}
.icon-tile{width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center; background:rgba(62,193,255,.12); color:var(--accent); font-size:1.3rem; border:1px solid rgba(62,193,255,.3); flex-shrink:0;}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
.grid-4{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
@media (max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}
ul.clean{list-style:none; margin:0; padding:0;}
ul.clean li{position:relative; padding:6px 0 6px 26px; color:var(--text); font-size:.94rem;}
ul.clean li::before{content:"\f105"; font-family:"Font Awesome 6 Free"; font-weight:900; color:var(--accent); position:absolute; left:2px; top:8px; font-size:.85rem;}
.check-btn{border:none; background:linear-gradient(90deg,var(--accent),var(--accent-2)); color:#04101f; font-weight:800; padding:10px 22px; border-radius:10px; font-size:.9rem; box-shadow:0 8px 22px rgba(62,193,255,.25); cursor:pointer;}
.check-btn:hover{filter:brightness(1.08); color:#04101f;}
.nav-controls{position:fixed; bottom:18px; left:0; right:0; z-index:50; display:flex; justify-content:center; gap:14px; align-items:center;}
.nav-btn{width:46px; height:46px; border-radius:50%; border:1px solid var(--border); background:rgba(17,26,46,.9); color:var(--text); display:flex; align-items:center; justify-content:center; font-size:1.1rem; backdrop-filter:blur(6px);}
.nav-btn:hover{border-color:var(--accent); color:var(--accent);}
.nav-dots{display:flex; gap:6px; align-items:center; background:rgba(17,26,46,.9); border:1px solid var(--border); padding:8px 14px; border-radius:999px;}
.nav-dots .dot{width:7px; height:7px; border-radius:50%; background:var(--border); cursor:pointer; transition:.2s;}
.nav-dots .dot.active{background:var(--accent); width:20px; border-radius:4px;}
.footer-note{position:fixed; bottom:20px; right:22px; z-index:50; font-size:.72rem; color:var(--text-dim); font-family:'JetBrains Mono';}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px}

.tac-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
@media (max-width:900px){.tac-grid{grid-template-columns:1fr;}}
.tac-tile{
  background:var(--panel-2); border:1px solid var(--border); border-radius:14px; padding:16px;
  cursor:pointer; transition:.2s; text-align:center;
}
.tac-tile:hover{transform:translateY(-4px); border-color:var(--accent); box-shadow:0 10px 24px rgba(62,193,255,.15);}
.tac-tile i{font-size:1.3rem; color:var(--accent); margin-bottom:6px; display:block;}
.tac-tile .tname{font-size:.86rem; font-weight:700;}

.example-box{background:rgba(62,193,255,.07); border:1px dashed rgba(62,193,255,.35); border-radius:12px; padding:14px 16px; margin-top:10px;}
.example-box .ex-label{font-size:.72rem; text-transform:uppercase; letter-spacing:.08em; color:var(--accent); font-weight:800; margin-bottom:4px; display:flex; align-items:center; gap:6px;}

.fig-img{max-width:100%; border-radius:12px; border:1px solid var(--border); background:#fff; padding:14px; display:block; margin:0 auto;}
.fig-cap{text-align:center; font-size:.78rem; color:var(--text-dim); margin-top:8px;}

.compare-col{background:var(--panel-2); border:1px solid var(--border); border-radius:14px; padding:20px;}
.compare-col h4{font-weight:800; font-size:1.02rem; margin-bottom:10px; display:flex; align-items:center; gap:8px;}

.stat-row{display:flex; gap:14px; flex-wrap:wrap;}
.stat-box{flex:1; min-width:160px; background:var(--panel-2); border:1px solid var(--border); border-radius:14px; padding:16px; text-align:center;}
.stat-box .num{font-family:'JetBrains Mono'; font-size:1.5rem; font-weight:800; color:var(--accent);}
.stat-box .lbl{font-size:.76rem; color:var(--text-dim); margin-top:4px;}
</style>
</head>

</div>

// 1. Qué es la nube
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-circle-info"></i> La definición formal</span>
  <h2 class="slide-title">¿Qué es la computación en la nube?</h2>
  <div class="card-panel">
    <p style="font-size:1.0rem; line-height:1.75; margin-bottom:0;">
      El <strong>NIST</strong> —el instituto de estándares de EE.UU.— la define como un modelo que permite acceder a recursos informáticos compartidos —redes, servidores, almacenamiento, aplicaciones y servicios— a través de <strong>Internet</strong>, de forma rápida y sencilla, sin necesidad de gestión compleja.
    </p>
  </div>
  <p class="subtitle mt-3" style="margin-top:18px;">Coloquialmente, "la nube" significa:</p>
  <ul class="clean mt-2">
    <li>Recursos de los que <strong style="color:var(--text)">otro</strong> —no vos— es responsable de comprar y mantener.</li>
    <li>Acceso a esos recursos a través de <strong style="color:var(--text)">Internet</strong>.</li>
    <li>Pagar <strong style="color:var(--text)">solo por lo que usás</strong>.</li>
    <li>Recursos <strong style="color:var(--text)">elásticos</strong>: consumir más o menos según haga falta.</li>
    <li>Poder crear y eliminar recursos <strong style="color:var(--text)">vos mismo</strong>, una vez creada la cuenta.</li>

</div>
`);

// 5. Centros de cómputo
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-warehouse"></i> Por dentro</span>
  <h2 class="slide-title">Centros de cómputo de nube pública</h2>
  <div class="stat-row">
    <div class="stat-box"><div class="num">5.000–25.000</div><div class="lbl">servidores por centro de cómputo</div></div>
    <div class="stat-box"><div class="num">40–100+ MW</div><div class="lbl">consumo eléctrico — como una ciudad de 100.000 a 300.000 habitantes</div></div>
    <div class="stat-box"><div class="num">25–50</div><div class="lbl">servidores por rack</div></div>
  </div>
  <div class="card-panel mt-3">
    <p style="margin:0; font-size:.92rem; line-height:1.7; color:var(--text-dim);">
      Los servidores están armados con <strong style="color:var(--text)">blades</strong> de cómputo —varios procesadores cada uno— y discos, organizados en <strong style="color:var(--text)">racks</strong>, conectados por switches de alta velocidad, con energía redundante —UPS y generadores—. El límite de tamaño de un centro de cómputo no es el espacio: es la energía disponible y la capacidad de disipar el calor.
    </p>
  </div>
  <div class="example-box mt-3" style="margin-top:18px;">
    <div class="ex-label"><i class="fa-solid fa-location-dot"></i> Regiones y zonas de disponibilidad</div>
    Los proveedores agrupan sus centros de cómputo en <strong>regiones</strong> —cerca geográficamente de los usuarios, respetando regulaciones como el GDPR—. Cada región tiene varias <strong>zonas de disponibilidad</strong>, separadas entre sí para que un corte de energía o un desastre natural no afecte a todas a la vez. Elegir región y zona es una decisión arquitectónica.
  </div>
</div>
`);

// 6. Fallos en la nube
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-triangle-exclamation"></i> Con tantos servidores...</span>
  <h2 class="slide-title">En la nube, algo va a fallar</h2>
  <div class="card-panel">
    <p style="font-size:1.0rem; line-height:1.75; margin-bottom:0;">
      Amazon reporta que en un centro de cómputo de unos <strong>64.000 servidores</strong>, cada uno con dos discos giratorios, fallan aproximadamente <strong>5 servidores y 17 discos por día</strong>. También pueden fallar switches, o el centro de cómputo completo. Si algo puede fallar, va a fallar — es cuestión de tiempo, no de si va a pasar.
    </p>
  </div>
  <div class="example-box mt-3" style="margin-top:18px;">
    <div class="ex-label"><i class="fa-solid fa-hourglass-half"></i> Timeouts</div>
    Un <strong>timeout</strong> no distingue una falla real de una respuesta simplemente lenta — cuando se agota el tiempo de espera, hay que asumir que hubo una falla, aunque no sepamos cuál ni dónde. Patrones como <strong>Circuit Breaker</strong> y <strong>Retry</strong> existen justamente para manejar estas fallas eventuales o intermitentes, ya que recuperarse de ellas tiene un costo.
  </div>
</div>
`);

// 7. Latencia de cola larga
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-chart-bar"></i> El promedio engaña</span>
  <h2 class="slide-title">Latencia de cola larga</h2>
  <div class="card-panel">
    <p style="font-size:1.0rem; line-height:1.75; margin-bottom:0;">
      Un pequeño porcentaje de solicitudes tarda <strong>mucho más</strong> que la mayoría — esa "cola larga" de respuestas lentas puede arruinar la experiencia de usuario, aunque la latencia <strong>promedio</strong> se vea perfectamente razonable.
    </p>
  </div>
  <img src="${IMG_LATENCIA}" class="fig-img mt-3" alt="Histograma de latencia: la mayoría de las solicitudes responden en 12 milisegundos y el promedio es de 18, pero hay una cola de solicitudes que tardan 40 milisegundos o más">
  <p class="fig-cap">Figura 2: ejemplo de latencia de cola larga — la mayoría responde en 12 ms, el promedio es 18 ms, pero hay solicitudes que tardan 40 ms o más.</p>
  <div class="example-box mt-3" style="margin-top:18px;">
    <div class="ex-label"><i class="fa-solid fa-lightbulb"></i> Un patrón para esto</div>
    <strong>Request Hedging</strong> es un patrón pensado específicamente para este problema: si una solicitud tarda demasiado, se dispara una segunda en paralelo y se usa la que responda primero.
  </div>
</div>
`);

// 8. Auto-escalado
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-arrows-up-down"></i> Pagar solo por lo que hace falta</span>
  <h2 class="slide-title">Auto-escalado (autoscaling)</h2>
  <div class="card-panel">
    <p style="font-size:1.0rem; line-height:1.75; margin-bottom:0;">
      En un centro de cómputo propio hay que dimensionar para la <strong>carga pico</strong>, y el resto del tiempo esos recursos quedan ociosos —pero se pagan igual—. En la nube, combinando elasticidad con pago por uso, el auto-escalado <strong>crea instancias nuevas</strong> cuando la carga sube y las <strong>elimina</strong> cuando baja, usando el balanceador de carga para medir latencia o capacidad disponible.
    </p>
  </div>
  <div class="example-box mt-3" style="margin-top:18px;">
    <div class="ex-label"><i class="fa-solid fa-right-from-bracket"></i> El «drenado» (draining)</div>

/* ============ MOTOR DE NAVEGACIÓN ============ */
const container = document.getElementById('slidesContainer');
slidesHTML.forEach((html, i)=>{
  const div = document.createElement('div');
  div.className = 'slide' + (i===0 ? ' active' : '');
  div.id = 'slide'+i;
  div.innerHTML = html;
  container.appendChild(div);
});

let current = 0;
const total = slidesHTML.length;
document.getElementById('hudTotal').textContent = total;

const dotsWrap = document.getElementById('navDots');
for(let i=0;i<total;i++){
  const d = document.createElement('div');
  d.className = 'dot' + (i===0?' active':'');
  d.onclick = ()=>goTo(i);
  dotsWrap.appendChild(d);
}

function updateUI(){
  document.querySelectorAll('.slide').forEach((s,i)=>{ s.classList.toggle('active', i===current); });
  document.querySelectorAll('.nav-dots .dot').forEach((d,i)=>{ d.classList.toggle('active', i===current); });
  document.getElementById('hudCurrent').textContent = current+1;
  document.getElementById('progressFill').style.width = ((current+1)/total*100)+'%';
  const active = document.getElementById('slide'+current);
  active.scrollTop = 0;
  const animTarget = active.querySelector('.slide-inner');
  if(animTarget){
    animTarget.classList.remove('animate__fadeIn');
    void animTarget.offsetWidth;
    animTarget.classList.add('animate__animated','animate__fadeIn');
  }
}
function goTo(i){ if(i<0||i>=total) return; current = i; updateUI(); }
document.getElementById('prevBtn').onclick = ()=>goTo(current-1);
document.getElementById('nextBtn').onclick = ()=>goTo(current+1);
document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight') goTo(current+1);
  if(e.key==='ArrowLeft') goTo(current-1);
});
updateUI();

/* ============ QUIZ ============ */
const preguntas = [
  {
    texto:'Una empresa necesita poder crear y eliminar servidores ella misma, en cualquier momento, sin llamar a nadie del proveedor. ¿Qué característica esencial de la nube, según el NIST, describe esto?',
    opciones:{
      a:'Pooling de recursos',
      b:'Servicio medido',
      c:'Autoservicio bajo demanda',
      d:'Amplio acceso a través de la red'
    },
    correcta:'c'
  },
  {
    texto:'Una organización necesita que ciertos datos sensibles se mantengan bajo su control total por regulación, pero quiere usar nube pública para el resto de sus cargas de trabajo. ¿Qué modelo de despliegue encaja mejor?',
    opciones:{
      a:'Nube pública únicamente',
      b:'Nube híbrida',
      c:'Nube privada únicamente',
      d:'No es posible combinar ambos enfoques'
    },
    correcta:'b'
  },
  {
    texto:'Un equipo quiere desplegar su aplicación usando los lenguajes y frameworks que ya domina, sin tener que administrar sistemas operativos ni servidores. ¿Qué modelo de servicio le conviene?',
    opciones:{
      a:'IaaS',
      b:'On-premises',
      c:'SaaS',
      d:'PaaS'
    },
    correcta:'d'
  },
  {
    texto:'Según el teórico, ¿por qué en un centro de cómputo de nube pública con decenas de miles de servidores hay que asumir que algo va a fallar?',
    opciones:{
      a:'Porque con tantos servidores y discos, aumenta la probabilidad de que algunos fallen cada día, como reporta Amazon',
      b:'Porque los proveedores de nube no invierten en redundancia de energía',
      c:'Porque los centros de cómputo de nube pública nunca tienen generadores de respaldo',
      d:'Porque todos los servidores de un centro de cómputo comparten exactamente el mismo disco físico'
    },
    correcta:'a'
  },
  {
    texto:'En un histograma de latencia, la mayoría de las solicitudes responden en 12 ms y el promedio es 18 ms, pero algunas tardan 40 ms o más. ¿Cómo se llama este fenómeno?',
    opciones:{
      a:'Pooling de recursos',
      b:'Auto-escalado',
      c:'Drenado (draining)',
      d:'Latencia de cola larga'
    },
    correcta:'d'
  },
  {
    texto:'Cuando el servicio de auto-escalado decide eliminar una instancia de máquina virtual porque ya no es necesaria, ¿qué hace primero, antes de apagarla?',
    opciones:{
      a:'La apaga inmediatamente, sin ningún paso previo',
      b:'La saca del balanceador de carga y le avisa, para que termine lo que tenía en curso —el "drenado"—',
      c:'Crea automáticamente una imagen nueva a partir de ella',
      d:'Le aumenta los recursos asignados antes de apagarla'
    },
    correcta:'b'
  }
];
let idxPregunta = 0, aciertos = 0;

function lanzarQuiz(){ idxPregunta = 0; aciertos = 0; mostrarPregunta(); }
function mostrarPregunta(){
  if(idxPregunta >= preguntas.length){
    Swal.fire({
      title:'Resultado',
      html:`Acertaste <b>${aciertos}/${preguntas.length}</b>.`,
      icon: aciertos===preguntas.length ? 'success' : 'info',
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    });
    return;
  }
  const p = preguntas[idxPregunta];
  Swal.fire({
    title: p.texto,
    input:'radio',
    inputOptions: p.opciones,
    background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff',
    confirmButtonText:'Responder',
    inputValidator: (value)=> !value && 'Elegí una opción'
  }).then(res=>{
    if(!res.isConfirmed) return;
    const ok = res.value === p.correcta;
    if(ok) aciertos++;
    Swal.fire({
      title: ok ? '¡Correcto!' : 'No es así',
      html: `La respuesta correcta era: <b>${p.opciones[p.correcta]}</b>`,
      icon: ok ? 'success' : 'error',
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    }).then(()=>{ idxPregunta++; mostrarPregunta(); });
  });
}
</script>

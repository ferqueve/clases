<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANDIS 2 · Teórico — Eficiencia energética</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#070b14; --bg-1:#0d1424; --panel:#111a2e; --panel-2:#16223a;
  --accent:#3ec1ff; --accent-2:#7b6bff; --accent-3:#ffb547; --ok:#3ee6a8;
  --text:#e8edf7; --text-dim:#8fa0bd; --border:#22304d;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(1200px 700px at 15% -10%, rgba(62,193,255,.10), transparent 60%),
    radial-gradient(1000px 700px at 110% 10%, rgba(123,107,255,.12), transparent 55%),
    var(--bg-0);
  color:var(--text); font-family:'Inter',sans-serif; overflow:hidden;
}
.mono{font-family:'JetBrains Mono',monospace}
.blueprint{
  position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.35;
  background-image:linear-gradient(rgba(62,193,255,.06) 1px, transparent 1px),linear-gradient(90deg, rgba(62,193,255,.06) 1px, transparent 1px);
  background-size:42px 42px;
}
.progress-track{position:fixed; top:0; left:0; width:100%; height:4px; background:rgba(255,255,255,.06); z-index:50;}
.progress-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--accent-2)); transition:width .4s ease; box-shadow:0 0 12px var(--accent);}
.hud{position:fixed; top:14px; right:18px; z-index:50; background:rgba(17,26,46,.85); border:1px solid var(--border); backdrop-filter:blur(6px); padding:7px 14px; border-radius:999px; font-size:.82rem; color:var(--text-dim); display:flex; align-items:center; gap:8px;}
.hud .unit-tag{color:var(--accent); font-weight:700}
.brand{position:fixed; top:14px; left:18px; z-index:50; font-size:.78rem; color:var(--text-dim); display:flex; align-items:center; gap:8px; letter-spacing:.03em;}
.brand i{color:var(--accent-3)}
.slides-container{position:relative; z-index:1; height:100vh; width:100vw;}
.slide{position:absolute; inset:0; display:none; padding:90px 8vw 110px 8vw; overflow-y:auto;}
.slide.active{display:block}
.slide-inner{max-width:1180px; margin:0 auto;}
.eyebrow{display:inline-flex; align-items:center; gap:8px; font-size:.78rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent); font-weight:700; margin-bottom:14px;}
.eyebrow i{font-size:.9rem}
h1.slide-title{font-size:clamp(1.9rem,3.4vw,3rem); font-weight:800; margin-bottom:.4rem; line-height:1.1;}
h2.slide-title{font-size:clamp(1.5rem,2.6vw,2.2rem); font-weight:800; margin-bottom:.6rem;}
.subtitle{color:var(--text-dim); font-size:1.05rem; max-width:820px;}
.card-panel{background:linear-gradient(180deg, var(--panel), var(--panel-2)); border:1px solid var(--border); border-radius:16px; padding:26px 28px; box-shadow:0 12px 30px rgba(0,0,0,.35);}
.card-panel + .card-panel{margin-top:18px}
.pill{display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:999px; font-size:.76rem; font-weight:700; background:rgba(62,193,255,.12); color:var(--accent); border:1px solid rgba(62,193,255,.35);}
.pill.purple{background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)}
.pill.amber{background:rgba(255,181,71,.14); color:var(--accent-3); border-color:rgba(255,181,71,.4)}
.pill.ok{background:rgba(62,230,168,.12); color:var(--ok); border-color:rgba(62,230,168,.35)}
.icon-tile{width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center; background:rgba(62,193,255,.12); color:var(--accent); font-size:1.3rem; border:1px solid rgba(62,193,255,.3); flex-shrink:0;}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
.grid-4{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
@media (max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}
ul.clean{list-style:none; margin:0; padding:0;}
ul.clean li{position:relative; padding:6px 0 6px 26px; color:var(--text); font-size:.94rem;}
ul.clean li::before{content:"\f105"; font-family:"Font Awesome 6 Free"; font-weight:900; color:var(--accent); position:absolute; left:2px; top:8px; font-size:.85rem;}
.check-btn{border:none; background:linear-gradient(90deg,var(--accent),var(--accent-2)); color:#04101f; font-weight:800; padding:10px 22px; border-radius:10px; font-size:.9rem; box-shadow:0 8px 22px rgba(62,193,255,.25); cursor:pointer;}
.check-btn:hover{filter:brightness(1.08); color:#04101f;}
.check-btn.ghost{background:transparent; border:1px solid var(--border); color:var(--text); box-shadow:none;}
.check-btn.ghost:hover{border-color:var(--accent); color:var(--accent);}
.nav-controls{position:fixed; bottom:18px; left:0; right:0; z-index:50; display:flex; justify-content:center; gap:14px; align-items:center;}
.nav-btn{width:46px; height:46px; border-radius:50%; border:1px solid var(--border); background:rgba(17,26,46,.9); color:var(--text); display:flex; align-items:center; justify-content:center; font-size:1.1rem; backdrop-filter:blur(6px);}
.nav-btn:hover{border-color:var(--accent); color:var(--accent);}
.nav-dots{display:flex; gap:6px; align-items:center; background:rgba(17,26,46,.9); border:1px solid var(--border); padding:8px 14px; border-radius:999px;}
.nav-dots .dot{width:7px; height:7px; border-radius:50%; background:var(--border); cursor:pointer; transition:.2s;}
.nav-dots .dot.active{background:var(--accent); width:20px; border-radius:4px;}
.footer-note{position:fixed; bottom:20px; right:22px; z-index:50; font-size:.72rem; color:var(--text-dim); font-family:'JetBrains Mono';}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px}

.sub-item{background:var(--panel-2); border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:10px;}
.sub-item .sname{font-weight:700; font-size:.94rem; color:var(--accent); margin-bottom:4px; display:flex; align-items:center; gap:8px;}
.sub-item .sdesc{font-size:.85rem; color:var(--text-dim); margin:0;}

.link-row{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid rgba(255,255,255,.06);}
.link-row:last-child{border-bottom:none;}
.link-row a{color:var(--text); text-decoration:none; font-weight:600;}
.link-row a:hover{color:var(--accent);}
.link-row .ext{margin-left:auto; color:var(--text-dim); font-size:.75rem;}

.case-card{background:var(--panel-2); border:1px solid var(--border); border-radius:14px; padding:18px; height:100%;}
.case-card .icase{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;margin-bottom:10px;}

.scenario-card{background:var(--panel-2); border:1px solid var(--border); border-radius:14px; padding:16px 18px; margin-bottom:12px;}
.scenario-card .stext{font-size:.92rem; color:var(--text); font-style:italic; margin-bottom:10px;}
.scenario-actions{display:flex; justify-content:flex-end;}
</style>
</head>
<body>

<div class="blueprint"></div>
<div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
<div class="brand"><i class="fa-solid fa-cubes"></i> ANDIS 2 · Teórico</div>
<div class="hud"><i class="fa-solid fa-layer-group"></i> <span class="unit-tag" id="hudCurrent">1</span>/<span id="hudTotal">0</span></div>

<div class="slides-container" id="slidesContainer"></div>

<div class="nav-controls">
  <button class="nav-btn" id="prevBtn"><i class="fa-solid fa-chevron-left"></i></button>
  <div class="nav-dots" id="navDots"></div>
  <button class="nav-btn" id="nextBtn"><i class="fa-solid fa-chevron-right"></i></button>
</div>
<div class="footer-note">← → para navegar</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.10.5/sweetalert2.all.min.js"></script>
<script>
const slidesHTML = [];

// 0. Portada
slidesHTML.push(`
<div class="slide-inner d-flex flex-column justify-content-center" style="min-height:78vh;">
  <div class="animate__animated animate__fadeInDown">
    <span class="eyebrow"><i class="fa-solid fa-leaf"></i> Teórico · Unidad 1</span>
    <h1 class="slide-title">Eficiencia energética</h1>
    <p class="subtitle">Cuando la batería, el datacenter o la huella de carbono también son decisiones de arquitectura — no solo de infraestructura.</p>
  </div>
</div>
`);

// 1. Contexto
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-clock-rotate-left"></i> Por qué importa ahora</span>
  <h2 class="slide-title">De preocupación ausente a atributo de calidad</h2>
  <div class="card-panel mt-3">
    <div class="d-flex gap-3">
      <div class="icon-tile"><i class="fa-solid fa-battery-full"></i></div>
      <p style="font-size:1.02rem; line-height:1.75; margin:0;">
        Hasta hace un tiempo, la energía usada por las computadoras <strong>no era una preocupación arquitectónica</strong>:
        el costo de la energía no era relevante y su disponibilidad parecía ilimitada. Hoy conviven dispositivos IoT cuyas
        baterías deben durar <strong>años</strong>, wearables que preferimos cargar cada varios días, y centros de cómputo
        que consumen tanta energía como <strong>ciudades enteras</strong>.
      </p>
    </div>
  </div>
  <div class="card-panel mt-3 d-flex gap-3 align-items-center">
    <div class="icon-tile" style="background:rgba(62,230,168,.12); color:var(--ok); border-color:rgba(62,230,168,.35)"><i class="fa-solid fa-bolt"></i></div>
    <div class="small" style="color:var(--text-dim)">El consumo de energía pasó a ser un tema a considerar, y la <strong style="color:var(--text)">eficiencia energética</strong> se sumó a la lista de atributos de calidad que la arquitectura de software debe satisfacer.</div>
  </div>
</div>
`);

// 2. Definición
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-circle-question"></i> Definición</span>
  <h2 class="slide-title">¿Qué es la eficiencia energética?</h2>
  <div class="card-panel mt-3">
    <div class="d-flex gap-3">
      <div class="icon-tile"><i class="fa-solid fa-plug-circle-check"></i></div>
      <p style="font-size:1.05rem; line-height:1.75; margin:0;">
        Es la capacidad de un sistema o componente para <strong>cumplir sus funciones utilizando la menor cantidad
        posible de energía</strong>, dentro de restricciones de tiempo, costo y calidad dados.
      </p>
    </div>
  </div>
  <div class="card-panel mt-3 d-flex gap-3 align-items-center">
    <div class="icon-tile" style="background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)"><i class="fa-solid fa-sitemap"></i></div>
    <div class="small" style="color:var(--text-dim)">ISO/IEC 25010 <strong style="color:var(--text)">no define un atributo específico</strong> para esto: la sub-característica <em>utilización de recursos</em>, dentro de eficiencia de desempeño, contempla la potencia y la energía entre los recursos considerados.</div>
  </div>
</div>
`);

// 3. Nube: sustentabilidad y costos
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-cloud"></i> En la computación en la nube</span>
  <h2 class="slide-title">Sustentabilidad y optimización de costos</h2>
  <div class="grid-2 mt-3">
    <div class="card-panel h-100">
      <div class="icon-tile mb-3"><i class="fa-brands fa-aws"></i></div>
      <h6 class="fw-bold">AWS Well-Architected Framework</h6>
      <p class="small mb-0" style="color:var(--text-dim)">La sustentabilidad es uno de sus <strong style="color:var(--text)">pilares</strong> propios.</p>
    </div>
    <div class="card-panel h-100">
      <div class="icon-tile mb-3" style="background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)"><i class="fa-brands fa-microsoft"></i></div>
      <h6 class="fw-bold">Azure Well-Architected Framework</h6>
      <p class="small mb-0" style="color:var(--text-dim)">La sustentabilidad es un <strong style="color:var(--text)">tema transversal</strong> a los distintos workloads, no un pilar independiente.</p>
    </div>
  </div>
  <div class="card-panel mt-3">
    <div class="d-flex gap-3">
      <div class="icon-tile" style="background:rgba(255,181,71,.14); color:var(--accent-3); border-color:rgba(255,181,71,.4)"><i class="fa-solid fa-triangle-exclamation"></i></div>
      <div>
        <h6 class="fw-bold mb-1">Ojo: ahorrar costo ≠ ahorrar energía</h6>
        <p class="small mb-0" style="color:var(--text-dim)">Dimensionamiento adecuado, apagado de entornos ociosos y auto-escalado suelen reducir el consumo energético. Pero no siempre: elegir una <strong style="color:var(--text)">región más barata</strong> cuya energía provenga de <strong style="color:var(--text)">fuentes fósiles</strong> ahorra dinero sin ahorrar energía limpia.</p>
      </div>
    </div>
  </div>
</div>
`);

// 4. Elementos
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-ruler"></i> Cómo se mide</span>
  <h2 class="slide-title">Elementos de la eficiencia energética</h2>
  <div class="grid-2 mt-3">
    <div class="sub-item">
      <div class="sname"><i class="fa-solid fa-microchip"></i>Consumo por unidad de procesamiento</div>
      <p class="sdesc">Energía requerida para procesar una solicitud. Se expresa en Joules o kWh por unidad de procesamiento.</p>
    </div>
    <div class="sub-item">
      <div class="sname"><i class="fa-solid fa-gauge"></i>Consumo por unidad de tiempo</div>
      <p class="sdesc">Potencia promedio consumida durante un período, en distintos modos: pico, valle, standby. Se mide en Watts.</p>
    </div>
    <div class="sub-item">
      <div class="sname"><i class="fa-solid fa-cloud-sun"></i>Huella de carbono asociada</div>
      <p class="sdesc">Estimación de emisiones de gases de efecto invernadero por unidad de procesamiento o de tiempo. Se expresa en CO₂e.</p>
    </div>
    <div class="sub-item">
      <div class="sname"><i class="fa-solid fa-chart-pie"></i>Utilización de recursos y energía</div>
      <p class="sdesc">Relación entre el recurso usado y el disponible, y cómo eso se traduce en consumo. Los recursos infrautilizados tienden a ser ineficientes.</p>
    </div>
  </div>
</div>
`);

// 5. Casos prácticos
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-briefcase"></i> Casos prácticos</span>
  <h2 class="slide-title">La eficiencia energética en el mundo real</h2>
  <div class="grid-2">
    <div class="case-card">
      <div class="icase" style="background:rgba(62,193,255,.12); color:var(--accent);"><i class="fa-solid fa-microchip"></i></div>
      <h6 class="fw-bold">Sensor IoT en una planta rural</h6>
      <p class="small mb-0" style="color:var(--text-dim)">Un sensor de humedad de suelo debe funcionar con una batería durante <strong style="color:var(--text)">años sin reemplazo</strong>. Cada transmisión de datos, cada ciclo de CPU y cada segundo con el radio encendido consume energía finita — la arquitectura debe decidir cada cuánto medir y transmitir.</p>
    </div>
    <div class="case-card">
      <div class="icase" style="background:rgba(123,107,255,.14); color:#b3a8ff;"><i class="fa-solid fa-watch"></i></div>
      <h6 class="fw-bold">Wearable de salud</h6>
      <p class="small mb-0" style="color:var(--text-dim)">Un reloj que mide frecuencia cardíaca busca que el usuario lo cargue cada varios días, no cada noche. El firmware decide qué sensores mantener activos y cuándo sincronizar con el teléfono para no vaciar la batería.</p>
    </div>
    <div class="case-card">
      <div class="icase" style="background:rgba(255,181,71,.14); color:var(--accent-3);"><i class="fa-solid fa-city"></i></div>
      <h6 class="fw-bold">Centro de cómputo a escala de ciudad</h6>
      <p class="small mb-0" style="color:var(--text-dim)">Un datacenter grande puede consumir energía comparable a la de una ciudad. Decisiones de arquitectura como auto-escalado, apagado de instancias ociosas y ubicación de las cargas de trabajo tienen impacto real y medible.</p>
    </div>
    <div class="case-card">
      <div class="icase" style="background:rgba(62,230,168,.12); color:var(--ok);"><i class="fa-solid fa-earth-americas"></i></div>
      <h6 class="fw-bold">Elegir región de nube</h6>
      <p class="small mb-0" style="color:var(--text-dim)">Dos regiones ofrecen el mismo servicio: una más barata con energía de fuentes fósiles, otra algo más cara pero con energía renovable. El costo y la eficiencia energética <strong style="color:var(--text)">no siempre van de la mano</strong>.</p>
    </div>
  </div>
</div>
`);

// 6. Tácticas
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-compass"></i> Cómo se ataca</span>
  <h2 class="slide-title">Tácticas para eficiencia energética</h2>
  <div class="card-panel mt-3">
    <p style="font-size:1rem; line-height:1.7;">
      El catalizador del escenario es el deseo de <strong>conservar o gestionar energía</strong> sin dejar de proveer
      —al menos parte de— la funcionalidad requerida, dentro de restricciones de tiempo, costo y calidad. Es esencialmente
      la <strong>utilización efectiva de recursos</strong>: monitoreo, asignación y adaptación.
    </p>
  </div>
  <div class="grid-3 mt-2">
    <div class="sub-item"><div class="sname"><i class="fa-solid fa-magnifying-glass"></i>Medición</div></div>
    <div class="sub-item"><div class="sname"><i class="fa-solid fa-layer-group"></i>Clasificación estática</div></div>
    <div class="sub-item"><div class="sname"><i class="fa-solid fa-shuffle"></i>Clasificación dinámica</div></div>
    <div class="sub-item"><div class="sname"><i class="fa-solid fa-power-off"></i>Reducción del uso</div></div>
    <div class="sub-item"><div class="sname"><i class="fa-solid fa-compass-drafting"></i>Descubrimiento</div></div>
    <div class="sub-item"><div class="sname"><i class="fa-solid fa-calendar-days"></i>Calendarización de recursos</div></div>
  </div>
  <div class="sub-item mt-0"><div class="sname"><i class="fa-solid fa-down-left-and-up-right-to-center"></i>Reducción de la demanda de recursos</div></div>
  <div class="card-panel mt-2">
    <div class="link-row">
      <i class="fa-solid fa-link" style="color:var(--accent)"></i>
      <a href="https://github.com/ucudal/ANDIS_Conceptos/blob/main/2_Tecnicas_y_herramientas/2_05_.Tacticas_arquitectura/2_05_07_Tacticas_eficiencia_energetica.md" target="_blank">Tácticas para eficiencia energética — desarrollo completo</a>
      <span class="ext">repositorio</span>
    </div>
  </div>
</div>
`);

// 7. Ejercicio: identificar la táctica
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-flask"></i> Ejercicio práctico</span>
  <h2 class="slide-title">¿Qué táctica se está aplicando?</h2>
  <p class="subtitle mb-3">Leé cada situación, escribí qué táctica creés que corresponde, y contrastá con el análisis esperado.</p>
  <div id="ejercicioWrap"></div>
</div>
`);

// 8. Patrones
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-book-open-reader"></i> Para profundizar</span>
  <h2 class="slide-title">Patrones para eficiencia energética</h2>
  <div class="card-panel mt-3">
    <span class="pill purple"><i class="fa-solid fa-shapes"></i> Patrones</span>
    <div class="link-row mt-2">
      <i class="fa-solid fa-link" style="color:var(--accent)"></i>
      <a href="https://learn.microsoft.com/en-us/azure/well-architected/cost-optimization/design-patterns" target="_blank">Cloud design patterns that support cost optimization</a>
      <span class="ext">Azure Well-Architected Framework</span>
    </div>
    <div class="link-row">
      <i class="fa-solid fa-link" style="color:var(--accent)"></i>
      <a href="https://learn.microsoft.com/en-us/azure/well-architected/sustainability/overview" target="_blank">Sustainability</a>
      <span class="ext">Azure Well-Architected Framework</span>
    </div>
  </div>
</div>
`);

// 9. Quiz
slidesHTML.push(`
<div class="slide-inner d-flex flex-column justify-content-center align-items-center text-center" style="min-height:70vh;">
  <span class="eyebrow"><i class="fa-solid fa-brain"></i> Chequeo de comprensión</span>
  <h2 class="slide-title">5 preguntas sobre eficiencia energética</h2>
  <p class="subtitle mb-4">Definición, elementos de medición, relación con ISO 25010 y tácticas.</p>
  <button class="check-btn" onclick="lanzarQuiz()"><i class="fa-solid fa-play me-2"></i>Iniciar quiz</button>
</div>
`);

// 10. Cierre
slidesHTML.push(`
<div class="slide-inner d-flex flex-column justify-content-center align-items-center text-center" style="min-height:78vh;">
  <div class="icon-tile mb-3" style="width:72px;height:72px;font-size:2rem;"><i class="fa-solid fa-check"></i></div>
  <span class="eyebrow"><i class="fa-solid fa-flag-checkered"></i> Repaso completo</span>
  <h2 class="slide-title">Eficiencia energética: costo, sustentabilidad y diseño</h2>
  <p class="subtitle mb-4" style="max-width:640px;">Cada decisión de arquitectura —dónde correr algo, cuándo, con qué recursos— también es una decisión energética. Próxima lectura: Facilidad de modificación.</p>
</div>
`);

/* ============ MOTOR DE NAVEGACIÓN ============ */
const container = document.getElementById('slidesContainer');
slidesHTML.forEach((html, i)=>{
  const div = document.createElement('div');
  div.className = 'slide' + (i===0 ? ' active' : '');
  div.id = 'slide'+i;
  div.innerHTML = html;
  container.appendChild(div);
});

let current = 0;
const total = slidesHTML.length;
document.getElementById('hudTotal').textContent = total;

const dotsWrap = document.getElementById('navDots');
for(let i=0;i<total;i++){
  const d = document.createElement('div');
  d.className = 'dot' + (i===0?' active':'');
  d.onclick = ()=>goTo(i);
  dotsWrap.appendChild(d);
}

function updateUI(){
  document.querySelectorAll('.slide').forEach((s,i)=>{ s.classList.toggle('active', i===current); });
  document.querySelectorAll('.nav-dots .dot').forEach((d,i)=>{ d.classList.toggle('active', i===current); });
  document.getElementById('hudCurrent').textContent = current+1;
  document.getElementById('progressFill').style.width = ((current+1)/total*100)+'%';
  const active = document.getElementById('slide'+current);
  active.scrollTop = 0;
  const animTarget = active.querySelector('.slide-inner');
  if(animTarget){
    animTarget.classList.remove('animate__fadeIn');
    void animTarget.offsetWidth;
    animTarget.classList.add('animate__animated','animate__fadeIn');
  }
}
function goTo(i){ if(i<0||i>=total) return; current = i; updateUI(); }
document.getElementById('prevBtn').onclick = ()=>goTo(current-1);
document.getElementById('nextBtn').onclick = ()=>goTo(current+1);
document.addEventListener('keydown', (e)=>{
  const tag = document.activeElement.tagName;
  if(tag==='TEXTAREA' || tag==='INPUT') return;
  if(e.key==='ArrowRight') goTo(current+1);
  if(e.key==='ArrowLeft') goTo(current-1);
});
updateUI();

/* ============ EJERCICIO: identificar la táctica ============ */
const escenarios = [
  {sit:'Un servicio monitorea continuamente el consumo de CPU y memoria de cada nodo del clúster para tener datos actualizados antes de tomar cualquier decisión.', tactica:'Medición', exp:'Es el primer paso de cualquier estrategia de eficiencia energética: no se puede gestionar lo que no se mide.'},
  {sit:'El sistema apaga automáticamente las instancias de cómputo que llevan 30 minutos sin recibir tráfico.', tactica:'Reducción del uso', exp:'Se reduce directamente el uso de un recurso ocioso, en lugar de mantenerlo encendido "por las dudas".'},
  {sit:'Antes de desplegar, el equipo asigna a cada servicio una categoría de criticidad energética fija, definida una única vez en el diseño.', tactica:'Clasificación estática', exp:'La categoría se define de antemano y no cambia en tiempo de ejecución — por eso es "estática".'},
  {sit:'En tiempo de ejecución, el sistema reclasifica las tareas según la disponibilidad energética actual del datacenter.', tactica:'Clasificación dinámica', exp:'A diferencia del caso anterior, acá la clasificación se recalcula mientras el sistema está corriendo.'},
  {sit:'Antes de asignar una tarea, el sistema identifica automáticamente qué servidores disponibles en ese momento son más eficientes energéticamente.', tactica:'Descubrimiento', exp:'El sistema "descubre" en tiempo real qué recursos existen y cuáles convienen antes de decidir dónde ejecutar.'},
  {sit:'Las tareas batch no urgentes se programan para ejecutarse de madrugada, cuando la energía disponible es más barata y proviene de fuentes más limpias.', tactica:'Calendarización de recursos', exp:'Se elige el momento de ejecución en función de cuándo conviene energéticamente — calendarización.'},
  {sit:'Ante una sobrecarga del sistema, se reduce la calidad del video servido para bajar el consumo de CPU en los servidores.', tactica:'Reducción de la demanda de recursos', exp:'En vez de tocar la oferta de recursos, se reduce lo que la funcionalidad exige — se degrada el servicio a propósito.'}
];
const wrap = document.getElementById('ejercicioWrap');
escenarios.forEach((e, i)=>{
  const card = document.createElement('div');
  card.className = 'scenario-card';
  card.innerHTML = `
    <p class="stext">"${e.sit}"</p>
    <div class="scenario-actions">
      <button class="check-btn ghost" onclick="verTactica(${i})"><i class="fa-solid fa-eye me-2"></i>Ver táctica</button>
    </div>`;
  wrap.appendChild(card);
});
function verTactica(i){
  const e = escenarios[i];
  Swal.fire({
    title: e.tactica,
    html: `<p style="text-align:left;">${e.exp}</p>`,
    background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
  });
}

/* ============ QUIZ ============ */
const preguntas = [
  {
    texto:'¿Qué define la eficiencia energética como atributo de calidad de una arquitectura de software?',
    opciones:{
      a:'La cantidad de servidores físicos necesarios para desplegar el sistema',
      b:'La capacidad del sistema para cumplir sus funciones usando la menor cantidad posible de energía, dentro de restricciones de tiempo, costo y calidad dadas',
      c:'El tiempo que tarda el sistema en responder a una solicitud del usuario',
      d:'La cantidad de servidores virtuales asignados a un mismo clúster'
    },
    correcta:'b'
  },
  {
    texto:'¿Cómo trata ISO/IEC 25010 a la eficiencia energética dentro de su modelo de calidad?',
    opciones:{
      a:'La excluye por completo de cualquier categoría del estándar',
      b:'La incluye implícitamente en la sub-característica utilización de recursos, dentro de eficiencia de desempeño, que contempla potencia y energía entre los recursos considerados',
      c:'La define como una categoría independiente llamada "sustentabilidad"',
      d:'La agrupa directamente dentro de la categoría de seguridad'
    },
    correcta:'b'
  },
  {
    texto:'¿Por qué elegir una región de nube más barata no siempre implica ahorrar energía?',
    opciones:{
      a:'Porque las regiones más baratas siempre tienen menor capacidad de cómputo disponible',
      b:'Porque una región más barata puede obtener su energía de fuentes fósiles menos sustentables, en lugar de fuentes renovables, aunque el costo económico sea menor',
      c:'Porque el precio de la nube no tiene ninguna relación con el consumo eléctrico real',
      d:'Porque todas las regiones consumen exactamente la misma cantidad de energía'
    },
    correcta:'b'
  },
  {
    texto:'¿Qué mide la "huella de carbono asociada" como elemento de eficiencia energética?',
    opciones:{
      a:'La cantidad de CPU utilizada durante un pico de demanda',
      b:'La estimación de las emisiones de gases de efecto invernadero asociadas al uso de la infraestructura, típicamente expresada en CO₂ equivalente',
      c:'El tiempo de respuesta promedio de un servicio en producción',
      d:'La cantidad de memoria RAM disponible en un servidor'
    },
    correcta:'b'
  },
  {
    texto:'¿En qué tres grupos se agrupan las tácticas de eficiencia energética, según el texto?',
    opciones:{
      a:'Seguridad, disponibilidad y rendimiento',
      b:'Monitoreo de recursos, asignación de recursos y adaptación de recursos — reflejando que la eficiencia energética es, esencialmente, la utilización efectiva de los recursos del sistema',
      c:'Diseño, implementación y despliegue',
      d:'Medición, facturación y auditoría'
    },
    correcta:'b'
  }
];
let idxPregunta = 0, aciertos = 0;

function lanzarQuiz(){ idxPregunta = 0; aciertos = 0; mostrarPregunta(); }
function mostrarPregunta(){
  if(idxPregunta >= preguntas.length){
    Swal.fire({
      title:'Resultado',
      html:`Acertaste <b>${aciertos}/${preguntas.length}</b>.`,
      icon: aciertos===preguntas.length ? 'success' : 'info',
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    });
    return;
  }
  const p = preguntas[idxPregunta];
  Swal.fire({
    title: p.texto,
    input:'radio',
    inputOptions: p.opciones,
    background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff',
    confirmButtonText:'Responder',
    inputValidator: (value)=> !value && 'Elegí una opción'
  }).then(res=>{
    if(!res.isConfirmed) return;
    const ok = res.value === p.correcta;
    if(ok) aciertos++;
    Swal.fire({
      title: ok ? '¡Correcto!' : 'No es así',
      html: `La respuesta correcta era: <b>${p.opciones[p.correcta]}</b>`,
      icon: ok ? 'success' : 'error',
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    }).then(()=>{ idxPregunta++; mostrarPregunta(); });
  });
}
</script>

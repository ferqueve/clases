<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANDIS 2 · Unidad 3 — File Transfer</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#070b14; --bg-1:#0d1424; --panel:#111a2e; --panel-2:#16223a;
  --accent:#3ec1ff; --accent-2:#7b6bff; --accent-3:#ffb547; --ok:#3ee6a8;
  --text:#e8edf7; --text-dim:#8fa0bd; --border:#22304d;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(1200px 700px at 15% -10%, rgba(62,193,255,.10), transparent 60%),
    radial-gradient(1000px 700px at 110% 10%, rgba(123,107,255,.12), transparent 55%),
    var(--bg-0);
  color:var(--text); font-family:'Inter',sans-serif; overflow:hidden;
}
.mono{font-family:'JetBrains Mono',monospace}
.blueprint{
  position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.35;
  background-image:linear-gradient(rgba(62,193,255,.06) 1px, transparent 1px),linear-gradient(90deg, rgba(62,193,255,.06) 1px, transparent 1px);
  background-size:42px 42px;
}
.progress-track{position:fixed; top:0; left:0; width:100%; height:4px; background:rgba(255,255,255,.06); z-index:50;}
.progress-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--accent-2)); transition:width .4s ease; box-shadow:0 0 12px var(--accent);}
.hud{position:fixed; top:14px; right:18px; z-index:50; background:rgba(17,26,46,.85); border:1px solid var(--border); backdrop-filter:blur(6px); padding:7px 14px; border-radius:999px; font-size:.82rem; color:var(--text-dim); display:flex; align-items:center; gap:8px;}
.hud .unit-tag{color:var(--accent); font-weight:700}
.brand{position:fixed; top:14px; left:18px; z-index:50; font-size:.78rem; color:var(--text-dim); display:flex; align-items:center; gap:8px; letter-spacing:.03em;}
.brand i{color:var(--accent-3)}
.slides-container{position:relative; z-index:1; height:100vh; width:100vw;}
.slide{position:absolute; inset:0; display:none; padding:90px 8vw 110px 8vw; overflow-y:auto;}
.slide.active{display:block}
.slide-inner{max-width:1180px; margin:0 auto;}
.eyebrow{display:inline-flex; align-items:center; gap:8px; font-size:.78rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent); font-weight:700; margin-bottom:14px;}
.eyebrow i{font-size:.9rem}
h1.slide-title{font-size:clamp(1.9rem,3.4vw,3rem); font-weight:800; margin-bottom:.4rem; line-height:1.1;}
h2.slide-title{font-size:clamp(1.5rem,2.6vw,2.2rem); font-weight:800; margin-bottom:.6rem;}
.subtitle{color:var(--text-dim); font-size:1.05rem; max-width:820px;}
.card-panel{background:linear-gradient(180deg, var(--panel), var(--panel-2)); border:1px solid var(--border); border-radius:16px; padding:26px 28px; box-shadow:0 12px 30px rgba(0,0,0,.35);}
.card-panel + .card-panel{margin-top:18px}
.pill{display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:999px; font-size:.76rem; font-weight:700; background:rgba(62,193,255,.12); color:var(--accent); border:1px solid rgba(62,193,255,.35);}
.pill.purple{background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)}
.pill.amber{background:rgba(255,181,71,.14); color:var(--accent-3); border-color:rgba(255,181,71,.4)}
.pill.ok{background:rgba(62,230,168,.12); color:var(--ok); border-color:rgba(62,230,168,.35)}
.pill.bad{background:rgba(255,107,107,.12); color:#ff6b6b; border-color:rgba(255,107,107,.35)}
.icon-tile{width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center; background:rgba(62,193,255,.12); color:var(--accent); font-size:1.3rem; border:1px solid rgba(62,193,255,.3); flex-shrink:0;}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
.grid-4{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
@media (max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}
ul.clean{list-style:none; margin:0; padding:0;}
ul.clean li{position:relative; padding:6px 0 6px 26px; color:var(--text); font-size:.94rem;}
ul.clean li::before{content:"\f105"; font-family:"Font Awesome 6 Free"; font-weight:900; color:var(--accent); position:absolute; left:2px; top:8px; font-size:.85rem;}
.check-btn{border:none; background:linear-gradient(90deg,var(--accent),var(--accent-2)); color:#04101f; font-weight:800; padding:10px 22px; border-radius:10px; font-size:.9rem; box-shadow:0 8px 22px rgba(62,193,255,.25); cursor:pointer;}
.check-btn:hover{filter:brightness(1.08); color:#04101f;}
.nav-controls{position:fixed; bottom:18px; left:0; right:0; z-index:50; display:flex; justify-content:center; gap:14px; align-items:center;}
.nav-btn{width:46px; height:46px; border-radius:50%; border:1px solid var(--border); background:rgba(17,26,46,.9); color:var(--text); display:flex; align-items:center; justify-content:center; font-size:1.1rem; backdrop-filter:blur(6px);}
.nav-btn:hover{border-color:var(--accent); color:var(--accent);}
.nav-dots{display:flex; gap:6px; align-items:center; background:rgba(17,26,46,.9); border:1px solid var(--border); padding:8px 14px; border-radius:999px;}
.nav-dots .dot{width:7px; height:7px; border-radius:50%; background:var(--border); cursor:pointer; transition:.2s;}
.nav-dots .dot.active{background:var(--accent); width:20px; border-radius:4px;}
.footer-note{position:fixed; bottom:20px; right:22px; z-index:50; font-size:.72rem; color:var(--text-dim); font-family:'JetBrains Mono';}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px}

.tac-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px;}
@media (max-width:900px){.tac-grid{grid-template-columns:1fr;}}
.tac-tile{
  background:var(--panel-2); border:1px solid var(--border); border-radius:14px; padding:16px;
  cursor:pointer; transition:.2s; text-align:center;
}
.tac-tile:hover{transform:translateY(-4px); border-color:var(--accent); box-shadow:0 10px 24px rgba(62,193,255,.15);}
.tac-tile i{font-size:1.3rem; color:var(--accent); margin-bottom:6px; display:block;}
.tac-tile .tname{font-size:.86rem; font-weight:700;}

.link-row{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid rgba(255,255,255,.06);}
.link-row:last-child{border-bottom:none;}
.link-row a{color:var(--text); text-decoration:none; font-weight:600;}
.link-row a:hover{color:var(--accent);}
.link-row .ext{margin-left:auto; color:var(--text-dim); font-size:.75rem;}

.fig-img{max-width:100%; border-radius:12px; border:1px solid var(--border); background:#fff; padding:14px; display:block; margin:0 auto;}
.fig-cap{text-align:center; font-size:.78rem; color:var(--text-dim); margin-top:8px;}

.step-big{display:flex; gap:20px; align-items:flex-start;}
.step-num{
  width:60px; height:60px; border-radius:16px; background:rgba(62,193,255,.12); border:1px solid rgba(62,193,255,.35);
  color:var(--accent); display:flex; align-items:center; justify-content:center; font-size:1.6rem; font-weight:800;
  font-family:'JetBrains Mono'; flex-shrink:0;
}
.compare-col{background:var(--panel-2); border:1px solid var(--border); border-radius:14px; padding:20px;}
.compare-col h4{font-weight:800; font-size:1.02rem; margin-bottom:10px; display:flex; align-items:center; gap:8px;}
.example-box{background:rgba(62,193,255,.07); border:1px dashed rgba(62,193,255,.35); border-radius:12px; padding:14px 16px; margin-top:10px;}
.example-box .ex-label{font-size:.72rem; text-transform:uppercase; letter-spacing:.08em; color:var(--accent); font-weight:800; margin-bottom:4px; display:flex; align-items:center; gap:6px;}
.flow-diagram{display:flex; align-items:center; justify-content:center; gap:12px; flex-wrap:wrap; padding:20px 10px;}
.flow-box{background:var(--panel-2); border:1px solid var(--border); border-radius:12px; padding:16px 20px; text-align:center; min-width:130px;}
.flow-box i{font-size:1.5rem; color:var(--accent); display:block; margin-bottom:8px;}
.flow-box .flabel{font-size:.85rem; font-weight:700;}
.flow-box .fsub{font-size:.72rem; color:var(--text-dim); margin-top:2px;}
.flow-arrow{color:var(--text-dim); font-size:1.4rem;}
</style>
</head>
<body>

<div class="blueprint"></div>
<div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
<div class="brand"><i class="fa-solid fa-file-arrow-up"></i> ANDIS 2 · Unidad 3</div>
<div class="hud"><i class="fa-solid fa-layer-group"></i> <span class="unit-tag" id="hudCurrent">1</span>/<span id="hudTotal">0</span></div>

<div class="slides-container" id="slidesContainer"></div>

<div class="nav-controls">
  <button class="nav-btn" id="prevBtn"><i class="fa-solid fa-chevron-left"></i></button>
  <div class="nav-dots" id="navDots"></div>
  <button class="nav-btn" id="nextBtn"><i class="fa-solid fa-chevron-right"></i></button>
</div>
<div class="footer-note">← → para navegar</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.10.5/sweetalert2.all.min.js"></script>
<script>
const slidesHTML = [];

// 0. Portada
slidesHTML.push(`
<div class="slide-inner d-flex flex-column justify-content-center" style="min-height:78vh;">
  <div class="animate__animated animate__fadeInDown">
    <span class="eyebrow"><i class="fa-solid fa-file-arrow-up"></i> Unidad 3 · Integración de aplicaciones</span>
    <h1 class="slide-title">File Transfer</h1>
    <p class="subtitle">El mecanismo de integración más simple de todos: dos aplicaciones que nunca se hablaron directamente, se entienden a través de un archivo.</p>
  </div>
</div>
`);

// 1. El problema real
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-puzzle-piece"></i> Por qué hace falta integrar</span>
  <h2 class="slide-title">El software real no es tan prolijo</h2>
  <div class="card-panel">
    <p style="font-size:1.0rem; line-height:1.75; margin-bottom:0;">
      Idealmente imaginamos el software de una organización como piezas diseñadas para funcionar de forma unificada. La realidad es otra: se compran paquetes <strong>COTS</strong> de distintos proveedores, se desarrollan aplicaciones en momentos distintos con tecnologías distintas, y distintos equipos eligen enfoques distintos. Cualquier organización —chica o grande— tiene que lidiar con compartir información entre aplicaciones que nunca se pensaron juntas.
    </p>
  </div>
  <div class="example-box mt-3" style="margin-top:18px;">
    <div class="ex-label"><i class="fa-solid fa-lightbulb"></i> Ejemplo simple</div>
    Una inmobiliaria usa un sistema de gestión de alquileres desarrollado a medida hace años, y contrató un software de contabilidad en la nube que no puede modificar. Ninguno de los dos "sabe" que el otro existe — pero el contador necesita los cobros del mes para hacer los balances.
  </div>
</div>
`);

// 2. Qué es File Transfer
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-file-arrow-up"></i> La idea</span>
  <h2 class="slide-title">¿Qué es File Transfer?</h2>
  <div class="card-panel">
    <p style="font-size:1.0rem; line-height:1.75; margin-bottom:0;">
      Cada aplicación produce <strong>archivos</strong> con la información que las demás deben consumir. Es el mecanismo <strong>más simple</strong> para integrar aplicaciones: los archivos son un formato de almacenamiento universal, soportado por cualquier sistema operativo y manejable desde cualquier lenguaje de programación.
    </p>
  </div>
  <div class="flow-diagram">
    <div class="flow-box"><i class="fa-solid fa-desktop"></i><div class="flabel">App productora</div><div class="fsub">genera el archivo</div></div>
    <div class="flow-arrow"><i class="fa-solid fa-arrow-right"></i></div>
    <div class="flow-box"><i class="fa-solid fa-file-csv"></i><div class="flabel">Archivo</div><div class="fsub">CSV / XML / JSON</div></div>
    <div class="flow-arrow"><i class="fa-solid fa-arrow-right"></i></div>
    <div class="flow-box"><i class="fa-solid fa-desktop"></i><div class="flabel">App consumidora</div><div class="fsub">lee e importa</div></div>
  </div>
  <div class="example-box">
    <div class="ex-label"><i class="fa-solid fa-lightbulb"></i> Ejemplo simple</div>
    Volviendo a la inmobiliaria: cada noche, el sistema de alquileres exporta un archivo CSV con los cobros del día. A la mañana siguiente, el software contable —sin que nadie tenga que tocar nada— lo importa automáticamente y actualiza los balances.
  </div>
</div>
`);

// 3. Decisiones de diseño
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-sliders"></i> Tres decisiones clave</span>
  <h2 class="slide-title">¿Qué hay que acordar?</h2>
  <p class="subtitle mb-3">Tocá cada decisión para ver de qué se trata.</p>
  <div class="tac-grid" id="gridDecisiones"></div>
</div>
`);

// 4. Ventajas y consecuencias
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-thumbs-up"></i> Lo bueno</span>
  <h2 class="slide-title">Ventajas y consecuencias</h2>
  <div class="grid-2">
    <div class="compare-col">
      <h4><i class="fa-solid fa-eye-slash" style="color:var(--ok)"></i> Bajo acoplamiento</h4>
      <p style="color:var(--text-dim); font-size:.88rem; line-height:1.6; margin:0;">Los desarrolladores de la app consumidora no necesitan conocer ningún detalle interno de la app que produce el archivo — solo el formato acordado.</p>
    </div>
    <div class="compare-col">
      <h4><i class="fa-solid fa-file-contract" style="color:var(--accent-3)"></i> El archivo como interfaz</h4>
      <p style="color:var(--text-dim); font-size:.88rem; line-height:1.6; margin:0;">Cuando la app productora es un COTS que no se puede negociar, el formato del archivo se convierte, de hecho, en una <strong style="color:var(--text)">interfaz pública</strong>.</p>
    </div>
  </div>
  <div class="example-box mt-3" style="margin-top:18px;">
    <div class="ex-label"><i class="fa-solid fa-lightbulb"></i> Ejemplo simple</div>
    El banco te deja descargar tus movimientos como CSV. El banco no sabe —ni le importa— si vos abrís ese archivo en Excel, en un sistema de gestión contable, o en un script propio: el formato del archivo es todo lo que necesitás saber para integrarte con él.
  </div>
</div>
`);

// 5. Desafíos
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-triangle-exclamation"></i> Lo que no es gratis</span>
  <h2 class="slide-title">El trabajo manual detrás de escena</h2>
  <div class="card-panel">
    <p style="font-size:.96rem; line-height:1.75; margin-bottom:0;">
      Es simple, pero implica coordinación manual: ponerse de acuerdo en la <strong>convención de nombres</strong> de los archivos, dónde se ubican en el medio de transferencia, <strong>bloquearlos</strong> mientras se procesan para que no se lean a medio escribir, y <strong>borrar</strong> los ya importados.
    </p>
  </div>
  <div class="example-box mt-3" style="margin-top:18px;">
    <div class="ex-label"><i class="fa-solid fa-lightbulb"></i> Ejemplo simple</div>
    Si el sistema contable intenta leer el archivo de cobros justo mientras el sistema de alquileres todavía lo está escribiendo, puede terminar importando datos a medio generar — por eso hace falta algún mecanismo de bloqueo o una convención como escribir primero a un nombre temporal y renombrar al final.
  </div>
</div>
`);

// 6. Cuándo NO usarlo
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-clock"></i> El límite del mecanismo</span>
  <h2 class="slide-title">Cuando la inmediatez importa</h2>
  <div class="card-panel">
    <p style="font-size:1.0rem; line-height:1.75; margin-bottom:0;">
      Las actualizaciones de datos demoran tanto como la <strong>frecuencia de sincronización</strong>. En muchos negocios esto no es un problema —lotes nocturnos para sincronizar lo que cambió en el día—, pero cuando se necesita que la actualización sea <strong>inmediata</strong>, File Transfer deja de ser el mecanismo adecuado: ahí entran en juego Shared Database, RPC o Messaging.
    </p>
  </div>
  <div class="example-box mt-3" style="margin-top:18px;">
    <div class="ex-label"><i class="fa-solid fa-lightbulb"></i> Ejemplo simple</div>
    Un archivo nocturno de ventas está perfecto para cerrar la contabilidad del mes. Pero si un cliente compra la última unidad de un producto, y otro cliente entra a comprarla dos minutos después, un archivo que se sincroniza una vez por día no va a evitar que se venda dos veces el mismo producto.
  </div>
</div>
`);

// 7. Quiz
slidesHTML.push(`
<div class="slide-inner d-flex flex-column justify-content-center align-items-center text-center" style="min-height:70vh;">
  <span class="eyebrow"><i class="fa-solid fa-brain"></i> Chequeo de comprensión</span>
  <h2 class="slide-title">5 preguntas sobre File Transfer</h2>
  <p class="subtitle mb-4">Qué es, cuándo conviene, qué decisiones hay que tomar y cuáles son sus límites.</p>
  <button class="check-btn" onclick="lanzarQuiz()"><i class="fa-solid fa-play me-2"></i>Iniciar quiz</button>
</div>
`);

// 8. Cierre
slidesHTML.push(`
<div class="slide-inner d-flex flex-column justify-content-center align-items-center text-center" style="min-height:78vh;">
  <div class="icon-tile mb-3" style="width:72px;height:72px;font-size:2rem;"><i class="fa-solid fa-check"></i></div>
  <span class="eyebrow"><i class="fa-solid fa-flag-checkered"></i> Repaso completo</span>
  <h2 class="slide-title">Simple, universal, pero no instantáneo</h2>
  <p class="subtitle mb-4" style="max-width:680px;">File Transfer es la puerta de entrada a la integración de aplicaciones: fácil de implementar y de entender, ideal cuando el negocio puede esperar a la próxima sincronización — pero no cuando cada segundo cuenta.</p>
</div>
`);

/* ============ MOTOR DE NAVEGACIÓN ============ */
const container = document.getElementById('slidesContainer');
slidesHTML.forEach((html, i)=>{
  const div = document.createElement('div');
  div.className = 'slide' + (i===0 ? ' active' : '');
  div.id = 'slide'+i;
  div.innerHTML = html;
  container.appendChild(div);
});

let current = 0;
const total = slidesHTML.length;
document.getElementById('hudTotal').textContent = total;

const dotsWrap = document.getElementById('navDots');
for(let i=0;i<total;i++){
  const d = document.createElement('div');
  d.className = 'dot' + (i===0?' active':'');
  d.onclick = ()=>goTo(i);
  dotsWrap.appendChild(d);
}

function updateUI(){
  document.querySelectorAll('.slide').forEach((s,i)=>{ s.classList.toggle('active', i===current); });
  document.querySelectorAll('.nav-dots .dot').forEach((d,i)=>{ d.classList.toggle('active', i===current); });
  document.getElementById('hudCurrent').textContent = current+1;
  document.getElementById('progressFill').style.width = ((current+1)/total*100)+'%';
  const active = document.getElementById('slide'+current);
  active.scrollTop = 0;
  const animTarget = active.querySelector('.slide-inner');
  if(animTarget){
    animTarget.classList.remove('animate__fadeIn');
    void animTarget.offsetWidth;
    animTarget.classList.add('animate__animated','animate__fadeIn');
  }
}
function goTo(i){ if(i<0||i>=total) return; current = i; updateUI(); }
document.getElementById('prevBtn').onclick = ()=>goTo(current-1);
document.getElementById('nextBtn').onclick = ()=>goTo(current+1);
document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight') goTo(current+1);
  if(e.key==='ArrowLeft') goTo(current-1);
});
updateUI();

/* ============ DECISIONES DE DISEÑO ============ */
const decisiones = [
  {icon:'fa-file-code', n:'Formato del archivo', d:'CSV, XML o JSON son los estándares más comunes. La elección define qué tan fácil es de leer, de validar y de mantener el archivo con el tiempo.<br><br><strong>Ejemplo simple:</strong> un archivo CSV de "un producto por línea" es fácil de generar desde una planilla de cálculo; un XML permite describir estructuras más complejas, como un pedido con varios productos anidados.'},
  {icon:'fa-clock', n:'Frecuencia de sincronización', d:'Típicamente se sincroniza con los ciclos del negocio: diariamente —de noche, con el negocio cerrado— para operaciones del día, o mensualmente para cierres de mes.<br><br><strong>Ejemplo simple:</strong> una farmacia sincroniza su stock con el proveedor una vez por semana, porque no hace pedidos con más frecuencia que esa.'},
  {icon:'fa-truck', n:'Medio de transferencia', d:'Cómo llega el archivo de una aplicación a la otra: una carpeta de red compartida, un dispositivo de almacenamiento removible, o incluso el correo electrónico.<br><br><strong>Ejemplo simple:</strong> muchas pymes todavía envían un Excel por mail al contador una vez al mes — es, literalmente, File Transfer.'}
];
const gridDecisiones = document.getElementById('gridDecisiones');
decisiones.forEach(t=>{
  const tile = document.createElement('div');
  tile.className = 'tac-tile';
  tile.innerHTML = `<i class="fa-solid ${t.icon}"></i><div class="tname">${t.n}</div>`;
  tile.onclick = ()=>{
    Swal.fire({
      title: t.n,
      html: `<div style="text-align:left; font-size:.94rem; line-height:1.6;">${t.d}</div>`,
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    });
  };
  gridDecisiones.appendChild(tile);
});

/* ============ QUIZ ============ */
const preguntas = [
  {
    texto:'¿Por qué se dice que File Transfer es el mecanismo de integración "más simple"?',
    opciones:{
      a:'Porque siempre garantiza actualizaciones inmediatas entre aplicaciones',
      b:'Porque los archivos son un formato de almacenamiento universal, soportado por cualquier sistema operativo y lenguaje',
      c:'Porque nunca requiere ponerse de acuerdo en ningún formato',
      d:'Porque elimina la necesidad de cualquier tipo de coordinación entre equipos'
    },
    correcta:'b'
  },
  {
    texto:'Una inmobiliaria exporta cada noche un CSV con los cobros del día, que el sistema contable importa a la mañana siguiente. ¿Qué limitación tiene este enfoque si un cobro necesitara reflejarse al instante?',
    opciones:{
      a:'Que los archivos CSV no pueden contener montos de dinero',
      b:'Que el sistema contable no puede leer archivos generados por otro sistema',
      c:'Que la actualización demora tanto como la frecuencia de sincronización — en este caso, hasta la próxima noche',
      d:'Que haría falta reescribir por completo el sistema de alquileres'
    },
    correcta:'c'
  },
  {
    texto:'¿Cuándo el formato de un archivo se convierte, en la práctica, en una interfaz pública?',
    opciones:{
      a:'Cuando la aplicación que produce el archivo es un paquete COTS y su formato no puede negociarse',
      b:'Solo cuando el archivo está en formato XML',
      c:'Nunca — los archivos jamás funcionan como una interfaz',
      d:'Únicamente cuando ambas aplicaciones fueron desarrolladas por el mismo equipo'
    },
    correcta:'a'
  },
  {
    texto:'¿Qué tipo de trabajo manual suele requerir la integración por transferencia de archivos?',
    opciones:{
      a:'Instalar un servidor de mensajería dedicado',
      b:'Configurar un balanceador de carga entre las aplicaciones',
      c:'Definir esquemas de bases de datos compartidos',
      d:'Acordar convenciones de nombres, bloquear archivos mientras se procesan, y borrar los ya importados'
    },
    correcta:'d'
  },
  {
    texto:'¿Cuál de estas situaciones es un ejemplo típico y razonable de uso de File Transfer?',
    opciones:{
      a:'Verificar en tiempo real si hay stock disponible antes de confirmar una compra',
      b:'Sincronizar el inventario de un supermercado cada noche mediante un archivo con las ventas del día',
      c:'Coordinar el bloqueo de un mismo registro entre dos transacciones concurrentes',
      d:'Notificar instantáneamente a tres sistemas distintos cuando se confirma un pedido'
    },
    correcta:'b'
  }
];
let idxPregunta = 0, aciertos = 0;

function lanzarQuiz(){ idxPregunta = 0; aciertos = 0; mostrarPregunta(); }
function mostrarPregunta(){
  if(idxPregunta >= preguntas.length){
    Swal.fire({
      title:'Resultado',
      html:`Acertaste <b>${aciertos}/${preguntas.length}</b>.`,
      icon: aciertos===preguntas.length ? 'success' : 'info',
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    });
    return;
  }
  const p = preguntas[idxPregunta];
  Swal.fire({
    title: p.texto,
    input:'radio',
    inputOptions: p.opciones,
    background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff',
    confirmButtonText:'Responder',
    inputValidator: (value)=> !value && 'Elegí una opción'
  }).then(res=>{
    if(!res.isConfirmed) return;
    const ok = res.value === p.correcta;
    if(ok) aciertos++;
    Swal.fire({
      title: ok ? '¡Correcto!' : 'No es así',
      html: `La respuesta correcta era: <b>${p.opciones[p.correcta]}</b>`,
      icon: ok ? 'success' : 'error',
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    }).then(()=>{ idxPregunta++; mostrarPregunta(); });
  });
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANDIS 2 · Unidad 3 — Contenedores</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#070b14; --bg-1:#0d1424; --panel:#111a2e; --panel-2:#16223a;
  --accent:#3ec1ff; --accent-2:#7b6bff; --accent-3:#ffb547; --ok:#3ee6a8;
  --text:#e8edf7; --text-dim:#8fa0bd; --border:#22304d;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(1200px 700px at 15% -10%, rgba(62,193,255,.10), transparent 60%),
    radial-gradient(1000px 700px at 110% 10%, rgba(123,107,255,.12), transparent 55%),
    var(--bg-0);
  color:var(--text); font-family:'Inter',sans-serif; overflow:hidden;
}
.mono{font-family:'JetBrains Mono',monospace}
.blueprint{
  position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.35;
  background-image:linear-gradient(rgba(62,193,255,.06) 1px, transparent 1px),linear-gradient(90deg, rgba(62,193,255,.06) 1px, transparent 1px);
  background-size:42px 42px;
}
.progress-track{position:fixed; top:0; left:0; width:100%; height:4px; background:rgba(255,255,255,.06); z-index:50;}
.progress-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--accent-2)); transition:width .4s ease; box-shadow:0 0 12px var(--accent);}
.hud{position:fixed; top:14px; right:18px; z-index:50; background:rgba(17,26,46,.85); border:1px solid var(--border); backdrop-filter:blur(6px); padding:7px 14px; border-radius:999px; font-size:.82rem; color:var(--text-dim); display:flex; align-items:center; gap:8px;}
.hud .unit-tag{color:var(--accent); font-weight:700}
.brand{position:fixed; top:14px; left:18px; z-index:50; font-size:.78rem; color:var(--text-dim); display:flex; align-items:center; gap:8px; letter-spacing:.03em;}
.brand i{color:var(--accent-3)}
.slides-container{position:relative; z-index:1; height:100vh; width:100vw;}
.slide{position:absolute; inset:0; display:none; padding:90px 8vw 110px 8vw; overflow-y:auto;}
.slide.active{display:block}
.slide-inner{max-width:1180px; margin:0 auto;}
.eyebrow{display:inline-flex; align-items:center; gap:8px; font-size:.78rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent); font-weight:700; margin-bottom:14px;}
.eyebrow i{font-size:.9rem}
h1.slide-title{font-size:clamp(1.9rem,3.4vw,3rem); font-weight:800; margin-bottom:.4rem; line-height:1.1;}
h2.slide-title{font-size:clamp(1.5rem,2.6vw,2.2rem); font-weight:800; margin-bottom:.6rem;}
.subtitle{color:var(--text-dim); font-size:1.05rem; max-width:820px;}
.card-panel{background:linear-gradient(180deg, var(--panel), var(--panel-2)); border:1px solid var(--border); border-radius:16px; padding:26px 28px; box-shadow:0 12px 30px rgba(0,0,0,.35);}
.card-panel + .card-panel{margin-top:18px}
.pill{display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:999px; font-size:.76rem; font-weight:700; background:rgba(62,193,255,.12); color:var(--accent); border:1px solid rgba(62,193,255,.35);}
.pill.purple{background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)}
.pill.amber{background:rgba(255,181,71,.14); color:var(--accent-3); border-color:rgba(255,181,71,.4)}
.pill.ok{background:rgba(62,230,168,.12); color:var(--ok); border-color:rgba(62,230,168,.35)}
.pill.bad{background:rgba(255,107,107,.12); color:#ff6b6b; border-color:rgba(255,107,107,.35)}
.icon-tile{width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center; background:rgba(62,193,255,.12); color:var(--accent); font-size:1.3rem; border:1px solid rgba(62,193,255,.3); flex-shrink:0;}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
.grid-4{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
@media (max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}
ul.clean{list-style:none; margin:0; padding:0;}
ul.clean li{position:relative; padding:6px 0 6px 26px; color:var(--text); font-size:.94rem;}
ul.clean li::before{content:"\f105"; font-family:"Font Awesome 6 Free"; font-weight:900; color:var(--accent); position:absolute; left:2px; top:8px; font-size:.85rem;}
.check-btn{border:none; background:linear-gradient(90deg,var(--accent),var(--accent-2)); color:#04101f; font-weight:800; padding:10px 22px; border-radius:10px; font-size:.9rem; box-shadow:0 8px 22px rgba(62,193,255,.25); cursor:pointer;}
.check-btn:hover{filter:brightness(1.08); color:#04101f;}
.nav-controls{position:fixed; bottom:18px; left:0; right:0; z-index:50; display:flex; justify-content:center; gap:14px; align-items:center;}
.nav-btn{width:46px; height:46px; border-radius:50%; border:1px solid var(--border); background:rgba(17,26,46,.9); color:var(--text); display:flex; align-items:center; justify-content:center; font-size:1.1rem; backdrop-filter:blur(6px);}
.nav-btn:hover{border-color:var(--accent); color:var(--accent);}
.nav-dots{display:flex; gap:6px; align-items:center; background:rgba(17,26,46,.9); border:1px solid var(--border); padding:8px 14px; border-radius:999px;}
.nav-dots .dot{width:7px; height:7px; border-radius:50%; background:var(--border); cursor:pointer; transition:.2s;}
.nav-dots .dot.active{background:var(--accent); width:20px; border-radius:4px;}
.footer-note{position:fixed; bottom:20px; right:22px; z-index:50; font-size:.72rem; color:var(--text-dim); font-family:'JetBrains Mono';}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px}

.tac-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
.tac-grid.cols4{grid-template-columns:repeat(4,1fr);}
@media (max-width:900px){.tac-grid,.tac-grid.cols4{grid-template-columns:1fr;}}
.tac-tile{
  background:var(--panel-2); border:1px solid var(--border); border-radius:14px; padding:16px;
  cursor:pointer; transition:.2s; text-align:center;
}
.tac-tile:hover{transform:translateY(-4px); border-color:var(--accent); box-shadow:0 10px 24px rgba(62,193,255,.15);}
.tac-tile i{font-size:1.3rem; color:var(--accent); margin-bottom:6px; display:block;}
.tac-tile .tname{font-size:.86rem; font-weight:700;}

.example-box{background:rgba(62,193,255,.07); border:1px dashed rgba(62,193,255,.35); border-radius:12px; padding:14px 16px; margin-top:10px;}
.example-box .ex-label{font-size:.72rem; text-transform:uppercase; letter-spacing:.08em; color:var(--accent); font-weight:800; margin-bottom:4px; display:flex; align-items:center; gap:6px;}

.fig-img{max-width:100%; border-radius:12px; border:1px solid var(--border); background:#fff; padding:14px; display:block; margin:0 auto;}
.fig-img.sm{max-width:480px;}
.fig-cap{text-align:center; font-size:.78rem; color:var(--text-dim); margin-top:8px;}

.compare-col{background:var(--panel-2); border:1px solid var(--border); border-radius:14px; padding:20px;}
.compare-col h4{font-weight:800; font-size:1.02rem; margin-bottom:10px; display:flex; align-items:center; gap:8px;}

table.vs-table{width:100%; border-collapse:collapse; font-size:.86rem;}
table.vs-table th{text-align:left; padding:9px 12px; color:var(--accent); border-bottom:2px solid var(--border); font-size:.74rem; text-transform:uppercase; letter-spacing:.05em;}
table.vs-table td{padding:10px 12px; border-bottom:1px solid rgba(255,255,255,.06); vertical-align:top; line-height:1.5;}
table.vs-table tr:last-child td{border-bottom:none;}
table.vs-table td.feat{font-weight:700; color:var(--accent-3); white-space:nowrap;}

.layer-stack{display:flex; flex-direction:column; gap:6px; max-width:520px; margin:0 auto;}
.layer{border:1px solid var(--border); border-radius:10px; padding:10px 16px; font-size:.86rem; text-align:center; font-family:'JetBrains Mono';}
.layer.l1{background:rgba(62,193,255,.1); color:var(--accent);}
.layer.l2{background:rgba(123,107,255,.1); color:#b3a8ff;}
.layer.l3{background:rgba(255,181,71,.1); color:var(--accent-3);}
.layer.l4{background:rgba(62,230,168,.1); color:var(--ok);}
</style>
</head>

// 1. Qué son
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-circle-info"></i> La idea</span>
  <h2 class="slide-title">¿Qué es un contenedor?</h2>
  <div class="card-panel">
    <p style="font-size:1.0rem; line-height:1.75; margin-bottom:0;">
      Un contenedor empaqueta y ejecuta una aplicación en un entorno <strong>aislado y liviano</strong>. Los contenedores mantienen las ventajas de la virtualización —aislamiento, varias aplicaciones conviviendo en el mismo anfitrión—, pero <strong>reduciendo el tamaño</strong> de las imágenes y el <strong>tiempo de inicio</strong> frente a una máquina virtual.
    </p>
  </div>
  <div class="example-box mt-3" style="margin-top:18px;">
    <div class="ex-label"><i class="fa-solid fa-lightbulb"></i> Lo que trae adentro</div>
    Un contenedor incluye <strong>todo lo necesario</strong> para correr la aplicación —no depende de lo que esté instalado en el anfitrión—, por eso se puede <strong>replicar</strong> con la garantía de que todas las réplicas se comportan igual: la misma imagen, en cualquier máquina con el motor adecuado, funciona del mismo modo.
  </div>
</div>
`);

// 2. Figura 1
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-diagram-project"></i> Dónde viven los contenedores</span>
  <h2 class="slide-title">Contenedores, motor de contenedores y sistema operativo</h2>
  <img src="${IMG_CONT}" class="fig-img mt-2" alt="Varios contenedores, cada uno con sus aplicaciones y servicios, corriendo bajo un motor de contenedores, sobre un kernel, sobre un hipervisor o hardware">
  <p class="fig-cap">Figura 1: contenedores en un motor de contenedores, sobre un sistema operativo, sobre un hipervisor o hardware.</p>
  <div class="card-panel mt-3">
    <p style="margin:0; font-size:.92rem; line-height:1.7; color:var(--text-dim);">
      Varios contenedores corren bajo el control de un <strong style="color:var(--text)">motor de contenedores</strong> —o container runtime engine—, que a su vez se ejecuta sobre un sistema operativo. Ese sistema operativo puede estar directamente sobre hardware —bare metal— o dentro de una máquina virtual. Así como todas las VM de un anfitrión comparten su hardware físico, <strong style="color:var(--text)">todos los contenedores comparten el mismo kernel</strong> del sistema operativo — y a través de él, el mismo hardware subyacente.
    </p>
  </div>
</div>
`);

// 3. Kernel compartido y aislamiento
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-lock"></i> Compartir sin perder aislamiento</span>
  <h2 class="slide-title">Un kernel compartido, una vista aislada</h2>
  <div class="card-panel">
    <p style="font-size:1.0rem; line-height:1.75; margin-bottom:0;">
      Como comparten el kernel del anfitrión, los contenedores están <strong>limitados por sus capacidades</strong>: un contenedor Linux necesita un kernel Linux en el anfitrión, uno Windows necesita un kernel Windows —aunque las distribuciones o versiones puedan diferir—. Pero compartir el kernel no significa acceso irrestricto: cada contenedor tiene una <strong>vista aislada</strong> —y a veces virtual— de la computadora anfitrión.
    </p>
  </div>
  <div class="example-box mt-3" style="margin-top:18px;">
    <div class="ex-label"><i class="fa-solid fa-lightbulb"></i> Ejemplo simple</div>
    Un contenedor puede "ver" el sistema de archivos del anfitrión, pero los cambios que haga ahí <strong>no son visibles</strong> para otros contenedores, y se <strong>descartan</strong> cuando el contenedor se detiene. Si necesita guardar algo de forma persistente, tiene que montar almacenamiento externo explícitamente — nada se guarda "gratis".
  </div>
</div>
`);

// 4. Imagen base y capas
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-layer-group"></i> Lo que el kernel no da</span>
  <h2 class="slide-title">Imagen base e imágenes en capas</h2>
  <div class="card-panel">
    <p style="font-size:.95rem; line-height:1.7; color:var(--text-dim); margin-bottom:0;">
      El kernel no provee todos los servicios que una aplicación necesita — el resto está en <strong style="color:var(--text)">bibliotecas</strong> que corren en modo usuario (no protegido). Por eso cada contenedor necesita su propia copia de esos archivos, empaquetados en una <strong style="color:var(--text)">imagen base</strong>: la capa fundamental sobre la que se construye el contenedor.
    </p>
  </div>
  <p class="subtitle mt-3" style="margin-top:18px;">Una imagen de contenedor se arma superponiendo capas — cada una aporta una parte:</p>
  <div class="layer-stack mt-2">
    <div class="layer l4">Capa 4 · Archivos de la aplicación Django</div>
    <div class="layer l3">Capa 3 · Entorno de ejecución de Python</div>
    <div class="layer l2">Capa 2 · Archivos de configuración</div>
    <div class="layer l1">Capa 1 · Archivos modo usuario de una distribución Linux (imagen base)</div>
  </div>
</div>
`);

/* ============ MOTOR DE NAVEGACIÓN ============ */
const container = document.getElementById('slidesContainer');
slidesHTML.forEach((html, i)=>{
  const div = document.createElement('div');
  div.className = 'slide' + (i===0 ? ' active' : '');
  div.id = 'slide'+i;
  div.innerHTML = html;
  container.appendChild(div);
});

let current = 0;
const total = slidesHTML.length;
document.getElementById('hudTotal').textContent = total;

const dotsWrap = document.getElementById('navDots');
for(let i=0;i<total;i++){
  const d = document.createElement('div');
  d.className = 'dot' + (i===0?' active':'');
  d.onclick = ()=>goTo(i);
  dotsWrap.appendChild(d);
}

function updateUI(){
  document.querySelectorAll('.slide').forEach((s,i)=>{ s.classList.toggle('active', i===current); });
  document.querySelectorAll('.nav-dots .dot').forEach((d,i)=>{ d.classList.toggle('active', i===current); });
  document.getElementById('hudCurrent').textContent = current+1;
  document.getElementById('progressFill').style.width = ((current+1)/total*100)+'%';
  const active = document.getElementById('slide'+current);
  active.scrollTop = 0;
  const animTarget = active.querySelector('.slide-inner');
  if(animTarget){
    animTarget.classList.remove('animate__fadeIn');
    void animTarget.offsetWidth;
    animTarget.classList.add('animate__animated','animate__fadeIn');
  }
}
function goTo(i){ if(i<0||i>=total) return; current = i; updateUI(); }
document.getElementById('prevBtn').onclick = ()=>goTo(current-1);
document.getElementById('nextBtn').onclick = ()=>goTo(current+1);
document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight') goTo(current+1);
  if(e.key==='ArrowLeft') goTo(current-1);
});
updateUI();

/* ============ QUIZ ============ */
const preguntas = [
  {
    texto:'Según el teórico, ¿qué problema de las máquinas virtuales buscan resolver los contenedores?',
    opciones:{
      a:'El tamaño de las imágenes y el tiempo de inicio, manteniendo las ventajas de la virtualización',
      b:'La imposibilidad de ejecutar más de una aplicación en la misma computadora',
      c:'La falta de soporte para redes virtuales',
      d:'La imposibilidad de usar más de un procesador físico'
    },
    correcta:'a'
  },
  {
    texto:'¿Qué comparten entre sí todos los contenedores que corren sobre el mismo anfitrión?',
    opciones:{
      a:'Cada uno tiene su propio kernel independiente, igual que una máquina virtual',
      b:'Solamente comparten la conexión de red, pero no el resto del sistema',
      c:'El mismo kernel del sistema operativo anfitrión',
      d:'Nada — cada contenedor es completamente independiente del anfitrión'
    },
    correcta:'c'
  },
  {
    texto:'Un contenedor modifica un archivo dentro de su sistema de archivos, pero no monta ningún almacenamiento externo. ¿Qué pasa con ese cambio cuando el contenedor se detiene?',
    opciones:{
      a:'Se sincroniza automáticamente con todos los demás contenedores',
      b:'Se descarta — no persiste, salvo que se haya montado almacenamiento persistente externo',
      c:'Se guarda permanentemente en el kernel del anfitrión',
      d:'Se convierte automáticamente en una nueva imagen base'
    },
    correcta:'b'
  },
  {
    texto:'¿Cuál de los siguientes es uno de los tres mecanismos del kernel de Linux en los que se apoyan los contenedores?',
    opciones:{
      a:'Los hipervisores de tipo 1',
      b:'El protocolo HTTP',
      c:'Las máquinas virtuales de proceso, como la JVM',
      d:'Los namespaces, que aíslan recursos del sistema para un conjunto específico de procesos'
    },
    correcta:'d'
  },
  {
    texto:'Según la tabla comparativa, ¿qué ocurre con el sistema operativo de un contenedor en comparación con el de una máquina virtual?',
    opciones:{
      a:'El contenedor ejecuta solo la parte en modo usuario del sistema operativo, sin kernel propio; la VM ejecuta un sistema operativo completo',
      b:'Ambos ejecutan exactamente el mismo sistema operativo completo, incluido el kernel',
      c:'El contenedor siempre requiere más recursos de sistema operativo que la máquina virtual',
      d:'Ninguno de los dos necesita ningún tipo de sistema operativo'
    },
    correcta:'a'
  },
  {
    texto:'¿Cuál de estos es un motor de contenedores pensado específicamente para Kubernetes, como implementación ligera del Container Runtime Interface?',
    opciones:{
      a:'Docker',
      b:'VirtualBox',
      c:'CRI-O',
      d:'Hyper-V'
    },
    correcta:'c'
  }
];
let idxPregunta = 0, aciertos = 0;

function lanzarQuiz(){ idxPregunta = 0; aciertos = 0; mostrarPregunta(); }
function mostrarPregunta(){
  if(idxPregunta >= preguntas.length){
    Swal.fire({
      title:'Resultado',
      html:`Acertaste <b>${aciertos}/${preguntas.length}</b>.`,
      icon: aciertos===preguntas.length ? 'success' : 'info',
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    });
    return;
  }
  const p = preguntas[idxPregunta];
  Swal.fire({
    title: p.texto,
    input:'radio',
    inputOptions: p.opciones,
    background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff',
    confirmButtonText:'Responder',
    inputValidator: (value)=> !value && 'Elegí una opción'
  }).then(res=>{
    if(!res.isConfirmed) return;
    const ok = res.value === p.correcta;
    if(ok) aciertos++;
    Swal.fire({
      title: ok ? '¡Correcto!' : 'No es así',
      html: `La respuesta correcta era: <b>${p.opciones[p.correcta]}</b>`,
      icon: ok ? 'success' : 'error',
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    }).then(()=>{ idxPregunta++; mostrarPregunta(); });
  });
}

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANDIS 2 · Unidad 3 — Remote Procedure Invocation</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#070b14; --bg-1:#0d1424; --panel:#111a2e; --panel-2:#16223a;
  --accent:#3ec1ff; --accent-2:#7b6bff; --accent-3:#ffb547; --ok:#3ee6a8;
  --text:#e8edf7; --text-dim:#8fa0bd; --border:#22304d;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(1200px 700px at 15% -10%, rgba(62,193,255,.10), transparent 60%),
    radial-gradient(1000px 700px at 110% 10%, rgba(123,107,255,.12), transparent 55%),
    var(--bg-0);
  color:var(--text); font-family:'Inter',sans-serif; overflow:hidden;
}
.mono{font-family:'JetBrains Mono',monospace}
.blueprint{
  position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.35;
  background-image:linear-gradient(rgba(62,193,255,.06) 1px, transparent 1px),linear-gradient(90deg, rgba(62,193,255,.06) 1px, transparent 1px);
  background-size:42px 42px;
}
.progress-track{position:fixed; top:0; left:0; width:100%; height:4px; background:rgba(255,255,255,.06); z-index:50;}
.progress-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--accent-2)); transition:width .4s ease; box-shadow:0 0 12px var(--accent);}
.hud{position:fixed; top:14px; right:18px; z-index:50; background:rgba(17,26,46,.85); border:1px solid var(--border); backdrop-filter:blur(6px); padding:7px 14px; border-radius:999px; font-size:.82rem; color:var(--text-dim); display:flex; align-items:center; gap:8px;}
.hud .unit-tag{color:var(--accent); font-weight:700}
.brand{position:fixed; top:14px; left:18px; z-index:50; font-size:.78rem; color:var(--text-dim); display:flex; align-items:center; gap:8px; letter-spacing:.03em;}
.brand i{color:var(--accent-3)}
.slides-container{position:relative; z-index:1; height:100vh; width:100vw;}
.slide{position:absolute; inset:0; display:none; padding:90px 8vw 110px 8vw; overflow-y:auto;}
.slide.active{display:block}
.slide-inner{max-width:1180px; margin:0 auto;}
.eyebrow{display:inline-flex; align-items:center; gap:8px; font-size:.78rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent); font-weight:700; margin-bottom:14px;}
.eyebrow i{font-size:.9rem}
h1.slide-title{font-size:clamp(1.9rem,3.4vw,3rem); font-weight:800; margin-bottom:.4rem; line-height:1.1;}
h2.slide-title{font-size:clamp(1.5rem,2.6vw,2.2rem); font-weight:800; margin-bottom:.6rem;}
.subtitle{color:var(--text-dim); font-size:1.05rem; max-width:820px;}
.card-panel{background:linear-gradient(180deg, var(--panel), var(--panel-2)); border:1px solid var(--border); border-radius:16px; padding:26px 28px; box-shadow:0 12px 30px rgba(0,0,0,.35);}
.card-panel + .card-panel{margin-top:18px}
.pill{display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:999px; font-size:.76rem; font-weight:700; background:rgba(62,193,255,.12); color:var(--accent); border:1px solid rgba(62,193,255,.35);}
.pill.purple{background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)}
.pill.amber{background:rgba(255,181,71,.14); color:var(--accent-3); border-color:rgba(255,181,71,.4)}
.pill.ok{background:rgba(62,230,168,.12); color:var(--ok); border-color:rgba(62,230,168,.35)}
.pill.bad{background:rgba(255,107,107,.12); color:#ff6b6b; border-color:rgba(255,107,107,.35)}
.icon-tile{width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center; background:rgba(62,193,255,.12); color:var(--accent); font-size:1.3rem; border:1px solid rgba(62,193,255,.3); flex-shrink:0;}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
.grid-4{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
@media (max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}
ul.clean{list-style:none; margin:0; padding:0;}
ul.clean li{position:relative; padding:6px 0 6px 26px; color:var(--text); font-size:.94rem;}
ul.clean li::before{content:"\f105"; font-family:"Font Awesome 6 Free"; font-weight:900; color:var(--accent); position:absolute; left:2px; top:8px; font-size:.85rem;}
.check-btn{border:none; background:linear-gradient(90deg,var(--accent),var(--accent-2)); color:#04101f; font-weight:800; padding:10px 22px; border-radius:10px; font-size:.9rem; box-shadow:0 8px 22px rgba(62,193,255,.25); cursor:pointer;}
.check-btn:hover{filter:brightness(1.08); color:#04101f;}
.nav-controls{position:fixed; bottom:18px; left:0; right:0; z-index:50; display:flex; justify-content:center; gap:14px; align-items:center;}
.nav-btn{width:46px; height:46px; border-radius:50%; border:1px solid var(--border); background:rgba(17,26,46,.9); color:var(--text); display:flex; align-items:center; justify-content:center; font-size:1.1rem; backdrop-filter:blur(6px);}
.nav-btn:hover{border-color:var(--accent); color:var(--accent);}
.nav-dots{display:flex; gap:6px; align-items:center; background:rgba(17,26,46,.9); border:1px solid var(--border); padding:8px 14px; border-radius:999px;}
.nav-dots .dot{width:7px; height:7px; border-radius:50%; background:var(--border); cursor:pointer; transition:.2s;}
.nav-dots .dot.active{background:var(--accent); width:20px; border-radius:4px;}
.footer-note{position:fixed; bottom:20px; right:22px; z-index:50; font-size:.72rem; color:var(--text-dim); font-family:'JetBrains Mono';}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px}

.tac-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px;}
@media (max-width:900px){.tac-grid{grid-template-columns:1fr;}}
.tac-tile{
  background:var(--panel-2); border:1px solid var(--border); border-radius:14px; padding:16px;
  cursor:pointer; transition:.2s; text-align:center;
}
.tac-tile:hover{transform:translateY(-4px); border-color:var(--accent); box-shadow:0 10px 24px rgba(62,193,255,.15);}
.tac-tile i{font-size:1.3rem; color:var(--accent); margin-bottom:6px; display:block;}
.tac-tile .tname{font-size:.86rem; font-weight:700;}

.link-row{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid rgba(255,255,255,.06);}
.link-row:last-child{border-bottom:none;}
.link-row a{color:var(--text); text-decoration:none; font-weight:600;}
.link-row a:hover{color:var(--accent);}
.link-row .ext{margin-left:auto; color:var(--text-dim); font-size:.75rem;}

.fig-img{max-width:100%; border-radius:12px; border:1px solid var(--border); background:#fff; padding:14px; display:block; margin:0 auto;}
.fig-cap{text-align:center; font-size:.78rem; color:var(--text-dim); margin-top:8px;}

.step-big{display:flex; gap:20px; align-items:flex-start;}
.step-num{
  width:60px; height:60px; border-radius:16px; background:rgba(62,193,255,.12); border:1px solid rgba(62,193,255,.35);
  color:var(--accent); display:flex; align-items:center; justify-content:center; font-size:1.6rem; font-weight:800;
  font-family:'JetBrains Mono'; flex-shrink:0;
}
.compare-col{background:var(--panel-2); border:1px solid var(--border); border-radius:14px; padding:20px;}
.compare-col h4{font-weight:800; font-size:1.02rem; margin-bottom:10px; display:flex; align-items:center; gap:8px;}
.example-box{background:rgba(62,193,255,.07); border:1px dashed rgba(62,193,255,.35); border-radius:12px; padding:14px 16px; margin-top:10px;}
.example-box .ex-label{font-size:.72rem; text-transform:uppercase; letter-spacing:.08em; color:var(--accent); font-weight:800; margin-bottom:4px; display:flex; align-items:center; gap:6px;}
</style>
</head>

// 1. Lo que File Transfer y Shared Database no resuelven
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-arrow-right-arrow-left"></i> Compartir datos no es suficiente</span>
  <h2 class="slide-title">El límite de los mecanismos anteriores</h2>
  <div class="card-panel">
    <p style="font-size:1.0rem; line-height:1.75; margin-bottom:0;">
      File Transfer y Shared Database permiten compartir <strong>datos</strong> entre aplicaciones, pero compartir datos no es suficiente para integrar aplicaciones: Shared Database <strong>rompe el encapsulamiento</strong> —cualquiera puede leer y escribir cualquier tabla—, y aunque File Transfer no lo rompe, sus actualizaciones <strong>no son inmediatas</strong>.
    </p>
  </div>
  <div class="example-box mt-3" style="margin-top:18px;">
    <div class="ex-label"><i class="fa-solid fa-lightbulb"></i> Ejemplo simple</div>
    Volviendo al hospital: si facturación necesita "cancelar un turno" —no solo leer o escribir un dato suelto—, meterse directo en la tabla de turnos de otra aplicación es frágil y riesgoso. Lo que hace falta es pedirle a la aplicación de turnos que haga esa cancelación ella misma, con su propia lógica.
  </div>
</div>
`);

// 2. Qué es RPI
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-tower-broadcast"></i> La idea</span>
  <h2 class="slide-title">¿Qué es Remote Procedure Invocation?</h2>
  <div class="card-panel">
    <p style="font-size:1.0rem; line-height:1.75; margin-bottom:0;">
      Es un mecanismo para que una aplicación <strong>invoque una función en otra aplicación</strong>, pasándole los datos que hace falta compartir, e indicándole cómo procesarlos. Cada aplicación se diseña como un <strong>componente a gran escala</strong> con sus datos encapsulados, y expone una <strong>interfaz</strong> para que otras la invoquen.
    </p>
  </div>
  <img src="${IMG_RPI}" class="fig-img mt-3" alt="Integración de aplicaciones mediante invocación a procedimiento remoto: Aplicación A llama a través de un Stub, que envía la función a un Skeleton en Aplicación B, que devuelve el resultado">
  <p class="fig-cap">Figura 1: integración de aplicaciones mediante invocación a procedimiento remoto.</p>
  <div class="card-panel mt-3">
    <p style="margin:0; font-size:.92rem; line-height:1.7; color:var(--text-dim);">
      La aplicación A llama a una función a través de un <strong style="color:var(--text)">Stub</strong> —un "doble" local de la función remota—, que empaqueta la llamada y la envía por red hasta un <strong style="color:var(--text)">Skeleton</strong> del lado de la aplicación B, que la ejecuta de verdad y devuelve el resultado por el mismo camino. Para quien programa, se siente igual que llamar a una función local. En otros contextos a este mecanismo se lo llama simplemente <strong style="color:var(--text)">RPC</strong>.
    </p>
  </div>
</div>
`);

// 3. Encapsulamiento
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-lock"></i> La gran ventaja</span>
  <h2 class="slide-title">Encapsulamiento preservado</h2>
  <div class="card-panel">
    <p style="font-size:1.0rem; line-height:1.75; margin-bottom:0;">
      A diferencia de Shared Database, RPI usa <strong>encapsulamiento</strong> para integrar: cada aplicación mantiene el control sobre sus propios datos, y las demás solo acceden o los modifican a través de <strong>llamadas remotas</strong>. Esto preserva la integridad de los datos y permite que cada aplicación cambie su estructura interna sin romper a las demás.
    </p>
  </div>
  <div class="example-box mt-3" style="margin-top:18px;">
    <div class="ex-label"><i class="fa-solid fa-lightbulb"></i> Ejemplo simple</div>
    Con RPI, facturación no toca la tabla de turnos: llama a una función <span class="mono">CancelarTurno(id)</span> expuesta por la aplicación de turnos. Si mañana el equipo de turnos decide cambiar completamente cómo guarda sus datos internamente, a facturación no le importa — la interfaz sigue siendo la misma.
  </div>
</div>
`);

// 4. El problema: la ilusión de transparencia
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-triangle-exclamation"></i> El riesgo escondido</span>
  <h2 class="slide-title">Simple de usar, fácil de subestimar</h2>
  <div class="card-panel">
    <p style="font-size:1.0rem; line-height:1.75; margin-bottom:0;">
      RPI es simple para los desarrolladores que ya están acostumbrados a llamar procedimientos, y las tecnologías que lo implementan hacen su uso bastante <strong>transparente</strong>. Pero eso <strong>no es una ventaja, es un problema</strong>: hay enormes diferencias de desempeño y confiabilidad entre una invocación local y una remota. Ignorar esa diferencia lleva a sistemas <strong>lentos y poco confiables</strong>.
    </p>
  </div>
  <div class="example-box mt-3" style="margin-top:18px;">
    <div class="ex-label"><i class="fa-solid fa-lightbulb"></i> Ejemplo simple</div>
    Una llamada local tarda microsegundos y prácticamente nunca falla. Una llamada remota a otro servidor puede tardar cientos de milisegundos, o directamente no responder porque la red se cortó o el otro servidor está caído. Si un desarrollador escribe el código como si ambas fueran iguales —sin manejar timeouts ni reintentos— el sistema se vuelve lento e impredecible en producción.
  </div>
</div>
`);

slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-scale-balanced"></i> Poniendo todo junto</span>
  <h2 class="slide-title">RPI frente a los mecanismos anteriores</h2>
  <div class="grid-2">
    <div class="compare-col">

      <p style="color:var(--text-dim); font-size:.88rem; line-height:1.6; margin:0;">RPI preserva el <strong style="color:var(--text)">encapsulamiento</strong> —nadie mete la mano en los datos de otra aplicación—; Shared Database lo rompe, pero es más simple para compartir datos "en bruto".</p>
    </div>
    <div class="compare-col">
      <h4><i class="fa-solid fa-file-arrow-up" style="color:var(--accent)"></i> vs. File Transfer</h4>
      <p style="color:var(--text-dim); font-size:.88rem; line-height:1.6; margin:0;">RPI es <strong style="color:var(--text)">inmediato</strong> y permite invocar comportamiento, no solo datos; File Transfer es más simple y desacoplado, pero sus actualizaciones tardan lo que tarda la sincronización.</p>
    </div>
  </div>
  <div class="card-panel mt-3 d-flex gap-3 align-items-center">

    <div class="small" style="color:var(--text-dim)">Cuando lo que hace falta es integrar <strong style="color:var(--text)">funcionalidad</strong> —no solo datos— y se puede tolerar el acoplamiento temporal de una llamada síncrona, RPI es la herramienta indicada.</div>
  </div>
</div>
`);

  <h2 class="slide-title">Se siente local, pero nunca lo es</h2>
  <p class="subtitle mb-4" style="max-width:680px;">RPI integra funcionalidad preservando el encapsulamiento — pero su mayor virtud, hacer que lo remoto se sienta local, es también su mayor trampa. Tratar una llamada remota como si fuera local es la forma más común de terminar con un sistema lento y poco confiable.</p>
</div>
`);

/* ============ MOTOR DE NAVEGACIÓN ============ */
const container = document.getElementById('slidesContainer');
slidesHTML.forEach((html, i)=>{
  const div = document.createElement('div');
  div.className = 'slide' + (i===0 ? ' active' : '');
  div.id = 'slide'+i;
  div.innerHTML = html;
  container.appendChild(div);
});

let current = 0;
const total = slidesHTML.length;
document.getElementById('hudTotal').textContent = total;

const dotsWrap = document.getElementById('navDots');
for(let i=0;i<total;i++){
  const d = document.createElement('div');
  d.className = 'dot' + (i===0?' active':'');
  d.onclick = ()=>goTo(i);
  dotsWrap.appendChild(d);
}

function updateUI(){
  document.querySelectorAll('.slide').forEach((s,i)=>{ s.classList.toggle('active', i===current); });
  document.querySelectorAll('.nav-dots .dot').forEach((d,i)=>{ d.classList.toggle('active', i===current); });
  document.getElementById('hudCurrent').textContent = current+1;
  document.getElementById('progressFill').style.width = ((current+1)/total*100)+'%';
  const active = document.getElementById('slide'+current);
  active.scrollTop = 0;
  const animTarget = active.querySelector('.slide-inner');
  if(animTarget){
    animTarget.classList.remove('animate__fadeIn');
    void animTarget.offsetWidth;
    animTarget.classList.add('animate__animated','animate__fadeIn');
  }
}
function goTo(i){ if(i<0||i>=total) return; current = i; updateUI(); }
document.getElementById('prevBtn').onclick = ()=>goTo(current-1);
document.getElementById('nextBtn').onclick = ()=>goTo(current+1);
document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight') goTo(current+1);
  if(e.key==='ArrowLeft') goTo(current-1);
});
updateUI();

/* ============ QUIZ ============ */
const preguntas = [
  {
    texto:'Facturación necesita que la aplicación de turnos cancele un turno con su propia lógica, en vez de escribir directamente en su tabla. ¿Qué mecanismo resuelve esto mejor que Shared Database?',
    opciones:{
      a:'File Transfer, enviando un archivo con el listado de turnos a cancelar',
      b:'Seguir usando Shared Database, pero con una tabla adicional',
      c:'Remote Procedure Invocation, invocando una función como CancelarTurno(id) expuesta por la aplicación de turnos',
      d:'Duplicar la lógica de cancelación dentro de facturación'
    },
    correcta:'c'
  },
  {
    texto:'¿Qué significa que RPI "usa encapsulamiento para la integración de aplicaciones"?',
    opciones:{
      a:'Que cada aplicación mantiene el control sobre sus propios datos, y las demás acceden o los modifican solo a través de llamadas remotas',
      b:'Que todas las aplicaciones deben compartir el mismo esquema de base de datos',
      c:'Que los datos se transfieren únicamente mediante archivos cifrados',
      d:'Que ninguna aplicación puede exponer una interfaz pública'
    },
    correcta:'a'
  },
  {
    texto:'Según el teórico, ¿por qué la "transparencia" de RPI —que una llamada remota se sienta igual que una local— es en realidad un problema?',
    opciones:{
      a:'Porque las llamadas remotas siempre son más rápidas que las locales',
      b:'Porque impide que los desarrolladores usen sus lenguajes de programación habituales',
      c:'Porque esa facilidad hace fácil ignorar las enormes diferencias de desempeño y confiabilidad entre invocaciones locales y remotas',
      d:'Porque obliga a que ambas aplicaciones estén escritas en el mismo lenguaje'
    },
    correcta:'c'
  },
  {
    texto:'¿Qué ventaja tiene RPI sobre Shared Database?',
    opciones:{
      a:'RPI nunca puede fallar ni tener problemas de red',
      b:'RPI preserva el encapsulamiento de cada aplicación, en vez de romperlo como Shared Database',
      c:'RPI no requiere ningún tipo de interfaz entre aplicaciones',
      d:'RPI siempre es más rápido que una consulta local a una base de datos'
    },
    correcta:'b'
  },
  {
    texto:'¿Qué otro nombre recibe la invocación de procedimientos remotos en otros contextos, según el teórico?',
    opciones:{
      a:'Shared Database',
      b:'Message Endpoint',
      c:'File Transfer',
      d:'RPC'
    },
    correcta:'d'
  }
];
let idxPregunta = 0, aciertos = 0;

function lanzarQuiz(){ idxPregunta = 0; aciertos = 0; mostrarPregunta(); }
function mostrarPregunta(){
  if(idxPregunta >= preguntas.length){
    Swal.fire({
      title:'Resultado',
      html:`Acertaste <b>${aciertos}/${preguntas.length}</b>.`,
      icon: aciertos===preguntas.length ? 'success' : 'info',
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    });
    return;
  }
  const p = preguntas[idxPregunta];
  Swal.fire({
    title: p.texto,
    input:'radio',
    inputOptions: p.opciones,
    background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff',
    confirmButtonText:'Responder',
    inputValidator: (value)=> !value && 'Elegí una opción'
  }).then(res=>{
    if(!res.isConfirmed) return;
    const ok = res.value === p.correcta;
    if(ok) aciertos++;
    Swal.fire({
      title: ok ? '¡Correcto!' : 'No es así',
      html: `La respuesta correcta era: <b>${p.opciones[p.correcta]}</b>`,
      icon: ok ? 'success' : 'error',
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    }).then(()=>{ idxPregunta++; mostrarPregunta(); });
  });
}
</script>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANDIS 2 · Unidad 4 — Patrones de modificación y despliegue</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#070b14; --bg-1:#0d1424; --panel:#111a2e; --panel-2:#16223a;
  --accent:#3ec1ff; --accent-2:#7b6bff; --accent-3:#ffb547; --ok:#3ee6a8; --bad:#ff6b6b;
  --text:#e8edf7; --text-dim:#8fa0bd; --border:#22304d;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(1200px 700px at 15% -10%, rgba(62,193,255,.10), transparent 60%),radial-gradient(1000px 700px at 110% 10%, rgba(123,107,255,.12), transparent 55%),var(--bg-0);color:var(--text);font-family:'Inter',sans-serif;overflow:hidden;}
.mono{font-family:'JetBrains Mono',monospace}
.blueprint{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.35;background-image:linear-gradient(rgba(62,193,255,.06) 1px, transparent 1px),linear-gradient(90deg, rgba(62,193,255,.06) 1px, transparent 1px);background-size:42px 42px;}
.progress-track{position:fixed;top:0;left:0;width:100%;height:4px;background:rgba(255,255,255,.06);z-index:50;}
.progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .4s ease;box-shadow:0 0 12px var(--accent);}
.hud{position:fixed;top:14px;right:18px;z-index:50;background:rgba(17,26,46,.85);border:1px solid var(--border);backdrop-filter:blur(6px);padding:7px 14px;border-radius:999px;font-size:.82rem;color:var(--text-dim);display:flex;align-items:center;gap:8px;}
.hud .unit-tag{color:var(--accent);font-weight:700}
.brand{position:fixed;top:14px;left:18px;z-index:50;font-size:.78rem;color:var(--text-dim);display:flex;align-items:center;gap:8px;letter-spacing:.03em;}
.brand i{color:var(--accent-3)}
.slides-container{position:relative;z-index:1;height:100vh;width:100vw;}
.slide{position:absolute;inset:0;display:none;padding:90px 8vw 110px 8vw;overflow-y:auto;}
.slide.active{display:block}
.slide-inner{max-width:1180px;margin:0 auto;}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);font-weight:700;margin-bottom:14px;}
h1.slide-title{font-size:clamp(1.9rem,3.4vw,3rem);font-weight:800;margin-bottom:.4rem;line-height:1.1;}
h2.slide-title{font-size:clamp(1.5rem,2.6vw,2.2rem);font-weight:800;margin-bottom:.6rem;}
.subtitle{color:var(--text-dim);font-size:1.05rem;max-width:820px;}
.card-panel{background:linear-gradient(180deg, var(--panel), var(--panel-2));border:1px solid var(--border);border-radius:16px;padding:26px 28px;box-shadow:0 12px 30px rgba(0,0,0,.35);}
.card-panel + .card-panel{margin-top:18px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:.76rem;font-weight:700;background:rgba(62,193,255,.12);color:var(--accent);border:1px solid rgba(62,193,255,.35);}
.pill.amber{background:rgba(255,181,71,.14);color:var(--accent-3);border-color:rgba(255,181,71,.4)}
.pill.ok{background:rgba(62,230,168,.12);color:var(--ok);border-color:rgba(62,230,168,.35)}
.pill.bad{background:rgba(255,107,107,.12);color:#ff6b6b;border-color:rgba(255,107,107,.35)}
.icon-tile{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:rgba(62,193,255,.12);color:var(--accent);font-size:1.3rem;border:1px solid rgba(62,193,255,.3);flex-shrink:0;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
@media (max-width:900px){.grid-2,.grid-3{grid-template-columns:1fr;}}
ul.clean{list-style:none;margin:0;padding:0;}
ul.clean li{position:relative;padding:6px 0 6px 26px;color:var(--text);font-size:.94rem;}
ul.clean li::before{content:"\f105";font-family:"Font Awesome 6 Free";font-weight:900;color:var(--accent);position:absolute;left:2px;top:8px;font-size:.85rem;}
ul.clean.bad li::before{content:"\f00d";color:var(--bad);}
ul.clean.ok li::before{content:"\f00c";color:var(--ok);}
.check-btn{border:none;background:linear-gradient(90deg,var(--accent),var(--accent-2));color:#04101f;font-weight:800;padding:10px 22px;border-radius:10px;font-size:.9rem;box-shadow:0 8px 22px rgba(62,193,255,.25);cursor:pointer;}
.check-btn:hover{filter:brightness(1.08);color:#04101f;}
.sim-btn{border:1px solid var(--border);background:var(--panel-2);color:var(--text);font-weight:700;padding:8px 14px;border-radius:10px;font-size:.84rem;cursor:pointer;transition:.2s;}
.sim-btn:hover{border-color:var(--accent);color:var(--accent);}
.sim-btn.ok:hover{border-color:var(--ok);color:var(--ok);} .sim-btn.bad:hover{border-color:var(--bad);color:var(--bad);}
.nav-controls{position:fixed;bottom:18px;left:0;right:0;z-index:50;display:flex;justify-content:center;gap:14px;align-items:center;}
.nav-btn{width:46px;height:46px;border-radius:50%;border:1px solid var(--border);background:rgba(17,26,46,.9);color:var(--text);display:flex;align-items:center;justify-content:center;font-size:1.1rem;backdrop-filter:blur(6px);}
.nav-btn:hover{border-color:var(--accent);color:var(--accent);}
.nav-dots{display:flex;gap:6px;align-items:center;background:rgba(17,26,46,.9);border:1px solid var(--border);padding:8px 14px;border-radius:999px;}
.nav-dots .dot{width:7px;height:7px;border-radius:50%;background:var(--border);cursor:pointer;transition:.2s;}
.nav-dots .dot.active{background:var(--accent);width:20px;border-radius:4px;}
.footer-note{position:fixed;bottom:20px;right:22px;z-index:50;font-size:.72rem;color:var(--text-dim);font-family:'JetBrains Mono';}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}
.tac-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.tac-grid.cols4{grid-template-columns:repeat(4,1fr);}
@media (max-width:900px){.tac-grid,.tac-grid.cols4{grid-template-columns:1fr;}}
.tac-tile{background:var(--panel-2);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;text-align:center;}
.tac-tile:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 10px 24px rgba(62,193,255,.15);}
.tac-tile i{font-size:1.3rem;color:var(--accent);margin-bottom:6px;display:block;}
.tac-tile .tname{font-size:.86rem;font-weight:700;}
.tac-tile .tsub{font-size:.72rem;color:var(--text-dim);margin-top:3px;}
.example-box{background:rgba(62,193,255,.07);border:1px dashed rgba(62,193,255,.35);border-radius:12px;padding:14px 16px;margin-top:10px;font-size:.93rem;line-height:1.6;}
.example-box .ex-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:6px;}
.example-box.amber{background:rgba(255,181,71,.07);border-color:rgba(255,181,71,.4);}
.example-box.amber .ex-label{color:var(--accent-3);}
.fig-img{max-width:100%;border-radius:12px;border:1px solid var(--border);background:#fff;padding:14px;display:block;margin:0 auto;}
.fig-img.sm{max-width:520px;} .fig-img.md{max-width:680px;}
.fig-cap{text-align:center;font-size:.78rem;color:var(--text-dim);margin-top:8px;}
.compare-col{background:var(--panel-2);border:1px solid var(--border);border-radius:14px;padding:20px;}
.compare-col h4{font-weight:800;font-size:1.02rem;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.link-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.06);}
.link-row:last-child{border-bottom:none;}
.link-row a{color:var(--text);text-decoration:none;font-weight:600;}
.link-row a:hover{color:var(--accent);}
.link-row .ext{margin-left:auto;color:var(--text-dim);font-size:.75rem;}
.chain{display:flex;align-items:stretch;gap:10px;flex-wrap:wrap;}
.chain .node{flex:1;min-width:190px;background:var(--panel-2);border:1px solid var(--border);border-radius:14px;padding:16px;}
.chain .node .lvl{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:800;}
.chain .node .nm{font-size:1.1rem;font-weight:800;margin:4px 0;}
.chain .node .ex{font-size:.82rem;color:var(--text-dim);line-height:1.5;}
.chain .arrow{display:flex;align-items:center;color:var(--accent-3);font-size:1.3rem;}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:.86rem;}
.tbl th{background:var(--panel-2);color:var(--accent);text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);font-size:.76rem;text-transform:uppercase;letter-spacing:.06em;}
.tbl td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.06);vertical-align:top;line-height:1.5;}
.tbl td:first-child{font-weight:800;white-space:nowrap;}
.tbl tr:hover td{background:rgba(62,193,255,.04);}
.sim{background:#0a1020;border:1px solid var(--border);border-radius:14px;padding:16px;}
.sim .log{font-family:'JetBrains Mono',monospace;font-size:.78rem;color:var(--text-dim);min-height:90px;max-height:150px;overflow-y:auto;margin-top:10px;line-height:1.7;}
.state-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
.state-box{flex:1;min-width:110px;text-align:center;padding:12px 8px;border-radius:12px;border:1px solid var(--border);background:var(--panel-2);font-weight:800;font-size:.9rem;opacity:.45;transition:.25s;}
.state-box.on.closed{opacity:1;border-color:var(--ok);color:var(--ok);box-shadow:0 0 18px rgba(62,230,168,.25);}
.state-box.on.open{opacity:1;border-color:var(--bad);color:var(--bad);box-shadow:0 0 18px rgba(255,107,107,.25);}
.state-box.on.half{opacity:1;border-color:var(--accent-3);color:var(--accent-3);box-shadow:0 0 18px rgba(255,181,71,.25);}
.lines{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.prov{background:var(--panel-2);border:1px solid var(--border);border-radius:12px;padding:10px;text-align:center;}
.prov .pn{font-weight:800;font-size:.85rem;margin-bottom:6px;}
.prov .ln{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;}
.prov .ln span{width:20px;height:20px;border-radius:5px;background:rgba(62,230,168,.25);border:1px solid var(--ok);}
.prov .ln span.wait{background:rgba(255,107,107,.3);border-color:var(--bad);}
.prov .ln span.free{background:transparent;border-color:var(--border);}
.ev{display:flex;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:8px 12px;margin-bottom:8px;font-size:.86rem;}
.ev .n{font-family:'JetBrains Mono';color:var(--text-dim);font-size:.75rem;width:26px;}
.ev .amt{margin-left:auto;font-family:'JetBrains Mono';font-weight:800;}
.ev.dep .amt{color:var(--ok)} .ev.ret .amt{color:var(--bad)}
.ev.snap{border-color:var(--accent-3);background:rgba(255,181,71,.08);}
.vs{display:flex;gap:14px;align-items:flex-end;justify-content:center;margin:10px 0;}
.srv{background:var(--panel-2);border:1px solid var(--accent);border-radius:8px;text-align:center;font-size:.7rem;padding:6px 10px;color:var(--accent);font-weight:700;}
.qbar{display:flex;gap:4px;flex-wrap:wrap;min-height:26px;margin-top:8px;}
.qbar span{width:20px;height:20px;border-radius:5px;background:var(--accent-3);opacity:.9;}
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0;}
.flow .bx{background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-size:.8rem;font-weight:700;text-align:center;}
.flow .bx.w{border-color:var(--bad);color:var(--bad)} .flow .bx.r{border-color:var(--ok);color:var(--ok)} .flow .bx.m{border-color:var(--accent-3);color:var(--accent-3)}
.flow .ar{color:var(--text-dim)}
.subr.hit{border-color:var(--ok);box-shadow:0 0 14px rgba(62,230,168,.3)}
.subr{background:var(--panel-2);border:1px solid var(--border);border-radius:12px;padding:10px;text-align:center;font-size:.84rem;font-weight:700;transition:.2s;}
.step{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--border);border-radius:10px;margin-bottom:6px;background:var(--panel-2);opacity:.45;transition:.25s;font-size:.84rem;line-height:1.5;}
.step.on{opacity:1;border-color:var(--accent);box-shadow:0 0 14px rgba(62,193,255,.2);}
.step .sn{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#04101f;font-weight:800;font-size:.75rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.impl{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px;}
.impl div{background:rgba(255,107,107,.12);border:1px solid var(--bad);border-radius:6px;font-size:.62rem;text-align:center;padding:4px 2px;color:var(--bad);font-weight:700;}
.impl.ok div{background:rgba(62,230,168,.12);border-color:var(--ok);color:var(--ok);}
.zone{border:1px dashed var(--border);border-radius:12px;padding:10px;text-align:center;}
.zone .zt{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);margin-bottom:6px;font-weight:800;}
pre.code{background:#0a1020;border:1px solid var(--border);border-radius:12px;padding:14px;font-family:'JetBrains Mono',monospace;font-size:.78rem;color:#cfe3ff;overflow-x:auto;margin:0;line-height:1.6;}
.inst{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin:8px 0;}
.inst div{height:26px;border-radius:6px;border:1px solid var(--border);font-size:.6rem;display:flex;align-items:center;justify-content:center;font-weight:800;}
.inst .v1{background:rgba(62,193,255,.18);border-color:var(--accent);color:var(--accent);}
.inst .v2{background:rgba(62,230,168,.2);border-color:var(--ok);color:var(--ok);}
.inst .off{background:rgba(255,107,107,.12);border-color:var(--bad);color:var(--bad);}
.inst .idle{background:transparent;border-style:dashed;color:var(--text-dim);}
.tbar{height:14px;border-radius:7px;background:var(--accent);overflow:hidden;margin-top:6px;border:1px solid var(--border);}
.tbar div{height:100%;background:var(--ok);transition:width .3s;}
.stamp{background:var(--panel-2);border:1px solid var(--border);border-radius:12px;padding:10px;}
.stamp.down{border-color:var(--bad);background:rgba(255,107,107,.08);}
.stamp .st{font-size:.72rem;font-weight:800;margin-bottom:6px;}
.chip{display:inline-block;background:rgba(62,193,255,.15);border:1px solid var(--accent);color:var(--accent);border-radius:6px;padding:2px 7px;font-size:.68rem;margin:2px;font-weight:700;}
.stamp.down .chip{background:rgba(255,107,107,.15);border-color:var(--bad);color:var(--bad);}
</style>
</head>
<body>
<div class="blueprint"></div>
<div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
<div class="brand"><i class="fa-solid fa-rocket"></i> ANDIS 2 · Unidad 4</div>
<div class="hud"><i class="fa-solid fa-layer-group"></i> <span class="unit-tag" id="hudCurrent">1</span>/<span id="hudTotal">0</span></div>
<div class="slides-container" id="slidesContainer"></div>
<div class="nav-controls">
  <button class="nav-btn" id="prevBtn"><i class="fa-solid fa-chevron-left"></i></button>
  <div class="nav-dots" id="navDots"></div>
  <button class="nav-btn" id="nextBtn"><i class="fa-solid fa-chevron-right"></i></button>
</div>
<div class="footer-note">← → para navegar</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.10.5/sweetalert2.all.min.js"></script>
<script>
const SW={background:'#111a2e',color:'#e8edf7',confirmButtonColor:'#3ec1ff'};
const slidesHTML=[];

// 0. Portada
slidesHTML.push(`
<div class="slide-inner d-flex flex-column justify-content-center" style="min-height:78vh;">
  <div class="animate__animated animate__fadeInDown">
    <span class="eyebrow"><i class="fa-solid fa-rocket"></i> Unidad 4 · Patrones de arquitectura</span>
    <h1 class="slide-title">Patrones de <span style="color:var(--accent)">modificación</span> y <span style="color:var(--accent-3)">despliegue</span></h1>
    <p class="subtitle">Ocho patrones para cambiar un sistema sin dolor y ponerlo en producción sin sobresaltos. Base teórica para el práctico UT4-TA4.</p>
    <div class="mt-3 d-flex gap-2 flex-wrap">
      <span class="pill"><i class="fa-solid fa-cubes"></i> Deployment Stamps</span>
      <span class="pill"><i class="fa-solid fa-sliders"></i> External Configuration Store</span>
      <span class="pill"><i class="fa-solid fa-bridge"></i> Messaging Bridge</span>
      <span class="pill"><i class="fa-solid fa-seedling"></i> Strangler Fig</span>
      <span class="pill amber"><i class="fa-solid fa-repeat"></i> Blue/Green</span>
      <span class="pill amber"><i class="fa-solid fa-arrows-rotate"></i> Rolling Upgrade</span>
      <span class="pill amber"><i class="fa-solid fa-dove"></i> Canary</span>
      <span class="pill amber"><i class="fa-solid fa-code-compare"></i> A/B Testing</span>
    </div>
  </div>
</div>
`);

// 1. Atributos y tácticas
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-pen-ruler"></i> Dos atributos de calidad</span>
  <h2 class="slide-title">Facilidad de modificación y facilidad de despliegue</h2>
  <div class="grid-2">
    <div class="compare-col">
      <h4><i class="fa-solid fa-pen-to-square" style="color:var(--accent)"></i> Facilidad de modificación</h4>
      <p style="font-size:.9rem; line-height:1.7; margin:0;">Qué tan <strong>barato y rápido</strong> es cambiar el sistema: agregar una función, corregir algo, adaptarse a un nuevo entorno. Depende de cuánto se propaga un cambio: si tocar una pieza obliga a tocar diez, es caro.</p>
      <div class="example-box" style="margin-top:10px; font-size:.86rem;"><strong>Casa:</strong> cambiar una lámpara es fácil; cambiar una cañería oculta dentro de la pared, no.</div>
    </div>
    <div class="compare-col">
      <h4><i class="fa-solid fa-rocket" style="color:var(--accent-3)"></i> Facilidad de despliegue</h4>
      <p style="font-size:.9rem; line-height:1.7; margin:0;">Qué tan <strong>rápido, seguro y repetible</strong> es llevar una nueva versión a producción, y volver atrás si algo sale mal. Importa tanto la velocidad como el riesgo de cada liberación.</p>
      <div class="example-box amber" style="margin-top:10px; font-size:.86rem;"><strong>Teatro:</strong> cambiar el decorado entre actos sin que el público lo note.</div>
    </div>
  </div>
  <p class="subtitle mt-3" style="margin-top:16px;">Las tácticas de cada atributo se agrupan por el tipo de decisión que toman. Tocá cada grupo.</p>
  <div class="tac-grid mt-2" id="tacticasGrid" style="grid-template-columns:repeat(3,1fr);"></div>
  <div class="card-panel mt-3" style="margin-top:14px; padding:14px 20px;">
    <span class="pill amber"><i class="fa-solid fa-sitemap"></i> Atributo → Táctica → Patrón</span>
    <span style="font-size:.9rem; margin-left:8px;">En el práctico vas a decir <strong>qué tácticas</strong> intervienen en cada patrón. Tené este árbol a mano.</span>
  </div>
</div>
`);

// 2. Mapa
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-map"></i> Mapa del tema</span>
  <h2 class="slide-title">Los ocho patrones de un vistazo</h2>
  <p class="subtitle">Cuatro ayudan a <strong>cambiar</strong> la arquitectura y cuatro a <strong>liberar</strong> versiones. Tocá cada tarjeta.</p>
  <div class="tac-grid cols4 mt-3" id="patronesGrid" style="margin-top:18px;"></div>
</div>
`);

// 3. Microservicios contexto
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-cubes"></i> Contexto</span>
  <h2 class="slide-title">Por qué estos patrones aparecen con los microservicios</h2>
  <p class="subtitle">Muchos de estos patrones nacen de un problema de fondo: cambiar y desplegar un sistema grande es riesgoso si todo está junto. Los microservicios son una respuesta, y abren sus propios desafíos.</p>
  <div class="grid-2 mt-3" style="margin-top:14px;">
    <div class="compare-col">
      <h4><i class="fa-solid fa-cube" style="color:var(--bad)"></i> Monolito</h4>

// 4. Deployment Stamps
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-cubes"></i> Patrón 1</span>
  <h2 class="slide-title">Deployment Stamps <span style="color:var(--text-dim); font-weight:600;">(sellos de despliegue)</span></h2>
  <div class="grid-2">
    <div>
      <div class="card-panel">
        <p style="margin:0 0 10px; line-height:1.7; font-size:.95rem;"><strong>Problema:</strong> una única instancia de la solución tiene límites: de escala, de costo (escalar hacia arriba se vuelve carísimo), de aislamiento entre clientes, de actualizaciones (no todos las toleran con la misma frecuencia) o de regulación geográfica.</p>
        <p style="margin:0; line-height:1.7; font-size:.95rem;"><strong>Solución:</strong> desplegar <strong>varias copias independientes</strong> de los componentes <em>incluyendo los datos</em>, como un grupo de recursos. Cada copia es un <strong>stamp</strong> (también "scale unit" o "cell") y atiende a un subconjunto de clientes. Se agrega un stamp para escalar casi linealmente.</p>
      </div>
      <div class="example-box">
        <div class="ex-label"><i class="fa-solid fa-stamp"></i> Analogía: sucursales de un banco</div>
        En vez de agrandar una sola sucursal infinitamente, se abren <strong>sucursales idénticas</strong>. Cada una atiende a sus clientes; si una cierra por un problema, las demás siguen.
      </div>
    </div>
    <div class="compare-col">
      <h4><i class="fa-solid fa-list-check" style="color:var(--accent)"></i> Puntos clave</h4>
      <ul class="clean">
        <li>Cada stamp <strong style="color:var(--text)">se despliega y actualiza por separado</strong>: permite <em>deployment rings</em> (grupos de clientes que reciben cambios en distinto momento).</li>
        <li>Los stamps <strong style="color:var(--text)">particionan los datos</strong> de forma implícita (sharding).</li>
        <li>Se define con <strong style="color:var(--text)">infraestructura como código</strong> (Bicep, Terraform) para que las copias sean idénticas.</li>
        <li>Conviene <strong style="color:var(--text)">al menos dos stamps</strong>, para no hardcodear supuestos de "una sola".</li>
        <li>Hace falta un componente de <strong style="color:var(--text)">enrutamiento</strong> que sepa a qué stamp va cada cliente.</li>
        <li>Limita el <strong style="color:var(--text)">radio de impacto</strong> (blast radius) de una falla.</li>
      </ul>
    </div>
  </div>
</div>
`);

function addLog(id,t,c){const l=document.getElementById(id);if(!l)return;l.innerHTML+=`<div style="color:${c||'inherit'}">${t}</div>`;l.scrollTop=l.scrollHeight;}
function clearLog(id){const l=document.getElementById(id);if(l)l.innerHTML='';}

/* --- Deployment Stamps --- */
let st={gyms:[],stamps:[{down:false,ver:1}]};
const CAP=3;
function stView(){
  const v=document.getElementById('stView');if(!v)return;
  v.innerHTML=st.stamps.map((s,i)=>`<div class="stamp ${s.down?'down':''}"><div class="st">Stamp ${i+1} · v${s.ver} ${s.down?'· ⛔ caído':''}</div>${st.gyms.filter(g=>g.s===i).map(g=>`<span class="chip">Gimnasio ${g.n}</span>`).join('')||'<span style="font-size:.7rem;color:#8fa0bd;">vacío</span>'}</div>`).join('');
}
function stAdd(){
  const n=st.gyms.length+1;
  let i=st.stamps.findIndex((s,k)=>st.gyms.filter(g=>g.s===k).length<CAP);
  if(i<0){st.stamps.push({down:false,ver:st.stamps[0].ver});i=st.stamps.length-1;addLog('stLog','Capacidad llena: se despliega un <b>nuevo stamp</b> (copia idéntica con su propia base de datos)','#ffb547');}
  st.gyms.push({n,s:i});addLog('stLog',`Gimnasio ${n} asignado al stamp ${i+1} (el enrutador guarda la relación)`,'#3ee6a8');stView();
}
function stFail(){
  const i=st.stamps.findIndex(s=>!s.down&&st.gyms.some(g=>g.s===st.stamps.indexOf(s)));
  if(i<0){addLog('stLog','No hay stamps con clientes para fallar.','#ff6b6b');return;}
  st.stamps[i].down=true;
  const a=st.gyms.filter(g=>g.s===i).length,t=st.gyms.length;
  addLog('stLog',`⛔ Falla el stamp ${i+1}: afecta a ${a} de ${t} clientes. Los demás <b>siguen funcionando</b> (radio de impacto acotado).`,'#ff6b6b');stView();
}
function stRing(){
  const pend=st.stamps.findIndex(s=>s.ver===1&&!s.down);
  if(pend<0){addLog('stLog','Todos los stamps sanos ya están en v2.','#ffb547');return;}
  st.stamps[pend].ver=2;addLog('stLog',`Anillo ${pend+1}: stamp ${pend+1} actualizado a v2 antes que los otros. Si algo sale mal, solo ese grupo lo sufre.`,'#3ec1ff');stView();
}
function stReset(){st={gyms:[],stamps:[{down:false,ver:1}]};clearLog('stLog');stView();addLog('stLog','Un stamp inicial (capacidad: 3 gimnasios).');}

/* --- External Configuration Store --- */
let ecs={store:30,inst:[30,30,30],local:false,pend:0};
function ecsView(){
  document.getElementById('ecsStore').textContent='Store: timeout = '+ecs.store;
  document.getElementById('ecsInst').innerHTML=ecs.inst.map((v,i)=>`<div class="subr ${v===ecs.store?'hit':''}">Instancia ${i+1}<br><span class="mono">timeout = ${v}</span></div>`).join('');
}
function ecsChange(){ecs.store=60;ecs.local=false;addLog('ecsLog','Valor cambiado en el store. Las instancias siguen con su caché hasta que venza.','#ffb547');ecsView();}
function ecsRefresh(){
  if(ecs.inst.every(v=>v===ecs.store)){addLog('ecsLog','Ya están todas sincronizadas.');return;}
  ecs.inst=ecs.inst.map(()=>ecs.store);addLog('ecsLog','La caché venció: las 3 instancias leyeron el valor nuevo <b>sin redesplegar ni reiniciar</b>.','#3ee6a8');ecsView();
}
function ecsLocal(){

}

/* --- Messaging Bridge --- */
let mb={up:true,q:0,sent:0,deliv:0};
function mbInfo(){document.getElementById('mbInfo').textContent=`Enviados: ${mb.sent} · Entregados: ${mb.deliv} · Retenidos en el puente: ${mb.q} · Nube: ${mb.up?'arriba':'caída'}`;document.getElementById('mbC').style.borderColor=mb.up?'#3ee6a8':'#ff6b6b';}
function mbSend(){
  mb.sent++;
  if(mb.up){mb.deliv++;addLog('mbLog',`Mensaje ${mb.sent}: MSMQ → puente → Service Bus. Contenido idéntico.`,'#3ee6a8');}
  else{mb.q++;addLog('mbLog',`Mensaje ${mb.sent}: la nube no responde. El puente lo <b>retiene</b> y reintenta (Circuit Breaker evita insistir sin parar).`,'#ffb547');}
  mbInfo();
}
function mbDown(){mb.up=false;addLog('mbLog','⛔ La nube cae. El sistema legacy ni se entera.','#ff6b6b');mbInfo();}
function mbUp(){
  if(mb.up)return;mb.up=true;
  if(mb.q){addLog('mbLog',`✓ La nube vuelve: el puente entrega los ${mb.q} retenidos (al menos una vez; el consumidor debe tolerar duplicados).`,'#3ee6a8');mb.deliv+=mb.q;mb.q=0;}
  else addLog('mbLog','La nube vuelve.','#3ee6a8');
  mbInfo();
}
function mbReset(){mb={up:true,q:0,sent:0,deliv:0};clearLog('mbLog');mbInfo();}

const SF=['Catálogo de libros','Préstamos','Usuarios','Multas'];
let sfN=0;
function sfRender(){
  document.getElementById('sfOld').innerHTML=SF.slice(sfN).map(m=>`<div class="subr" style="margin-bottom:5px;">${m}</div>`).join('')||'<div style="color:#8fa0bd;font-size:.8rem;">(retirado)</div>';
  document.getElementById('sfNew').innerHTML=SF.slice(0,sfN).map(m=>`<div class="subr hit" style="margin-bottom:5px;">${m}</div>`).join('')||'<div style="color:#8fa0bd;font-size:.8rem;">(vacío)</div>';
  const m=document.getElementById('sfMsg');
  const txt=['Fase 1: la fachada solo reenvía todo al legacy.','Fase 2: <b>Catálogo</b> migrado. La fachada manda su ruta al nuevo y el resto sigue en el viejo.','Fase 2: <b>Préstamos</b> migrado. Los clientes no notaron nada.','Fase 2: <b>Usuarios</b> migrado. El legacy solo conserva Multas.','Fase 3 y 4: legacy retirado. La fachada ya no hace falta o queda como adaptador.'];
  m.innerHTML=txt[sfN];
}

/* --- Estrategias de despliegue --- */
let dp={s:'bg',step:0};
const DP_MAX={bg:2,roll:5,can:4,ab:2};
function dpSet(s){dp={s,step:0};clearLog('dpLog');['bg','roll','can','ab'].forEach(k=>{const b=document.getElementById('dpB_'+k);if(b)b.style.outline=k===s?'2px solid #3ec1ff':'none';});dpRender();
  addLog('dpLog',{bg:'Blue/Green: entorno azul (v1) activo. Avanzá para desplegar el verde.',roll:'Rolling: 10 instancias en v1. Se actualizan de a 2.',can:'Canary: 10 instancias en v1. Se irá exponiendo v2 a más usuarios.',ab:'A/B: queremos saber qué variante convierte mejor.'}[s]);}
function dpGrid(arr){return arr.map(c=>`<div class="${c}">${c==='v1'?'v1':c==='v2'?'v2':c==='off'?'↻':'—'}</div>`).join('');}
function dpRender(){
  const s=dp.s,k=dp.step;let g1=Array(10).fill('v1'),g2=null,pct=0,l1='Producción',l2='';
  if(s==='bg'){l1='Entorno azul';l2='Entorno verde';g2=Array(10).fill('idle');
    if(k>=1){g2=Array(10).fill('v2');}
    if(k>=2){pct=100;g1=Array(10).fill('idle');}}
  if(s==='roll'){const n=Math.min(k*2,10);g1=g1.map((c,i)=>i<n?'v2':'v1');pct=n*10;}
  if(s==='can'){const sh=[0,5,25,50,100][k];pct=sh;const n=[0,1,3,5,10][k];g1=g1.map((c,i)=>i<n?'v2':'v1');}
  if(s==='ab'){l1='Variante A (actual) | Variante B (nueva)';if(k>=1){g1=g1.map((c,i)=>i<5?'v1':'v2');pct=50;}}
  document.getElementById('dpG1').innerHTML=dpGrid(g1);
  document.getElementById('dpLab1').textContent=l1;
  document.getElementById('dpLab2').textContent=l2;
  document.getElementById('dpG2').innerHTML=g2?dpGrid(g2):'';
  document.getElementById('dpG2').style.display=g2?'grid':'none';
  document.getElementById('dpPct').textContent=pct+'% del tráfico en v2 / B';
  document.getElementById('dpBar').style.width=pct+'%';
}
function dpNext(){
  const s=dp.s;if(dp.step>=DP_MAX[s]){addLog('dpLog','Ya se llegó al final de esta estrategia.','#ffb547');return;}
  dp.step++;dpRender();const k=dp.step;
  if(s==='bg')addLog('dpLog',k===1?'Se despliega v2 en el entorno verde y se prueba. Los usuarios siguen en el azul (0% a v2).':'<b>Corte:</b> el router apunta 100% al verde. El azul queda intacto como respaldo.','#3ec1ff');
  if(s==='roll')addLog('dpLog',`Lote ${k}: 2 instancias reemplazadas por v2. Hay ${k*2} en v2 y ${10-k*2} en v1 <b>conviviendo</b>; siempre queda capacidad atendiendo.`,'#3ec1ff');
  if(s==='can'){const sh=[0,5,25,50,100][k];addLog('dpLog',`Canary al ${sh}%. Métricas ilustrativas v2 vs v1: errores 0.4% vs 0.4% · latencia p95 210 ms vs 205 ms → ${k<4?'se expande':'se completa'}.`,'#3ee6a8');}
  if(s==='ab')addLog('dpLog',k===1?'La mitad ve A, la otra mitad B. Se mide conversión (compras por visita).':'Tras varios días: A 3.1% vs B 3.8%, diferencia estadísticamente significativa → se promueve B a todos.','#3ec1ff');
}
function dpBack(){
  const s=dp.s;if(dp.step===0){addLog('dpLog','No hay nada que revertir todavía.','#ffb547');return;}
  dp.step--;dpRender();
  const m={bg:'Rollback: el router vuelve al entorno azul. <b>Casi instantáneo</b>, porque nunca se apagó.',roll:'Rollback: hay que volver a actualizar lote por lote hacia v1. <b>Más lento</b>.',can:'Rollback: se deja de enviar tráfico a v2 (cambio de enrutamiento). Rápido.',ab:'Se descarta la variante B y todos vuelven a A.'};
  addLog('dpLog',m[s],'#ff6b6b');
}

/* ============ MOTOR DE NAVEGACIÓN ============ */
const container=document.getElementById('slidesContainer');
slidesHTML.forEach((html,i)=>{
  const div=document.createElement('div');
  div.className='slide'+(i===0?' active':'');
  div.id='slide'+i;
  div.innerHTML=html;
  container.appendChild(div);
});
initExplorers();
stReset();ecsReset();mbReset();sfReset();dpSet('bg');

let current=0;
const total=slidesHTML.length;
document.getElementById('hudTotal').textContent=total;
const dotsWrap=document.getElementById('navDots');
for(let i=0;i<total;i++){
  const d=document.createElement('div');
  d.className='dot'+(i===0?' active':'');
  d.onclick=()=>goTo(i);
  dotsWrap.appendChild(d);
}
function updateUI(){
  document.querySelectorAll('.slide').forEach((s,i)=>{s.classList.toggle('active',i===current);});
  document.querySelectorAll('.nav-dots .dot').forEach((d,i)=>{d.classList.toggle('active',i===current);});
  document.getElementById('hudCurrent').textContent=current+1;
  document.getElementById('progressFill').style.width=((current+1)/total*100)+'%';
  const active=document.getElementById('slide'+current);
  active.scrollTop=0;
  const animTarget=active.querySelector('.slide-inner');
  if(animTarget){
    animTarget.classList.remove('animate__fadeIn');
    void animTarget.offsetWidth;
    animTarget.classList.add('animate__animated','animate__fadeIn');
  }
}
function goTo(i){if(i<0||i>=total)return;current=i;updateUI();}
document.getElementById('prevBtn').onclick=()=>goTo(current-1);
document.getElementById('nextBtn').onclick=()=>goTo(current+1);
document.addEventListener('keydown',(e)=>{
  if(e.key==='ArrowRight')goTo(current+1);
  if(e.key==='ArrowLeft')goTo(current-1);
});
updateUI();

const preguntas=[
  {texto:'Una app de turnos médicos reúne clínicas en una sola instancia que ya no escala. Se decide desplegar copias completas, cada una con su propia base de datos y un grupo de clínicas. ¿Qué ventaja principal aporta esto frente a una falla?',
   opciones:{a:'Todas las clínicas comparten la misma base de datos, así que cualquier dato está siempre disponible',b:'Se puede quitar la necesidad de un enrutador, porque cada clínica sabe a qué copia ir sola',c:'Una falla en una copia solo afecta a las clínicas que atiende, no a todas las demás del sistema',d:'La infraestructura se vuelve más barata que con una sola instancia grande en todos los casos'},correcta:'c'},
  {texto:'Un microservicio necesita la contraseña de la base de datos y el límite de reintentos. ¿Cómo conviene tratar cada uno con un External Configuration Store?',

   opciones:{a:'Strangler Fig, porque reemplaza el sistema de la empresa absorbida de forma gradual',b:'Deployment Stamps, porque crea una copia de cada sistema para cada empresa',c:'External Configuration Store, porque guarda los datos de conexión en un lugar central',d:'Messaging Bridge, que reenvía mensajes de una infraestructura a otra sin modificar'},correcta:'d'},
  {texto:'En una migración con Strangler Fig, ¿cuál es el rol de la fachada?',
   opciones:{a:'Almacenar la copia de seguridad de los datos del sistema antiguo hasta el final',b:'Decidir, solicitud por solicitud, si la atiende el sistema viejo o el nuevo, según la ruta',c:'Traducir mensajes entre dos tecnologías de mensajería incompatibles sin cambiar su contenido',d:'Repartir tareas pesadas entre varias instancias idénticas para mejorar el rendimiento'},correcta:'b'},
  {texto:'Un equipo dice: "Blue/Green nos asusta por el costo". ¿A qué se refieren principalmente?',
   opciones:{a:'A que el cambio de tráfico necesita un reinicio manual de todas las computadoras de los usuarios',b:'A que el rollback lleva varias horas porque hay que reconstruir el entorno anterior',c:'A que los dos entornos no pueden ejecutarse al mismo tiempo en la misma región',d:'A mantener dos entornos de producción completos, casi idénticos y a la vez, con su costo'},correcta:'d'},
  {texto:'Con Rolling Upgrade, durante la actualización conviven instancias viejas y nuevas. ¿Qué requisito técnico implica?',
   opciones:{a:'Ambas versiones deben ser compatibles entre sí mientras conviven en producción',b:'Todas las instancias deben apagarse un instante para sincronizar su estado interno',c:'La base de datos debe duplicarse y mantener una copia exclusiva por versión',d:'Las instancias nuevas deben atender a todos los clientes antes que las viejas'},correcta:'a'},
  {texto:'Un banco quiere enviar el 3% de sus usuarios a la nueva versión de la app, vigilando errores y tiempos de respuesta, y ampliar solo si todo va bien. ¿Qué estrategia es?',
   opciones:{a:'Blue/Green, porque hay dos entornos y uno de ellos recibe una porción del tráfico',b:'A/B Testing, porque se comparan dos versiones entre grupos de usuarios distintos',c:'Canary: muy pocos usuarios primero, con monitoreo y ampliación gradual del alcance',d:'Rolling Upgrade, porque se actualiza una parte de las instancias antes que el resto'},correcta:'c'},
  {texto:'¿Qué distingue a un A/B test de un canary?',
   opciones:{a:'El A/B test no necesita monitoreo, porque el resultado se decide por votación entre los equipos',b:'Compara variantes según un objetivo de negocio; el canary valida que la versión funciona',c:'El A/B test siempre dura minutos y el canary siempre dura semanas de medición',d:'El canary se usa solo para bases de datos y el A/B test solo para interfaces gráficas'},correcta:'b'},
  {texto:'Una empresa quiere reemplazar una aplicación vieja, pero no hay forma de interceptar las solicitudes que llegan a ella. ¿Por qué Strangler Fig no es adecuado?',
   opciones:{a:'Sin interceptarlas no hay un punto donde enrutar entre el sistema viejo y el nuevo del cliente',b:'Porque el patrón solo funciona con sistemas escritos en lenguajes modernos y orientados a objetos',c:'Porque la fachada necesita ser desplegada siempre en una región distinta a la del sistema antiguo',d:'Porque el sistema viejo debe apagarse antes de empezar a construir cualquier parte del nuevo'},correcta:'a'},
  {texto:'Un equipo cambia el valor de un límite de subida de archivos sin redesplegar nada, y las instancias lo toman solas. ¿Qué principio de modificabilidad se aprovecha?',
   opciones:{a:'Reducir el tamaño de los módulos para que los cambios sean pequeños',b:'Aumentar la cohesión moviendo responsabilidades al mismo módulo',c:'Restringir las dependencias para que solo algunos módulos se comuniquen entre sí',d:'Diferir el momento de enlace: el valor se resuelve en ejecución, no al compilar'},correcta:'d'}
];
let idxPregunta=0,aciertos=0;
function lanzarQuiz(){idxPregunta=0;aciertos=0;mostrarPregunta();}
function mostrarPregunta(){
  if(idxPregunta>=preguntas.length){
    Swal.fire({title:'Resultado',html:`Acertaste <b>${aciertos}/${preguntas.length}</b>.`,icon:aciertos===preguntas.length?'success':'info',...SW});
    return;
  }
  const p=preguntas[idxPregunta];
  Swal.fire({
    title:p.texto,input:'radio',inputOptions:p.opciones,...SW,
    confirmButtonText:'Responder',
    inputValidator:(value)=>!value&&'Elegí una opción'
  }).then(res=>{
    if(!res.isConfirmed)return;
    const ok=res.value===p.correcta;
    if(ok)aciertos++;
    Swal.fire({
      title:ok?'¡Correcto!':'No es así',
      html:`La respuesta correcta era: <b>${p.opciones[p.correcta]}</b>`,
      icon:ok?'success':'error',...SW
    }).then(()=>{idxPregunta++;mostrarPregunta();});
  });
}

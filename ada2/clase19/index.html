<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANDIS 2 · Unidad 3 — Modularidad, cohesión, acoplamiento y co-nascencia</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#070b14; --bg-1:#0d1424; --panel:#111a2e; --panel-2:#16223a;
  --accent:#3ec1ff; --accent-2:#7b6bff; --accent-3:#ffb547; --ok:#3ee6a8;
  --text:#e8edf7; --text-dim:#8fa0bd; --border:#22304d;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(1200px 700px at 15% -10%, rgba(62,193,255,.10), transparent 60%),
    radial-gradient(1000px 700px at 110% 10%, rgba(123,107,255,.12), transparent 55%),
    var(--bg-0);
  color:var(--text); font-family:'Inter',sans-serif; overflow:hidden;
}
.mono{font-family:'JetBrains Mono',monospace}
.blueprint{
  position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.35;
  background-image:linear-gradient(rgba(62,193,255,.06) 1px, transparent 1px),linear-gradient(90deg, rgba(62,193,255,.06) 1px, transparent 1px);
  background-size:42px 42px;
}
.progress-track{position:fixed; top:0; left:0; width:100%; height:4px; background:rgba(255,255,255,.06); z-index:50;}
.progress-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--accent-2)); transition:width .4s ease; box-shadow:0 0 12px var(--accent);}
.hud{position:fixed; top:14px; right:18px; z-index:50; background:rgba(17,26,46,.85); border:1px solid var(--border); backdrop-filter:blur(6px); padding:7px 14px; border-radius:999px; font-size:.82rem; color:var(--text-dim); display:flex; align-items:center; gap:8px;}
.hud .unit-tag{color:var(--accent); font-weight:700}
.brand{position:fixed; top:14px; left:18px; z-index:50; font-size:.78rem; color:var(--text-dim); display:flex; align-items:center; gap:8px; letter-spacing:.03em;}
.brand i{color:var(--accent-3)}
.slides-container{position:relative; z-index:1; height:100vh; width:100vw;}
.slide{position:absolute; inset:0; display:none; padding:90px 8vw 110px 8vw; overflow-y:auto;}
.slide.active{display:block}
.slide-inner{max-width:1180px; margin:0 auto;}
.eyebrow{display:inline-flex; align-items:center; gap:8px; font-size:.78rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent); font-weight:700; margin-bottom:14px;}
.eyebrow i{font-size:.9rem}
h1.slide-title{font-size:clamp(1.9rem,3.4vw,3rem); font-weight:800; margin-bottom:.4rem; line-height:1.1;}
h2.slide-title{font-size:clamp(1.5rem,2.6vw,2.2rem); font-weight:800; margin-bottom:.6rem;}
.subtitle{color:var(--text-dim); font-size:1.05rem; max-width:820px;}
.card-panel{background:linear-gradient(180deg, var(--panel), var(--panel-2)); border:1px solid var(--border); border-radius:16px; padding:26px 28px; box-shadow:0 12px 30px rgba(0,0,0,.35);}
.card-panel + .card-panel{margin-top:18px}
.pill{display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:999px; font-size:.76rem; font-weight:700; background:rgba(62,193,255,.12); color:var(--accent); border:1px solid rgba(62,193,255,.35);}
.pill.purple{background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)}
.pill.amber{background:rgba(255,181,71,.14); color:var(--accent-3); border-color:rgba(255,181,71,.4)}
.pill.ok{background:rgba(62,230,168,.12); color:var(--ok); border-color:rgba(62,230,168,.35)}
.icon-tile{width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center; background:rgba(62,193,255,.12); color:var(--accent); font-size:1.3rem; border:1px solid rgba(62,193,255,.3); flex-shrink:0;}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
.grid-4{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
@media (max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}
ul.clean{list-style:none; margin:0; padding:0;}
ul.clean li{position:relative; padding:6px 0 6px 26px; color:var(--text); font-size:.94rem;}
ul.clean li::before{content:"\f105"; font-family:"Font Awesome 6 Free"; font-weight:900; color:var(--accent); position:absolute; left:2px; top:8px; font-size:.85rem;}
.check-btn{border:none; background:linear-gradient(90deg,var(--accent),var(--accent-2)); color:#04101f; font-weight:800; padding:10px 22px; border-radius:10px; font-size:.9rem; box-shadow:0 8px 22px rgba(62,193,255,.25); cursor:pointer;}
.check-btn:hover{filter:brightness(1.08); color:#04101f;}
.nav-controls{position:fixed; bottom:18px; left:0; right:0; z-index:50; display:flex; justify-content:center; gap:14px; align-items:center;}
.nav-btn{width:46px; height:46px; border-radius:50%; border:1px solid var(--border); background:rgba(17,26,46,.9); color:var(--text); display:flex; align-items:center; justify-content:center; font-size:1.1rem; backdrop-filter:blur(6px);}
.nav-btn:hover{border-color:var(--accent); color:var(--accent);}
.nav-dots{display:flex; gap:6px; align-items:center; background:rgba(17,26,46,.9); border:1px solid var(--border); padding:8px 14px; border-radius:999px;}
.nav-dots .dot{width:7px; height:7px; border-radius:50%; background:var(--border); cursor:pointer; transition:.2s;}
.nav-dots .dot.active{background:var(--accent); width:20px; border-radius:4px;}
.footer-note{position:fixed; bottom:20px; right:22px; z-index:50; font-size:.72rem; color:var(--text-dim); font-family:'JetBrains Mono';}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px}

.tac-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
@media (max-width:900px){.tac-grid{grid-template-columns:repeat(2,1fr);}}
.tac-tile{
  background:var(--panel-2); border:1px solid var(--border); border-radius:14px; padding:16px;
  cursor:pointer; transition:.2s; text-align:center;
}
.tac-tile:hover{transform:translateY(-4px); border-color:var(--accent); box-shadow:0 10px 24px rgba(62,193,255,.15);}
.tac-tile i{font-size:1.3rem; color:var(--accent); margin-bottom:6px; display:block;}
.tac-tile .tname{font-size:.82rem; font-weight:700;}

.sub-item{background:var(--panel-2); border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:10px;}
.sub-item .sname{font-weight:700; font-size:.94rem; color:var(--accent); margin-bottom:4px; display:flex; align-items:center; gap:8px;}
.sub-item .sdesc{font-size:.85rem; color:var(--text-dim); margin:0;}

.triangle{display:flex; gap:14px; flex-wrap:wrap; justify-content:center;}
.triangle .apex{flex:1; min-width:200px; border-radius:14px; padding:18px; text-align:center; border:1px solid var(--border);}
.apex-a{background:rgba(62,193,255,.10); border-color:rgba(62,193,255,.35);}
.apex-b{background:rgba(123,107,255,.10); border-color:rgba(123,107,255,.35);}
.apex-c{background:rgba(255,181,71,.10); border-color:rgba(255,181,71,.35);}

.arrow-relation{display:flex; align-items:center; justify-content:center; gap:14px; margin:16px 0;}
.arrow-relation .node{background:var(--panel-2); border:1px solid var(--border); border-radius:12px; padding:12px 20px; font-weight:700; text-align:center;}
.arrow-relation i{color:var(--accent); font-size:1.3rem;}
</style>
</head>
<body>

<div class="blueprint"></div>
<div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
<div class="brand"><i class="fa-solid fa-cubes"></i> ANDIS 2 · Unidad 3</div>
<div class="hud"><i class="fa-solid fa-layer-group"></i> <span class="unit-tag" id="hudCurrent">1</span>/<span id="hudTotal">0</span></div>

<div class="slides-container" id="slidesContainer"></div>

<div class="nav-controls">
  <button class="nav-btn" id="prevBtn"><i class="fa-solid fa-chevron-left"></i></button>
  <div class="nav-dots" id="navDots"></div>
  <button class="nav-btn" id="nextBtn"><i class="fa-solid fa-chevron-right"></i></button>
</div>
<div class="footer-note">← → para navegar</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.10.5/sweetalert2.all.min.js"></script>
<script>
const slidesHTML = [];

// 0. Portada
slidesHTML.push(`
<div class="slide-inner d-flex flex-column justify-content-center" style="min-height:78vh;">
  <div class="animate__animated animate__fadeInDown">
    <span class="eyebrow"><i class="fa-solid fa-puzzle-piece"></i> Unidad 3 · Soluciones arquitectónicas</span>
    <h1 class="slide-title">Modularidad, cohesión, acoplamiento y co-nascencia</h1>
    <p class="subtitle">Cuatro conceptos que responden la misma pregunta desde ángulos distintos: ¿qué va junto, y qué tan atado queda a lo demás?</p>
  </div>
</div>
`);

// 1. Modularidad
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-circle-question"></i> El concepto original</span>
  <h2 class="slide-title">Modularidad</h2>
  <div class="card-panel mt-3">
    <div class="d-flex gap-3">
      <div class="icon-tile"><i class="fa-solid fa-user"></i></div>
      <p style="font-size:1.02rem; line-height:1.75; margin:0;">
        <strong>David Parnas</strong> introdujo el concepto para referirse a la descomposición de un sistema en
        módulos <strong>altamente cohesivos</strong> y <strong>poco acoplados</strong>, donde cada módulo oculta sus
        detalles de implementación detrás de una <strong>interfaz</strong> y puede modificarse independientemente
        con muy poco o ningún impacto en otros módulos.
      </p>
    </div>
  </div>
  <div class="card-panel mt-3 d-flex gap-3 align-items-center">
    <div class="icon-tile" style="background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)"><i class="fa-solid fa-user-plus"></i></div>
    <div class="small" style="color:var(--text-dim)"><strong style="color:var(--text)">Meilir Page-Jones</strong> extendió el concepto: además, los módulos deben tener poca o nula <strong style="color:var(--text)">co-nascencia</strong>.</div>
  </div>
  <div class="card-panel mt-3 d-flex gap-3 align-items-center">
    <div class="icon-tile" style="background:rgba(255,181,71,.14); color:var(--accent-3); border-color:rgba(255,181,71,.4)"><i class="fa-solid fa-equals"></i></div>
    <div class="small" style="color:var(--text-dim)">A veces "modularidad" se usa para nombrar la <strong style="color:var(--text)">técnica</strong> de dividir un sistema en componentes discretos, desarrollables y reemplazables de forma independiente. En ese uso, <strong style="color:var(--text)">"módulo" y "componente" son intercambiables</strong>.</div>
  </div>
</div>
`);

// 2. Las tres formas de medir
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-ruler-combined"></i> Cómo se mide</span>
  <h2 class="slide-title">Tres formas de medir la modularidad</h2>
  <div class="triangle mt-3">
    <div class="apex apex-a"><i class="fa-solid fa-object-group mb-2 d-block" style="color:var(--accent)"></i><strong>Cohesión</strong><div class="small mt-1" style="color:var(--text-dim)">Qué tan relacionadas están las partes de un módulo entre sí</div></div>
    <div class="apex apex-b"><i class="fa-solid fa-link mb-2 d-block" style="color:#b3a8ff"></i><strong>Acoplamiento</strong><div class="small mt-1" style="color:var(--text-dim)">Conexiones entre partes de distintos módulos</div></div>
    <div class="apex apex-c"><i class="fa-solid fa-diagram-project mb-2 d-block" style="color:var(--accent-3)"></i><strong>Co-nascencia</strong><div class="small mt-1" style="color:var(--text-dim)">Si cambiar una parte obliga a cambiar otra</div></div>
  </div>
  <p class="subtitle mt-3 mb-0">Las tres se examinan en detalle en las próximas diapositivas.</p>
</div>
`);

// 3. Cohesión: definición y ejemplos de módulo/partes
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-object-group"></i> Primera medida</span>
  <h2 class="slide-title">Cohesión: ¿qué va junto?</h2>
  <div class="card-panel mt-3">
    <p style="font-size:1.02rem; line-height:1.75; margin:0;">
      Refiere a hasta qué punto las partes de un módulo deben estar contenidas dentro del mismo módulo: una medida
      de qué tan relacionadas están esas partes entre sí.
    </p>
  </div>
  <p class="subtitle mt-3 mb-2">Qué es "módulo" y qué son sus "partes" depende del contexto:</p>
  <div class="grid-2">
    <div class="sub-item"><div class="sname"><i class="fa-solid fa-box"></i>Despliegue (C#)</div><p class="sdesc">Módulo = ensamblado (assembly). Partes = tipos de datos definidos en él.</p></div>
    <div class="sub-item"><div class="sname"><i class="fa-solid fa-tag"></i>Definición de tipos (C#)</div><p class="sdesc">Módulo = espacio de nombres (namespace). Partes = tipos definidos en ese espacio.</p></div>
    <div class="sub-item"><div class="sname"><i class="fa-solid fa-cube"></i>Programación orientada a objetos</div><p class="sdesc">Módulo = clase. Partes = atributos y métodos de esa clase.</p></div>
    <div class="sub-item"><div class="sname"><i class="fa-solid fa-code"></i>Programación estructurada</div><p class="sdesc">Módulo = función o procedimiento. Partes = la lógica que implementan.</p></div>
  </div>
</div>
`);

// 4. Cohesión en arquitectura de software
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-cubes"></i> El caso que nos importa</span>
  <h2 class="slide-title">Cohesión en arquitectura de software</h2>
  <div class="card-panel mt-3">
    <div class="d-flex gap-3">
      <div class="icon-tile"><i class="fa-solid fa-question"></i></div>
      <p style="font-size:1.02rem; line-height:1.75; margin:0;">
        En este contexto, los módulos son <strong>componentes</strong> desplegables independientemente, y sus partes
        son las <strong>clases</strong> (o tipos de datos) contenidos en ese componente. La cohesión responde:
        <strong>¿qué clase pertenece a qué componente?</strong>
      </p>
    </div>
  </div>
  <div class="card-panel mt-3 d-flex gap-3 align-items-center">
    <div class="icon-tile" style="background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)"><i class="fa-solid fa-scale-unbalanced"></i></div>
    <div class="small" style="color:var(--text-dim)">Para responder esa pregunta con criterio existen los principios <strong style="color:var(--text)">REP, CCP y CRP</strong> — los vemos en la próxima clase.</div>
  </div>
</div>
`);

// 5. Cohesión-acoplamiento tradeoff + discrecionalidad
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-scale-balanced"></i> La tensión central</span>
  <h2 class="slide-title">Cohesión y acoplamiento van de la mano</h2>
  <div class="arrow-relation">
    <div class="node">Cohesión ↑</div>
    <i class="fa-solid fa-arrow-right"></i>
    <div class="node">Acoplamiento ↑</div>
  </div>
  <div class="card-panel">
    <p style="font-size:1rem; line-height:1.7;">
      Cuando aumenta la cohesión, también tiende a aumentar el acoplamiento — y viceversa. Lo mismo aplica para
      cohesión y co-nascencia. El problema: para la modularidad es bueno que la cohesión sea <strong>alta</strong>,
      pero también que el acoplamiento sea <strong>bajo</strong> al mismo tiempo. Ambas cosas tiran en direcciones
      opuestas.
    </p>
    <p style="font-size:1rem; line-height:1.7; margin-bottom:0;">
      Idealmente, un módulo cohesivo es aquel donde todas las partes deben estar juntas, porque separarlas
      requeriría <strong>acoplarlas</strong> de nuevo para lograr un resultado equivalente.
    </p>
  </div>
  <div class="card-panel mt-3 d-flex gap-3 align-items-center">
    <div class="icon-tile" style="background:rgba(255,181,71,.14); color:var(--accent-3); border-color:rgba(255,181,71,.4)"><i class="fa-solid fa-user-pen"></i></div>
    <div class="small" style="color:var(--text-dim)">La cohesión es muchas veces <strong style="color:var(--text)">discrecional</strong>: queda a criterio del arquitecto la mejor forma de repartir las partes. Ejemplo: un ensamblado C# es altamente cohesivo si sus tipos "van juntos" — si al desplegar o usar uno, hay grandes chances de desplegar o usar los demás.</div>
  </div>
</div>
`);

// 6. Acoplamiento
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-link"></i> Segunda medida</span>
  <h2 class="slide-title">Acoplamiento: aferente y eferente</h2>
  <div class="card-panel mt-3">
    <p style="font-size:1.02rem; line-height:1.75;">
      Refiere a la conexión entre partes de diferentes módulos, o entre módulos distintos.
    </p>
    <div class="grid-2 mt-2">
      <div class="sub-item"><div class="sname"><i class="fa-solid fa-arrow-right-to-bracket"></i>Aferente (hacia adentro)</div><p class="sdesc">Mide el número de conexiones entrantes a una parte de un módulo.</p></div>
      <div class="sub-item"><div class="sname"><i class="fa-solid fa-arrow-right-from-bracket"></i>Eferente (hacia afuera)</div><p class="sdesc">Mide las conexiones salientes hacia otras partes en otros módulos.</p></div>
    </div>
  </div>
  <div class="card-panel mt-3">
    <p class="small mb-0" style="color:var(--text-dim)"><strong style="color:var(--text)">Ejemplo:</strong> si una clase en un namespace de C# usa un tipo de otro namespace, necesita un <code>using</code>. El namespace que usa tiene acoplamiento <strong style="color:var(--text)">eferente</strong> con el otro; el usado tiene acoplamiento <strong style="color:var(--text)">aferente</strong> con el primero. Lo mismo pasa entre ensamblados, vía referencias de proyecto.</p>
  </div>
</div>
`);

// 7. Acoplamiento: menos discrecional + problema
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-triangle-exclamation"></i> Una diferencia clave con la cohesión</span>
  <h2 class="slide-title">El acoplamiento es menos discrecional</h2>
  <div class="card-panel mt-3">
    <p style="font-size:1.02rem; line-height:1.75; margin:0;">
      A diferencia de la cohesión, las conexiones salientes y entrantes están <strong>bien determinadas</strong> —
      no quedan tanto a criterio del arquitecto.
    </p>
  </div>
  <div class="card-panel mt-3 d-flex gap-3 align-items-center">
    <div class="icon-tile" style="background:rgba(255,181,71,.14); color:var(--accent-3); border-color:rgba(255,181,71,.4)"><i class="fa-solid fa-triangle-exclamation"></i></div>
    <div class="small" style="color:var(--text-dim)">Un ensamblado que referencia a muchos otros está <strong style="color:var(--text)">altamente acoplado</strong>: si cambian firmas de métodos o nombres de clases en esos otros ensamblados, hay grandes chances de tener que modificarlo y volver a desplegarlo también.</div>
  </div>
</div>
`);

// 8. Co-nascencia: definición
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-diagram-project"></i> Tercera medida</span>
  <h2 class="slide-title">Co-nascencia (connascence)</h2>
  <div class="card-panel mt-3">
    <div class="d-flex gap-3">
      <div class="icon-tile"><i class="fa-solid fa-link-slash"></i></div>
      <p style="font-size:1.02rem; line-height:1.75; margin:0;">
        Dos partes son co-nascentes si un cambio en una de ellas requiere modificar la otra para mantener la
        <strong>corrección general del sistema</strong>. Refina los conceptos de acoplamiento eferente y aferente
        específicamente para lenguajes orientados a objetos.
      </p>
    </div>
  </div>
  <div class="card-panel mt-3 d-flex gap-3 align-items-center">
    <div class="icon-tile" style="background:rgba(62,230,168,.12); color:var(--ok); border-color:rgba(62,230,168,.35)"><i class="fa-solid fa-language"></i></div>
    <div class="small" style="color:var(--text-dim)">"Nascencia" viene de "nacer": co-nascencia sería algo así como "nacer al mismo tiempo". En español no es un término muy común — se suele preferir directamente <strong style="color:var(--text)">connascence</strong>.</div>
  </div>
</div>
`);

// 9. Co-nascencia estática
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-lock"></i> Tipo 1</span>
  <h2 class="slide-title">Co-nascencia estática</h2>
  <p class="subtitle mb-3">Acoplamiento en tiempo de compilación.</p>
  <div class="tac-grid" id="gridEstatica"></div>
</div>
`);

// 10. Co-nascencia dinámica
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-bolt"></i> Tipo 2</span>
  <h2 class="slide-title">Co-nascencia dinámica</h2>
  <p class="subtitle mb-3">Acoplamiento en tiempo de ejecución — más difícil de determinar, por la falta de herramientas de análisis dinámico comparables a las de análisis estático de código.</p>
  <div class="tac-grid" id="gridDinamica"></div>
</div>
`);

// 11. Quiz
slidesHTML.push(`

<div class="slide-inner d-flex flex-column justify-content-center align-items-center text-center" style="min-height:78vh;">
  <div class="icon-tile mb-3" style="width:72px;height:72px;font-size:2rem;"><i class="fa-solid fa-check"></i></div>

/* ============ MOTOR DE NAVEGACIÓN ============ */
const container = document.getElementById('slidesContainer');
slidesHTML.forEach((html, i)=>{
  const div = document.createElement('div');
  div.className = 'slide' + (i===0 ? ' active' : '');
  div.id = 'slide'+i;
  div.innerHTML = html;
  container.appendChild(div);
});

let current = 0;
const total = slidesHTML.length;
document.getElementById('hudTotal').textContent = total;

const dotsWrap = document.getElementById('navDots');
for(let i=0;i<total;i++){
  const d = document.createElement('div');
  d.className = 'dot' + (i===0?' active':'');
  d.onclick = ()=>goTo(i);
  dotsWrap.appendChild(d);
}

function updateUI(){
  document.querySelectorAll('.slide').forEach((s,i)=>{ s.classList.toggle('active', i===current); });
  document.querySelectorAll('.nav-dots .dot').forEach((d,i)=>{ d.classList.toggle('active', i===current); });
  document.getElementById('hudCurrent').textContent = current+1;
  document.getElementById('progressFill').style.width = ((current+1)/total*100)+'%';
  const active = document.getElementById('slide'+current);
  active.scrollTop = 0;
  const animTarget = active.querySelector('.slide-inner');
  if(animTarget){
    animTarget.classList.remove('animate__fadeIn');
    void animTarget.offsetWidth;
    animTarget.classList.add('animate__animated','animate__fadeIn');
  }
}
function goTo(i){ if(i<0||i>=total) return; current = i; updateUI(); }
document.getElementById('prevBtn').onclick = ()=>goTo(current-1);
document.getElementById('nextBtn').onclick = ()=>goTo(current+1);
document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight') goTo(current+1);
  if(e.key==='ArrowLeft') goTo(current-1);
});
updateUI();

/* ============ CO-NASCENCIA: DATOS ============ */
const estatica = [
  {icon:'fa-signature', n:'De nombres', d:'Múltiples partes deben ponerse de acuerdo en el nombre de una entidad (por ejemplo, un identificador). El refactoring de "renombrar" que ofrecen los IDE hace trivial lidiar con este tipo.'},
  {icon:'fa-shapes', n:'De tipos', d:'Múltiples partes deben ponerse de acuerdo en el tipo de una propiedad, parámetro, variable local, o del resultado de un método.'},
  {icon:'fa-comment-dots', n:'De significado o convención', d:'Múltiples partes deben acordar la semántica de ciertos valores. Ejemplo: que true sea 1 y false sea 0, o que el primer elemento de un vector sea 0 o sea 1.'},
  {icon:'fa-arrow-down-1-9', n:'De posición', d:'Múltiples partes deben acordar el orden de los valores. Ejemplo: el orden de parámetros del mismo tipo en la firma de un método y en su invocación.'},
  {icon:'fa-diagram-project', n:'De algoritmos', d:'Múltiples partes deben acordar el algoritmo utilizado. Ejemplo: la función LOOKUP de Excel requiere que el vector esté ordenado ascendentemente, porque probablemente usa búsqueda binaria internamente.'}
];

const dinamica = [
  {icon:'fa-list-ol', n:'De orden de ejecución', d:'El orden en que se ejecutan distintas partes importa. Ejemplo: en un ORM, asignar todas las propiedades de un objeto nuevo antes de persistirlo en la base de datos.'},
  {icon:'fa-clock', n:'De tiempo', d:'El momento de ejecución de varias partes importa. Ejemplo: una condición de carrera (race condition).'},
  {icon:'fa-equals', n:'De valores', d:'Varios valores están relacionados entre sí y deben cambiar simultáneamente. Ejemplo: las transacciones en una base de datos permiten lidiar con este tipo de acoplamiento.'},
  {icon:'fa-fingerprint', n:'De identidad', d:'Varias partes deben referenciar exactamente a la misma entidad. Ejemplo: una clave primaria en una base de datos.'}
];

function renderGrid(containerId, items){
  const grid = document.getElementById(containerId);
  items.forEach(t=>{
    const tile = document.createElement('div');
    tile.className = 'tac-tile';
    tile.innerHTML = `<i class="fa-solid ${t.icon}"></i><div class="tname">${t.n}</div>`;
    tile.onclick = ()=>{
      Swal.fire({
        title: t.n,
        html: `<p style="text-align:left;">${t.d}</p>`,
        background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
      });
    };
    grid.appendChild(tile);
  });
}
renderGrid('gridEstatica', estatica);
renderGrid('gridDinamica', dinamica);

/* ============ QUIZ ============ */
const preguntas = [
  {
    texto:'¿Qué agregó Meilir Page-Jones al concepto original de modularidad de David Parnas?',
    opciones:{
      a:'Que los módulos deben tener poca o nula co-nascencia, además de alta cohesión y bajo acoplamiento',
      b:'Que los módulos deben poder desplegarse siempre en contenedores Docker',
      c:'Que los módulos solo pueden existir en lenguajes orientados a objetos',
      d:'Que los módulos deben tener exactamente una sola clase cada uno'
    },
    correcta:'a'
  },
  {
    texto:'En arquitectura de software, ¿qué pregunta responde la cohesión, según el texto?',
    opciones:{
      a:'Qué proveedor de nube conviene usar para desplegar el sistema',
      b:'Qué clase pertenece a qué componente',
      c:'Cuánto tiempo tarda el sistema en responder a una solicitud',
      d:'Cuántas réplicas de un componente son necesarias para alta disponibilidad'
    },
    correcta:'b'
  },
  {
    texto:'¿Qué mide el acoplamiento "aferente" de una parte de un módulo?',
    opciones:{
      a:'El número de conexiones entrantes hacia esa parte',
      b:'El número de conexiones salientes desde esa parte hacia otros módulos',
      c:'La cantidad de líneas de código que contiene esa parte',
      d:'La cantidad de pruebas unitarias que cubren esa parte'
    },
    correcta:'a'
  },
  {
    texto:'¿Cuál es la diferencia principal entre acoplamiento y cohesión en cuanto a discrecionalidad, según el texto?',
    opciones:{
      a:'Ambos son igual de discrecionales, no hay diferencia',
      b:'El acoplamiento es menos discrecional: las conexiones entrantes y salientes están bien determinadas, mientras que la cohesión depende más del criterio del arquitecto',
      c:'La cohesión nunca depende del criterio del arquitecto, siempre está determinada por el compilador',
      d:'El acoplamiento es completamente discrecional y no se puede medir'
    },
    correcta:'b'
  },
  {
    texto:'Una condición de carrera (race condition) es un ejemplo del texto para ilustrar, ¿qué tipo de co-nascencia?',
    opciones:{
      a:'Co-nascencia estática de nombres',
      b:'Co-nascencia estática de algoritmos',
      c:'Co-nascencia dinámica de tiempo',
      d:'Co-nascencia dinámica de identidad'
    },
    correcta:'c'
  }
];
let idxPregunta = 0, aciertos = 0;

function lanzarQuiz(){ idxPregunta = 0; aciertos = 0; mostrarPregunta(); }
function mostrarPregunta(){
  if(idxPregunta >= preguntas.length){
    Swal.fire({
      title:'Resultado',
      html:`Acertaste <b>${aciertos}/${preguntas.length}</b>.`,
      icon: aciertos===preguntas.length ? 'success' : 'info',
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    });
    return;
  }
  const p = preguntas[idxPregunta];
  Swal.fire({
    title: p.texto,
    input:'radio',
    inputOptions: p.opciones,
    background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff',
    confirmButtonText:'Responder',
    inputValidator: (value)=> !value && 'Elegí una opción'
  }).then(res=>{
    if(!res.isConfirmed) return;
    const ok = res.value === p.correcta;
    if(ok) aciertos++;
    Swal.fire({
      title: ok ? '¡Correcto!' : 'No es así',
      html: `La respuesta correcta era: <b>${p.opciones[p.correcta]}</b>`,
      icon: ok ? 'success' : 'error',
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    }).then(()=>{ idxPregunta++; mostrarPregunta(); });
  });
}
</script>

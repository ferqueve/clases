<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANDIS 2 · Unidad 2 — Tácticas para la protección</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#070b14; --bg-1:#0d1424; --panel:#111a2e; --panel-2:#16223a;
  --accent:#3ec1ff; --accent-2:#7b6bff; --accent-3:#ffb547; --ok:#3ee6a8;
  --text:#e8edf7; --text-dim:#8fa0bd; --border:#22304d;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(1200px 700px at 15% -10%, rgba(62,193,255,.10), transparent 60%),
    radial-gradient(1000px 700px at 110% 10%, rgba(123,107,255,.12), transparent 55%),
    var(--bg-0);
  color:var(--text); font-family:'Inter',sans-serif; overflow:hidden;
}
.mono{font-family:'JetBrains Mono',monospace}
.blueprint{
  position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.35;
  background-image:linear-gradient(rgba(62,193,255,.06) 1px, transparent 1px),linear-gradient(90deg, rgba(62,193,255,.06) 1px, transparent 1px);
  background-size:42px 42px;
}
.progress-track{position:fixed; top:0; left:0; width:100%; height:4px; background:rgba(255,255,255,.06); z-index:50;}
.progress-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--accent-2)); transition:width .4s ease; box-shadow:0 0 12px var(--accent);}
.hud{position:fixed; top:14px; right:18px; z-index:50; background:rgba(17,26,46,.85); border:1px solid var(--border); backdrop-filter:blur(6px); padding:7px 14px; border-radius:999px; font-size:.82rem; color:var(--text-dim); display:flex; align-items:center; gap:8px;}
.hud .unit-tag{color:var(--accent); font-weight:700}
.brand{position:fixed; top:14px; left:18px; z-index:50; font-size:.78rem; color:var(--text-dim); display:flex; align-items:center; gap:8px; letter-spacing:.03em;}
.brand i{color:var(--accent-3)}
.slides-container{position:relative; z-index:1; height:100vh; width:100vw;}
.slide{position:absolute; inset:0; display:none; padding:90px 8vw 110px 8vw; overflow-y:auto;}
.slide.active{display:block}
.slide-inner{max-width:1180px; margin:0 auto;}
.eyebrow{display:inline-flex; align-items:center; gap:8px; font-size:.78rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent); font-weight:700; margin-bottom:14px;}
.eyebrow i{font-size:.9rem}
h1.slide-title{font-size:clamp(1.9rem,3.4vw,3rem); font-weight:800; margin-bottom:.4rem; line-height:1.1;}
h2.slide-title{font-size:clamp(1.5rem,2.6vw,2.2rem); font-weight:800; margin-bottom:.6rem;}
.subtitle{color:var(--text-dim); font-size:1.05rem; max-width:820px;}
.card-panel{background:linear-gradient(180deg, var(--panel), var(--panel-2)); border:1px solid var(--border); border-radius:16px; padding:26px 28px; box-shadow:0 12px 30px rgba(0,0,0,.35);}
.card-panel + .card-panel{margin-top:18px}
.pill{display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:999px; font-size:.76rem; font-weight:700; background:rgba(62,193,255,.12); color:var(--accent); border:1px solid rgba(62,193,255,.35);}
.pill.purple{background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)}
.pill.amber{background:rgba(255,181,71,.14); color:var(--accent-3); border-color:rgba(255,181,71,.4)}
.pill.ok{background:rgba(62,230,168,.12); color:var(--ok); border-color:rgba(62,230,168,.35)}
.icon-tile{width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center; background:rgba(62,193,255,.12); color:var(--accent); font-size:1.3rem; border:1px solid rgba(62,193,255,.3); flex-shrink:0;}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
.grid-4{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
@media (max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}
ul.clean{list-style:none; margin:0; padding:0;}
ul.clean li{position:relative; padding:6px 0 6px 26px; color:var(--text); font-size:.94rem;}
ul.clean li::before{content:"\f105"; font-family:"Font Awesome 6 Free"; font-weight:900; color:var(--accent); position:absolute; left:2px; top:8px; font-size:.85rem;}
.check-btn{border:none; background:linear-gradient(90deg,var(--accent),var(--accent-2)); color:#04101f; font-weight:800; padding:10px 22px; border-radius:10px; font-size:.9rem; box-shadow:0 8px 22px rgba(62,193,255,.25); cursor:pointer;}
.check-btn:hover{filter:brightness(1.08); color:#04101f;}
.nav-controls{position:fixed; bottom:18px; left:0; right:0; z-index:50; display:flex; justify-content:center; gap:14px; align-items:center;}
.nav-btn{width:46px; height:46px; border-radius:50%; border:1px solid var(--border); background:rgba(17,26,46,.9); color:var(--text); display:flex; align-items:center; justify-content:center; font-size:1.1rem; backdrop-filter:blur(6px);}
.nav-btn:hover{border-color:var(--accent); color:var(--accent);}
.nav-dots{display:flex; gap:6px; align-items:center; background:rgba(17,26,46,.9); border:1px solid var(--border); padding:8px 14px; border-radius:999px;}
.nav-dots .dot{width:7px; height:7px; border-radius:50%; background:var(--border); cursor:pointer; transition:.2s;}
.nav-dots .dot.active{background:var(--accent); width:20px; border-radius:4px;}
.footer-note{position:fixed; bottom:20px; right:22px; z-index:50; font-size:.72rem; color:var(--text-dim); font-family:'JetBrains Mono';}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px}

.tac-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
@media (max-width:900px){.tac-grid{grid-template-columns:repeat(2,1fr);}}
.tac-tile{
  background:var(--panel-2); border:1px solid var(--border); border-radius:14px; padding:16px;
  cursor:pointer; transition:.2s; text-align:center;
}
.tac-tile:hover{transform:translateY(-4px); border-color:var(--accent); box-shadow:0 10px 24px rgba(62,193,255,.15);}
.tac-tile i{font-size:1.3rem; color:var(--accent); margin-bottom:6px; display:block;}
.tac-tile .tname{font-size:.82rem; font-weight:700;}
.tac-tile .badge-reused{display:block; font-size:.62rem; color:var(--ok); margin-top:3px;}

.link-row{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid rgba(255,255,255,.06);}
.link-row:last-child{border-bottom:none;}
.link-row a{color:var(--text); text-decoration:none; font-weight:600;}
.link-row a:hover{color:var(--accent);}
.link-row .ext{margin-left:auto; color:var(--text-dim); font-size:.75rem;}

.tree{display:flex; gap:14px; flex-wrap:wrap; justify-content:center;}
.tree .branch{flex:1; min-width:200px; border-radius:14px; padding:16px; text-align:center; border:1px solid var(--border);}
.branch-a{background:rgba(62,193,255,.10); border-color:rgba(62,193,255,.35);}
.branch-b{background:rgba(123,107,255,.10); border-color:rgba(123,107,255,.35);}
.branch-c{background:rgba(255,181,71,.10); border-color:rgba(255,181,71,.35);}
.branch-d{background:rgba(62,230,168,.10); border-color:rgba(62,230,168,.35);}

.subhead{font-size:.78rem; text-transform:uppercase; letter-spacing:.08em; color:var(--accent); font-weight:700; margin:18px 0 8px 0;}
.subhead:first-child{margin-top:0;}
</style>
</head>
<body>

<div class="blueprint"></div>
<div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
<div class="brand"><i class="fa-solid fa-cubes"></i> ANDIS 2 · Unidad 2</div>
<div class="hud"><i class="fa-solid fa-layer-group"></i> <span class="unit-tag" id="hudCurrent">1</span>/<span id="hudTotal">0</span></div>

<div class="slides-container" id="slidesContainer"></div>

<div class="nav-controls">
  <button class="nav-btn" id="prevBtn"><i class="fa-solid fa-chevron-left"></i></button>
  <div class="nav-dots" id="navDots"></div>
  <button class="nav-btn" id="nextBtn"><i class="fa-solid fa-chevron-right"></i></button>
</div>
<div class="footer-note">← → para navegar</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.10.5/sweetalert2.all.min.js"></script>
<script>
const slidesHTML = [];

// 0. Portada
slidesHTML.push(`
<div class="slide-inner d-flex flex-column justify-content-center" style="min-height:78vh;">
  <div class="animate__animated animate__fadeInDown">
    <span class="eyebrow"><i class="fa-solid fa-toolbox"></i> Unidad 2 · Tácticas de arquitectura</span>
    <h1 class="slide-title">Tácticas para la protección</h1>
    <p class="subtitle">Evitar, detectar, contener y recuperarse de estados desprotegidos — con más de una táctica prestada del catálogo de disponibilidad.</p>
  </div>
</div>
`);

// 1. Introducción
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-circle-question"></i> Punto de partida</span>
  <h2 class="slide-title">Tres grandes clasificaciones</h2>
  <div class="card-panel mt-3">
    <p style="font-size:1.02rem; line-height:1.75;">
      Las tácticas para protección se clasifican ampliamente como <strong>prevención</strong>, <strong>detección</strong>
      o <strong>remediación</strong> de estados inseguros.
    </p>
  </div>
  <div class="card-panel mt-3 d-flex gap-3 align-items-center">
    <div class="icon-tile" style="background:rgba(255,181,71,.14); color:var(--accent-3); border-color:rgba(255,181,71,.4)"><i class="fa-solid fa-magnifying-glass-chart"></i></div>
    <div class="small" style="color:var(--text-dim)">Una condición previa lógica para evitar o detectar un estado inseguro es poder <strong style="color:var(--text)">reconocerlo</strong> — lo cual implica haber hecho un <strong style="color:var(--text)">FTA</strong> (Fault Tree Analysis, análisis de árbol de fallas).</div>
  </div>
  <div class="card-panel mt-3 d-flex gap-3 align-items-center">
    <div class="icon-tile" style="background:rgba(62,230,168,.12); color:var(--ok); border-color:rgba(62,230,168,.35)"><i class="fa-solid fa-recycle"></i></div>
    <div class="small" style="color:var(--text-dim)">Varias tácticas de protección son <strong style="color:var(--text)">las mismas</strong> que ya viste en disponibilidad — las tarjetas marcadas "ya vista" te lo recuerdan.</div>
  </div>
</div>
`);

// 2. Taxonomía
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-sitemap"></i> El mapa completo</span>
  <h2 class="slide-title">Cuatro ramas, dieciocho tácticas</h2>
  <div class="tree mt-3">
    <div class="branch branch-a"><i class="fa-solid fa-ban mb-2 d-block" style="color:var(--accent)"></i><strong>Evitar estados desprotegidos</strong><div class="small mt-1" style="color:var(--text-dim)">2 tácticas</div></div>
    <div class="branch branch-b"><i class="fa-solid fa-magnifying-glass mb-2 d-block" style="color:#b3a8ff"></i><strong>Detección</strong><div class="small mt-1" style="color:var(--text-dim)">5 tácticas</div></div>
    <div class="branch branch-c"><i class="fa-solid fa-shield-halved mb-2 d-block" style="color:var(--accent-3)"></i><strong>Contención</strong><div class="small mt-1" style="color:var(--text-dim)">Redundancia (3) + Limitar consecuencias (3) + Barreras (2)</div></div>
    <div class="branch branch-d"><i class="fa-solid fa-heart-pulse mb-2 d-block" style="color:var(--ok)"></i><strong>Recuperación</strong><div class="small mt-1" style="color:var(--text-dim)">3 tácticas</div></div>
  </div>
</div>
`);

// 3. Explorador: Evitar
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-ban"></i> Rama 1</span>
  <h2 class="slide-title">Evitar los estados desprotegidos</h2>
  <p class="subtitle mb-3">Impedir que el sistema entre en un estado peligroso, en primer lugar.</p>
  <div class="tac-grid" id="gridEvitar"></div>
</div>
`);

// 4. Explorador: Detección
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-magnifying-glass"></i> Rama 2</span>
  <h2 class="slide-title">Detección de estados desprotegidos</h2>
  <p class="subtitle mb-3">Reconocer que algo ya está mal, antes de que cause más daño.</p>
  <div class="tac-grid" id="gridDeteccion"></div>
</div>
`);

// 5. Explorador: Contención
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-shield-halved"></i> Rama 3</span>
  <h2 class="slide-title">Contención</h2>
  <p class="subtitle mb-3">Ya detectado el problema: limitar su alcance por redundancia, por reducir consecuencias, o con barreras.</p>
  <div class="subhead">Redundancia</div>
  <div class="tac-grid" id="gridRedundancia"></div>
  <div class="subhead">Limitar las consecuencias</div>
  <div class="tac-grid" id="gridConsecuencias"></div>
  <div class="subhead">Barreras</div>
  <div class="tac-grid" id="gridBarreras"></div>
</div>
`);

// 6. Explorador: Recuperación
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-heart-pulse"></i> Rama 4</span>
  <h2 class="slide-title">Recuperación</h2>
  <p class="subtitle mb-3">Volver a un estado seguro y operativo.</p>
  <div class="tac-grid" id="gridRecuperacion"></div>
</div>
`);

// 7. Sustitución en detalle
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-microchip"></i> Un caso destacado</span>
  <h2 class="slide-title">Sustitución: protección por hardware</h2>
  <div class="card-panel mt-3">
    <div class="d-flex gap-3">
      <div class="icon-tile"><i class="fa-solid fa-gears"></i></div>
      <p style="font-size:1.02rem; line-height:1.75; margin:0;">
        Emplea mecanismos de protección —usualmente por <strong>hardware</strong>— para controlar características
        potencialmente dañinas. Caen en esta categoría los <strong>watchdogs</strong>, los <strong>interlocks</strong>
        y los <strong>monitores</strong>.
      </p>
    </div>
  </div>
  <div class="card-panel mt-3 d-flex gap-3 align-items-center">
    <div class="icon-tile" style="background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)"><i class="fa-solid fa-atom"></i></div>
    <div class="small" style="color:var(--text-dim)">Ejemplo real: el <strong style="color:var(--text)">Software Interlock System</strong> del Super Proton Synchrotron en el CERN protege partes del acelerador vigilando el estado de dispositivos clave y deteniendo el haz de partículas ante una situación potencialmente peligrosa.</div>
  </div>
  <div class="card-panel mt-3">
    <div class="link-row">
      <i class="fa-solid fa-link" style="color:var(--accent)"></i>
      <a href="https://www.researchgate.net/publication/230691185_SOFTWARE_INTERLOCKS_SYSTEM" target="_blank">Software Interlocks System (CERN SPS)</a>
      <span class="ext">ResearchGate</span>
    </div>
  </div>
</div>
`);

// 8. Quiz
slidesHTML.push(`
<div class="slide-inner d-flex flex-column justify-content-center align-items-center text-center" style="min-height:70vh;">
  <span class="eyebrow"><i class="fa-solid fa-brain"></i> Chequeo de comprensión</span>
  <h2 class="slide-title">5 preguntas sobre tácticas de protección</h2>
  <p class="subtitle mb-4">Las 3 clasificaciones, la contención y qué se comparte con disponibilidad.</p>
  <button class="check-btn" onclick="lanzarQuiz()"><i class="fa-solid fa-play me-2"></i>Iniciar quiz</button>
</div>
`);

// 9. Cierre
slidesHTML.push(`
<div class="slide-inner d-flex flex-column justify-content-center align-items-center text-center" style="min-height:78vh;">
  <div class="icon-tile mb-3" style="width:72px;height:72px;font-size:2rem;"><i class="fa-solid fa-check"></i></div>
  <span class="eyebrow"><i class="fa-solid fa-flag-checkered"></i> Repaso completo</span>
  <h2 class="slide-title">Protección: el mismo ciclo, con más en juego</h2>
  <p class="subtitle mb-4" style="max-width:640px;">Evitar, detectar, contener, recuperar — y reconocer que buena parte del catálogo ya lo conocés de disponibilidad. La diferencia está en qué hay en juego cuando algo falla.</p>
</div>
`);

/* ============ MOTOR DE NAVEGACIÓN ============ */
const container = document.getElementById('slidesContainer');
slidesHTML.forEach((html, i)=>{
  const div = document.createElement('div');
  div.className = 'slide' + (i===0 ? ' active' : '');
  div.id = 'slide'+i;
  div.innerHTML = html;
  container.appendChild(div);
});

let current = 0;
const total = slidesHTML.length;
document.getElementById('hudTotal').textContent = total;

const dotsWrap = document.getElementById('navDots');
for(let i=0;i<total;i++){
  const d = document.createElement('div');
  d.className = 'dot' + (i===0?' active':'');
  d.onclick = ()=>goTo(i);
  dotsWrap.appendChild(d);
}

function updateUI(){
  document.querySelectorAll('.slide').forEach((s,i)=>{ s.classList.toggle('active', i===current); });
  document.querySelectorAll('.nav-dots .dot').forEach((d,i)=>{ d.classList.toggle('active', i===current); });
  document.getElementById('hudCurrent').textContent = current+1;
  document.getElementById('progressFill').style.width = ((current+1)/total*100)+'%';
  const active = document.getElementById('slide'+current);
  active.scrollTop = 0;
  const animTarget = active.querySelector('.slide-inner');
  if(animTarget){
    animTarget.classList.remove('animate__fadeIn');
    void animTarget.offsetWidth;
    animTarget.classList.add('animate__animated','animate__fadeIn');
  }
}
function goTo(i){ if(i<0||i>=total) return; current = i; updateUI(); }
document.getElementById('prevBtn').onclick = ()=>goTo(current-1);
document.getElementById('nextBtn').onclick = ()=>goTo(current+1);
document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight') goTo(current+1);
  if(e.key==='ArrowLeft') goTo(current-1);
});
updateUI();

/* ============ DATOS DE TÁCTICAS ============ */
const evitar = [
  {icon:'fa-microchip', n:'Sustitución', d:'Mecanismos de protección, usualmente por hardware, para controlar características potencialmente dañinas: watchdogs, interlocks, monitores. Ver el ejemplo del CERN en la próxima diapositiva.'},
  {icon:'fa-brain', n:'Modelo predictivo', d:'Usa aprendizaje automático y análisis predictivo sobre datos de monitoreo para anticipar fallas antes de que ocurran.', reused:true}
];

const deteccion = [
  {icon:'fa-check-double', n:'Control de cordura (sanity check)', d:'Verificación simple y rápida de que los valores recibidos o calculados, o el estado de un componente, son razonables.', reused:true},
  {icon:'fa-scale-balanced', n:'Comparación', d:'Verifica los resultados de una operación comparándolos con los de sistemas redundantes. Se usa junto con las tácticas de redundancia, y ayuda a detectar fallos antes de que causen estados inseguros.'},
  {icon:'fa-hourglass-half', n:'Tiempo de espera (timeout)', d:'Define un límite máximo de tiempo para esperar una respuesta. Si no llega, se asume un fallo y se actúa para evitar entrar en un estado inseguro por razones de tiempo.'},
  {icon:'fa-gauge', n:'Monitoreo de condiciones', d:'Verificar condiciones específicas de operación para identificar anomalías respecto de lo asumido en el diseño.', reused:true},
  {icon:'fa-clock', n:'Timestamp', d:'Asociar una marca de tiempo a eventos o mensajes, para rastrear cuándo ocurrió una falla.', reused:true}
];

const redundancia = [
  {icon:'fa-copy', n:'Replicación', d:'Copias exactas de un componente listas para tomar su lugar si una falla, sincrónica o asíncrona.', reused:true},
  {icon:'fa-chart-line', n:'Redundancia analítica', d:'Distintos métodos o algoritmos analizan el mismo conjunto de datos para obtener un resultado consensuado.', reused:true},
  {icon:'fa-code-branch', n:'Redundancia funcional', d:'Varias implementaciones distintas cumplen la misma tarea; si una falla, otra puede seguir operando.', reused:true}
];

const consecuencias = [
  {icon:'fa-mask', n:'Enmascaramiento (masking)', d:'Oculta un error comparando el resultado de varios componentes redundantes, con un criterio de votación en caso de diferencias. Debe ser simple y muy confiable para funcionar.'},
  {icon:'fa-hand', n:'Abortar', d:'Detiene una operación que conduce hacia un estado inseguro, o está en riesgo de hacerlo, antes de que cause más daño.'},
  {icon:'fa-battery-quarter', n:'Degradación', d:'Reducción deliberada de la funcionalidad del sistema en respuesta a un fallo, para mantener un nivel mínimo de operación segura.'}
];

const barreras = [
  {icon:'fa-fire-extinguisher', n:'Cortafuegos (firewall)', d:'Limita el acceso a recursos específicos: típicamente procesadores, memoria o conexiones de red.'},
  {icon:'fa-lock', n:'Interlock', d:'Protege contra fallas causadas por la ocurrencia de eventos en un orden incorrecto. Relacionado con la táctica de sustitución.'}
];

const recuperacion = [
  {icon:'fa-rotate-left', n:'Rollback', d:'Revierte un cambio a un estado anterior si se detectan problemas, restaurando datos y configuraciones.', reused:true},
  {icon:'fa-sliders', n:'Re-configuración', d:'Ajusta dinámicamente la configuración del sistema para reasignar responsabilidades a componentes que siguen funcionando.', reused:true},
  {icon:'fa-user-doctor', n:'Reparación del estado (repair state)', d:'Toma acciones concretas para volver el sistema a un estado seguro.'}
];

function renderGrid(containerId, items){
  const grid = document.getElementById(containerId);
  items.forEach(t=>{
    const tile = document.createElement('div');
    tile.className = 'tac-tile';
    const badge = t.reused ? '<span class="badge-reused"><i class="fa-solid fa-recycle"></i> ya vista</span>' : '';
    tile.innerHTML = `<i class="fa-solid ${t.icon}"></i><div class="tname">${t.n}</div>${badge}`;
    tile.onclick = ()=>{
      Swal.fire({
        title: t.n,
        html: `<p style="text-align:left;">${t.d}</p>`,
        background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
      });
    };
    grid.appendChild(tile);
  });
}
renderGrid('gridEvitar', evitar);
renderGrid('gridDeteccion', deteccion);
renderGrid('gridRedundancia', redundancia);
renderGrid('gridConsecuencias', consecuencias);
renderGrid('gridBarreras', barreras);
renderGrid('gridRecuperacion', recuperacion);

/* ============ QUIZ ============ */
const preguntas = [
  {
    texto:'¿Cuáles son las tres grandes clasificaciones de las tácticas de protección?',
    opciones:{
      a:'Diseño, implementación y prueba',
      b:'Prevención, detección y remediación de estados inseguros',
      c:'Hardware, software y redes',
      d:'Monitoreo, alerta y facturación'
    },
    correcta:'b'
  },
  {
    texto:'¿Qué condición previa lógica menciona el texto para poder evitar o detectar un estado inseguro?',
    opciones:{
      a:'Haber realizado un análisis de árbol de fallas (FTA) que permita reconocer qué constituye un estado inseguro',
      b:'Contar con al menos tres proveedores de nube distintos',
      c:'Tener certificación ISO 27001 vigente',
      d:'Haber automatizado el 100% del deployment pipeline'
    },
    correcta:'a'
  },
  {
    texto:'¿Qué táctica de contención oculta un error comparando el resultado de varios componentes redundantes mediante un criterio de votación?',
    opciones:{
      a:'Abortar',
      b:'Degradación',
      c:'Enmascaramiento (masking)',
      d:'Cortafuegos'
    },
    correcta:'c'
  },
  {
    texto:'¿Cuál de las siguientes tácticas de protección es también una táctica de disponibilidad, según el texto?',
    opciones:{
      a:'Interlock',
      b:'Rollback',
      c:'Enmascaramiento',
      d:'Reparación del estado'
    },
    correcta:'b'
  },
  {
    texto:'¿Qué limita específicamente la táctica de "cortafuegos (firewall)"?',
    opciones:{
      a:'El tiempo máximo de espera de una respuesta',
      b:'El acceso a recursos específicos, típicamente procesadores, memoria o conexiones de red',
      c:'La cantidad de réplicas de un componente redundante',
      d:'El orden en el que llegan los eventos a un componente'
    },
    correcta:'b'
  }
];
let idxPregunta = 0, aciertos = 0;

function lanzarQuiz(){ idxPregunta = 0; aciertos = 0; mostrarPregunta(); }
function mostrarPregunta(){
  if(idxPregunta >= preguntas.length){
    Swal.fire({
      title:'Resultado',
      html:`Acertaste <b>${aciertos}/${preguntas.length}</b>.`,
      icon: aciertos===preguntas.length ? 'success' : 'info',
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    });
    return;
  }
  const p = preguntas[idxPregunta];
  Swal.fire({
    title: p.texto,
    input:'radio',
    inputOptions: p.opciones,
    background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff',
    confirmButtonText:'Responder',
    inputValidator: (value)=> !value && 'Elegí una opción'
  }).then(res=>{
    if(!res.isConfirmed) return;
    const ok = res.value === p.correcta;
    if(ok) aciertos++;
    Swal.fire({
      title: ok ? '¡Correcto!' : 'No es así',
      html: `La respuesta correcta era: <b>${p.opciones[p.correcta]}</b>`,
      icon: ok ? 'success' : 'error',
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    }).then(()=>{ idxPregunta++; mostrarPregunta(); });
  });
}
</script>

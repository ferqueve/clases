<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANDIS 2 · Unidad 3 — Messaging</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#070b14; --bg-1:#0d1424; --panel:#111a2e; --panel-2:#16223a;
  --accent:#3ec1ff; --accent-2:#7b6bff; --accent-3:#ffb547; --ok:#3ee6a8;
  --text:#e8edf7; --text-dim:#8fa0bd; --border:#22304d;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(1200px 700px at 15% -10%, rgba(62,193,255,.10), transparent 60%),
    radial-gradient(1000px 700px at 110% 10%, rgba(123,107,255,.12), transparent 55%),
    var(--bg-0);
  color:var(--text); font-family:'Inter',sans-serif; overflow:hidden;
}
.mono{font-family:'JetBrains Mono',monospace}
.blueprint{
  position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.35;
  background-image:linear-gradient(rgba(62,193,255,.06) 1px, transparent 1px),linear-gradient(90deg, rgba(62,193,255,.06) 1px, transparent 1px);
  background-size:42px 42px;
}
.progress-track{position:fixed; top:0; left:0; width:100%; height:4px; background:rgba(255,255,255,.06); z-index:50;}
.progress-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--accent-2)); transition:width .4s ease; box-shadow:0 0 12px var(--accent);}
.hud{position:fixed; top:14px; right:18px; z-index:50; background:rgba(17,26,46,.85); border:1px solid var(--border); backdrop-filter:blur(6px); padding:7px 14px; border-radius:999px; font-size:.82rem; color:var(--text-dim); display:flex; align-items:center; gap:8px;}
.hud .unit-tag{color:var(--accent); font-weight:700}
.brand{position:fixed; top:14px; left:18px; z-index:50; font-size:.78rem; color:var(--text-dim); display:flex; align-items:center; gap:8px; letter-spacing:.03em;}
.brand i{color:var(--accent-3)}
.slides-container{position:relative; z-index:1; height:100vh; width:100vw;}
.slide{position:absolute; inset:0; display:none; padding:90px 8vw 110px 8vw; overflow-y:auto;}
.slide.active{display:block}
.slide-inner{max-width:1180px; margin:0 auto;}
.eyebrow{display:inline-flex; align-items:center; gap:8px; font-size:.78rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent); font-weight:700; margin-bottom:14px;}
.eyebrow i{font-size:.9rem}
h1.slide-title{font-size:clamp(1.9rem,3.4vw,3rem); font-weight:800; margin-bottom:.4rem; line-height:1.1;}
h2.slide-title{font-size:clamp(1.5rem,2.6vw,2.2rem); font-weight:800; margin-bottom:.6rem;}
.subtitle{color:var(--text-dim); font-size:1.05rem; max-width:820px;}
.card-panel{background:linear-gradient(180deg, var(--panel), var(--panel-2)); border:1px solid var(--border); border-radius:16px; padding:26px 28px; box-shadow:0 12px 30px rgba(0,0,0,.35);}
.card-panel + .card-panel{margin-top:18px}
.pill{display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:999px; font-size:.76rem; font-weight:700; background:rgba(62,193,255,.12); color:var(--accent); border:1px solid rgba(62,193,255,.35);}
.pill.purple{background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)}
.pill.amber{background:rgba(255,181,71,.14); color:var(--accent-3); border-color:rgba(255,181,71,.4)}
.pill.ok{background:rgba(62,230,168,.12); color:var(--ok); border-color:rgba(62,230,168,.35)}
.pill.bad{background:rgba(255,107,107,.12); color:#ff6b6b; border-color:rgba(255,107,107,.35)}
.icon-tile{width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center; background:rgba(62,193,255,.12); color:var(--accent); font-size:1.3rem; border:1px solid rgba(62,193,255,.3); flex-shrink:0;}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
.grid-4{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
@media (max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}
ul.clean{list-style:none; margin:0; padding:0;}
ul.clean li{position:relative; padding:6px 0 6px 26px; color:var(--text); font-size:.94rem;}
ul.clean li::before{content:"\f105"; font-family:"Font Awesome 6 Free"; font-weight:900; color:var(--accent); position:absolute; left:2px; top:8px; font-size:.85rem;}
.check-btn{border:none; background:linear-gradient(90deg,var(--accent),var(--accent-2)); color:#04101f; font-weight:800; padding:10px 22px; border-radius:10px; font-size:.9rem; box-shadow:0 8px 22px rgba(62,193,255,.25); cursor:pointer;}
.check-btn:hover{filter:brightness(1.08); color:#04101f;}
.nav-controls{position:fixed; bottom:18px; left:0; right:0; z-index:50; display:flex; justify-content:center; gap:14px; align-items:center;}
.nav-btn{width:46px; height:46px; border-radius:50%; border:1px solid var(--border); background:rgba(17,26,46,.9); color:var(--text); display:flex; align-items:center; justify-content:center; font-size:1.1rem; backdrop-filter:blur(6px);}
.nav-btn:hover{border-color:var(--accent); color:var(--accent);}
.nav-dots{display:flex; gap:6px; align-items:center; background:rgba(17,26,46,.9); border:1px solid var(--border); padding:8px 14px; border-radius:999px;}
.nav-dots .dot{width:7px; height:7px; border-radius:50%; background:var(--border); cursor:pointer; transition:.2s;}
.nav-dots .dot.active{background:var(--accent); width:20px; border-radius:4px;}
.footer-note{position:fixed; bottom:20px; right:22px; z-index:50; font-size:.72rem; color:var(--text-dim); font-family:'JetBrains Mono';}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px}

.tac-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px;}
@media (max-width:900px){.tac-grid{grid-template-columns:1fr;}}
.tac-tile{
  background:var(--panel-2); border:1px solid var(--border); border-radius:14px; padding:16px;
  cursor:pointer; transition:.2s; text-align:center;
}
.tac-tile:hover{transform:translateY(-4px); border-color:var(--accent); box-shadow:0 10px 24px rgba(62,193,255,.15);}
.tac-tile i{font-size:1.3rem; color:var(--accent); margin-bottom:6px; display:block;}
.tac-tile .tname{font-size:.86rem; font-weight:700;}

.link-row{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid rgba(255,255,255,.06);}
.link-row:last-child{border-bottom:none;}
.link-row a{color:var(--text); text-decoration:none; font-weight:600;}
.link-row a:hover{color:var(--accent);}
.link-row .ext{margin-left:auto; color:var(--text-dim); font-size:.75rem;}

.fig-img{max-width:100%; border-radius:12px; border:1px solid var(--border); background:#fff; padding:14px; display:block; margin:0 auto;}
.fig-cap{text-align:center; font-size:.78rem; color:var(--text-dim); margin-top:8px;}

.step-big{display:flex; gap:20px; align-items:flex-start;}
.step-num{
  width:60px; height:60px; border-radius:16px; background:rgba(62,193,255,.12); border:1px solid rgba(62,193,255,.35);
  color:var(--accent); display:flex; align-items:center; justify-content:center; font-size:1.6rem; font-weight:800;
  font-family:'JetBrains Mono'; flex-shrink:0;
}
.compare-col{background:var(--panel-2); border:1px solid var(--border); border-radius:14px; padding:20px;}
.compare-col h4{font-weight:800; font-size:1.02rem; margin-bottom:10px; display:flex; align-items:center; gap:8px;}
.example-box{background:rgba(62,193,255,.07); border:1px dashed rgba(62,193,255,.35); border-radius:12px; padding:14px 16px; margin-top:10px;}
.example-box .ex-label{font-size:.72rem; text-transform:uppercase; letter-spacing:.08em; color:var(--accent); font-weight:800; margin-bottom:4px; display:flex; align-items:center; gap:6px;}
.cmp-table{width:100%; border-collapse:collapse; font-size:.86rem;}
.cmp-table th, .cmp-table td{padding:10px 12px; text-align:left; border-bottom:1px solid var(--border);}
.cmp-table th{color:var(--accent); font-weight:800; font-size:.78rem; text-transform:uppercase; letter-spacing:.05em;}
.cmp-table td{color:var(--text-dim);}
.cmp-table td strong{color:var(--text);}
.cmp-table tr:last-child td{border-bottom:none;}
</style>
</head>

// 2. Qué es Messaging
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-envelope"></i> La idea</span>
  <h2 class="slide-title">¿Qué es Messaging?</h2>
  <div class="card-panel">
    <p style="font-size:1.0rem; line-height:1.75; margin-bottom:0;">
      Es la posibilidad de enviar datos —como en File Transfer— con la garantía de que el receptor será <strong>notificado</strong> en cuanto lleguen, y de que ese envío puede <strong>desencadenar comportamiento</strong> en el receptor —como en RPI—, pero de forma <strong>asíncrona</strong>: quien envía no espera a quien recibe.
    </p>
  </div>
  <img src="${IMG_MSG}" class="fig-img mt-3" alt="Integración de aplicaciones por mensajería: Aplicación A, B y C publican eventos a través de canales hacia un Message Bus compartido">

  <div class="example-box">
    <div class="ex-label"><i class="fa-solid fa-lightbulb"></i> Ejemplo simple</div>
    Con mensajería, facturación publica un evento "cancelar turno" en el <strong>Message Bus</strong> y sigue trabajando. La aplicación de turnos lo procesa cuando puede — segundos después, o si estuviera momentáneamente caída, en cuanto vuelva a estar en pie.
  </div>
</div>
`);

// 3. Por qué es pragmática
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-scale-balanced"></i> Cohesión arriba, acoplamiento abajo</span>
  <h2 class="slide-title">Una solución pragmática</h2>
  <div class="card-panel">
    <p style="font-size:.98rem; line-height:1.75; margin-bottom:0;">
      La mensajería asíncrona es pragmática porque <strong>no requiere</strong> que ambos sistemas estén disponibles al mismo tiempo, y reconoce que la latencia de las comunicaciones remotas es <strong>inevitable</strong>. Esto sube la <strong>cohesión</strong> —favorece el procesamiento local— y baja el <strong>acoplamiento</strong> —minimiza las interacciones remotas directas—.
    </p>
  </div>
  <div class="grid-2 mt-3">
    <div class="compare-col">
      <h4><i class="fa-solid fa-unlink" style="color:var(--ok)"></i> Desacoplamiento como File Transfer</h4>
      <p style="color:var(--text-dim); font-size:.87rem; line-height:1.6; margin:0;">El envío queda desacoplado de la recepción, y el mensaje puede transformarse en el camino sin que ninguna de las dos partes lo sepa. Esto también permite que <strong style="color:var(--text)">varias aplicaciones</strong> reciban el mismo mensaje.</p>
    </div>
    <div class="compare-col">
      <h4><i class="fa-solid fa-bolt" style="color:var(--accent-3)"></i> Comportamiento como RPI</h4>
      <p style="color:var(--text-dim); font-size:.87rem; line-height:1.6; margin:0;">Los mensajes pueden invocar acciones en el receptor. No es tan eficiente como una llamada directa, pero quien envía el pedido <strong style="color:var(--text)">sigue trabajando</strong> mientras el receptor lo procesa.</p>
    </div>
  </div>
  <div class="example-box mt-3" style="margin-top:18px;">
    <div class="ex-label"><i class="fa-solid fa-lightbulb"></i> Ejemplo simple</div>
    Al confirmarse un pedido en una tienda online, el mismo evento "pedido confirmado" es recibido a la vez por inventario, facturación y envíos — algo que con RPI hubiera significado tres llamadas remotas separadas, cada una con su propio riesgo de fallar.
  </div>
</div>
`);

/* ============ MOTOR DE NAVEGACIÓN ============ */
const container = document.getElementById('slidesContainer');
slidesHTML.forEach((html, i)=>{
  const div = document.createElement('div');
  div.className = 'slide' + (i===0 ? ' active' : '');
  div.id = 'slide'+i;
  div.innerHTML = html;
  container.appendChild(div);
});

let current = 0;
const total = slidesHTML.length;
document.getElementById('hudTotal').textContent = total;

const dotsWrap = document.getElementById('navDots');
for(let i=0;i<total;i++){
  const d = document.createElement('div');
  d.className = 'dot' + (i===0?' active':'');
  d.onclick = ()=>goTo(i);
  dotsWrap.appendChild(d);
}

function updateUI(){
  document.querySelectorAll('.slide').forEach((s,i)=>{ s.classList.toggle('active', i===current); });
  document.querySelectorAll('.nav-dots .dot').forEach((d,i)=>{ d.classList.toggle('active', i===current); });
  document.getElementById('hudCurrent').textContent = current+1;
  document.getElementById('progressFill').style.width = ((current+1)/total*100)+'%';
  const active = document.getElementById('slide'+current);
  active.scrollTop = 0;
  const animTarget = active.querySelector('.slide-inner');
  if(animTarget){
    animTarget.classList.remove('animate__fadeIn');
    void animTarget.offsetWidth;
    animTarget.classList.add('animate__animated','animate__fadeIn');
  }
}
function goTo(i){ if(i<0||i>=total) return; current = i; updateUI(); }
document.getElementById('prevBtn').onclick = ()=>goTo(current-1);
document.getElementById('nextBtn').onclick = ()=>goTo(current+1);
document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight') goTo(current+1);
  if(e.key==='ArrowLeft') goTo(current-1);
});
updateUI();

/* ============ ROLES DE LA MENSAJERÍA ============ */
const roles = [
  {icon:'fa-road', n:'Message Channel', d:'¿Cómo transferir los paquetes de datos? El remitente lo envía a través de un canal que lo conecta con el receptor.<br><br><strong>Ejemplo simple:</strong> una cola de RabbitMQ o un tópico de Kafka llamado "pedidos-confirmados", por donde viaja cada mensaje.', link:'https://www.enterpriseintegrationpatterns.com/patterns/messaging/MessageChannel.html'},
  {icon:'fa-signs-post', n:'Message Router', d:'¿Cómo saber dónde enviar los mensajes? Se envían a un enrutador, que los dirige al receptor adecuado.<br><br><strong>Ejemplo simple:</strong> un mensaje de "pedido con envío internacional" se enruta hacia el sistema de aduanas; uno local va directo a logística.', link:'https://www.enterpriseintegrationpatterns.com/patterns/messaging/MessageRouter.html'},
  {icon:'fa-language', n:'Message Translator', d:'¿Cómo saber qué formato de datos usar? Un traductor convierte el mensaje al formato que el receptor espera.<br><br><strong>Ejemplo simple:</strong> el sistema de ventas envía el precio en dólares, y el traductor lo convierte a pesos antes de que lo reciba el sistema contable local.', link:'https://www.enterpriseintegrationpatterns.com/patterns/messaging/MessageTranslator.html'},
  {icon:'fa-plug', n:'Message Endpoint', d:'¿Cómo conecta la aplicación con el sistema de mensajería? Implementando un endpoint que envía y recibe mensajes.<br><br><strong>Ejemplo simple:</strong> el pequeño módulo dentro de la app que se suscribe a la cola y llama a una función propia cada vez que llega un mensaje nuevo.', link:'https://www.enterpriseintegrationpatterns.com/patterns/messaging/MessageEndpoint.html'}
];
const gridRoles = document.getElementById('gridRoles');
roles.forEach(t=>{
  const tile = document.createElement('div');
  tile.className = 'tac-tile';
  tile.innerHTML = `<i class="fa-solid ${t.icon}"></i><div class="tname">${t.n}</div>`;
  tile.onclick = ()=>{
    const linkHtml = t.link ? `<p style="text-align:left; margin-top:10px;"><a href="${t.link}" target="_blank" style="color:#3ec1ff;">Más información →</a></p>` : '';
    Swal.fire({
      title: t.n,
      html: `<div style="text-align:left; font-size:.94rem; line-height:1.6;">${t.d}</div>${linkHtml}`,
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    });
  };
  gridRoles.appendChild(tile);
});

/* ============ QUIZ ============ */
const preguntas = [
  {
    texto:'Con RPI, facturación queda esperando a que turnos procese la cancelación de un turno, y si turnos está caído, facturación también se traba. ¿Qué característica de Messaging evita este problema?',
    opciones:{
      a:'Que la mensajería siempre usa el mismo formato que RPI, sin traducción',
      b:'Que el envío es asíncrono: quien envía el mensaje no tiene que esperar a que el receptor lo procese',
      c:'Que la mensajería elimina por completo la necesidad de un receptor',
      d:'Que los mensajes nunca pueden desencadenar ninguna acción en el receptor'
    },
    correcta:'b'
  },
  {
    texto:'¿Qué característica comparte la mensajería con File Transfer?',
    opciones:{
      a:'Que el envío queda desacoplado de la recepción, y el mensaje puede transformarse en el camino sin que ninguna de las dos partes lo sepa',
      b:'Que ambas requieren que el receptor esté disponible en el momento exacto del envío',
      c:'Que ambas necesitan una base de datos compartida entre aplicaciones',
      d:'Que ambas son mecanismos exclusivamente síncronos'
    },
    correcta:'a'
  },
  {
    texto:'En un e-commerce, el evento "pedido confirmado" es recibido simultáneamente por inventario, facturación y envíos desde el mismo canal. ¿Qué posibilita esto?',
    opciones:{
      a:'Que Shared Database permite que varias aplicaciones lean la misma tabla',
      b:'Que RPI invoca automáticamente varias funciones remotas a la vez',
      c:'Que el desacoplamiento de la mensajería permite que varias aplicaciones reciban el mismo mensaje transmitido por otra',
      d:'Que File Transfer sincroniza tres archivos distintos al mismo tiempo'
    },
    correcta:'c'
  },
  {
    texto:'¿Qué rol de la mensajería se encarga de convertir un mensaje al formato que espera el receptor?',
    opciones:{
      a:'Message Channel',
      b:'Message Router',
      c:'Message Endpoint',
      d:'Message Translator'
    },
    correcta:'d'
  },
  {
    texto:'¿Por qué la mensajería asíncrona se describe como una solución "pragmática" a los problemas de los sistemas distribuidos?',
    opciones:{
      a:'Porque no requiere que ambos sistemas estén disponibles al mismo tiempo, y reconoce que la latencia de las comunicaciones remotas es inevitable',
      b:'Porque elimina por completo la posibilidad de que un mensaje se pierda',
      c:'Porque obliga a todas las aplicaciones a usar el mismo lenguaje de programación',
      d:'Porque convierte automáticamente cualquier llamada remota en una llamada local'
    },
    correcta:'a'
  },
  {
    texto:'De los 4 mecanismos de integración vistos, ¿cuál combina compartir datos y funcionalidad, de forma inmediata pero con bajo acoplamiento?',
    opciones:{
      a:'File Transfer',
      b:'Shared Database',
      c:'Messaging',
      d:'Remote Procedure Invocation'
    },
    correcta:'c'
  }
];
let idxPregunta = 0, aciertos = 0;

function lanzarQuiz(){ idxPregunta = 0; aciertos = 0; mostrarPregunta(); }
function mostrarPregunta(){
  if(idxPregunta >= preguntas.length){
    Swal.fire({
      title:'Resultado',
      html:`Acertaste <b>${aciertos}/${preguntas.length}</b>.`,
      icon: aciertos===preguntas.length ? 'success' : 'info',
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    });
    return;
  }
  const p = preguntas[idxPregunta];
  Swal.fire({
    title: p.texto,
    input:'radio',
    inputOptions: p.opciones,
    background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff',
    confirmButtonText:'Responder',
    inputValidator: (value)=> !value && 'Elegí una opción'
  }).then(res=>{
    if(!res.isConfirmed) return;
    const ok = res.value === p.correcta;
    if(ok) aciertos++;
    Swal.fire({
      title: ok ? '¡Correcto!' : 'No es así',
      html: `La respuesta correcta era: <b>${p.opciones[p.correcta]}</b>`,
      icon: ok ? 'success' : 'error',
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    }).then(()=>{ idxPregunta++; mostrarPregunta(); });
  });
}
</script>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANDIS 2 · Unidad 3 — BASE y consistencia eventual</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#070b14; --bg-1:#0d1424; --panel:#111a2e; --panel-2:#16223a;
  --accent:#3ec1ff; --accent-2:#7b6bff; --accent-3:#ffb547; --ok:#3ee6a8;
  --text:#e8edf7; --text-dim:#8fa0bd; --border:#22304d;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(1200px 700px at 15% -10%, rgba(62,193,255,.10), transparent 60%),
    radial-gradient(1000px 700px at 110% 10%, rgba(123,107,255,.12), transparent 55%),
    var(--bg-0);
  color:var(--text); font-family:'Inter',sans-serif; overflow:hidden;
}
.mono{font-family:'JetBrains Mono',monospace}
.blueprint{
  position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.35;
  background-image:linear-gradient(rgba(62,193,255,.06) 1px, transparent 1px),linear-gradient(90deg, rgba(62,193,255,.06) 1px, transparent 1px);
  background-size:42px 42px;
}
.progress-track{position:fixed; top:0; left:0; width:100%; height:4px; background:rgba(255,255,255,.06); z-index:50;}
.progress-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--accent-2)); transition:width .4s ease; box-shadow:0 0 12px var(--accent);}
.hud{position:fixed; top:14px; right:18px; z-index:50; background:rgba(17,26,46,.85); border:1px solid var(--border); backdrop-filter:blur(6px); padding:7px 14px; border-radius:999px; font-size:.82rem; color:var(--text-dim); display:flex; align-items:center; gap:8px;}
.hud .unit-tag{color:var(--accent); font-weight:700}
.brand{position:fixed; top:14px; left:18px; z-index:50; font-size:.78rem; color:var(--text-dim); display:flex; align-items:center; gap:8px; letter-spacing:.03em;}
.brand i{color:var(--accent-3)}
.slides-container{position:relative; z-index:1; height:100vh; width:100vw;}
.slide{position:absolute; inset:0; display:none; padding:90px 8vw 110px 8vw; overflow-y:auto;}
.slide.active{display:block}
.slide-inner{max-width:1180px; margin:0 auto;}
.eyebrow{display:inline-flex; align-items:center; gap:8px; font-size:.78rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent); font-weight:700; margin-bottom:14px;}
.eyebrow i{font-size:.9rem}
h1.slide-title{font-size:clamp(1.9rem,3.4vw,3rem); font-weight:800; margin-bottom:.4rem; line-height:1.1;}
h2.slide-title{font-size:clamp(1.5rem,2.6vw,2.2rem); font-weight:800; margin-bottom:.6rem;}
.subtitle{color:var(--text-dim); font-size:1.05rem; max-width:820px;}
.card-panel{background:linear-gradient(180deg, var(--panel), var(--panel-2)); border:1px solid var(--border); border-radius:16px; padding:26px 28px; box-shadow:0 12px 30px rgba(0,0,0,.35);}
.card-panel + .card-panel{margin-top:18px}
.pill{display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:999px; font-size:.76rem; font-weight:700; background:rgba(62,193,255,.12); color:var(--accent); border:1px solid rgba(62,193,255,.35);}
.pill.purple{background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)}
.pill.amber{background:rgba(255,181,71,.14); color:var(--accent-3); border-color:rgba(255,181,71,.4)}
.pill.ok{background:rgba(62,230,168,.12); color:var(--ok); border-color:rgba(62,230,168,.35)}
.pill.bad{background:rgba(255,107,107,.12); color:#ff6b6b; border-color:rgba(255,107,107,.35)}
.icon-tile{width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center; background:rgba(62,193,255,.12); color:var(--accent); font-size:1.3rem; border:1px solid rgba(62,193,255,.3); flex-shrink:0;}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
.grid-4{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
@media (max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}
ul.clean{list-style:none; margin:0; padding:0;}
ul.clean li{position:relative; padding:6px 0 6px 26px; color:var(--text); font-size:.94rem;}
ul.clean li::before{content:"\f105"; font-family:"Font Awesome 6 Free"; font-weight:900; color:var(--accent); position:absolute; left:2px; top:8px; font-size:.85rem;}
.check-btn{border:none; background:linear-gradient(90deg,var(--accent),var(--accent-2)); color:#04101f; font-weight:800; padding:10px 22px; border-radius:10px; font-size:.9rem; box-shadow:0 8px 22px rgba(62,193,255,.25); cursor:pointer;}
.check-btn:hover{filter:brightness(1.08); color:#04101f;}
.nav-controls{position:fixed; bottom:18px; left:0; right:0; z-index:50; display:flex; justify-content:center; gap:14px; align-items:center;}
.nav-btn{width:46px; height:46px; border-radius:50%; border:1px solid var(--border); background:rgba(17,26,46,.9); color:var(--text); display:flex; align-items:center; justify-content:center; font-size:1.1rem; backdrop-filter:blur(6px);}
.nav-btn:hover{border-color:var(--accent); color:var(--accent);}
.nav-dots{display:flex; gap:6px; align-items:center; background:rgba(17,26,46,.9); border:1px solid var(--border); padding:8px 14px; border-radius:999px;}
.nav-dots .dot{width:7px; height:7px; border-radius:50%; background:var(--border); cursor:pointer; transition:.2s;}
.nav-dots .dot.active{background:var(--accent); width:20px; border-radius:4px;}
.footer-note{position:fixed; bottom:20px; right:22px; z-index:50; font-size:.72rem; color:var(--text-dim); font-family:'JetBrains Mono';}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px}

.tac-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px;}
@media (max-width:900px){.tac-grid{grid-template-columns:1fr;}}
.tac-tile{
  background:var(--panel-2); border:1px solid var(--border); border-radius:14px; padding:16px;
  cursor:pointer; transition:.2s; text-align:center;
}
.tac-tile:hover{transform:translateY(-4px); border-color:var(--accent); box-shadow:0 10px 24px rgba(62,193,255,.15);}
.tac-tile i{font-size:1.3rem; color:var(--accent); margin-bottom:6px; display:block;}
.tac-tile .tname{font-size:.86rem; font-weight:700;}

.link-row{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid rgba(255,255,255,.06);}
.link-row:last-child{border-bottom:none;}
.link-row a{color:var(--text); text-decoration:none; font-weight:600;}
.link-row a:hover{color:var(--accent);}
.link-row .ext{margin-left:auto; color:var(--text-dim); font-size:.75rem;}

.fig-img{max-width:100%; border-radius:12px; border:1px solid var(--border); background:#fff; padding:14px; display:block; margin:0 auto;}
.fig-cap{text-align:center; font-size:.78rem; color:var(--text-dim); margin-top:8px;}

.step-big{display:flex; gap:20px; align-items:flex-start;}
.step-num{
  width:60px; height:60px; border-radius:16px; background:rgba(62,193,255,.12); border:1px solid rgba(62,193,255,.35);
  color:var(--accent); display:flex; align-items:center; justify-content:center; font-size:1.6rem; font-weight:800;
  font-family:'JetBrains Mono'; flex-shrink:0;
}
.acid-letter{
  width:64px; height:64px; border-radius:18px; display:flex; align-items:center; justify-content:center;
  font-size:1.9rem; font-weight:800; font-family:'JetBrains Mono'; flex-shrink:0;
}
.compare-col{background:var(--panel-2); border:1px solid var(--border); border-radius:14px; padding:20px;}
.compare-col h4{font-weight:800; font-size:1.02rem; margin-bottom:10px; display:flex; align-items:center; gap:8px;}
.example-box{background:rgba(62,193,255,.07); border:1px dashed rgba(62,193,255,.35); border-radius:12px; padding:14px 16px; margin-top:10px;}
.example-box .ex-label{font-size:.72rem; text-transform:uppercase; letter-spacing:.08em; color:var(--accent); font-weight:800; margin-bottom:4px; display:flex; align-items:center; gap:6px;}
.nwr-box{width:78px; height:78px; border-radius:16px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:'JetBrains Mono'; font-weight:800; flex-shrink:0;}
.nwr-box .nwr-val{font-size:1.5rem; line-height:1;}
.nwr-box .nwr-lbl{font-size:.62rem; opacity:.85; margin-top:2px;}
</style>
</head>
<body>

<div class="blueprint"></div>
<div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
<div class="brand"><i class="fa-solid fa-diagram-project"></i> ANDIS 2 · Unidad 3</div>
<div class="hud"><i class="fa-solid fa-layer-group"></i> <span class="unit-tag" id="hudCurrent">1</span>/<span id="hudTotal">0</span></div>

<div class="slides-container" id="slidesContainer"></div>

<div class="nav-controls">
  <button class="nav-btn" id="prevBtn"><i class="fa-solid fa-chevron-left"></i></button>
  <div class="nav-dots" id="navDots"></div>
  <button class="nav-btn" id="nextBtn"><i class="fa-solid fa-chevron-right"></i></button>
</div>
<div class="footer-note">← → para navegar</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.10.5/sweetalert2.all.min.js"></script>
<script>
const slidesHTML = [];

// 0. Portada
slidesHTML.push(`
<div class="slide-inner d-flex flex-column justify-content-center" style="min-height:78vh;">
  <div class="animate__animated animate__fadeInDown">
    <span class="eyebrow"><i class="fa-solid fa-diagram-project"></i> Unidad 3 · Soluciones arquitectónicas</span>
    <h1 class="slide-title">BASE y consistencia eventual</h1>
    <p class="subtitle">El opuesto de ACID: sistemas que aceptan estar momentáneamente "desactualizados" a cambio de estar siempre disponibles — y cómo razonar, desde el cliente y desde el servidor, sobre cuándo se garantiza ver el último valor.</p>
  </div>
</div>
`);

// 1. Teorema de Brewer (CAP)
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-scale-unbalanced"></i> El porqué de BASE</span>
  <h2 class="slide-title">Teorema de Brewer (CAP)</h2>
  <div class="card-panel">
    <p style="font-size:1.02rem; line-height:1.75; margin-bottom:14px;">
      En los sistemas que proporcionan alta disponibilidad mediante réplicas, dadas las propiedades de <strong>Consistencia</strong>, <strong>Alta disponibilidad</strong> y <strong>Resiliencia a la partición</strong>, solo es posible cumplir <strong>dos como máximo, nunca las tres al mismo tiempo</strong>.
    </p>
  </div>
  <div class="grid-3 mt-3">
    <div class="compare-col text-center">
      <h4 class="justify-content-center"><i class="fa-solid fa-check-double" style="color:var(--accent)"></i> Consistencia</h4>
      <p style="color:var(--text-dim); font-size:.86rem; margin:0;">Todos los nodos ven el mismo dato al mismo tiempo.</p>
    </div>
    <div class="compare-col text-center">
      <h4 class="justify-content-center"><i class="fa-solid fa-signal" style="color:var(--ok)"></i> Disponibilidad</h4>
      <p style="color:var(--text-dim); font-size:.86rem; margin:0;">Cada solicitud recibe una respuesta, sin garantía de que sea la más reciente.</p>
    </div>
    <div class="compare-col text-center">
      <h4 class="justify-content-center"><i class="fa-solid fa-network-wired" style="color:var(--accent-3)"></i> Partición</h4>
      <p style="color:var(--text-dim); font-size:.86rem; margin:0;">El sistema sigue funcionando aunque se corte la comunicación entre nodos.</p>
    </div>
  </div>
  <div class="card-panel mt-3 d-flex gap-3 align-items-center">
    <div class="icon-tile" style="background:rgba(255,181,71,.12); color:var(--accent-3); border-color:rgba(255,181,71,.35)"><i class="fa-solid fa-lightbulb"></i></div>
    <div class="small" style="color:var(--text-dim)">Como las particiones de red <strong style="color:var(--text)">van a ocurrir</strong> en cualquier sistema distribuido real, la decisión práctica es entre priorizar <strong style="color:var(--text)">Consistencia</strong> o priorizar <strong style="color:var(--text)">Disponibilidad</strong>. Los sistemas que eligen disponibilidad permiten inconsistencias temporales, con la expectativa de llegar a un estado consistente después: eso es <strong style="color:var(--text)">BASE</strong>.</div>
  </div>
</div>
`);

// 2. BASE overview
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-flask"></i> El acrónimo</span>
  <h2 class="slide-title">BASE: lo opuesto a ACID</h2>
  <p class="subtitle mb-3">"Base" en química es lo contrario a "ácido" — un juego de palabras deliberado: BASE es el modelo opuesto a ACID.</p>
  <div class="grid-3">
    <div class="card-panel text-center">
      <div class="acid-letter mx-auto mb-2" style="background:rgba(62,193,255,.12); color:var(--accent); border:1px solid rgba(62,193,255,.35)">B</div>
      <h4 style="font-weight:800; margin-bottom:4px;">Basic Availability</h4>
      <p style="color:var(--text-dim); font-size:.86rem; margin:0;">Disponibilidad básica: el sistema responde, la mayor parte del tiempo.</p>
    </div>
    <div class="card-panel text-center">
      <div class="acid-letter mx-auto mb-2" style="background:rgba(123,107,255,.12); color:#b3a8ff; border:1px solid rgba(123,107,255,.35)">S</div>
      <h4 style="font-weight:800; margin-bottom:4px;">Soft State</h4>
      <p style="color:var(--text-dim); font-size:.86rem; margin:0;">Estado blando: el estado del sistema puede cambiar con el tiempo, incluso sin nueva entrada, mientras se propagan las réplicas.</p>
    </div>
    <div class="card-panel text-center">
      <div class="acid-letter mx-auto mb-2" style="background:rgba(62,230,168,.12); color:var(--ok); border:1px solid rgba(62,230,168,.35)">E</div>
      <h4 style="font-weight:800; margin-bottom:4px;">Eventual Consistency</h4>
      <p style="color:var(--text-dim); font-size:.86rem; margin:0;">Consistencia eventual: si dejan de llegar actualizaciones, el sistema converge a un único valor coherente.</p>
    </div>
  </div>
</div>
`);

// 3. Dos formas de ver la consistencia
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-eye"></i> Dos ángulos</span>
  <h2 class="slide-title">Dos formas de ver la consistencia</h2>
  <div class="grid-2">
    <div class="card-panel d-flex gap-3 align-items-start">
      <div class="icon-tile"><i class="fa-solid fa-user"></i></div>
      <div>
        <h4 style="margin:0 0 6px 0; font-weight:800;">Lado del cliente</h4>
        <p style="margin:0; color:var(--text-dim); font-size:.9rem; line-height:1.6;">Cómo observan las actualizaciones los desarrolladores o clientes del sistema: ¿cuándo veo yo el dato nuevo?</p>
      </div>
    </div>
    <div class="card-panel d-flex gap-3 align-items-start">
      <div class="icon-tile" style="background:rgba(123,107,255,.12); color:#b3a8ff; border-color:rgba(123,107,255,.35)"><i class="fa-solid fa-server"></i></div>
      <div>
        <h4 style="margin:0 0 6px 0; font-weight:800;">Lado del servidor</h4>
        <p style="margin:0; color:var(--text-dim); font-size:.9rem; line-height:1.6;">Cómo fluyen las actualizaciones entre las réplicas internamente, y qué garantías puede dar el sistema al respecto.</p>
      </div>
    </div>
  </div>
  <div class="card-panel mt-3">
    <p style="margin:0; font-size:.94rem; line-height:1.7; color:var(--text-dim);">
      Para razonar sobre el lado del cliente pensemos en tres actores: un <strong style="color:var(--text)">sistema de almacenamiento</strong> —una caja negra, grande y distribuida, pensada para ser durable y disponible—, un <strong style="color:var(--text)">proceso A</strong> que escribe y lee, y los <strong style="color:var(--text)">procesos B y C</strong>, independientes de A, que también leen y escriben. No importa si son procesos distintos o hilos del mismo proceso: lo que importa es que son independientes entre sí.
    </p>
  </div>
</div>
`);

// 4. Tipos de consistencia (cliente) - fuerte, débil, eventual
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-user"></i> Consistencia del lado del cliente</span>
  <h2 class="slide-title">Fuerte, débil y eventual</h2>
  <p class="subtitle mb-3">En todos los casos, el proceso A acaba de actualizar un dato. La pregunta es: ¿qué ven A, B y C después?</p>
  <div class="card-panel">
    <h4 style="font-weight:800; margin-bottom:6px;"><i class="fa-solid fa-bolt" style="color:var(--accent)"></i> Consistencia fuerte</h4>
    <p style="margin:0; color:var(--text-dim); font-size:.92rem; line-height:1.6;">Una vez completada la actualización, <strong style="color:var(--text)">cualquier</strong> acceso posterior —de A, B o C— devuelve el valor actualizado.</p>
    <div class="example-box"><div class="ex-label"><i class="fa-solid fa-lightbulb"></i> Ejemplo simple</div>Cambiás tu contraseña. Un segundo después, ni vos ni nadie puede entrar con la contraseña vieja: el cambio ya es visible para todos, en todos lados.</div>
  </div>
  <div class="card-panel mt-3">
    <h4 style="font-weight:800; margin-bottom:6px;"><i class="fa-solid fa-hourglass-half" style="color:var(--accent-3)"></i> Consistencia débil</h4>
    <p style="margin:0; color:var(--text-dim); font-size:.92rem; line-height:1.6;">No hay garantía de que los accesos posteriores devuelvan el valor actualizado; hace falta que se cumplan ciertas condiciones. Al período entre la actualización y el momento en que se garantiza ver el valor nuevo se lo llama <strong style="color:var(--text)">ventana de inconsistencia</strong>.</p>
    <div class="example-box"><div class="ex-label"><i class="fa-solid fa-lightbulb"></i> Ejemplo simple</div>Subís una foto de perfil nueva. Por un rato, algunos amigos siguen viendo la foto vieja, otros ya ven la nueva — y no hay garantía de cuándo se pareja eso.</div>
  </div>
  <div class="card-panel mt-3">
    <h4 style="font-weight:800; margin-bottom:6px;"><i class="fa-solid fa-clock-rotate-left" style="color:var(--ok)"></i> Consistencia eventual</h4>
    <p style="margin:0; color:var(--text-dim); font-size:.92rem; line-height:1.6;">Un caso particular de consistencia débil: si <strong style="color:var(--text)">no se realizan nuevas actualizaciones</strong>, eventualmente todos los accesos devolverán el último valor. El tamaño de la ventana depende de la latencia de red, la carga del sistema, y la cantidad de réplicas.</p>
    <div class="example-box"><div class="ex-label"><i class="fa-solid fa-lightbulb"></i> Ejemplo simple</div>Le das "me gusta" a una foto. El contador puede tardar unos segundos en actualizarse para tus amigos en otro país, pero si nadie más lo toca, todos van a terminar viendo el mismo número.</div>
  </div>
</div>
`);

// 5. Variaciones del modelo eventual - explorer
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-code-branch"></i> Matices del modelo eventual</span>
  <h2 class="slide-title">Variaciones de la consistencia eventual</h2>
  <p class="subtitle mb-3">Tocá cada una para ver su definición y un ejemplo simple.</p>
  <div class="tac-grid" id="gridVariaciones"></div>
</div>
`);

// 6. Server-side intro: N, W, R
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-server"></i> Ahora, del lado del servidor</span>
  <h2 class="slide-title">El modelo N, W, R</h2>
  <p class="subtitle mb-3">Para entender qué garantías puede dar el sistema, tres números clave sobre cómo se replican los datos:</p>
  <div class="grid-3">
    <div class="card-panel d-flex gap-3 align-items-center">
      <div class="nwr-box" style="background:rgba(62,193,255,.12); color:var(--accent); border:1px solid rgba(62,193,255,.35)"><span class="nwr-val">N</span><span class="nwr-lbl">nodos</span></div>
      <p style="margin:0; color:var(--text-dim); font-size:.88rem; line-height:1.5;">Cantidad de nodos que almacenan réplicas del dato.</p>
    </div>
    <div class="card-panel d-flex gap-3 align-items-center">
      <div class="nwr-box" style="background:rgba(255,181,71,.12); color:var(--accent-3); border:1px solid rgba(255,181,71,.35)"><span class="nwr-val">W</span><span class="nwr-lbl">write</span></div>
      <p style="margin:0; color:var(--text-dim); font-size:.88rem; line-height:1.5;">Cantidad de réplicas que deben confirmar la escritura para darla por completa.</p>
    </div>
    <div class="card-panel d-flex gap-3 align-items-center">
      <div class="nwr-box" style="background:rgba(62,230,168,.12); color:var(--ok); border:1px solid rgba(62,230,168,.35)"><span class="nwr-val">R</span><span class="nwr-lbl">read</span></div>
      <p style="margin:0; color:var(--text-dim); font-size:.88rem; line-height:1.5;">Cantidad de réplicas que se consultan al hacer una lectura.</p>
    </div>
  </div>
  <div class="card-panel mt-3">
    <div class="example-box" style="margin-top:0;"><div class="ex-label"><i class="fa-solid fa-lightbulb"></i> Ejemplo simple</div>Pensalo como preguntarle un rumor a varios amigos: si le preguntás a suficiente gente que ya se enteró de lo último —W y R grandes, superpuestos—, es casi seguro que te van a contar la versión más actualizada. Si le preguntás a uno solo que todavía no se enteró, te puede llegar información vieja.</div>

/* ============ MOTOR DE NAVEGACIÓN ============ */
const container = document.getElementById('slidesContainer');
slidesHTML.forEach((html, i)=>{
  const div = document.createElement('div');
  div.className = 'slide' + (i===0 ? ' active' : '');
  div.id = 'slide'+i;
  div.innerHTML = html;
  container.appendChild(div);
});

let current = 0;
const total = slidesHTML.length;
document.getElementById('hudTotal').textContent = total;

const dotsWrap = document.getElementById('navDots');
for(let i=0;i<total;i++){
  const d = document.createElement('div');
  d.className = 'dot' + (i===0?' active':'');
  d.onclick = ()=>goTo(i);
  dotsWrap.appendChild(d);
}

function updateUI(){
  document.querySelectorAll('.slide').forEach((s,i)=>{ s.classList.toggle('active', i===current); });
  document.querySelectorAll('.nav-dots .dot').forEach((d,i)=>{ d.classList.toggle('active', i===current); });
  document.getElementById('hudCurrent').textContent = current+1;
  document.getElementById('progressFill').style.width = ((current+1)/total*100)+'%';
  const active = document.getElementById('slide'+current);
  active.scrollTop = 0;
  const animTarget = active.querySelector('.slide-inner');
  if(animTarget){
    animTarget.classList.remove('animate__fadeIn');
    void animTarget.offsetWidth;
    animTarget.classList.add('animate__animated','animate__fadeIn');
  }
}
function goTo(i){ if(i<0||i>=total) return; current = i; updateUI(); }
document.getElementById('prevBtn').onclick = ()=>goTo(current-1);
document.getElementById('nextBtn').onclick = ()=>goTo(current+1);
document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight') goTo(current+1);
  if(e.key==='ArrowLeft') goTo(current-1);
});
updateUI();

/* ============ VARIACIONES DE CONSISTENCIA EVENTUAL ============ */
const variaciones = [
  {icon:'fa-link', n:'Consistencia causal', d:'Si A le contó a B que actualizó un dato, un acceso posterior de B devuelve el valor actualizado —esa escritura reemplaza a la anterior—. El acceso de C, que no tiene relación causal con A, sigue las reglas normales de consistencia eventual.<br><br><strong>Ejemplo simple:</strong> le contás a un amigo por chat que cambiaste de plan, y cuando él entra a la app ya ve el cambio — porque vos se lo dijiste. Un tercero, que no habló con ninguno de los dos, puede tardar un poco más en verlo.'},
  {icon:'fa-pen-to-square', n:'Lectura de escrituras (read-your-writes)', d:'Después de actualizar un dato, el proceso A siempre ve el valor actualizado y nunca uno anterior. Es un caso especial de consistencia causal.<br><br><strong>Ejemplo simple:</strong> subís una nueva foto de perfil y, al refrescar tu propia pantalla, la ves siempre a vos — aunque tus amigos todavía vean la vieja por un rato.'},
  {icon:'fa-id-badge', n:'Consistencia de sesión', d:'Versión práctica de "lectura de escrituras": mientras dura la sesión, el sistema garantiza leer lo que uno mismo escribió. Si la sesión termina por una falla, hay que empezar una sesión nueva y las garantías no se trasladan.<br><br><strong>Ejemplo simple:</strong> agregás un producto al carrito de una tienda online y lo seguís viendo mientras navegás. Si cerrás el navegador y volvés a entrar más tarde con otra sesión, no hay garantía de que el carrito esté igual.'},
  {icon:'fa-arrow-trend-up', n:'Lectura monótona', d:'Si un proceso ya vio un valor particular de un dato, ningún acceso posterior le devuelve un valor anterior a ese.<br><br><strong>Ejemplo simple:</strong> ves que un video tiene 1.000 reproducciones. Por más que refresques varias veces, nunca vas a ver de nuevo un número menor a 1.000 — como mucho, ves 1.000 otra vez o más.'},
  {icon:'fa-pen', n:'Escritura monótona', d:'El sistema garantiza serializar las escrituras hechas por el mismo proceso, en el orden en que se hicieron. Los sistemas que no lo garantizan son muy difíciles de programar.<br><br><strong>Ejemplo simple:</strong> editás un documento compartido dos veces seguidas. El sistema aplica tu primer cambio y después el segundo, nunca al revés — aunque a otro proceso concurrente lo intercale de otra forma.'}
];
const gridVariaciones = document.getElementById('gridVariaciones');
variaciones.forEach(t=>{
  const tile = document.createElement('div');

  tile.innerHTML = `<i class="fa-solid ${t.icon}"></i><div class="tname">${t.n}</div>`;
  tile.onclick = ()=>{
    Swal.fire({
      title: t.n,
      html: `<div style="text-align:left; font-size:.94rem; line-height:1.6;">${t.d}</div>`,

    });

/* ============ QUIZ ============ */
const preguntas = [
  {
    texto:'Según el teorema de Brewer (CAP), ¿qué es imposible garantizar al mismo tiempo en un sistema distribuido con réplicas?',
    opciones:{
      a:'Rendimiento, escalabilidad y seguridad simultáneamente',
      b:'Consistencia, alta disponibilidad y resiliencia a la partición, las tres a la vez — como máximo se pueden cumplir dos',
      c:'Atomicidad, aislamiento y durabilidad',
      d:'Ninguna combinación de propiedades es posible en sistemas distribuidos'
    },
    correcta:'b'
  },
  {
    texto:'¿Qué significa que un sistema tenga "consistencia eventual"?',
    opciones:{
      a:'Que nunca se garantiza ver el valor correcto, bajo ninguna circunstancia',
      b:'Que todos los accesos devuelven siempre el valor más reciente, sin excepción',
      c:'Que si no se realizan nuevas actualizaciones sobre un dato, eventualmente todos los accesos devolverán el último valor actualizado',
      d:'Que solo el proceso que escribió el dato puede leerlo después'
    },
    correcta:'c'
  },
  {
    texto:'Un proceso A actualiza su foto de perfil y, al refrescar su propia pantalla, siempre ve la foto nueva —nunca una vieja—, aunque otros usuarios tarden un poco en verla. ¿Qué variación de consistencia eventual describe esto?',
    opciones:{
      a:'Consistencia de escritura monótona',
      b:'Lectura de escrituras (read-your-writes)',
      c:'Consistencia de lectura monótona',
      d:'Consistencia causal'
    },
    correcta:'b'
  },
  {
    texto:'En el modelo N/W/R, ¿qué condición garantiza consistencia fuerte?',
    opciones:{
      a:'N siempre debe ser igual a 1',
      b:'W + R > N, porque así el conjunto de lectura y el de escritura siempre se superponen',
      c:'W debe ser siempre menor que R',
      d:'R debe ser igual a N y W igual a 1'
    },
    correcta:'b'
  },
  {
    texto:'¿Qué significa "estado blando" (soft state) en el acrónimo BASE?',
    opciones:{
      a:'Que los datos se almacenan sin cifrar',
      b:'Que el estado del sistema puede cambiar con el tiempo, incluso sin nueva entrada, mientras se propagan las actualizaciones entre réplicas',
      c:'Que el sistema no guarda ningún tipo de estado',
      d:'Que las transacciones se revierten automáticamente ante cualquier error'
    },
    correcta:'b'
  }
];
let idxPregunta = 0, aciertos = 0;

function lanzarQuiz(){ idxPregunta = 0; aciertos = 0; mostrarPregunta(); }
function mostrarPregunta(){
  if(idxPregunta >= preguntas.length){
    Swal.fire({
      title:'Resultado',
      html:`Acertaste <b>${aciertos}/${preguntas.length}</b>.`,
      icon: aciertos===preguntas.length ? 'success' : 'info',
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    });
    return;
  }
  const p = preguntas[idxPregunta];
  Swal.fire({
    title: p.texto,
    input:'radio',
    inputOptions: p.opciones,
    background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff',
    confirmButtonText:'Responder',
    inputValidator: (value)=> !value && 'Elegí una opción'
  }).then(res=>{
    if(!res.isConfirmed) return;
    const ok = res.value === p.correcta;
    if(ok) aciertos++;
    Swal.fire({
      title: ok ? '¡Correcto!' : 'No es así',
      html: `La respuesta correcta era: <b>${p.opciones[p.correcta]}</b>`,
      icon: ok ? 'success' : 'error',
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    }).then(()=>{ idxPregunta++; mostrarPregunta(); });
  });
}
</script>

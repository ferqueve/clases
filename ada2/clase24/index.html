<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANDIS 2 · Unidad 3 — ACID</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#070b14; --bg-1:#0d1424; --panel:#111a2e; --panel-2:#16223a;
  --accent:#3ec1ff; --accent-2:#7b6bff; --accent-3:#ffb547; --ok:#3ee6a8;
  --text:#e8edf7; --text-dim:#8fa0bd; --border:#22304d;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(1200px 700px at 15% -10%, rgba(62,193,255,.10), transparent 60%),
    radial-gradient(1000px 700px at 110% 10%, rgba(123,107,255,.12), transparent 55%),
    var(--bg-0);
  color:var(--text); font-family:'Inter',sans-serif; overflow:hidden;
}
.mono{font-family:'JetBrains Mono',monospace}
.blueprint{
  position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.35;
  background-image:linear-gradient(rgba(62,193,255,.06) 1px, transparent 1px),linear-gradient(90deg, rgba(62,193,255,.06) 1px, transparent 1px);
  background-size:42px 42px;
}
.progress-track{position:fixed; top:0; left:0; width:100%; height:4px; background:rgba(255,255,255,.06); z-index:50;}
.progress-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--accent-2)); transition:width .4s ease; box-shadow:0 0 12px var(--accent);}
.hud{position:fixed; top:14px; right:18px; z-index:50; background:rgba(17,26,46,.85); border:1px solid var(--border); backdrop-filter:blur(6px); padding:7px 14px; border-radius:999px; font-size:.82rem; color:var(--text-dim); display:flex; align-items:center; gap:8px;}
.hud .unit-tag{color:var(--accent); font-weight:700}
.brand{position:fixed; top:14px; left:18px; z-index:50; font-size:.78rem; color:var(--text-dim); display:flex; align-items:center; gap:8px; letter-spacing:.03em;}
.brand i{color:var(--accent-3)}
.slides-container{position:relative; z-index:1; height:100vh; width:100vw;}
.slide{position:absolute; inset:0; display:none; padding:90px 8vw 110px 8vw; overflow-y:auto;}
.slide.active{display:block}
.slide-inner{max-width:1180px; margin:0 auto;}
.eyebrow{display:inline-flex; align-items:center; gap:8px; font-size:.78rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent); font-weight:700; margin-bottom:14px;}
.eyebrow i{font-size:.9rem}
h1.slide-title{font-size:clamp(1.9rem,3.4vw,3rem); font-weight:800; margin-bottom:.4rem; line-height:1.1;}
h2.slide-title{font-size:clamp(1.5rem,2.6vw,2.2rem); font-weight:800; margin-bottom:.6rem;}
.subtitle{color:var(--text-dim); font-size:1.05rem; max-width:820px;}
.card-panel{background:linear-gradient(180deg, var(--panel), var(--panel-2)); border:1px solid var(--border); border-radius:16px; padding:26px 28px; box-shadow:0 12px 30px rgba(0,0,0,.35);}
.card-panel + .card-panel{margin-top:18px}
.pill{display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:999px; font-size:.76rem; font-weight:700; background:rgba(62,193,255,.12); color:var(--accent); border:1px solid rgba(62,193,255,.35);}
.pill.purple{background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)}
.pill.amber{background:rgba(255,181,71,.14); color:var(--accent-3); border-color:rgba(255,181,71,.4)}
.pill.ok{background:rgba(62,230,168,.12); color:var(--ok); border-color:rgba(62,230,168,.35)}
.pill.bad{background:rgba(255,107,107,.12); color:#ff6b6b; border-color:rgba(255,107,107,.35)}
.icon-tile{width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center; background:rgba(62,193,255,.12); color:var(--accent); font-size:1.3rem; border:1px solid rgba(62,193,255,.3); flex-shrink:0;}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
.grid-4{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
@media (max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}
ul.clean{list-style:none; margin:0; padding:0;}
ul.clean li{position:relative; padding:6px 0 6px 26px; color:var(--text); font-size:.94rem;}
ul.clean li::before{content:"\f105"; font-family:"Font Awesome 6 Free"; font-weight:900; color:var(--accent); position:absolute; left:2px; top:8px; font-size:.85rem;}
.check-btn{border:none; background:linear-gradient(90deg,var(--accent),var(--accent-2)); color:#04101f; font-weight:800; padding:10px 22px; border-radius:10px; font-size:.9rem; box-shadow:0 8px 22px rgba(62,193,255,.25); cursor:pointer;}
.check-btn:hover{filter:brightness(1.08); color:#04101f;}
.nav-controls{position:fixed; bottom:18px; left:0; right:0; z-index:50; display:flex; justify-content:center; gap:14px; align-items:center;}
.nav-btn{width:46px; height:46px; border-radius:50%; border:1px solid var(--border); background:rgba(17,26,46,.9); color:var(--text); display:flex; align-items:center; justify-content:center; font-size:1.1rem; backdrop-filter:blur(6px);}
.nav-btn:hover{border-color:var(--accent); color:var(--accent);}
.nav-dots{display:flex; gap:6px; align-items:center; background:rgba(17,26,46,.9); border:1px solid var(--border); padding:8px 14px; border-radius:999px;}
.nav-dots .dot{width:7px; height:7px; border-radius:50%; background:var(--border); cursor:pointer; transition:.2s;}
.nav-dots .dot.active{background:var(--accent); width:20px; border-radius:4px;}
.footer-note{position:fixed; bottom:20px; right:22px; z-index:50; font-size:.72rem; color:var(--text-dim); font-family:'JetBrains Mono';}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px}

.tac-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px;}
@media (max-width:900px){.tac-grid{grid-template-columns:1fr;}}
.tac-tile{
  background:var(--panel-2); border:1px solid var(--border); border-radius:14px; padding:16px;
  cursor:pointer; transition:.2s; text-align:center;
}
.tac-tile:hover{transform:translateY(-4px); border-color:var(--accent); box-shadow:0 10px 24px rgba(62,193,255,.15);}
.tac-tile i{font-size:1.3rem; color:var(--accent); margin-bottom:6px; display:block;}
.tac-tile .tname{font-size:.86rem; font-weight:700;}

.link-row{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid rgba(255,255,255,.06);}
.link-row:last-child{border-bottom:none;}
.link-row a{color:var(--text); text-decoration:none; font-weight:600;}
.link-row a:hover{color:var(--accent);}
.link-row .ext{margin-left:auto; color:var(--text-dim); font-size:.75rem;}

.fig-img{max-width:100%; border-radius:12px; border:1px solid var(--border); background:#fff; padding:14px; display:block; margin:0 auto;}
.fig-cap{text-align:center; font-size:.78rem; color:var(--text-dim); margin-top:8px;}

.step-big{display:flex; gap:20px; align-items:flex-start;}
.step-num{
  width:60px; height:60px; border-radius:16px; background:rgba(62,193,255,.12); border:1px solid rgba(62,193,255,.35);
  color:var(--accent); display:flex; align-items:center; justify-content:center; font-size:1.6rem; font-weight:800;
  font-family:'JetBrains Mono'; flex-shrink:0;
}
.acid-letter{
  width:64px; height:64px; border-radius:18px; display:flex; align-items:center; justify-content:center;
  font-size:1.9rem; font-weight:800; font-family:'JetBrains Mono'; flex-shrink:0;
}
.compare-col{background:var(--panel-2); border:1px solid var(--border); border-radius:14px; padding:20px;}
.compare-col h4{font-weight:800; font-size:1.02rem; margin-bottom:10px; display:flex; align-items:center; gap:8px;}
</style>
</head>
<body>

<div class="blueprint"></div>
<div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
<div class="brand"><i class="fa-solid fa-database"></i> ANDIS 2 · Unidad 3</div>
<div class="hud"><i class="fa-solid fa-layer-group"></i> <span class="unit-tag" id="hudCurrent">1</span>/<span id="hudTotal">0</span></div>

<div class="slides-container" id="slidesContainer"></div>

<div class="nav-controls">
  <button class="nav-btn" id="prevBtn"><i class="fa-solid fa-chevron-left"></i></button>
  <div class="nav-dots" id="navDots"></div>
  <button class="nav-btn" id="nextBtn"><i class="fa-solid fa-chevron-right"></i></button>
</div>
<div class="footer-note">← → para navegar</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.10.5/sweetalert2.all.min.js"></script>
<script>
const slidesHTML = [];

// 0. Portada
slidesHTML.push(`
<div class="slide-inner d-flex flex-column justify-content-center" style="min-height:78vh;">
  <div class="animate__animated animate__fadeInDown">
    <span class="eyebrow"><i class="fa-solid fa-database"></i> Unidad 3 · Soluciones arquitectónicas</span>
    <h1 class="slide-title">ACID</h1>
    <p class="subtitle">Cuatro propiedades que garantizan que una transacción se comporte de forma predecible: atomicidad, consistencia, aislamiento y durabilidad — y por qué esas garantías van más allá de las bases de datos.</p>
  </div>
</div>
`);

// 1. Qué es una transacción / ACID
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-right-left"></i> Punto de partida</span>
  <h2 class="slide-title">¿Qué es una transacción?</h2>
  <div class="card-panel">
    <p style="font-size:1.02rem; line-height:1.75; margin-bottom:14px;">
      Una <strong>transacción</strong> refleja la idea de que las actividades de un usuario en particular queden <strong>aisladas</strong> de todas las demás actividades concurrentes —de otros usuarios u otros procesos—. Típicamente es una secuencia corta de interacciones con la base de datos —encontrar o modificar un elemento— que representa una actividad significativa en el contexto del usuario.
    </p>
    <p style="font-size:1.02rem; line-height:1.75; margin-bottom:0;">
      <strong class="mono" style="color:var(--accent)">ACID</strong> es el acrónimo que referencia las cuatro propiedades que debe cumplir una transacción: <strong>a</strong>tomicidad, <strong>c</strong>onsistencia, a<strong>i</strong>slamiento —isolation— y <strong>d</strong>urabilidad.
    </p>
  </div>
  <div class="card-panel mt-3 d-flex gap-3 align-items-center">
    <div class="icon-tile" style="background:rgba(123,107,255,.12); color:#b3a8ff; border-color:rgba(123,107,255,.35)"><i class="fa-solid fa-code-compare"></i></div>
    <div class="small" style="color:var(--text-dim)">ACID tiene un modelo alternativo —más relajado— llamado <strong style="color:var(--text)">BASE</strong>, típico de sistemas distribuidos que priorizan disponibilidad sobre consistencia estricta.</div>
  </div>
</div>
`);

// 2. Las 4 letras - overview
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-list-ol"></i> El acrónimo</span>
  <h2 class="slide-title">Las cuatro propiedades</h2>
  <div class="grid-2">
    <div class="card-panel d-flex gap-3 align-items-center">
      <div class="acid-letter" style="background:rgba(62,193,255,.12); color:var(--accent); border:1px solid rgba(62,193,255,.35)">A</div>
      <div><h4 style="margin:0 0 3px 0; font-weight:800;">Atomicidad</h4><p style="margin:0; color:var(--text-dim); font-size:.88rem;">Todo o nada.</p></div>
    </div>
    <div class="card-panel d-flex gap-3 align-items-center">
      <div class="acid-letter" style="background:rgba(123,107,255,.12); color:#b3a8ff; border:1px solid rgba(123,107,255,.35)">C</div>
      <div><h4 style="margin:0 0 3px 0; font-weight:800;">Consistencia</h4><p style="margin:0; color:var(--text-dim); font-size:.88rem;">De un estado válido a otro.</p></div>
    </div>
    <div class="card-panel d-flex gap-3 align-items-center">
      <div class="acid-letter" style="background:rgba(255,181,71,.12); color:var(--accent-3); border:1px solid rgba(255,181,71,.35)">I</div>
      <div><h4 style="margin:0 0 3px 0; font-weight:800;">Aislamiento</h4><p style="margin:0; color:var(--text-dim); font-size:.88rem;">Invisible para otras transacciones.</p></div>
    </div>
    <div class="card-panel d-flex gap-3 align-items-center">
      <div class="acid-letter" style="background:rgba(62,230,168,.12); color:var(--ok); border:1px solid rgba(62,230,168,.35)">D</div>
      <div><h4 style="margin:0 0 3px 0; font-weight:800;">Durabilidad</h4><p style="margin:0; color:var(--text-dim); font-size:.88rem;">Permanente, pase lo que pase.</p></div>
    </div>
  </div>
</div>
`);

// 3. Atomicidad
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-atom"></i> Propiedad 1</span>
  <h2 class="slide-title">Atomicidad</h2>
  <div class="card-panel">
    <div class="step-big">
      <div class="acid-letter" style="background:rgba(62,193,255,.12); color:var(--accent); border:1px solid rgba(62,193,255,.35)">A</div>
      <p style="font-size:1.02rem; line-height:1.75; margin:0;">
        Las interacciones de una transacción deben ser <strong>indivisibles</strong>: o bien todas se reflejan de forma apropiada en los datos, o bien no ocurre ningún cambio. El usuario debe saber qué ha ocurrido y en qué estado quedaron los datos.
      </p>
    </div>
  </div>
  <div class="card-panel mt-3 d-flex gap-3 align-items-center">
    <div class="icon-tile" style="background:rgba(255,107,107,.12); color:#ff6b6b; border-color:rgba(255,107,107,.35)"><i class="fa-solid fa-rotate-left"></i></div>
    <div class="small" style="color:var(--text-dim)">La atomicidad trata la transacción como <strong style="color:var(--text)">una sola unidad de trabajo</strong>: se completa por entero, o no se completa en absoluto. Si ocurre una falla a mitad de camino, se revierte —<strong style="color:var(--text)">rollback</strong>— toda la transacción, como si nada hubiera pasado.</div>
  </div>
</div>
`);

// 4. Consistencia
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-check-double"></i> Propiedad 2</span>
  <h2 class="slide-title">Consistencia</h2>
  <div class="card-panel">
    <div class="step-big">
      <div class="acid-letter" style="background:rgba(123,107,255,.12); color:#b3a8ff; border:1px solid rgba(123,107,255,.35)">C</div>
      <p style="font-size:1.02rem; line-height:1.75; margin:0;">
        Cada transacción que se completa exitosamente produce solamente <strong>resultados correctos</strong>: se cumplen todas las reglas que se hayan definido sobre los datos.
      </p>
    </div>
  </div>
  <div class="card-panel mt-3 d-flex gap-3 align-items-center">
    <div class="icon-tile" style="background:rgba(123,107,255,.12); color:#b3a8ff; border-color:rgba(123,107,255,.35)"><i class="fa-solid fa-link"></i></div>
    <div class="small" style="color:var(--text-dim)">La consistencia garantiza que la transacción mueve el conjunto de datos de <strong style="color:var(--text)">un estado válido a otro estado también válido</strong>, cumpliendo por ejemplo reglas de <strong style="color:var(--text)">integridad referencial</strong>.</div>
  </div>
</div>
`);

// 5. Aislamiento
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-shield"></i> Propiedad 3</span>
  <h2 class="slide-title">Aislamiento</h2>
  <div class="card-panel">
    <div class="step-big">
      <div class="acid-letter" style="background:rgba(255,181,71,.12); color:var(--accent-3); border:1px solid rgba(255,181,71,.35)">I</div>
      <p style="font-size:1.02rem; line-height:1.75; margin:0;">
        Los eventos de una transacción deben quedar <strong>ocultos</strong> a otras transacciones que estén ejecutándose de forma concurrente. El aislamiento garantiza que las transacciones se ejecuten de forma independiente unas de otras.
      </p>
    </div>
  </div>
  <p class="subtitle mt-3 mb-2">Los distintos motores gestionan el aislamiento mediante <strong>niveles de aislamiento</strong>, para evitar problemas de concurrencia como lecturas sucias o lecturas fantasma. Tocá cada nivel para ver de qué se trata.</p>
  <div class="tac-grid" id="gridAislamiento"></div>
</div>
`);

// 6. Durabilidad
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-hard-drive"></i> Propiedad 4</span>
  <h2 class="slide-title">Durabilidad</h2>
  <div class="card-panel">
    <div class="step-big">
      <div class="acid-letter" style="background:rgba(62,230,168,.12); color:var(--ok); border:1px solid rgba(62,230,168,.35)">D</div>
      <p style="font-size:1.02rem; line-height:1.75; margin:0;">
        Una vez que una transacción se ha completado exitosamente, sus cambios son <strong>permanentes</strong>, aún en el caso de un fallo del sistema —corte de energía, caída del proceso, reinicio del servidor—.
      </p>
    </div>
  </div>
</div>
`);

// 7. ACID más allá de bases de datos
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-arrows-turn-right"></i> No es solo para bases de datos</span>
  <h2 class="slide-title">ACID más allá de las bases de datos</h2>
  <p class="subtitle mb-3">Aunque el concepto surgió en el contexto de bases de datos, hoy se usa en cualquier contexto donde haya manipulación y acceso a datos o eventos —por ejemplo, plataformas de colas de mensajes—.</p>
  <div class="grid-3">
    <div class="compare-col">
      <h4><i class="fa-solid fa-hard-drive" style="color:var(--ok)"></i> Durabilidad</h4>
      <p style="color:var(--text-dim); font-size:.88rem; line-height:1.6;">Se logra persistiendo los mensajes recibidos hasta que sean procesados y removidos de la cola.</p>
    </div>
    <div class="compare-col">
      <h4><i class="fa-solid fa-atom" style="color:var(--accent)"></i> Atomicidad</h4>
      <p style="color:var(--text-dim); font-size:.88rem; line-height:1.6;">Los mensajes se entregan por completo o no se entregan; si hay un error en la transmisión, no se procesan mensajes parcialmente recibidos.</p>
    </div>
    <div class="compare-col">
      <h4><i class="fa-solid fa-shield" style="color:var(--accent-3)"></i> Aislamiento</h4>
      <p style="color:var(--text-dim); font-size:.88rem; line-height:1.6;">En algunos casos se logra usando tópicos o múltiples colas, para que consumidores concurrentes no interfieran entre ellos.</p>
    </div>
  </div>
</div>
`);

// 8. Comparación con BASE
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-scale-unbalanced"></i> El otro extremo</span>
  <h2 class="slide-title">ACID vs. BASE</h2>
  <div class="card-panel">
    <p style="font-size:1.0rem; line-height:1.75; margin-bottom:0;">
      ACID prioriza la <strong>consistencia estricta</strong> de los datos, incluso a costa de disponibilidad en ciertos escenarios. Su contraparte —<strong>BASE</strong> (Basically Available, Soft state, Eventually consistent)— relaja esas garantías, favoreciendo la disponibilidad y la escalabilidad en sistemas distribuidos donde la consistencia inmediata es difícil de sostener.
    </p>
  </div>
  <div class="card-panel mt-3">
    <div class="link-row"><i class="fa-solid fa-link" style="color:var(--accent)"></i><a href="https://github.com/ucudal/ANDIS_Conceptos/blob/main/4_Conceptos/4_BASE.md" target="_blank">BASE — ANDIS_Conceptos</a><span class="ext">github.com</span></div>
    <div class="link-row"><i class="fa-solid fa-link" style="color:var(--accent)"></i><a href="https://www.postgresql.org/docs/current/transaction-iso.html" target="_blank">Transaction Isolation — PostgreSQL Docs</a><span class="ext">postgresql.org</span></div>
  </div>
</div>
`);

// 9. Quiz
slidesHTML.push(`
<div class="slide-inner d-flex flex-column justify-content-center align-items-center text-center" style="min-height:70vh;">
  <span class="eyebrow"><i class="fa-solid fa-brain"></i> Chequeo de comprensión</span>
  <h2 class="slide-title">5 preguntas sobre ACID</h2>
  <p class="subtitle mb-4">Las cuatro propiedades, los niveles de aislamiento, y su uso más allá de las bases de datos.</p>
  <button class="check-btn" onclick="lanzarQuiz()"><i class="fa-solid fa-play me-2"></i>Iniciar quiz</button>
</div>
`);

// 10. Cierre
slidesHTML.push(`
<div class="slide-inner d-flex flex-column justify-content-center align-items-center text-center" style="min-height:78vh;">
  <div class="icon-tile mb-3" style="width:72px;height:72px;font-size:2rem;"><i class="fa-solid fa-check"></i></div>
  <span class="eyebrow"><i class="fa-solid fa-flag-checkered"></i> Repaso completo</span>
  <h2 class="slide-title">Todo o nada, siempre correcto, invisible, para siempre</h2>
  <p class="subtitle mb-4" style="max-width:680px;">Atomicidad, consistencia, aislamiento y durabilidad son las cuatro garantías que hacen confiable una transacción — en una base de datos relacional o en cualquier sistema que manipule datos de forma crítica.</p>
</div>
`);

/* ============ MOTOR DE NAVEGACIÓN ============ */
const container = document.getElementById('slidesContainer');
slidesHTML.forEach((html, i)=>{
  const div = document.createElement('div');
  div.className = 'slide' + (i===0 ? ' active' : '');
  div.id = 'slide'+i;
  div.innerHTML = html;
  container.appendChild(div);
});

let current = 0;
const total = slidesHTML.length;
document.getElementById('hudTotal').textContent = total;

const dotsWrap = document.getElementById('navDots');
for(let i=0;i<total;i++){
  const d = document.createElement('div');
  d.className = 'dot' + (i===0?' active':'');
  d.onclick = ()=>goTo(i);
  dotsWrap.appendChild(d);
}

function updateUI(){
  document.querySelectorAll('.slide').forEach((s,i)=>{ s.classList.toggle('active', i===current); });
  document.querySelectorAll('.nav-dots .dot').forEach((d,i)=>{ d.classList.toggle('active', i===current); });
  document.getElementById('hudCurrent').textContent = current+1;
  document.getElementById('progressFill').style.width = ((current+1)/total*100)+'%';
  const active = document.getElementById('slide'+current);
  active.scrollTop = 0;
  const animTarget = active.querySelector('.slide-inner');
  if(animTarget){
    animTarget.classList.remove('animate__fadeIn');
    void animTarget.offsetWidth;
    animTarget.classList.add('animate__animated','animate__fadeIn');
  }
}
function goTo(i){ if(i<0||i>=total) return; current = i; updateUI(); }
document.getElementById('prevBtn').onclick = ()=>goTo(current-1);
document.getElementById('nextBtn').onclick = ()=>goTo(current+1);
document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight') goTo(current+1);
  if(e.key==='ArrowLeft') goTo(current-1);
});
updateUI();

/* ============ NIVELES DE AISLAMIENTO ============ */
const niveles = [
  {icon:'fa-eye', n:'Read committed', d:'Cada consulta dentro de la transacción solo ve datos que ya fueron confirmados (commit) por otras transacciones al momento de ejecutarse. Evita lecturas sucias, pero permite que dos lecturas dentro de la misma transacción devuelvan valores distintos.', link:'https://www.postgresql.org/docs/current/transaction-iso.html#XACT-READ-COMMITTED'},
  {icon:'fa-repeat', n:'Repeatable read', d:'Garantiza que si se lee el mismo dato varias veces dentro de la transacción, siempre se obtiene el mismo valor, aunque otras transacciones lo hayan modificado y confirmado mientras tanto.', link:'https://www.postgresql.org/docs/current/transaction-iso.html#XACT-REPEATABLE-READ'},
  {icon:'fa-lock', n:'Serializable', d:'El nivel más estricto: el resultado de ejecutar varias transacciones concurrentes es equivalente al de haberlas ejecutado una tras otra, en algún orden serial. Máxima consistencia, menor concurrencia posible.', link:'https://www.postgresql.org/docs/current/transaction-iso.html#XACT-SERIALIZABLE'}
];
const gridAislamiento = document.getElementById('gridAislamiento');
niveles.forEach(t=>{
  const tile = document.createElement('div');
  tile.className = 'tac-tile';
  tile.innerHTML = `<i class="fa-solid ${t.icon}"></i><div class="tname">${t.n}</div>`;
  tile.onclick = ()=>{
    const linkHtml = t.link ? `<p style="text-align:left; margin-top:10px;"><a href="${t.link}" target="_blank" style="color:#3ec1ff;">Más información →</a></p>` : '';
    Swal.fire({
      title: t.n,
      html: `<p style="text-align:left;">${t.d}</p>${linkHtml}`,
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    });
  };
  gridAislamiento.appendChild(tile);
});

/* ============ QUIZ ============ */
const preguntas = [
  {
    texto:'¿Qué garantiza la propiedad de Atomicidad en una transacción?',
    opciones:{
      a:'Que los datos siempre cumplan las reglas de integridad definidas',
      b:'Que la transacción se trate como una sola unidad: se completa por entero, o no se completa en absoluto — con rollback si falla a mitad de camino',
      c:'Que dos transacciones concurrentes nunca se vean entre sí',
      d:'Que los cambios sobrevivan a un fallo del sistema'
    },
    correcta:'b'
  },
  {
    texto:'¿Qué diferencia hay entre Consistencia y Aislamiento en ACID?',
    opciones:{
      a:'No hay ninguna diferencia, son sinónimos',
      b:'La Consistencia asegura que los datos pasen de un estado válido a otro válido cumpliendo las reglas definidas; el Aislamiento asegura que los eventos de una transacción queden ocultos a otras transacciones concurrentes',
      c:'La Consistencia se aplica solo a colas de mensajes y el Aislamiento solo a bases de datos',
      d:'La Consistencia garantiza durabilidad y el Aislamiento garantiza atomicidad'
    },
    correcta:'b'
  },
  {
    texto:'¿Cuál de estos NO es un nivel de aislamiento típico en una base de datos relacional?',
    opciones:{
      a:'Read committed',
      b:'Eventually consistent',
      c:'Repeatable read',
      d:'Serializable'
    },
    correcta:'b'
  },
  {
    texto:'En una plataforma de colas de mensajes, ¿cómo se logra típicamente la Durabilidad según ACID?',
    opciones:{
      a:'Cifrando los mensajes en tránsito',
      b:'Persistiendo los mensajes recibidos hasta que sean procesados y removidos de la cola',
      c:'Usando múltiples colas para consumidores concurrentes',
      d:'Rechazando mensajes parcialmente recibidos'
    },
    correcta:'b'
  },
  {
    texto:'¿Qué modelo alternativo a ACID prioriza la disponibilidad sobre la consistencia estricta en sistemas distribuidos?',
    opciones:{
      a:'CAP',
      b:'BASE',
      c:'SOLID',
      d:'REST'
    },
    correcta:'b'
  }
];
let idxPregunta = 0, aciertos = 0;

function lanzarQuiz(){ idxPregunta = 0; aciertos = 0; mostrarPregunta(); }
function mostrarPregunta(){
  if(idxPregunta >= preguntas.length){
    Swal.fire({
      title:'Resultado',
      html:`Acertaste <b>${aciertos}/${preguntas.length}</b>.`,
      icon: aciertos===preguntas.length ? 'success' : 'info',
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    });
    return;
  }
  const p = preguntas[idxPregunta];
  Swal.fire({
    title: p.texto,
    input:'radio',
    inputOptions: p.opciones,
    background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff',
    confirmButtonText:'Responder',
    inputValidator: (value)=> !value && 'Elegí una opción'
  }).then(res=>{
    if(!res.isConfirmed) return;
    const ok = res.value === p.correcta;
    if(ok) aciertos++;
    Swal.fire({
      title: ok ? '¡Correcto!' : 'No es así',
      html: `La respuesta correcta era: <b>${p.opciones[p.correcta]}</b>`,
      icon: ok ? 'success' : 'error',
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    }).then(()=>{ idxPregunta++; mostrarPregunta(); });
  });
}

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANDIS 2 · Teórico — Facilidad de modificación</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#070b14; --bg-1:#0d1424; --panel:#111a2e; --panel-2:#16223a;
  --accent:#3ec1ff; --accent-2:#7b6bff; --accent-3:#ffb547; --ok:#3ee6a8;
  --text:#e8edf7; --text-dim:#8fa0bd; --border:#22304d;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(1200px 700px at 15% -10%, rgba(62,193,255,.10), transparent 60%),
    radial-gradient(1000px 700px at 110% 10%, rgba(123,107,255,.12), transparent 55%),
    var(--bg-0);
  color:var(--text); font-family:'Inter',sans-serif; overflow:hidden;
}
.mono{font-family:'JetBrains Mono',monospace}
.blueprint{
  position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.35;
  background-image:linear-gradient(rgba(62,193,255,.06) 1px, transparent 1px),linear-gradient(90deg, rgba(62,193,255,.06) 1px, transparent 1px);
  background-size:42px 42px;
}
.progress-track{position:fixed; top:0; left:0; width:100%; height:4px; background:rgba(255,255,255,.06); z-index:50;}
.progress-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--accent-2)); transition:width .4s ease; box-shadow:0 0 12px var(--accent);}
.hud{position:fixed; top:14px; right:18px; z-index:50; background:rgba(17,26,46,.85); border:1px solid var(--border); backdrop-filter:blur(6px); padding:7px 14px; border-radius:999px; font-size:.82rem; color:var(--text-dim); display:flex; align-items:center; gap:8px;}
.hud .unit-tag{color:var(--accent); font-weight:700}
.brand{position:fixed; top:14px; left:18px; z-index:50; font-size:.78rem; color:var(--text-dim); display:flex; align-items:center; gap:8px; letter-spacing:.03em;}
.brand i{color:var(--accent-3)}
.slides-container{position:relative; z-index:1; height:100vh; width:100vw;}
.slide{position:absolute; inset:0; display:none; padding:90px 8vw 110px 8vw; overflow-y:auto;}
.slide.active{display:block}
.slide-inner{max-width:1180px; margin:0 auto;}
.eyebrow{display:inline-flex; align-items:center; gap:8px; font-size:.78rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent); font-weight:700; margin-bottom:14px;}
.eyebrow i{font-size:.9rem}
h1.slide-title{font-size:clamp(1.9rem,3.4vw,3rem); font-weight:800; margin-bottom:.4rem; line-height:1.1;}
h2.slide-title{font-size:clamp(1.5rem,2.6vw,2.2rem); font-weight:800; margin-bottom:.6rem;}
.subtitle{color:var(--text-dim); font-size:1.05rem; max-width:820px;}
.card-panel{background:linear-gradient(180deg, var(--panel), var(--panel-2)); border:1px solid var(--border); border-radius:16px; padding:26px 28px; box-shadow:0 12px 30px rgba(0,0,0,.35);}
.card-panel + .card-panel{margin-top:18px}
.pill{display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:999px; font-size:.76rem; font-weight:700; background:rgba(62,193,255,.12); color:var(--accent); border:1px solid rgba(62,193,255,.35);}
.pill.purple{background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)}
.pill.amber{background:rgba(255,181,71,.14); color:var(--accent-3); border-color:rgba(255,181,71,.4)}
.pill.ok{background:rgba(62,230,168,.12); color:var(--ok); border-color:rgba(62,230,168,.35)}
.icon-tile{width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center; background:rgba(62,193,255,.12); color:var(--accent); font-size:1.3rem; border:1px solid rgba(62,193,255,.3); flex-shrink:0;}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
.grid-4{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
@media (max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}
ul.clean{list-style:none; margin:0; padding:0;}
ul.clean li{position:relative; padding:6px 0 6px 26px; color:var(--text); font-size:.94rem;}
ul.clean li::before{content:"\f105"; font-family:"Font Awesome 6 Free"; font-weight:900; color:var(--accent); position:absolute; left:2px; top:8px; font-size:.85rem;}
.check-btn{border:none; background:linear-gradient(90deg,var(--accent),var(--accent-2)); color:#04101f; font-weight:800; padding:10px 22px; border-radius:10px; font-size:.9rem; box-shadow:0 8px 22px rgba(62,193,255,.25); cursor:pointer;}
.check-btn:hover{filter:brightness(1.08); color:#04101f;}
.check-btn.ghost{background:transparent; border:1px solid var(--border); color:var(--text); box-shadow:none;}
.check-btn.ghost:hover{border-color:var(--accent); color:var(--accent);}
.nav-controls{position:fixed; bottom:18px; left:0; right:0; z-index:50; display:flex; justify-content:center; gap:14px; align-items:center;}
.nav-btn{width:46px; height:46px; border-radius:50%; border:1px solid var(--border); background:rgba(17,26,46,.9); color:var(--text); display:flex; align-items:center; justify-content:center; font-size:1.1rem; backdrop-filter:blur(6px);}
.nav-btn:hover{border-color:var(--accent); color:var(--accent);}
.nav-dots{display:flex; gap:6px; align-items:center; background:rgba(17,26,46,.9); border:1px solid var(--border); padding:8px 14px; border-radius:999px;}
.nav-dots .dot{width:7px; height:7px; border-radius:50%; background:var(--border); cursor:pointer; transition:.2s;}
.nav-dots .dot.active{background:var(--accent); width:20px; border-radius:4px;}
.footer-note{position:fixed; bottom:20px; right:22px; z-index:50; font-size:.72rem; color:var(--text-dim); font-family:'JetBrains Mono';}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px}

.sub-item{background:var(--panel-2); border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:10px;}
.sub-item .sname{font-weight:700; font-size:.94rem; color:var(--accent); margin-bottom:4px; display:flex; align-items:center; gap:8px;}
.sub-item .sdesc{font-size:.85rem; color:var(--text-dim); margin:0;}

.link-row{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid rgba(255,255,255,.06);}
.link-row:last-child{border-bottom:none;}
.link-row a{color:var(--text); text-decoration:none; font-weight:600;}
.link-row a:hover{color:var(--accent);}
.link-row .ext{margin-left:auto; color:var(--text-dim); font-size:.75rem;}

.case-card{background:var(--panel-2); border:1px solid var(--border); border-radius:14px; padding:18px; height:100%;}
.case-card .icase{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;margin-bottom:10px;}

.scenario-card{background:var(--panel-2); border:1px solid var(--border); border-radius:14px; padding:16px 18px; margin-bottom:12px;}
.scenario-card .stext{font-size:.92rem; color:var(--text); font-style:italic; margin-bottom:10px;}
.scenario-actions{display:flex; justify-content:flex-end;}
</style>
</head>
<body>

<div class="blueprint"></div>
<div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
<div class="brand"><i class="fa-solid fa-cubes"></i> ANDIS 2 · Teórico</div>
<div class="hud"><i class="fa-solid fa-layer-group"></i> <span class="unit-tag" id="hudCurrent">1</span>/<span id="hudTotal">0</span></div>

<div class="slides-container" id="slidesContainer"></div>

<div class="nav-controls">
  <button class="nav-btn" id="prevBtn"><i class="fa-solid fa-chevron-left"></i></button>
  <div class="nav-dots" id="navDots"></div>
  <button class="nav-btn" id="nextBtn"><i class="fa-solid fa-chevron-right"></i></button>
</div>
<div class="footer-note">← → para navegar</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.10.5/sweetalert2.all.min.js"></script>
<script>
const slidesHTML = [];

// 0. Portada
slidesHTML.push(`
<div class="slide-inner d-flex flex-column justify-content-center" style="min-height:78vh;">
  <div class="animate__animated animate__fadeInDown">
    <span class="eyebrow"><i class="fa-solid fa-pen-ruler"></i> Teórico · Unidad 1</span>
    <h1 class="slide-title">Facilidad de modificación</h1>
    <p class="subtitle">Modifiability: si en todo lo demás la única constante es el cambio, en software mucho más. Cómo se diseña para que cambiar salga barato y seguro.</p>
  </div>
</div>
`);

// 1. Definición
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-circle-question"></i> Definición</span>
  <h2 class="slide-title">¿Qué es la facilidad de modificación?</h2>
  <div class="card-panel mt-3">
    <div class="d-flex gap-3">
      <div class="icon-tile"><i class="fa-solid fa-pen"></i></div>
      <p style="font-size:1.05rem; line-height:1.75; margin:0;">
        Es el atributo de calidad de la arquitectura de software que <strong>baja el costo y el riesgo</strong> de
        hacer cambios.
      </p>
    </div>
  </div>
  <div class="card-panel mt-3 d-flex gap-3 align-items-center">
    <div class="icon-tile" style="background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)"><i class="fa-solid fa-sitemap"></i></div>
    <div class="small" style="color:var(--text-dim)">En ISO/IEC 25010 es una <strong style="color:var(--text)">sub-característica de facilidad de mantenimiento</strong>: la capacidad de un sistema o componente de ser modificado de forma efectiva y eficiente, <strong style="color:var(--text)">sin introducir defectos</strong> ni degradar su calidad.</div>
  </div>
</div>
`);

// 2. Por qué importa
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-arrows-spin"></i> Por qué importa</span>
  <h2 class="slide-title">El cambio es la única constante</h2>
  <p class="subtitle mb-3">Si en muchos contextos el cambio es inevitable, en el software lo es todavía más.</p>
  <div class="grid-3">
    <div class="sub-item"><div class="sname"><i class="fa-solid fa-plus"></i>Nueva funcionalidad</div><p class="sdesc">Se agrega, y se retira lo que quedó obsoleto.</p></div>
    <div class="sub-item"><div class="sname"><i class="fa-solid fa-bug"></i>Corrección de defectos</div></div>
    <div class="sub-item"><div class="sname"><i class="fa-solid fa-shield"></i>Mejoras de seguridad o desempeño</div></div>
    <div class="sub-item"><div class="sname"><i class="fa-solid fa-arrows-rotate"></i>Actualización tecnológica</div><p class="sdesc">Nuevas tecnologías, protocolos o estándares.</p></div>
    <div class="sub-item"><div class="sname"><i class="fa-solid fa-money-bill-trend-up"></i>Reducción de deuda técnica</div></div>
    <div class="sub-item"><div class="sname"><i class="fa-solid fa-ellipsis"></i>Entre otras razones</div></div>
  </div>
</div>
`);

// 3. Cuatro aspectos
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-list-check"></i> Marco de análisis</span>
  <h2 class="slide-title">Cuatro aspectos a considerar</h2>
  <div class="grid-2 mt-3">
    <div class="card-panel h-100">
      <div class="icon-tile mb-2"><i class="fa-solid fa-crosshairs"></i></div>
      <h6 class="fw-bold">Qué puede cambiar</h6>
      <p class="small mb-0" style="color:var(--text-dim)">Qué partes del sistema son candidatas a modificarse.</p>
    </div>
    <div class="card-panel h-100">
      <div class="icon-tile mb-2" style="background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)"><i class="fa-solid fa-percent"></i></div>
      <h6 class="fw-bold">Cuál es la probabilidad de que ocurra</h6>
      <p class="small mb-0" style="color:var(--text-dim)">Qué tan probable es cada tipo de cambio.</p>
    </div>
    <div class="card-panel h-100">
      <div class="icon-tile mb-2" style="background:rgba(255,181,71,.14); color:var(--accent-3); border-color:rgba(255,181,71,.4)"><i class="fa-solid fa-user-gear"></i></div>
      <h6 class="fw-bold">Quién realiza el cambio</h6>
      <p class="small mb-0" style="color:var(--text-dim)">Desarrollador, operador, usuario final, otro sistema...</p>
    </div>
    <div class="card-panel h-100">
      <div class="icon-tile mb-2" style="background:rgba(62,230,168,.12); color:var(--ok); border-color:rgba(62,230,168,.35)"><i class="fa-solid fa-coins"></i></div>
      <h6 class="fw-bold">Cuál es el costo del cambio</h6>
      <p class="small mb-0" style="color:var(--text-dim)">Esfuerzo, tiempo y riesgo que implica hacerlo.</p>
    </div>
  </div>
</div>
`);

// 4. Categorías con nombre propio
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-tags"></i> Casos especiales</span>
  <h2 class="slide-title">Categorías de modificación con nombre propio</h2>
  <p class="subtitle mb-3">Algunos tipos de cambio son tan frecuentes que tienen su propio nombre dentro de la facilidad de modificación.</p>
  <div class="grid-2">
    <div class="sub-item"><div class="sname"><i class="fa-solid fa-arrows-up-down-left-right"></i>Escalabilidad</div><p class="sdesc">Cambiar la capacidad del sistema para atender más (o menos) carga.</p></div>
    <div class="sub-item"><div class="sname"><i class="fa-solid fa-sliders"></i>Variabilidad</div><p class="sdesc">Cambiar o configurar el comportamiento del sistema entre distintos contextos de uso.</p></div>
    <div class="sub-item"><div class="sname"><i class="fa-solid fa-box-archive"></i>Portabilidad</div><p class="sdesc">Cambiar el entorno de ejecución del sistema (hardware, sistema operativo, proveedor de nube...).</p></div>
    <div class="sub-item"><div class="sname"><i class="fa-solid fa-location-dot"></i>Independencia de la ubicación</div><p class="sdesc">Cambiar dónde se ejecuta cada componente sin afectar cómo se comunican entre sí.</p></div>
  </div>
</div>
`);

// 5. Casos prácticos
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-briefcase"></i> Casos prácticos</span>
  <h2 class="slide-title">Facilidad de modificación en el mundo real</h2>
  <div class="grid-2">
    <div class="case-card">
      <div class="icase" style="background:rgba(62,193,255,.12); color:var(--accent);"><i class="fa-solid fa-credit-card"></i></div>
      <h6 class="fw-bold">Nuevos métodos de pago</h6>
      <p class="small mb-0" style="color:var(--text-dim)">El área comercial pide sumar y quitar pasarelas de pago sin tocar el núcleo del sistema de facturación. Es un caso típico de <strong style="color:var(--text)">variabilidad</strong>.</p>
    </div>
    <div class="case-card">
      <div class="icase" style="background:rgba(123,107,255,.14); color:#b3a8ff;"><i class="fa-solid fa-cloud-arrow-up"></i></div>
      <h6 class="fw-bold">Cambio de proveedor de nube</h6>
      <p class="small mb-0" style="color:var(--text-dim)">La empresa migra de un proveedor a otro y la lógica de negocio no debería reescribirse. Es un caso de <strong style="color:var(--text)">portabilidad</strong>.</p>
    </div>
    <div class="case-card">
      <div class="icase" style="background:rgba(255,181,71,.14); color:var(--accent-3);"><i class="fa-solid fa-users"></i></div>
      <h6 class="fw-bold">Crecimiento de usuarios</h6>
      <p class="small mb-0" style="color:var(--text-dim)">El sistema debe atender diez veces más usuarios simultáneos sin un rediseño completo. Es un caso de <strong style="color:var(--text)">escalabilidad</strong>.</p>
    </div>
    <div class="case-card">
      <div class="icase" style="background:rgba(62,230,168,.12); color:var(--ok);"><i class="fa-solid fa-earth-americas"></i></div>
      <h6 class="fw-bold">Despliegue multi-región</h6>
      <p class="small mb-0" style="color:var(--text-dim)">Los servicios se distribuyen en distintas regiones geográficas y deben poder comunicarse sin que su ubicación esté fija en el código. Es <strong style="color:var(--text)">independencia de la ubicación</strong>.</p>
    </div>
  </div>
</div>
`);

// 6. Ejercicio interactivo
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-flask"></i> Ejercicio práctico</span>
  <h2 class="slide-title">¿Qué categoría de modificación es?</h2>
  <p class="subtitle mb-3">Leé cada situación, decidí a cuál de las 4 categorías con nombre propio corresponde, y contrastá con el análisis esperado.</p>
  <div id="ejercicioWrap"></div>
</div>
`);

// 7. Tácticas
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-compass"></i> Cómo se ataca</span>
  <h2 class="slide-title">Tácticas para la facilidad de modificación</h2>
  <div class="card-panel mt-3">
    <div class="link-row">
      <i class="fa-solid fa-link" style="color:var(--accent)"></i>
      <a href="https://github.com/ucudal/ANDIS_Conceptos/blob/main/2_Tecnicas_y_herramientas/2_05_.Tacticas_arquitectura/2_05_05_Tacticas_facilidad_de_modificacion.md" target="_blank">Tácticas para la facilidad de modificación — desarrollo completo</a>
      <span class="ext">repositorio</span>
    </div>
  </div>
</div>
`);

// 8. Patrones y referencias
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-book-open-reader"></i> Para profundizar</span>
  <h2 class="slide-title">Patrones y referencias</h2>
  <div class="card-panel mt-3">
    <span class="pill purple"><i class="fa-solid fa-shapes"></i> Patrones</span>
    <div class="grid-2 mt-2">
      <div class="sub-item"><div class="sname"><i class="fa-solid fa-arrows-left-right"></i>Cliente-servidor</div></div>
      <div class="sub-item"><div class="sname"><i class="fa-solid fa-plug"></i>Plug-in (microkernel)</div></div>
      <div class="sub-item"><div class="sname"><i class="fa-solid fa-layer-group"></i>Capas</div></div>
      <div class="sub-item"><div class="sname"><i class="fa-solid fa-tower-broadcast"></i>Editor-suscriptor</div></div>
    </div>
  </div>
  <div class="card-panel mt-3">
    <span class="pill amber"><i class="fa-solid fa-graduation-cap"></i> Referencias</span>
    <div class="link-row mt-2">
      <i class="fa-solid fa-link" style="color:var(--accent)"></i>
      <a href="https://insights.sei.cmu.edu/documents/778/2007_005_001_14858.pdf" target="_blank">Bachmann, Bass & Nord (2007). Modifiability Tactics</a>
      <span class="ext">SEI · CMU/SEI-2007-TR-002</span>
    </div>
    <div class="link-row">
      <i class="fa-solid fa-link" style="color:var(--accent)"></i>
      <a href="https://insights.sei.cmu.edu/blog/two-categories-of-architecture-patterns-for-deployability/" target="_blank">Kazman (2022). Two Categories of Architecture Patterns for Deployability</a>
      <span class="ext">SEI Insights Blog</span>
    </div>
  </div>
</div>
`);

// 9. Quiz
slidesHTML.push(`
<div class="slide-inner d-flex flex-column justify-content-center align-items-center text-center" style="min-height:70vh;">
  <span class="eyebrow"><i class="fa-solid fa-brain"></i> Chequeo de comprensión</span>
  <h2 class="slide-title">5 preguntas sobre facilidad de modificación</h2>
  <p class="subtitle mb-4">Definición, los 4 aspectos, las categorías con nombre propio y los patrones.</p>
  <button class="check-btn" onclick="lanzarQuiz()"><i class="fa-solid fa-play me-2"></i>Iniciar quiz</button>
</div>
`);

// 10. Cierre
slidesHTML.push(`
<div class="slide-inner d-flex flex-column justify-content-center align-items-center text-center" style="min-height:78vh;">
  <div class="icon-tile mb-3" style="width:72px;height:72px;font-size:2rem;"><i class="fa-solid fa-check"></i></div>
  <span class="eyebrow"><i class="fa-solid fa-flag-checkered"></i> Repaso completo</span>
  <h2 class="slide-title">Modificabilidad: diseñar para el cambio que todavía no conocés</h2>
  <p class="subtitle mb-4" style="max-width:640px;">Qué, con qué probabilidad, quién y a qué costo — esas cuatro preguntas ordenan cualquier análisis de modificabilidad. Próxima lectura: Facilidad de despliegue.</p>
</div>
`);

/* ============ MOTOR DE NAVEGACIÓN ============ */
const container = document.getElementById('slidesContainer');
slidesHTML.forEach((html, i)=>{
  const div = document.createElement('div');
  div.className = 'slide' + (i===0 ? ' active' : '');
  div.id = 'slide'+i;
  div.innerHTML = html;
  container.appendChild(div);
});

let current = 0;
const total = slidesHTML.length;
document.getElementById('hudTotal').textContent = total;

const dotsWrap = document.getElementById('navDots');
for(let i=0;i<total;i++){
  const d = document.createElement('div');
  d.className = 'dot' + (i===0?' active':'');
  d.onclick = ()=>goTo(i);
  dotsWrap.appendChild(d);
}

function updateUI(){
  document.querySelectorAll('.slide').forEach((s,i)=>{ s.classList.toggle('active', i===current); });
  document.querySelectorAll('.nav-dots .dot').forEach((d,i)=>{ d.classList.toggle('active', i===current); });
  document.getElementById('hudCurrent').textContent = current+1;
  document.getElementById('progressFill').style.width = ((current+1)/total*100)+'%';
  const active = document.getElementById('slide'+current);
  active.scrollTop = 0;
  const animTarget = active.querySelector('.slide-inner');
  if(animTarget){
    animTarget.classList.remove('animate__fadeIn');
    void animTarget.offsetWidth;
    animTarget.classList.add('animate__animated','animate__fadeIn');
  }
}
function goTo(i){ if(i<0||i>=total) return; current = i; updateUI(); }
document.getElementById('prevBtn').onclick = ()=>goTo(current-1);
document.getElementById('nextBtn').onclick = ()=>goTo(current+1);
document.addEventListener('keydown', (e)=>{
  const tag = document.activeElement.tagName;
  if(tag==='TEXTAREA' || tag==='INPUT') return;
  if(e.key==='ArrowRight') goTo(current+1);
  if(e.key==='ArrowLeft') goTo(current-1);
});
updateUI();

/* ============ EJERCICIO: identificar la categoría ============ */
const escenarios = [
  {sit:'El sistema debe poder atender diez veces más usuarios simultáneos durante una campaña de marketing, sin rediseñar la arquitectura desde cero.', cat:'Escalabilidad', exp:'Se trata de sostener el rendimiento cuando crece la carga de trabajo — la definición misma de escalabilidad.'},
  {sit:'El equipo comercial pide que el sistema soporte múltiples métodos de pago que se puedan agregar o quitar sin modificar el núcleo de la aplicación.', cat:'Variabilidad', exp:'Es la capacidad de configurar o intercambiar comportamiento del sistema entre distintos contextos de uso, sin tocar el core.'},
  {sit:'La empresa migra de un proveedor de nube a otro y el sistema debe seguir funcionando sin reescribir su lógica de negocio.', cat:'Portabilidad', exp:'Cambiar el entorno de ejecución (proveedor, hardware, sistema operativo) sin reescribir la lógica es, por definición, portabilidad.'},
  {sit:'Los servicios de la aplicación se despliegan en distintas regiones geográficas y deben poder comunicarse entre sí sin que su ubicación física esté fija en el código.', cat:'Independencia de la ubicación', exp:'La comunicación no depende de dónde esté físicamente cada componente — eso es independencia de la ubicación.'}
];
const wrap = document.getElementById('ejercicioWrap');
escenarios.forEach((e, i)=>{
  const card = document.createElement('div');
  card.className = 'scenario-card';
  card.innerHTML = `
    <p class="stext">"${e.sit}"</p>
    <div class="scenario-actions">
      <button class="check-btn ghost" onclick="verCategoria(${i})"><i class="fa-solid fa-eye me-2"></i>Ver categoría</button>
    </div>`;
  wrap.appendChild(card);
});
function verCategoria(i){
  const e = escenarios[i];
  Swal.fire({
    title: e.cat,
    html: `<p style="text-align:left;">${e.exp}</p>`,
    background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
  });
}

/* ============ QUIZ ============ */
const preguntas = [
  {
    texto:'¿Qué es la facilidad de modificación como atributo de calidad de una arquitectura de software?',
    opciones:{
      a:'La cantidad de líneas de código que tiene el sistema',
      b:'El atributo que baja el costo y el riesgo de hacer cambios en el sistema, permitiendo modificarlo de forma efectiva y eficiente sin introducir defectos ni degradar su calidad',
      c:'La velocidad con la que el sistema procesa una solicitud',
      d:'El número de servidores necesarios para desplegar la aplicación'
    },
    correcta:'b'
  },
  {
    texto:'¿De qué atributo de calidad de ISO/IEC 25010 es sub-característica la facilidad de modificación?',
    opciones:{
      a:'Compatibilidad',
      b:'Facilidad de mantenimiento — que además incluye modularidad, facilidad de reúso, facilidad de análisis y facilidad de ser probado',
      c:'Eficiencia de desempeño',
      d:'Capacidad de interacción'
    },
    correcta:'b'
  },
  {
    texto:'¿Cuáles son los cuatro aspectos a considerar al analizar la facilidad de modificación de un sistema?',
    opciones:{
      a:'Costo, tiempo, calidad y alcance del proyecto completo',
      b:'Qué puede cambiar, cuál es la probabilidad de que ocurra el cambio, quién lo realiza y cuál es su costo',
      c:'Requerimientos, diseño, implementación y pruebas',
      d:'Seguridad, disponibilidad, rendimiento y protección'
    },
    correcta:'b'
  },
  {
    texto:'Un sistema debe seguir funcionando igual si se lo despliega en un proveedor de nube distinto al original, sin reescribir su lógica de negocio. ¿Qué categoría de modificación describe mejor esta situación?',
    opciones:{
      a:'Variabilidad',
      b:'Portabilidad — la capacidad de cambiar el entorno de ejecución del sistema sin alterar su comportamiento esencial',
      c:'Escalabilidad',
      d:'Independencia de la ubicación'
    },
    correcta:'b'
  },
  {
    texto:'¿Cuál de los siguientes es uno de los patrones para facilidad de modificación mencionados en el texto?',
    opciones:{
      a:'Circuit breaker',
      b:'El patrón plug-in (también conocido como microkernel), que permite agregar o quitar funcionalidad sin modificar el núcleo del sistema',
      c:'Saga',
      d:'CQRS'
    },
    correcta:'b'
  }
];
let idxPregunta = 0, aciertos = 0;

function lanzarQuiz(){ idxPregunta = 0; aciertos = 0; mostrarPregunta(); }
function mostrarPregunta(){
  if(idxPregunta >= preguntas.length){
    Swal.fire({
      title:'Resultado',
      html:`Acertaste <b>${aciertos}/${preguntas.length}</b>.`,
      icon: aciertos===preguntas.length ? 'success' : 'info',
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    });
    return;
  }
  const p = preguntas[idxPregunta];
  Swal.fire({
    title: p.texto,
    input:'radio',
    inputOptions: p.opciones,
    background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff',
    confirmButtonText:'Responder',
    inputValidator: (value)=> !value && 'Elegí una opción'
  }).then(res=>{
    if(!res.isConfirmed) return;
    const ok = res.value === p.correcta;
    if(ok) aciertos++;
    Swal.fire({
      title: ok ? '¡Correcto!' : 'No es así',
      html: `La respuesta correcta era: <b>${p.opciones[p.correcta]}</b>`,
      icon: ok ? 'success' : 'error',
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    }).then(()=>{ idxPregunta++; mostrarPregunta(); });
  });
}
</script>

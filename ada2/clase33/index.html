<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANDIS 2 · Unidad 3 — REST</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#070b14; --bg-1:#0d1424; --panel:#111a2e; --panel-2:#16223a;
  --accent:#3ec1ff; --accent-2:#7b6bff; --accent-3:#ffb547; --ok:#3ee6a8;
  --text:#e8edf7; --text-dim:#8fa0bd; --border:#22304d;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(1200px 700px at 15% -10%, rgba(62,193,255,.10), transparent 60%),
    radial-gradient(1000px 700px at 110% 10%, rgba(123,107,255,.12), transparent 55%),
    var(--bg-0);
  color:var(--text); font-family:'Inter',sans-serif; overflow:hidden;
}
.mono{font-family:'JetBrains Mono',monospace}
.blueprint{
  position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.35;
  background-image:linear-gradient(rgba(62,193,255,.06) 1px, transparent 1px),linear-gradient(90deg, rgba(62,193,255,.06) 1px, transparent 1px);
  background-size:42px 42px;
}
.progress-track{position:fixed; top:0; left:0; width:100%; height:4px; background:rgba(255,255,255,.06); z-index:50;}
.progress-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--accent-2)); transition:width .4s ease; box-shadow:0 0 12px var(--accent);}
.hud{position:fixed; top:14px; right:18px; z-index:50; background:rgba(17,26,46,.85); border:1px solid var(--border); backdrop-filter:blur(6px); padding:7px 14px; border-radius:999px; font-size:.82rem; color:var(--text-dim); display:flex; align-items:center; gap:8px;}
.hud .unit-tag{color:var(--accent); font-weight:700}
.brand{position:fixed; top:14px; left:18px; z-index:50; font-size:.78rem; color:var(--text-dim); display:flex; align-items:center; gap:8px; letter-spacing:.03em;}
.brand i{color:var(--accent-3)}
.slides-container{position:relative; z-index:1; height:100vh; width:100vw;}
.slide{position:absolute; inset:0; display:none; padding:90px 8vw 110px 8vw; overflow-y:auto;}
.slide.active{display:block}
.slide-inner{max-width:1180px; margin:0 auto;}
.eyebrow{display:inline-flex; align-items:center; gap:8px; font-size:.78rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent); font-weight:700; margin-bottom:14px;}
.eyebrow i{font-size:.9rem}
h1.slide-title{font-size:clamp(1.9rem,3.4vw,3rem); font-weight:800; margin-bottom:.4rem; line-height:1.1;}
h2.slide-title{font-size:clamp(1.5rem,2.6vw,2.2rem); font-weight:800; margin-bottom:.6rem;}
.subtitle{color:var(--text-dim); font-size:1.05rem; max-width:820px;}
.card-panel{background:linear-gradient(180deg, var(--panel), var(--panel-2)); border:1px solid var(--border); border-radius:16px; padding:26px 28px; box-shadow:0 12px 30px rgba(0,0,0,.35);}
.card-panel + .card-panel{margin-top:18px}
.pill{display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:999px; font-size:.76rem; font-weight:700; background:rgba(62,193,255,.12); color:var(--accent); border:1px solid rgba(62,193,255,.35);}
.pill.purple{background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)}
.pill.amber{background:rgba(255,181,71,.14); color:var(--accent-3); border-color:rgba(255,181,71,.4)}
.pill.ok{background:rgba(62,230,168,.12); color:var(--ok); border-color:rgba(62,230,168,.35)}
.pill.bad{background:rgba(255,107,107,.12); color:#ff6b6b; border-color:rgba(255,107,107,.35)}
.icon-tile{width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center; background:rgba(62,193,255,.12); color:var(--accent); font-size:1.3rem; border:1px solid rgba(62,193,255,.3); flex-shrink:0;}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
.grid-4{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
@media (max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}
ul.clean{list-style:none; margin:0; padding:0;}
ul.clean li{position:relative; padding:6px 0 6px 26px; color:var(--text); font-size:.94rem;}
ul.clean li::before{content:"\f105"; font-family:"Font Awesome 6 Free"; font-weight:900; color:var(--accent); position:absolute; left:2px; top:8px; font-size:.85rem;}
.check-btn{border:none; background:linear-gradient(90deg,var(--accent),var(--accent-2)); color:#04101f; font-weight:800; padding:10px 22px; border-radius:10px; font-size:.9rem; box-shadow:0 8px 22px rgba(62,193,255,.25); cursor:pointer;}
.check-btn:hover{filter:brightness(1.08); color:#04101f;}
.nav-controls{position:fixed; bottom:18px; left:0; right:0; z-index:50; display:flex; justify-content:center; gap:14px; align-items:center;}
.nav-btn{width:46px; height:46px; border-radius:50%; border:1px solid var(--border); background:rgba(17,26,46,.9); color:var(--text); display:flex; align-items:center; justify-content:center; font-size:1.1rem; backdrop-filter:blur(6px);}
.nav-btn:hover{border-color:var(--accent); color:var(--accent);}
.nav-dots{display:flex; gap:6px; align-items:center; background:rgba(17,26,46,.9); border:1px solid var(--border); padding:8px 14px; border-radius:999px;}
.nav-dots .dot{width:7px; height:7px; border-radius:50%; background:var(--border); cursor:pointer; transition:.2s;}
.nav-dots .dot.active{background:var(--accent); width:20px; border-radius:4px;}
.footer-note{position:fixed; bottom:20px; right:22px; z-index:50; font-size:.72rem; color:var(--text-dim); font-family:'JetBrains Mono';}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px}

.tac-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
@media (max-width:900px){.tac-grid{grid-template-columns:1fr;}}
.tac-tile{
  background:var(--panel-2); border:1px solid var(--border); border-radius:14px; padding:16px;
  cursor:pointer; transition:.2s; text-align:center;
}
.tac-tile:hover{transform:translateY(-4px); border-color:var(--accent); box-shadow:0 10px 24px rgba(62,193,255,.15);}
.tac-tile i{font-size:1.3rem; color:var(--accent); margin-bottom:6px; display:block;}
.tac-tile .tname{font-size:.86rem; font-weight:700;}
.tac-tile.opt i{color:var(--accent-3)}

.example-box{background:rgba(62,193,255,.07); border:1px dashed rgba(62,193,255,.35); border-radius:12px; padding:14px 16px; margin-top:10px;}
.example-box .ex-label{font-size:.72rem; text-transform:uppercase; letter-spacing:.08em; color:var(--accent); font-weight:800; margin-bottom:4px; display:flex; align-items:center; gap:6px;}

table.verb-table{width:100%; border-collapse:collapse; font-size:.95rem;}
table.verb-table th{text-align:left; padding:10px 14px; color:var(--accent); border-bottom:2px solid var(--border); font-size:.78rem; text-transform:uppercase; letter-spacing:.06em;}
table.verb-table td{padding:12px 14px; border-bottom:1px solid rgba(255,255,255,.06);}
table.verb-table tr:last-child td{border-bottom:none;}
.verb-tag{font-family:'JetBrains Mono'; font-weight:800; padding:3px 10px; border-radius:7px; font-size:.82rem;}
.verb-post{background:rgba(62,230,168,.14); color:var(--ok);}
.verb-get{background:rgba(62,193,255,.14); color:var(--accent);}
.verb-put{background:rgba(255,181,71,.14); color:var(--accent-3);}
.verb-patch{background:rgba(123,107,255,.14); color:#b3a8ff;}
.verb-delete{background:rgba(255,107,107,.14); color:#ff6b6b;}
</style>
</head>
<body>

<div class="blueprint"></div>
<div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
<div class="brand"><i class="fa-solid fa-tower-broadcast"></i> ANDIS 2 · Unidad 3</div>
<div class="hud"><i class="fa-solid fa-layer-group"></i> <span class="unit-tag" id="hudCurrent">1</span>/<span id="hudTotal">0</span></div>

<div class="slides-container" id="slidesContainer"></div>

<div class="nav-controls">
  <button class="nav-btn" id="prevBtn"><i class="fa-solid fa-chevron-left"></i></button>
  <div class="nav-dots" id="navDots"></div>
  <button class="nav-btn" id="nextBtn"><i class="fa-solid fa-chevron-right"></i></button>
</div>
<div class="footer-note">← → para navegar</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.10.5/sweetalert2.all.min.js"></script>
<script>
const slidesHTML = [];

// 0. Portada
slidesHTML.push(`
<div class="slide-inner d-flex flex-column justify-content-center" style="min-height:78vh;">
  <div class="animate__animated animate__fadeInDown">
    <span class="eyebrow"><i class="fa-solid fa-globe"></i> Unidad 3 · Soluciones arquitectónicas</span>
    <h1 class="slide-title">REST</h1>
    <p class="subtitle">El estilo arquitectónico que hizo posible la web tal como la conocemos — y que hoy es la forma más común de exponer una API.</p>
  </div>
</div>
`);

// 1. Qué es REST
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-circle-info"></i> El origen</span>
  <h2 class="slide-title">¿Qué es REST?</h2>
  <div class="card-panel">
    <p style="font-size:1.0rem; line-height:1.75; margin-bottom:0;">
      REST —<strong>Representational State Transfer</strong>, o transferencia de estado representacional— es un <strong>estilo arquitectónico</strong> creado por <strong>Roy Fielding</strong> para guiar el diseño de la arquitectura de la World Wide Web. No es un protocolo ni una librería: es un conjunto de <strong>seis restricciones</strong> sobre cómo deben interactuar los componentes de un sistema distribuido a escala de Internet, como la web.
    </p>
  </div>
  <div class="example-box mt-3" style="margin-top:18px;">
    <div class="ex-label"><i class="fa-solid fa-lightbulb"></i> Ejemplo simple</div>
    Cada vez que tu navegador pide una página, o que una app de celular consulta una API —por ejemplo, la del clima o la de un banco—, probablemente esté usando los principios de REST por detrás, aunque quien programó la app nunca haya leído el paper de Fielding.
  </div>
</div>
`);

// 2. Las 6 restricciones — explorer
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-list-check"></i> Las reglas del juego</span>
  <h2 class="slide-title">Seis restricciones, un estilo</h2>
  <p class="subtitle">Tocá cada una para ver de qué se trata y un ejemplo cotidiano.</p>
  <div class="tac-grid mt-3" id="restGrid"></div>
</div>
`);

// 3. Stateless en detalle
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-ban"></i> La restricción más importante</span>
  <h2 class="slide-title">Sin estado: cada pedido se basta a sí mismo</h2>
  <div class="card-panel">
    <p style="font-size:1.0rem; line-height:1.75; margin-bottom:0;">
      En REST, el servidor <strong>no recuerda</strong> nada de la interacción anterior de ese cliente. Cada solicitud debe traer toda la información que el servidor necesita para procesarla. Si una operación requiere haberse autenticado antes, la autenticación no se "recuerda" entre pedidos — se transmite un <strong>token</strong> con cada solicitud, obtenido una vez al autenticarse.
    </p>
  </div>
  <div class="example-box mt-3" style="margin-top:18px;">
    <div class="ex-label"><i class="fa-solid fa-lightbulb"></i> Ejemplo simple</div>
    Pensalo como pedir algo por teléfono a una empresa que atiende con operadores distintos cada vez: no podés decir "seguí con lo de antes" — tenés que repetir tu número de cliente y el pedido completo en cada llamada, porque quien te atiende no tiene memoria de la llamada anterior. En una API REST, ese "número de cliente" es el token de autenticación que viaja en cada solicitud HTTP.
  </div>
</div>
`);

// 4. Verbos HTTP y CRUD
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-table"></i> En la práctica</span>
  <h2 class="slide-title">Verbos HTTP y operaciones CRUD</h2>
  <div class="card-panel">
    <p style="font-size:.95rem; line-height:1.7; color:var(--text-dim); margin-bottom:16px;">
      HTTP es el protocolo más usado para implementar REST, aunque no es el único. Asociar los verbos HTTP a las operaciones CRUD es una convención <strong style="color:var(--text)">posterior</strong> a la definición original de Fielding, pero es la que se usa casi universalmente hoy.
    </p>
    <table class="verb-table">
      <thead><tr><th>Verbo HTTP</th><th>Operación CRUD</th><th>Ejemplo sobre /productos</th></tr></thead>
      <tbody>
        <tr><td><span class="verb-tag verb-post">POST</span></td><td>Create</td><td class="mono" style="font-size:.85rem; color:var(--text-dim);">POST /productos</td></tr>
        <tr><td><span class="verb-tag verb-get">GET</span></td><td>Read</td><td class="mono" style="font-size:.85rem; color:var(--text-dim);">GET /productos/42</td></tr>
        <tr><td><span class="verb-tag verb-put">PUT</span></td><td>Update o replace</td><td class="mono" style="font-size:.85rem; color:var(--text-dim);">PUT /productos/42</td></tr>
        <tr><td><span class="verb-tag verb-patch">PATCH</span></td><td>Update o modify</td><td class="mono" style="font-size:.85rem; color:var(--text-dim);">PATCH /productos/42</td></tr>
        <tr><td><span class="verb-tag verb-delete">DELETE</span></td><td>Delete</td><td class="mono" style="font-size:.85rem; color:var(--text-dim);">DELETE /productos/42</td></tr>
      </tbody>
    </table>
  </div>
  <div class="example-box mt-3" style="margin-top:18px;">
    <div class="ex-label"><i class="fa-solid fa-lightbulb"></i> PUT vs. PATCH</div>
    PUT reemplaza el recurso completo —si mandás solo el precio, perdés el resto de los campos—; PATCH modifica solo lo que le mandás —por ejemplo, actualizar únicamente el stock de un producto sin tocar su nombre ni su precio.
  </div>
</div>
`);

// 5. Quiz
slidesHTML.push(`
<div class="slide-inner d-flex flex-column justify-content-center align-items-center text-center" style="min-height:70vh;">
  <span class="eyebrow"><i class="fa-solid fa-brain"></i> Chequeo de comprensión</span>
  <h2 class="slide-title">5 preguntas sobre REST</h2>
  <p class="subtitle mb-4">Las seis restricciones, el principio stateless, y la relación entre verbos HTTP y CRUD.</p>
  <button class="check-btn" onclick="lanzarQuiz()"><i class="fa-solid fa-play me-2"></i>Iniciar quiz</button>
</div>
`);

// 6. Cierre
slidesHTML.push(`
<div class="slide-inner d-flex flex-column justify-content-center align-items-center text-center" style="min-height:78vh;">
  <div class="icon-tile mb-3" style="width:72px;height:72px;font-size:2rem;"><i class="fa-solid fa-check"></i></div>
  <span class="eyebrow"><i class="fa-solid fa-flag-checkered"></i> Repaso completo</span>
  <h2 class="slide-title">Un estilo, no un protocolo</h2>
  <p class="subtitle mb-4" style="max-width:680px;">REST no es HTTP ni JSON — es un conjunto de restricciones de diseño. HTTP es simplemente el protocolo que mejor encaja con esas restricciones, y por eso terminó siendo la forma estándar de construirlo.</p>
</div>
`);

/* ============ EXPLORADOR: LAS 6 RESTRICCIONES ============ */
const restConstraints = [
  {
    nombre:'Interfaz uniforme', icon:'fa-link', opcional:false,
    desc:'Todas las interacciones tienen la misma forma, típicamente HTTP. Los recursos se identifican mediante una URI (universal resource identifier).',
    ejemplo:'Da igual si pedís un producto, un usuario o un pedido: siempre es un GET a una URL, con la misma estructura de solicitud y respuesta.'
  },
  {
    nombre:'Cliente-servidor', icon:'fa-arrows-left-right', opcional:false,
    desc:'Los actores son clientes y los proveedores de recursos son servidores, siguiendo el patrón cliente-servidor clásico.',
    ejemplo:'Tu app de celular (cliente) le pide datos a la API del banco (servidor) — nunca al revés.'
  },
  {
    nombre:'Sin estado (stateless)', icon:'fa-ban', opcional:false,
    desc:'El servidor no conserva información sobre la interacción anterior del cliente. Cada solicitud debe traer todo lo que el servidor necesita para procesarla, incluido un token si hace falta autenticación.',
    ejemplo:'Cada request a la API lleva su propio token de autenticación — el servidor no "recuerda" que ya te autenticaste hace un minuto.'
  },
  {
    nombre:'Uso de caché', icon:'fa-bolt', opcional:false,
    desc:'Se puede cachear la respuesta de un recurso, del lado del cliente o del servidor, siempre que exista un mecanismo para saber cuándo esa respuesta quedó desactualizada.',
    ejemplo:'El catálogo de productos de una tienda online se cachea por unos minutos, en vez de consultar la base de datos en cada visita.'
  },
  {
    nombre:'Arquitectura en capas', icon:'fa-layer-group', opcional:false,
    desc:'El servidor puede dividirse en capas que se despliegan de forma independiente. El cliente no tiene forma de saber si habla con el servidor final o con uno intermedio.',
    ejemplo:'Un balanceador de carga o un proxy de caché pueden interceptar tu pedido antes de que llegue al servidor real, sin que vos lo notes.'
  },
  {
    nombre:'Código a demanda', icon:'fa-file-code', opcional:true,
    desc:'Restricción opcional: el servidor puede enviarle código al cliente para que éste lo ejecute. JavaScript es el ejemplo típico.',
    ejemplo:'Un servidor web le envía al navegador un script JS que valida un formulario antes de enviarlo — el navegador ejecuta ese código.'
  }
];
const restGrid = document.getElementById('restGrid');
if(restGrid){
  restConstraints.forEach((t)=>{
    const tile = document.createElement('div');
    tile.className = 'tac-tile' + (t.opcional ? ' opt' : '');
    tile.innerHTML = `<i class="fa-solid ${t.icon}"></i><div class="tname">${t.nombre}${t.opcional ? ' <span class="pill amber" style="margin-left:4px;">opcional</span>' : ''}</div>`;
    tile.onclick = ()=>Swal.fire({
      title: t.nombre,
      html: `<p style="text-align:left; font-size:.92rem; line-height:1.6;">${t.desc}</p><div style="text-align:left; background:rgba(62,193,255,.08); border:1px dashed rgba(62,193,255,.3); border-radius:10px; padding:10px 12px; font-size:.85rem; margin-top:10px;"><strong style="color:#3ec1ff;">Ejemplo:</strong> ${t.ejemplo}</div>`,
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    });
    restGrid.appendChild(tile);
  });
}

/* ============ MOTOR DE NAVEGACIÓN ============ */
const container = document.getElementById('slidesContainer');
slidesHTML.forEach((html, i)=>{
  const div = document.createElement('div');
  div.className = 'slide' + (i===0 ? ' active' : '');
  div.id = 'slide'+i;
  div.innerHTML = html;
  container.appendChild(div);
});

let current = 0;
const total = slidesHTML.length;
document.getElementById('hudTotal').textContent = total;

const dotsWrap = document.getElementById('navDots');
for(let i=0;i<total;i++){
  const d = document.createElement('div');
  d.className = 'dot' + (i===0?' active':'');
  d.onclick = ()=>goTo(i);
  dotsWrap.appendChild(d);
}

function updateUI(){
  document.querySelectorAll('.slide').forEach((s,i)=>{ s.classList.toggle('active', i===current); });
  document.querySelectorAll('.nav-dots .dot').forEach((d,i)=>{ d.classList.toggle('active', i===current); });
  document.getElementById('hudCurrent').textContent = current+1;
  document.getElementById('progressFill').style.width = ((current+1)/total*100)+'%';
  const active = document.getElementById('slide'+current);
  active.scrollTop = 0;
  const animTarget = active.querySelector('.slide-inner');
  if(animTarget){
    animTarget.classList.remove('animate__fadeIn');
    void animTarget.offsetWidth;
    animTarget.classList.add('animate__animated','animate__fadeIn');
  }
}
function goTo(i){ if(i<0||i>=total) return; current = i; updateUI(); }
document.getElementById('prevBtn').onclick = ()=>goTo(current-1);
document.getElementById('nextBtn').onclick = ()=>goTo(current+1);
document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight') goTo(current+1);
  if(e.key==='ArrowLeft') goTo(current-1);
});
updateUI();

/* ============ QUIZ ============ */
const preguntas = [
  {
    texto:'¿Quién creó el estilo arquitectónico REST y en qué contexto?',
    opciones:{
      a:'Tim Berners-Lee, para definir el protocolo HTTP',
      b:'Roy Fielding, para guiar el desarrollo y diseño de la arquitectura de la World Wide Web',
      c:'El W3C, como estándar obligatorio para todas las APIs',
      d:'Google, como alternativa a SOAP'
    },
    correcta:'b'
  },
  {
    texto:'Una API dice ser "RESTful" pero el servidor guarda en sesión qué usuario se autenticó, y espera que las siguientes solicitudes no repitan esa información. ¿Qué restricción de REST está violando?',
    opciones:{
      a:'Cliente-servidor',
      b:'Interfaz uniforme',
      c:'Sin estado (stateless)',
      d:'Uso de caché'
    },
    correcta:'c'
  },
  {
    texto:'¿Cuál de las siguientes es la restricción OPCIONAL dentro de las seis de REST?',
    opciones:{
      a:'Código a demanda, como enviar JavaScript al cliente para que lo ejecute',
      b:'Arquitectura en capas',
      c:'Cliente-servidor',
      d:'Interfaz uniforme'
    },
    correcta:'a'
  },
  {
    texto:'Según el teórico, ¿qué relación existe entre los verbos HTTP y las operaciones CRUD?',
    opciones:{
      a:'Es parte de la definición original de REST que hizo Fielding',
      b:'HTTP exige por protocolo que cada verbo se use solo para su operación CRUD correspondiente',
      c:'Es una convención posterior a la definición de REST, aunque es la más usada en la práctica',
      d:'No existe ninguna relación entre verbos HTTP y CRUD'
    },
    correcta:'c'
  },
  {
    texto:'Querés actualizar únicamente el stock de un producto sin modificar su nombre ni su precio. ¿Qué verbo HTTP es el más apropiado?',
    opciones:{
      a:'DELETE',
      b:'PATCH',
      c:'PUT',
      d:'POST'
    },
    correcta:'b'
  }
];
let idxPregunta = 0, aciertos = 0;

function lanzarQuiz(){ idxPregunta = 0; aciertos = 0; mostrarPregunta(); }
function mostrarPregunta(){
  if(idxPregunta >= preguntas.length){
    Swal.fire({
      title:'Resultado',
      html:`Acertaste <b>${aciertos}/${preguntas.length}</b>.`,
      icon: aciertos===preguntas.length ? 'success' : 'info',
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    });
    return;
  }
  const p = preguntas[idxPregunta];
  Swal.fire({
    title: p.texto,
    input:'radio',
    inputOptions: p.opciones,
    background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff',
    confirmButtonText:'Responder',
    inputValidator: (value)=> !value && 'Elegí una opción'
  }).then(res=>{
    if(!res.isConfirmed) return;
    const ok = res.value === p.correcta;
    if(ok) aciertos++;
    Swal.fire({
      title: ok ? '¡Correcto!' : 'No es así',
      html: `La respuesta correcta era: <b>${p.opciones[p.correcta]}</b>`,
      icon: ok ? 'success' : 'error',
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    }).then(()=>{ idxPregunta++; mostrarPregunta(); });
  });
}
</script>

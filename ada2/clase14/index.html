<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANDIS 2 · Unidad 2 — Tácticas para la seguridad</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#070b14; --bg-1:#0d1424; --panel:#111a2e; --panel-2:#16223a;
  --accent:#3ec1ff; --accent-2:#7b6bff; --accent-3:#ffb547; --ok:#3ee6a8;
  --text:#e8edf7; --text-dim:#8fa0bd; --border:#22304d;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(1200px 700px at 15% -10%, rgba(62,193,255,.10), transparent 60%),
    radial-gradient(1000px 700px at 110% 10%, rgba(123,107,255,.12), transparent 55%),
    var(--bg-0);
  color:var(--text); font-family:'Inter',sans-serif; overflow:hidden;
}
.mono{font-family:'JetBrains Mono',monospace}
.blueprint{
  position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.35;
  background-image:linear-gradient(rgba(62,193,255,.06) 1px, transparent 1px),linear-gradient(90deg, rgba(62,193,255,.06) 1px, transparent 1px);
  background-size:42px 42px;
}
.progress-track{position:fixed; top:0; left:0; width:100%; height:4px; background:rgba(255,255,255,.06); z-index:50;}
.progress-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--accent-2)); transition:width .4s ease; box-shadow:0 0 12px var(--accent);}
.hud{position:fixed; top:14px; right:18px; z-index:50; background:rgba(17,26,46,.85); border:1px solid var(--border); backdrop-filter:blur(6px); padding:7px 14px; border-radius:999px; font-size:.82rem; color:var(--text-dim); display:flex; align-items:center; gap:8px;}
.hud .unit-tag{color:var(--accent); font-weight:700}
.brand{position:fixed; top:14px; left:18px; z-index:50; font-size:.78rem; color:var(--text-dim); display:flex; align-items:center; gap:8px; letter-spacing:.03em;}
.brand i{color:var(--accent-3)}
.slides-container{position:relative; z-index:1; height:100vh; width:100vw;}
.slide{position:absolute; inset:0; display:none; padding:90px 8vw 110px 8vw; overflow-y:auto;}
.slide.active{display:block}
.slide-inner{max-width:1180px; margin:0 auto;}
.eyebrow{display:inline-flex; align-items:center; gap:8px; font-size:.78rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent); font-weight:700; margin-bottom:14px;}
.eyebrow i{font-size:.9rem}
h1.slide-title{font-size:clamp(1.9rem,3.4vw,3rem); font-weight:800; margin-bottom:.4rem; line-height:1.1;}
h2.slide-title{font-size:clamp(1.5rem,2.6vw,2.2rem); font-weight:800; margin-bottom:.6rem;}
.subtitle{color:var(--text-dim); font-size:1.05rem; max-width:820px;}
.card-panel{background:linear-gradient(180deg, var(--panel), var(--panel-2)); border:1px solid var(--border); border-radius:16px; padding:26px 28px; box-shadow:0 12px 30px rgba(0,0,0,.35);}
.card-panel + .card-panel{margin-top:18px}
.pill{display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:999px; font-size:.76rem; font-weight:700; background:rgba(62,193,255,.12); color:var(--accent); border:1px solid rgba(62,193,255,.35);}
.pill.purple{background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)}
.pill.amber{background:rgba(255,181,71,.14); color:var(--accent-3); border-color:rgba(255,181,71,.4)}
.pill.ok{background:rgba(62,230,168,.12); color:var(--ok); border-color:rgba(62,230,168,.35)}
.icon-tile{width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center; background:rgba(62,193,255,.12); color:var(--accent); font-size:1.3rem; border:1px solid rgba(62,193,255,.3); flex-shrink:0;}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
.grid-4{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
@media (max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}
ul.clean{list-style:none; margin:0; padding:0;}
ul.clean li{position:relative; padding:6px 0 6px 26px; color:var(--text); font-size:.94rem;}
ul.clean li::before{content:"\f105"; font-family:"Font Awesome 6 Free"; font-weight:900; color:var(--accent); position:absolute; left:2px; top:8px; font-size:.85rem;}
.check-btn{border:none; background:linear-gradient(90deg,var(--accent),var(--accent-2)); color:#04101f; font-weight:800; padding:10px 22px; border-radius:10px; font-size:.9rem; box-shadow:0 8px 22px rgba(62,193,255,.25); cursor:pointer;}
.check-btn:hover{filter:brightness(1.08); color:#04101f;}
.nav-controls{position:fixed; bottom:18px; left:0; right:0; z-index:50; display:flex; justify-content:center; gap:14px; align-items:center;}
.nav-btn{width:46px; height:46px; border-radius:50%; border:1px solid var(--border); background:rgba(17,26,46,.9); color:var(--text); display:flex; align-items:center; justify-content:center; font-size:1.1rem; backdrop-filter:blur(6px);}
.nav-btn:hover{border-color:var(--accent); color:var(--accent);}
.nav-dots{display:flex; gap:6px; align-items:center; background:rgba(17,26,46,.9); border:1px solid var(--border); padding:8px 14px; border-radius:999px;}
.nav-dots .dot{width:7px; height:7px; border-radius:50%; background:var(--border); cursor:pointer; transition:.2s;}
.nav-dots .dot.active{background:var(--accent); width:20px; border-radius:4px;}
.footer-note{position:fixed; bottom:20px; right:22px; z-index:50; font-size:.72rem; color:var(--text-dim); font-family:'JetBrains Mono';}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px}

.tac-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
@media (max-width:900px){.tac-grid{grid-template-columns:repeat(2,1fr);}}
.tac-tile{
  background:var(--panel-2); border:1px solid var(--border); border-radius:14px; padding:16px;
  cursor:pointer; transition:.2s; text-align:center;
}
.tac-tile:hover{transform:translateY(-4px); border-color:var(--accent); box-shadow:0 10px 24px rgba(62,193,255,.15);}
.tac-tile i{font-size:1.3rem; color:var(--accent); margin-bottom:6px; display:block;}
.tac-tile .tname{font-size:.82rem; font-weight:700;}

.link-row{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid rgba(255,255,255,.06);}
.link-row:last-child{border-bottom:none;}
.link-row a{color:var(--text); text-decoration:none; font-weight:600;}
.link-row a:hover{color:var(--accent);}
.link-row .ext{margin-left:auto; color:var(--text-dim); font-size:.75rem; text-align:right;}

.tree{display:flex; gap:14px; flex-wrap:wrap; justify-content:center;}
.tree .branch{flex:1; min-width:200px; border-radius:14px; padding:16px; text-align:center; border:1px solid var(--border);}
.branch-a{background:rgba(62,193,255,.10); border-color:rgba(62,193,255,.35);}
.branch-b{background:rgba(123,107,255,.10); border-color:rgba(123,107,255,.35);}
.branch-c{background:rgba(255,181,71,.10); border-color:rgba(255,181,71,.35);}
.branch-d{background:rgba(62,230,168,.10); border-color:rgba(62,230,168,.35);}

.wall-row{display:flex; gap:10px; overflow-x:auto; padding-bottom:6px;}
.wall-item{flex:0 0 150px; background:var(--panel-2); border:1px solid var(--border); border-radius:12px; padding:14px; text-align:center;}
.wall-item i{font-size:1.2rem; color:var(--accent); display:block; margin-bottom:6px;}
.wall-item .wname{font-size:.78rem; font-weight:700;}
.wall-item .wcat{font-size:.66rem; color:var(--text-dim); margin-top:3px;}
</style>
</head>
<body>

<div class="blueprint"></div>
<div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
<div class="brand"><i class="fa-solid fa-cubes"></i> ANDIS 2 · Unidad 2</div>
<div class="hud"><i class="fa-solid fa-layer-group"></i> <span class="unit-tag" id="hudCurrent">1</span>/<span id="hudTotal">0</span></div>

<div class="slides-container" id="slidesContainer"></div>

<div class="nav-controls">
  <button class="nav-btn" id="prevBtn"><i class="fa-solid fa-chevron-left"></i></button>
  <div class="nav-dots" id="navDots"></div>
  <button class="nav-btn" id="nextBtn"><i class="fa-solid fa-chevron-right"></i></button>
</div>
<div class="footer-note">← → para navegar</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.10.5/sweetalert2.all.min.js"></script>
<script>
const slidesHTML = [];

// 0. Portada
slidesHTML.push(`
<div class="slide-inner d-flex flex-column justify-content-center" style="min-height:78vh;">
  <div class="animate__animated animate__fadeInDown">
    <span class="eyebrow"><i class="fa-solid fa-toolbox"></i> Unidad 2 · Tácticas de arquitectura</span>
    <h1 class="slide-title">Tácticas para la seguridad</h1>
    <p class="subtitle">La misma lógica de un edificio seguro —muros, cámaras, alarmas y respaldos— traducida a componentes de software.</p>
  </div>
</div>
`);

// 1. Analogía física
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-building-shield"></i> Punto de partida</span>
  <h2 class="slide-title">Pensar la seguridad como seguridad física</h2>
  <div class="card-panel mt-3">
    <p style="font-size:1.02rem; line-height:1.75;">
      Las instalaciones seguras <strong>limitan el acceso</strong> a su interior (muros, puntos de control),
      <strong>detectan intrusos</strong> (tarjetas de identificación), tienen <strong>mecanismos disuasorios</strong>
      (cámaras de vigilancia), <strong>sistemas de respuesta</strong> (alarmas) y <strong>mecanismos de recuperación</strong>
      (respaldos remotos).
    </p>
  </div>
  <div class="wall-row mt-3">
    <div class="wall-item"><i class="fa-solid fa-magnifying-glass"></i><div class="wname">Detección</div></div>
    <div class="wall-item"><i class="fa-solid fa-shield"></i><div class="wname">Resistencia</div></div>
    <div class="wall-item"><i class="fa-solid fa-bolt"></i><div class="wname">Reacción</div></div>
    <div class="wall-item"><i class="fa-solid fa-heart-pulse"></i><div class="wname">Recuperación</div></div>
  </div>
  <p class="subtitle mt-3 mb-0">Estas cuatro categorías organizan el catálogo completo de tácticas de seguridad.</p>
</div>
`);

// 2. Taxonomía
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-sitemap"></i> El mapa completo</span>
  <h2 class="slide-title">Cuatro ramas, dieciocho tácticas</h2>
  <div class="tree mt-3">
    <div class="branch branch-a"><i class="fa-solid fa-magnifying-glass mb-2 d-block" style="color:var(--accent)"></i><strong>Detectar ataques</strong><div class="small mt-1" style="color:var(--text-dim)">4 tácticas</div></div>
    <div class="branch branch-b"><i class="fa-solid fa-shield mb-2 d-block" style="color:#b3a8ff"></i><strong>Resistir ataques</strong><div class="small mt-1" style="color:var(--text-dim)">9 tácticas</div></div>
    <div class="branch branch-c"><i class="fa-solid fa-bolt mb-2 d-block" style="color:var(--accent-3)"></i><strong>Reaccionar a ataques</strong><div class="small mt-1" style="color:var(--text-dim)">3 tácticas</div></div>
    <div class="branch branch-d"><i class="fa-solid fa-heart-pulse mb-2 d-block" style="color:var(--ok)"></i><strong>Recuperarse de ataques</strong><div class="small mt-1" style="color:var(--text-dim)">2 tácticas</div></div>
  </div>
</div>
`);

// 3. Explorador: Detectar
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-magnifying-glass"></i> Rama 1</span>
  <h2 class="slide-title">Detectar ataques</h2>
  <p class="subtitle mb-3">Notar que algo anómalo está pasando, antes de que el daño sea mayor.</p>
  <div class="tac-grid" id="gridDetectar"></div>
</div>
`);

// 4. Explorador: Resistir
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-shield"></i> Rama 2</span>
  <h2 class="slide-title">Resistir ataques</h2>
  <p class="subtitle mb-3">La rama más numerosa: quién es, qué puede hacer, y cómo se protegen los datos y la superficie de ataque.</p>
  <div class="tac-grid" id="gridResistir"></div>
</div>
`);

// 5. Explorador: Reaccionar
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-bolt"></i> Rama 3</span>
  <h2 class="slide-title">Reaccionar a ataques</h2>
  <p class="subtitle mb-3">Actuar cuando ya se sospecha o confirma que algo está pasando.</p>
  <div class="tac-grid" id="gridReaccionar"></div>
</div>
`);

// 6. Explorador: Recuperarse
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-heart-pulse"></i> Rama 4</span>
  <h2 class="slide-title">Recuperarse de los ataques</h2>
  <p class="subtitle mb-3">Poder reconstruir lo ocurrido y sostener la responsabilidad de cada acción.</p>
  <div class="tac-grid" id="gridRecuperarse"></div>
</div>
`);

// 7. Para profundizar
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-book-open-reader"></i> Para profundizar</span>
  <h2 class="slide-title">Recomendaciones del Azure Well-Architected Framework</h2>
  <div class="card-panel mt-3">
    <div class="link-row">
      <i class="fa-solid fa-link" style="color:var(--accent)"></i>
      <a href="https://learn.microsoft.com/en-us/azure/well-architected/security/monitor-threats" target="_blank">Monitoring and threat detection</a>
      <span class="ext">Detectar la intrusión</span>
    </div>
    <div class="link-row">
      <i class="fa-solid fa-link" style="color:var(--accent)"></i>
      <a href="https://learn.microsoft.com/en-us/azure/well-architected/security/networking" target="_blank">Networking and connectivity</a>
      <span class="ext">Detectar la denegación del servicio</span>
    </div>
    <div class="link-row">
      <i class="fa-solid fa-link" style="color:var(--accent)"></i>
      <a href="https://learn.microsoft.com/en-us/azure/well-architected/security/encryption" target="_blank">Data encryption</a>
      <span class="ext">Verificar integridad · Cifrar los datos</span>
    </div>
    <div class="link-row">
      <i class="fa-solid fa-link" style="color:var(--accent)"></i>
      <a href="https://learn.microsoft.com/en-us/azure/well-architected/security/identity-access" target="_blank">Identity and access management</a>
      <span class="ext">Identificar · Autenticar · Autorizar actores</span>
    </div>
    <div class="link-row">
      <i class="fa-solid fa-link" style="color:var(--accent)"></i>
      <a href="https://learn.microsoft.com/en-us/azure/well-architected/security/segmentation" target="_blank">Building a segmentation strategy</a>
      <span class="ext">Limitar el acceso</span>
    </div>
    <div class="link-row">
      <i class="fa-solid fa-link" style="color:var(--accent)"></i>
      <a href="https://learn.microsoft.com/en-us/azure/architecture/reference-architectures/dmz/secure-vnet-dmz" target="_blank">Implement a secure hybrid network</a>
      <span class="ext">Limitar el acceso</span>
    </div>
    <div class="link-row">
      <i class="fa-solid fa-link" style="color:var(--accent)"></i>
      <a href="https://learn.microsoft.com/en-us/azure/well-architected/security/harden-resources" target="_blank">Hardening resources</a>
      <span class="ext">Validar la entrada</span>
    </div>
  </div>
</div>
`);

// 8. Quiz
slidesHTML.push(`
<div class="slide-inner d-flex flex-column justify-content-center align-items-center text-center" style="min-height:70vh;">
  <span class="eyebrow"><i class="fa-solid fa-brain"></i> Chequeo de comprensión</span>
  <h2 class="slide-title">5 preguntas sobre tácticas de seguridad</h2>
  <p class="subtitle mb-4">La analogía física, las 4 ramas y sus tácticas más representativas.</p>
  <button class="check-btn" onclick="lanzarQuiz()"><i class="fa-solid fa-play me-2"></i>Iniciar quiz</button>
</div>
`);

// 9. Cierre
slidesHTML.push(`
<div class="slide-inner d-flex flex-column justify-content-center align-items-center text-center" style="min-height:78vh;">
  <div class="icon-tile mb-3" style="width:72px;height:72px;font-size:2rem;"><i class="fa-solid fa-check"></i></div>
  <span class="eyebrow"><i class="fa-solid fa-flag-checkered"></i> Repaso completo</span>
  <h2 class="slide-title">Seguridad: el mismo edificio, ahora en código</h2>
  <p class="subtitle mb-4" style="max-width:640px;">Identificar, autenticar, autorizar, limitar, cifrar, separar, validar — cada táctica es una decisión concreta de diseño, no una casilla de "seguro" para tildar al final.</p>
</div>
`);

/* ============ MOTOR DE NAVEGACIÓN ============ */
const container = document.getElementById('slidesContainer');
slidesHTML.forEach((html, i)=>{
  const div = document.createElement('div');
  div.className = 'slide' + (i===0 ? ' active' : '');
  div.id = 'slide'+i;
  div.innerHTML = html;
  container.appendChild(div);
});

let current = 0;
const total = slidesHTML.length;
document.getElementById('hudTotal').textContent = total;

const dotsWrap = document.getElementById('navDots');
for(let i=0;i<total;i++){
  const d = document.createElement('div');
  d.className = 'dot' + (i===0?' active':'');
  d.onclick = ()=>goTo(i);
  dotsWrap.appendChild(d);
}

function updateUI(){
  document.querySelectorAll('.slide').forEach((s,i)=>{ s.classList.toggle('active', i===current); });
  document.querySelectorAll('.nav-dots .dot').forEach((d,i)=>{ d.classList.toggle('active', i===current); });
  document.getElementById('hudCurrent').textContent = current+1;
  document.getElementById('progressFill').style.width = ((current+1)/total*100)+'%';
  const active = document.getElementById('slide'+current);
  active.scrollTop = 0;
  const animTarget = active.querySelector('.slide-inner');
  if(animTarget){
    animTarget.classList.remove('animate__fadeIn');
    void animTarget.offsetWidth;
    animTarget.classList.add('animate__animated','animate__fadeIn');
  }
}
function goTo(i){ if(i<0||i>=total) return; current = i; updateUI(); }
document.getElementById('prevBtn').onclick = ()=>goTo(current-1);
document.getElementById('nextBtn').onclick = ()=>goTo(current+1);
document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight') goTo(current+1);
  if(e.key==='ArrowLeft') goTo(current-1);
});
updateUI();

/* ============ DATOS DE TÁCTICAS ============ */
const detectar = [
  {icon:'fa-user-secret', n:'Detectar la intrusión', d:'Compara patrones de tráfico o de llamados contra un conjunto conocido de patrones de comportamiento malicioso: protocolo, llamados, contenido del mensaje, origen, destino, etc.'},
  {icon:'fa-ban', n:'Detectar la denegación del servicio', d:'Identifica cuándo un ataque intenta volver el sistema inaccesible para usuarios legítimos. Ejemplo: monitorear un aumento inusual de solicitudes que sugiera un ataque DDoS.'},
  {icon:'fa-file-shield', n:'Verificar la integridad de los mensajes', d:'Asegura que los mensajes no fueron alterados en tránsito, usando sumas de verificación (hashes) o firmas digitales.'},
  {icon:'fa-user-ninja', n:'Detectar anomalías en la entrega de mensajes', d:'Identifica comportamientos inusuales en la entrega de mensajes que podrían sugerir un ataque de intermediario (man-in-the-middle).'}
];

const resistir = [
  {icon:'fa-id-badge', n:'Identificar actores', d:'Conocer la identidad de los usuarios o componentes que interactúan con el sistema. Típicamente por user id, aunque también IP u otros mecanismos.'},
  {icon:'fa-fingerprint', n:'Autenticar actores', d:'Verificar que un actor es quien dice ser: contraseñas, OTP, certificados digitales, 2FA, identificación biométrica.'},
  {icon:'fa-user-check', n:'Autorizar actores', d:'Determinar qué acciones o recursos puede acceder un actor ya autenticado. Puede limitarse por actor o por rol.'},
  {icon:'fa-door-closed', n:'Limitar el acceso', d:'Reduce la superficie de ataque restringiendo la cantidad de puntos de acceso o el tipo de tráfico permitido. Ejemplo: una DMZ.'},
  {icon:'fa-eye-slash', n:'Limitar la exposición', d:'Minimiza la cantidad de información o servicios expuestos por un punto de acceso, para acotar el daño posible de un ataque.'},
  {icon:'fa-lock', n:'Cifrar los datos', d:'Transforma los datos para que solo puedan leerlos quienes tengan la clave de descifrado. Simétrico (misma clave) o asimétrico (clave pública/privada).'},
  {icon:'fa-object-ungroup', n:'Separar entidades', d:'Aísla componentes o datos para que un compromiso en uno no afecte a los demás: máquinas físicas, VMs, contenedores; datos sensibles separados de los no sensibles.'},
  {icon:'fa-filter', n:'Validar la entrada', d:'Verifica que los datos de entrada cumplan los formatos y valores esperados, para prevenir ataques como inyección SQL o cross-site scripting.'},
  {icon:'fa-key', n:'Cambiar la configuración de las credenciales', d:'Modifica la configuración de seguridad predeterminada al poner en funcionamiento un componente, y periódicamente después. Ejemplo: forzar cambio de contraseña tras cierto tiempo.'}
];

const reaccionar = [
  {icon:'fa-user-slash', n:'Revocar el acceso', d:'Limita el acceso de credenciales —aún legítimas— cuando se sospecha que ocurrió un ataque.'},
  {icon:'fa-hand', n:'Restringir el ingreso', d:'Impide el acceso de credenciales ante sospecha de ataque. Ejemplo: bloquear a un usuario tras varios intentos fallidos de autenticación.'},
  {icon:'fa-bullhorn', n:'Informar a los actores', d:'Notifica a los interesados relevantes sobre un intento de ataque. Ejemplo: avisar por correo cuando se detecta un acceso no autorizado a una cuenta.'}
];

const recuperarse = [
  {icon:'fa-clipboard-list', n:'Auditar', d:'Registra y revisa las acciones de los actores, para detectar y prevenir actividades maliciosas.'},
  {icon:'fa-signature', n:'No-repudio', d:'Asegura que un actor no pueda negar haber realizado una acción específica. Ejemplo: firmas digitales que prueban el envío de un correo.'}
];

function renderGrid(containerId, items){
  const grid = document.getElementById(containerId);
  items.forEach(t=>{
    const tile = document.createElement('div');
    tile.className = 'tac-tile';
    tile.innerHTML = `<i class="fa-solid ${t.icon}"></i><div class="tname">${t.n}</div>`;
    tile.onclick = ()=>{
      Swal.fire({
        title: t.n,
        html: `<p style="text-align:left;">${t.d}</p>`,
        background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
      });
    };
    grid.appendChild(tile);
  });
}
renderGrid('gridDetectar', detectar);
renderGrid('gridResistir', resistir);
renderGrid('gridReaccionar', reaccionar);
renderGrid('gridRecuperarse', recuperarse);

const preguntas = [
  {
    texto:'Según la analogía de la seguridad física, ¿en qué cuatro categorías se agrupan las tácticas de seguridad?',
    opciones:{
      a:'Diseño, implementación, prueba y despliegue',
      b:'Detección, resistencia, reacción y recuperación',
      c:'Identidad, red, datos y aplicación',
      d:'Prevención, mitigación, transferencia y aceptación del riesgo'
    },
    correcta:'b'
  },
  {
    texto:'¿Qué diferencia hay entre "identificar actores" y "autenticar actores"?',
    opciones:{
      a:'No hay diferencia real entre ambas tácticas',
      b:'Identificar es conocer quién dice ser un actor (por ejemplo, su user id); autenticar es verificar que efectivamente es quien dice ser',
      c:'Autenticar ocurre siempre antes que identificar',
      d:'Identificar solo aplica a componentes, nunca a usuarios humanos'
    },
    correcta:'b'
  },
  {
    texto:'¿Qué táctica consiste en asegurar que los mensajes no fueron alterados durante la transmisión?',
    opciones:{
      a:'Detectar la denegación del servicio',
      b:'Verificar la integridad de los mensajes',
      c:'Limitar la exposición',
      d:'Cambiar la configuración de las credenciales'
    },
    correcta:'b'
  },
  {
    texto:'¿Cuál de las siguientes tácticas pertenece a la rama "Recuperarse de los ataques"?',
    opciones:{
      a:'Autorizar actores',
      b:'Restringir el ingreso',
      c:'No-repudio',
      d:'Separar entidades'
    },
    correcta:'c'
  },
  {
    texto:'¿Qué busca la táctica "separar entidades"?',
    opciones:{
      a:'Aislar componentes o datos para que un compromiso en uno no afecte a los demás',
      b:'Reducir la cantidad de puntos de acceso al sistema',
      c:'Verificar que los datos de entrada cumplan los formatos esperados',
      d:'Notificar a los interesados sobre un intento de ataque'
    },
    correcta:'a'
  }
];
let idxPregunta = 0, aciertos = 0;

function lanzarQuiz(){ idxPregunta = 0; aciertos = 0; mostrarPregunta(); }
function mostrarPregunta(){
  if(idxPregunta >= preguntas.length){
    Swal.fire({
      title:'Resultado',
      html:`Acertaste <b>${aciertos}/${preguntas.length}</b>.`,
      icon: aciertos===preguntas.length ? 'success' : 'info',
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    });
    return;
  }
  const p = preguntas[idxPregunta];
  Swal.fire({
    title: p.texto,
    input:'radio',
    inputOptions: p.opciones,
    background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff',
    confirmButtonText:'Responder',
    inputValidator: (value)=> !value && 'Elegí una opción'
  }).then(res=>{
    if(!res.isConfirmed) return;
    const ok = res.value === p.correcta;
    if(ok) aciertos++;
    Swal.fire({
      title: ok ? '¡Correcto!' : 'No es así',
      html: `La respuesta correcta era: <b>${p.opciones[p.correcta]}</b>`,
      icon: ok ? 'success' : 'error',
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    }).then(()=>{ idxPregunta++; mostrarPregunta(); });
  });
}
</script>

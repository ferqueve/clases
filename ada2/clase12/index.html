<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANDIS 2 · Unidad 2 — Tácticas para el rendimiento</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#070b14; --bg-1:#0d1424; --panel:#111a2e; --panel-2:#16223a;
  --accent:#3ec1ff; --accent-2:#7b6bff; --accent-3:#ffb547; --ok:#3ee6a8;
  --text:#e8edf7; --text-dim:#8fa0bd; --border:#22304d;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(1200px 700px at 15% -10%, rgba(62,193,255,.10), transparent 60%),
    radial-gradient(1000px 700px at 110% 10%, rgba(123,107,255,.12), transparent 55%),
    var(--bg-0);
  color:var(--text); font-family:'Inter',sans-serif; overflow:hidden;
}
.mono{font-family:'JetBrains Mono',monospace}
.blueprint{
  position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.35;
  background-image:linear-gradient(rgba(62,193,255,.06) 1px, transparent 1px),linear-gradient(90deg, rgba(62,193,255,.06) 1px, transparent 1px);
  background-size:42px 42px;
}
.progress-track{position:fixed; top:0; left:0; width:100%; height:4px; background:rgba(255,255,255,.06); z-index:50;}
.progress-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--accent-2)); transition:width .4s ease; box-shadow:0 0 12px var(--accent);}
.hud{position:fixed; top:14px; right:18px; z-index:50; background:rgba(17,26,46,.85); border:1px solid var(--border); backdrop-filter:blur(6px); padding:7px 14px; border-radius:999px; font-size:.82rem; color:var(--text-dim); display:flex; align-items:center; gap:8px;}
.hud .unit-tag{color:var(--accent); font-weight:700}
.brand{position:fixed; top:14px; left:18px; z-index:50; font-size:.78rem; color:var(--text-dim); display:flex; align-items:center; gap:8px; letter-spacing:.03em;}
.brand i{color:var(--accent-3)}
.slides-container{position:relative; z-index:1; height:100vh; width:100vw;}
.slide{position:absolute; inset:0; display:none; padding:90px 8vw 110px 8vw; overflow-y:auto;}
.slide.active{display:block}
.slide-inner{max-width:1180px; margin:0 auto;}
.eyebrow{display:inline-flex; align-items:center; gap:8px; font-size:.78rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent); font-weight:700; margin-bottom:14px;}
.eyebrow i{font-size:.9rem}
h1.slide-title{font-size:clamp(1.9rem,3.4vw,3rem); font-weight:800; margin-bottom:.4rem; line-height:1.1;}
h2.slide-title{font-size:clamp(1.5rem,2.6vw,2.2rem); font-weight:800; margin-bottom:.6rem;}
.subtitle{color:var(--text-dim); font-size:1.05rem; max-width:820px;}
.card-panel{background:linear-gradient(180deg, var(--panel), var(--panel-2)); border:1px solid var(--border); border-radius:16px; padding:26px 28px; box-shadow:0 12px 30px rgba(0,0,0,.35);}
.card-panel + .card-panel{margin-top:18px}
.pill{display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:999px; font-size:.76rem; font-weight:700; background:rgba(62,193,255,.12); color:var(--accent); border:1px solid rgba(62,193,255,.35);}
.pill.purple{background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)}
.pill.amber{background:rgba(255,181,71,.14); color:var(--accent-3); border-color:rgba(255,181,71,.4)}
.pill.ok{background:rgba(62,230,168,.12); color:var(--ok); border-color:rgba(62,230,168,.35)}
.icon-tile{width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center; background:rgba(62,193,255,.12); color:var(--accent); font-size:1.3rem; border:1px solid rgba(62,193,255,.3); flex-shrink:0;}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
@media (max-width:900px){.grid-2,.grid-3{grid-template-columns:1fr;}}
ul.clean{list-style:none; margin:0; padding:0;}
ul.clean li{position:relative; padding:6px 0 6px 26px; color:var(--text); font-size:.94rem;}
ul.clean li::before{content:"\f105"; font-family:"Font Awesome 6 Free"; font-weight:900; color:var(--accent); position:absolute; left:2px; top:8px; font-size:.85rem;}
.check-btn{border:none; background:linear-gradient(90deg,var(--accent),var(--accent-2)); color:#04101f; font-weight:800; padding:10px 22px; border-radius:10px; font-size:.9rem; box-shadow:0 8px 22px rgba(62,193,255,.25); cursor:pointer;}
.check-btn:hover{filter:brightness(1.08); color:#04101f;}
.nav-controls{position:fixed; bottom:18px; left:0; right:0; z-index:50; display:flex; justify-content:center; gap:14px; align-items:center;}
.nav-btn{width:46px; height:46px; border-radius:50%; border:1px solid var(--border); background:rgba(17,26,46,.9); color:var(--text); display:flex; align-items:center; justify-content:center; font-size:1.1rem; backdrop-filter:blur(6px);}
.nav-btn:hover{border-color:var(--accent); color:var(--accent);}
.nav-dots{display:flex; gap:6px; align-items:center; background:rgba(17,26,46,.9); border:1px solid var(--border); padding:8px 14px; border-radius:999px;}
.nav-dots .dot{width:7px; height:7px; border-radius:50%; background:var(--border); cursor:pointer; transition:.2s;}
.nav-dots .dot.active{background:var(--accent); width:20px; border-radius:4px;}
.footer-note{position:fixed; bottom:20px; right:22px; z-index:50; font-size:.72rem; color:var(--text-dim); font-family:'JetBrains Mono';}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px}

.tac-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
@media (max-width:900px){.tac-grid{grid-template-columns:repeat(2,1fr);}}
.tac-tile{
  background:var(--panel-2); border:1px solid var(--border); border-radius:14px; padding:16px;
  cursor:pointer; transition:.2s; text-align:center;
}
.tac-tile:hover{transform:translateY(-4px); border-color:var(--accent); box-shadow:0 10px 24px rgba(62,193,255,.15);}
.tac-tile i{font-size:1.3rem; color:var(--accent); margin-bottom:6px; display:block;}
.tac-tile .tname{font-size:.82rem; font-weight:700;}

.link-row{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid rgba(255,255,255,.06);}
.link-row:last-child{border-bottom:none;}
.link-row a{color:var(--text); text-decoration:none; font-weight:600;}
.link-row a:hover{color:var(--accent);}
.link-row .ext{margin-left:auto; color:var(--text-dim); font-size:.75rem;}

.tree{display:flex; gap:14px; flex-wrap:wrap; justify-content:center;}
.tree .branch{flex:1; min-width:220px; border-radius:14px; padding:18px; text-align:center; border:1px solid var(--border);}
.branch-a{background:rgba(62,193,255,.10); border-color:rgba(62,193,255,.35);}
.branch-b{background:rgba(123,107,255,.10); border-color:rgba(123,107,255,.35);}
</style>
</head>
<body>

<div class="blueprint"></div>
<div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
<div class="brand"><i class="fa-solid fa-cubes"></i> ANDIS 2 · Unidad 2</div>
<div class="hud"><i class="fa-solid fa-layer-group"></i> <span class="unit-tag" id="hudCurrent">1</span>/<span id="hudTotal">0</span></div>

<div class="slides-container" id="slidesContainer"></div>

<div class="nav-controls">
  <button class="nav-btn" id="prevBtn"><i class="fa-solid fa-chevron-left"></i></button>
  <div class="nav-dots" id="navDots"></div>
  <button class="nav-btn" id="nextBtn"><i class="fa-solid fa-chevron-right"></i></button>
</div>
<div class="footer-note">← → para navegar</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.10.5/sweetalert2.all.min.js"></script>
<script>
const slidesHTML = [];

// 0. Portada
slidesHTML.push(`
<div class="slide-inner d-flex flex-column justify-content-center" style="min-height:78vh;">
  <div class="animate__animated animate__fadeInDown">
    <span class="eyebrow"><i class="fa-solid fa-toolbox"></i> Unidad 2 · Tácticas de arquitectura</span>
    <h1 class="slide-title">Tácticas para el rendimiento</h1>
    <p class="subtitle">Controlar la demanda que entra o gestionar los recursos que responden: las dos grandes palancas para bajar el tiempo de respuesta bajo restricciones de tiempo y recursos.</p>
  </div>
</div>
`);

// 1. Introducción
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-circle-question"></i> Punto de partida</span>
  <h2 class="slide-title">¿Qué buscan estas tácticas?</h2>
  <div class="card-panel mt-3">
    <div class="d-flex gap-3">
      <div class="icon-tile"><i class="fa-solid fa-bullseye"></i></div>
      <p style="font-size:1.02rem; line-height:1.75; margin:0;">
        Generar una respuesta a los eventos que llegan al sistema, dentro de una <strong>restricción basada en tiempo
        o en recursos</strong>. El evento disparador puede ser único o parte de una secuencia.
      </p>
    </div>
  </div>
  <div class="card-panel mt-3 d-flex gap-3 align-items-center">
    <div class="icon-tile" style="background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)"><i class="fa-solid fa-microchip"></i></div>
    <div class="small" style="color:var(--text-dim)">Por <strong style="color:var(--text)">"recurso"</strong> se entiende un dispositivo computacional que consume energía al proveer su funcionalidad — la misma noción que en las tácticas de eficiencia energética.</div>
  </div>
</div>
`);

// 2. Taxonomía
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-sitemap"></i> El mapa completo</span>
  <h2 class="slide-title">Dos ramas, quince tácticas</h2>
  <div class="tree mt-3">
    <div class="branch branch-a"><i class="fa-solid fa-filter mb-2 d-block" style="color:var(--accent)"></i><strong>Controlar la demanda de recursos</strong><div class="small mt-1" style="color:var(--text-dim)">9 tácticas: gestionar pedidos, reducir sobrecarga, ganar eficiencia</div></div>
    <div class="branch branch-b"><i class="fa-solid fa-server mb-2 d-block" style="color:#b3a8ff"></i><strong>Gestionar los recursos</strong><div class="small mt-1" style="color:var(--text-dim)">6 tácticas: sumar, paralelizar, replicar, calendarizar</div></div>
  </div>
  <p class="subtitle mt-3 mb-0">Explorá cada una tocando su tarjeta en las próximas diapositivas.</p>
</div>
`);

// 3. Explorador: Controlar la demanda de recursos
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-filter"></i> Rama 1</span>
  <h2 class="slide-title">Controlar la demanda de recursos</h2>
  <p class="subtitle mb-3">Reducir cuántas solicitudes llegan a procesarse, o cuánto trabajo cuesta procesarlas.</p>
  <div class="tac-grid" id="gridDemanda"></div>
</div>
`);

// 4. Explorador: Gestionar los recursos
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-server"></i> Rama 2</span>
  <h2 class="slide-title">Gestionar los recursos</h2>
  <p class="subtitle mb-3">Aumentar, paralelizar o replicar lo que responde a la demanda.</p>
  <div class="tac-grid" id="gridRecursos"></div>
</div>
`);

// 5. Caché en detalle
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-database"></i> Un caso especial</span>
  <h2 class="slide-title">Múltiples copias de los datos: dos formas</h2>
  <div class="grid-2 mt-3">
    <div class="card-panel h-100">
      <div class="icon-tile mb-2"><i class="fa-solid fa-copy"></i></div>
      <h6 class="fw-bold">Replicación de datos</h6>
      <p class="small mb-0" style="color:var(--text-dim)">Los mismos datos están en más de un lugar, accesibles en paralelo para disminuir la contención. Deben mantenerse sincronizados para ser consistentes — lo cual puede ser un problema en sí mismo.</p>
    </div>
    <div class="card-panel h-100">
      <div class="icon-tile mb-2" style="background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)"><i class="fa-solid fa-bolt"></i></div>
      <h6 class="fw-bold">Caché</h6>
      <p class="small mb-0" style="color:var(--text-dim)">Datos de acceso frecuente o costoso de obtener se guardan en repositorios de acceso más rápido (memoria, SSD). Dos problemas: qué datos cachear, y cómo mantener el caché consistente con la fuente original.</p>
    </div>
  </div>
</div>
`);

// 6. Para profundizar
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-book-open-reader"></i> Para profundizar</span>
  <h2 class="slide-title">Recomendaciones del Azure Well-Architected Framework</h2>
  <div class="card-panel mt-3">
    <div class="link-row">
      <i class="fa-solid fa-link" style="color:var(--accent)"></i>
      <a href="https://learn.microsoft.com/en-us/azure/well-architected/performance-efficiency/prioritize-critical-flows" target="_blank">Prioritizing the performance of critical flows</a>
      <span class="ext">Performance Efficiency</span>
    </div>
    <div class="link-row">
      <i class="fa-solid fa-link" style="color:var(--accent)"></i>
      <a href="https://learn.microsoft.com/en-us/azure/well-architected/performance-efficiency/optimize-code-infrastructure" target="_blank">Optimizing code and infrastructure</a>
      <span class="ext">Performance Efficiency</span>
    </div>
    <div class="link-row">
      <i class="fa-solid fa-link" style="color:var(--accent)"></i>
      <a href="https://learn.microsoft.com/en-us/azure/well-architected/performance-efficiency/optimize-data-performance" target="_blank">Optimizing data performance</a>
      <span class="ext">Performance Efficiency</span>
    </div>
  </div>
</div>
`);

// 7. Quiz
slidesHTML.push(`
<div class="slide-inner d-flex flex-column justify-content-center align-items-center text-center" style="min-height:70vh;">
  <span class="eyebrow"><i class="fa-solid fa-brain"></i> Chequeo de comprensión</span>
  <h2 class="slide-title">5 preguntas sobre tácticas de rendimiento</h2>
  <p class="subtitle mb-4">Controlar la demanda vs. gestionar los recursos, y sus sub-tácticas.</p>
  <button class="check-btn" onclick="lanzarQuiz()"><i class="fa-solid fa-play me-2"></i>Iniciar quiz</button>
</div>
`);

// 8. Cierre
slidesHTML.push(`
<div class="slide-inner d-flex flex-column justify-content-center align-items-center text-center" style="min-height:78vh;">
  <div class="icon-tile mb-3" style="width:72px;height:72px;font-size:2rem;"><i class="fa-solid fa-check"></i></div>
  <span class="eyebrow"><i class="fa-solid fa-flag-checkered"></i> Repaso completo</span>
  <h2 class="slide-title">15 tácticas, dos preguntas</h2>
  <p class="subtitle mb-4" style="max-width:640px;">¿Reduzco lo que entra, o mejoro lo que responde? La mayoría de las decisiones de rendimiento se resumen en esa disyuntiva — y en combinar ambas con criterio.</p>
</div>
`);

/* ============ MOTOR DE NAVEGACIÓN ============ */
const container = document.getElementById('slidesContainer');
slidesHTML.forEach((html, i)=>{
  const div = document.createElement('div');
  div.className = 'slide' + (i===0 ? ' active' : '');
  div.id = 'slide'+i;
  div.innerHTML = html;
  container.appendChild(div);
});

let current = 0;
const total = slidesHTML.length;
document.getElementById('hudTotal').textContent = total;

const dotsWrap = document.getElementById('navDots');
for(let i=0;i<total;i++){
  const d = document.createElement('div');
  d.className = 'dot' + (i===0?' active':'');
  d.onclick = ()=>goTo(i);
  dotsWrap.appendChild(d);
}

function updateUI(){
  document.querySelectorAll('.slide').forEach((s,i)=>{ s.classList.toggle('active', i===current); });
  document.querySelectorAll('.nav-dots .dot').forEach((d,i)=>{ d.classList.toggle('active', i===current); });
  document.getElementById('hudCurrent').textContent = current+1;
  document.getElementById('progressFill').style.width = ((current+1)/total*100)+'%';
  const active = document.getElementById('slide'+current);
  active.scrollTop = 0;
  const animTarget = active.querySelector('.slide-inner');
  if(animTarget){
    animTarget.classList.remove('animate__fadeIn');
    void animTarget.offsetWidth;
    animTarget.classList.add('animate__animated','animate__fadeIn');
  }
}
function goTo(i){ if(i<0||i>=total) return; current = i; updateUI(); }
document.getElementById('prevBtn').onclick = ()=>goTo(current-1);
document.getElementById('nextBtn').onclick = ()=>goTo(current+1);
document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight') goTo(current+1);
  if(e.key==='ArrowLeft') goTo(current-1);
});
updateUI();

/* ============ DATOS DE TÁCTICAS ============ */
const demanda = [
  {icon:'fa-inbox', n:'Gestionar la llegada de eventos', d:'Controla cómo y cuándo se procesan los eventos para evitar sobrecargas. Ejemplo: un SLA que limita la cantidad de eventos por unidad de tiempo.'},
  {icon:'fa-sliders', n:'Gestionar la tasa de muestreo', d:'Ajusta la frecuencia con la que se procesan eventos. Ejemplo: reducir la frecuencia de muestreo en un sistema IoT para bajar la carga de procesamiento.'},
  {icon:'fa-filter-circle-xmark', n:'Limitar la respuesta a eventos', d:'Limita cuánto procesamiento se hace en respuesta a un evento: filtrarlos, o ponerlos en cola hasta poder procesarlos.'},
  {icon:'fa-list-ol', n:'Priorizar los eventos', d:'Asigna niveles de prioridad para que los eventos críticos se procesen antes. Ejemplo: cola donde las solicitudes de alta prioridad se atienden primero.'},
  {icon:'fa-arrows-to-dot', n:'Reducir la indirección', d:'Minimiza los niveles de indirección entre componentes, bajando complejidad y tiempo de procesamiento. Ejemplo: acceder a los datos directamente en vez de por múltiples capas.'},
  {icon:'fa-map-location-dot', n:'Co-ubicar recursos comunicados', d:'Agrupa recursos que se comunican frecuentemente para reducir el tiempo de transmisión. Ejemplo: almacenar datos relacionados en la misma ubicación física.'},
  {icon:'fa-broom', n:'Limpieza periódica', d:'Reiniciar componentes o hacer mantenimiento para evitar que memoria o archivos fragmentados enlentezcan las operaciones.'},
  {icon:'fa-hourglass-end', n:'Limitar los tiempos de ejecución', d:'Establece un límite de tiempo para una tarea; si lo excede, se interrumpe o gestiona de otra forma. Ejemplo: reducir iteraciones de un algoritmo aunque el resultado sea menos preciso.'},
  {icon:'fa-gears', n:'Incrementar la eficiencia en el uso de recursos', d:'Optimizar algoritmos y estructuras de datos para que las tareas se realicen de la forma más eficiente posible.'}
];

const recursos = [
  {icon:'fa-server', n:'Aumentar los recursos', d:'Agregar más y mejores procesadores, memoria o componentes de red. Ejemplo: escalar horizontalmente sumando servidores a un clúster.'},
  {icon:'fa-diagram-project', n:'Introducir concurrencia', d:'Permite que varias tareas se ejecuten en paralelo en lugar de una tras otra. Ejemplo: múltiples hilos manejando solicitudes concurrentes en un servidor web.'},
  {icon:'fa-clone', n:'Mantener múltiples copias del cómputo', d:'Reduce la contención de tener todo el procesamiento en un solo componente. Ejemplo: servicios replicados en microservicios, o un pool de servidores web.'},
  {icon:'fa-database', n:'Mantener múltiples copias de los datos', d:'Replica datos en distintas ubicaciones para bajar contención o tiempo de acceso: por replicación de datos o por caché (ver diapositiva siguiente).'},
  {icon:'fa-layer-group', n:'Limitar el tamaño de las colas', d:'Controla el tamaño de las colas de trabajo para evitar esperas excesivas. Suele combinarse con limitar la respuesta a eventos.'},
  {icon:'fa-calendar-check', n:'Calendarizar recursos', d:'Asigna recursos a eventos según algún criterio, para que estén disponibles cuando se necesiten. Ejemplos: first-in/first-out, round robin.'}
];

function renderGrid(containerId, items){
  const grid = document.getElementById(containerId);
  items.forEach(t=>{
    const tile = document.createElement('div');
    tile.className = 'tac-tile';
    tile.innerHTML = `<i class="fa-solid ${t.icon}"></i><div class="tname">${t.n}</div>`;
    tile.onclick = ()=>{
      Swal.fire({
        title: t.n,
        html: `<p style="text-align:left;">${t.d}</p>`,
        background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
      });
    };
    grid.appendChild(tile);
  });
}
renderGrid('gridDemanda', demanda);
renderGrid('gridRecursos', recursos);

/* ============ QUIZ ============ */
const preguntas = [
  {
    texto:'¿Cuál es el objetivo general de las tácticas de rendimiento?',
    opciones:{
      a:'Reducir el costo de licenciamiento del software',
      b:'Generar una respuesta a los eventos que llegan al sistema, dentro de una restricción de tiempo o de recursos',
      c:'Aumentar la cantidad de funcionalidades disponibles para el usuario',
      d:'Garantizar que el sistema nunca se quede sin memoria disponible'
    },
    correcta:'b'
  },
  {
    texto:'Un sistema IoT reduce la frecuencia con la que envía lecturas de sensores para bajar la carga de procesamiento. ¿Qué táctica es?',
    opciones:{
      a:'Gestionar la tasa de muestreo',
      b:'Limitar el tamaño de las colas',
      c:'Introducir concurrencia',
      d:'Co-ubicar recursos comunicados'
    },
    correcta:'a'
  },
  {
    texto:'¿Cuál es la diferencia principal entre replicación de datos y caché, como formas de mantener múltiples copias de los datos?',
    opciones:{
      a:'No hay diferencia real entre ambas técnicas',
      b:'La replicación solo aplica a bases de datos relacionales',
      c:'La replicación guarda los mismos datos en varios lugares para acceso paralelo; el caché guarda datos frecuentes o costosos en un repositorio de acceso más rápido',
      d:'El caché siempre es más lento que acceder a la fuente de datos original'
    },
    correcta:'c'
  },
  {
    texto:'¿Qué busca la táctica "reducir la indirección"?',
    opciones:{
      a:'Aumentar la cantidad de capas de abstracción para mayor flexibilidad',
      b:'Minimizar los niveles de indirección entre componentes, reduciendo complejidad y tiempo de procesamiento',
      c:'Eliminar por completo el uso de bases de datos',
      d:'Aumentar la cantidad de servidores en un clúster'
    },
    correcta:'b'
  },
  {
    texto:'¿A qué rama de las tácticas de rendimiento pertenece "introducir concurrencia"?',
    opciones:{
      a:'Controlar la demanda de recursos',
      b:'Gestionar los recursos',
      c:'Reducir la sobrecarga computacional',
      d:'Gestionar los pedidos de trabajo'
    },
    correcta:'b'
  }
];
let idxPregunta = 0, aciertos = 0;

function lanzarQuiz(){ idxPregunta = 0; aciertos = 0; mostrarPregunta(); }
function mostrarPregunta(){
  if(idxPregunta >= preguntas.length){
    Swal.fire({
      title:'Resultado',
      html:`Acertaste <b>${aciertos}/${preguntas.length}</b>.`,
      icon: aciertos===preguntas.length ? 'success' : 'info',
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    });
    return;
  }
  const p = preguntas[idxPregunta];
  Swal.fire({
    title: p.texto,
    input:'radio',
    inputOptions: p.opciones,
    background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff',
    confirmButtonText:'Responder',
    inputValidator: (value)=> !value && 'Elegí una opción'
  }).then(res=>{
    if(!res.isConfirmed) return;
    const ok = res.value === p.correcta;
    if(ok) aciertos++;
    Swal.fire({
      title: ok ? '¡Correcto!' : 'No es así',
      html: `La respuesta correcta era: <b>${p.opciones[p.correcta]}</b>`,
      icon: ok ? 'success' : 'error',
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    }).then(()=>{ idxPregunta++; mostrarPregunta(); });
  });
}
</script>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANDIS 2 · Unidad 3 — Interfaces</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#070b14; --bg-1:#0d1424; --panel:#111a2e; --panel-2:#16223a;
  --accent:#3ec1ff; --accent-2:#7b6bff; --accent-3:#ffb547; --ok:#3ee6a8;
  --text:#e8edf7; --text-dim:#8fa0bd; --border:#22304d;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(1200px 700px at 15% -10%, rgba(62,193,255,.10), transparent 60%),
    radial-gradient(1000px 700px at 110% 10%, rgba(123,107,255,.12), transparent 55%),
    var(--bg-0);
  color:var(--text); font-family:'Inter',sans-serif; overflow:hidden;
}
.mono{font-family:'JetBrains Mono',monospace}
.blueprint{
  position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.35;
  background-image:linear-gradient(rgba(62,193,255,.06) 1px, transparent 1px),linear-gradient(90deg, rgba(62,193,255,.06) 1px, transparent 1px);
  background-size:42px 42px;
}
.progress-track{position:fixed; top:0; left:0; width:100%; height:4px; background:rgba(255,255,255,.06); z-index:50;}
.progress-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--accent-2)); transition:width .4s ease; box-shadow:0 0 12px var(--accent);}
.hud{position:fixed; top:14px; right:18px; z-index:50; background:rgba(17,26,46,.85); border:1px solid var(--border); backdrop-filter:blur(6px); padding:7px 14px; border-radius:999px; font-size:.82rem; color:var(--text-dim); display:flex; align-items:center; gap:8px;}
.hud .unit-tag{color:var(--accent); font-weight:700}
.brand{position:fixed; top:14px; left:18px; z-index:50; font-size:.78rem; color:var(--text-dim); display:flex; align-items:center; gap:8px; letter-spacing:.03em;}
.brand i{color:var(--accent-3)}
.slides-container{position:relative; z-index:1; height:100vh; width:100vw;}
.slide{position:absolute; inset:0; display:none; padding:90px 8vw 110px 8vw; overflow-y:auto;}
.slide.active{display:block}
.slide-inner{max-width:1180px; margin:0 auto;}
.eyebrow{display:inline-flex; align-items:center; gap:8px; font-size:.78rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent); font-weight:700; margin-bottom:14px;}
.eyebrow i{font-size:.9rem}
h1.slide-title{font-size:clamp(1.9rem,3.4vw,3rem); font-weight:800; margin-bottom:.4rem; line-height:1.1;}
h2.slide-title{font-size:clamp(1.5rem,2.6vw,2.2rem); font-weight:800; margin-bottom:.6rem;}
.subtitle{color:var(--text-dim); font-size:1.05rem; max-width:820px;}
.card-panel{background:linear-gradient(180deg, var(--panel), var(--panel-2)); border:1px solid var(--border); border-radius:16px; padding:26px 28px; box-shadow:0 12px 30px rgba(0,0,0,.35);}
.card-panel + .card-panel{margin-top:18px}
.pill{display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:999px; font-size:.76rem; font-weight:700; background:rgba(62,193,255,.12); color:var(--accent); border:1px solid rgba(62,193,255,.35);}
.pill.purple{background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)}
.pill.amber{background:rgba(255,181,71,.14); color:var(--accent-3); border-color:rgba(255,181,71,.4)}
.pill.ok{background:rgba(62,230,168,.12); color:var(--ok); border-color:rgba(62,230,168,.35)}
.icon-tile{width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center; background:rgba(62,193,255,.12); color:var(--accent); font-size:1.3rem; border:1px solid rgba(62,193,255,.3); flex-shrink:0;}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
.grid-4{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
@media (max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}
ul.clean{list-style:none; margin:0; padding:0;}
ul.clean li{position:relative; padding:6px 0 6px 26px; color:var(--text); font-size:.94rem;}
ul.clean li::before{content:"\f105"; font-family:"Font Awesome 6 Free"; font-weight:900; color:var(--accent); position:absolute; left:2px; top:8px; font-size:.85rem;}
.check-btn{border:none; background:linear-gradient(90deg,var(--accent),var(--accent-2)); color:#04101f; font-weight:800; padding:10px 22px; border-radius:10px; font-size:.9rem; box-shadow:0 8px 22px rgba(62,193,255,.25); cursor:pointer;}
.check-btn:hover{filter:brightness(1.08); color:#04101f;}
.nav-controls{position:fixed; bottom:18px; left:0; right:0; z-index:50; display:flex; justify-content:center; gap:14px; align-items:center;}
.nav-btn{width:46px; height:46px; border-radius:50%; border:1px solid var(--border); background:rgba(17,26,46,.9); color:var(--text); display:flex; align-items:center; justify-content:center; font-size:1.1rem; backdrop-filter:blur(6px);}
.nav-btn:hover{border-color:var(--accent); color:var(--accent);}
.nav-dots{display:flex; gap:6px; align-items:center; background:rgba(17,26,46,.9); border:1px solid var(--border); padding:8px 14px; border-radius:999px;}
.nav-dots .dot{width:7px; height:7px; border-radius:50%; background:var(--border); cursor:pointer; transition:.2s;}
.nav-dots .dot.active{background:var(--accent); width:20px; border-radius:4px;}
.footer-note{position:fixed; bottom:20px; right:22px; z-index:50; font-size:.72rem; color:var(--text-dim); font-family:'JetBrains Mono';}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px}

.tac-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
@media (max-width:900px){.tac-grid{grid-template-columns:repeat(2,1fr);}}
.tac-tile{
  background:var(--panel-2); border:1px solid var(--border); border-radius:14px; padding:16px;
  cursor:pointer; transition:.2s; text-align:center;
}
.tac-tile:hover{transform:translateY(-4px); border-color:var(--accent); box-shadow:0 10px 24px rgba(62,193,255,.15);}
.tac-tile i{font-size:1.3rem; color:var(--accent); margin-bottom:6px; display:block;}
.tac-tile .tname{font-size:.82rem; font-weight:700;}

.sub-item{background:var(--panel-2); border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:10px;}
.sub-item .sname{font-weight:700; font-size:.94rem; color:var(--accent); margin-bottom:4px; display:flex; align-items:center; gap:8px;}
.sub-item .sdesc{font-size:.85rem; color:var(--text-dim); margin:0;}

.link-row{display:flex; align-items:center; gap:12px; padding:9px 0; border-bottom:1px solid rgba(255,255,255,.06); font-size:.88rem;}
.link-row:last-child{border-bottom:none;}
.link-row a{color:var(--text); text-decoration:none; font-weight:600;}
.link-row a:hover{color:var(--accent);}
.link-row .ext{margin-left:auto; color:var(--text-dim); font-size:.7rem;}
</style>
</head>
<body>

<div class="blueprint"></div>
<div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
<div class="brand"><i class="fa-solid fa-cubes"></i> ANDIS 2 · Unidad 3</div>
<div class="hud"><i class="fa-solid fa-layer-group"></i> <span class="unit-tag" id="hudCurrent">1</span>/<span id="hudTotal">0</span></div>

<div class="slides-container" id="slidesContainer"></div>

<div class="nav-controls">
  <button class="nav-btn" id="prevBtn"><i class="fa-solid fa-chevron-left"></i></button>
  <div class="nav-dots" id="navDots"></div>
  <button class="nav-btn" id="nextBtn"><i class="fa-solid fa-chevron-right"></i></button>
</div>
<div class="footer-note">← → para navegar</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.10.5/sweetalert2.all.min.js"></script>
<script>
const slidesHTML = [];

// 0. Portada
slidesHTML.push(`
<div class="slide-inner d-flex flex-column justify-content-center" style="min-height:78vh;">
  <div class="animate__animated animate__fadeInDown">
    <span class="eyebrow"><i class="fa-solid fa-plug"></i> Unidad 3 · Soluciones arquitectónicas</span>
    <h1 class="slide-title">Interfaces</h1>
    <p class="subtitle">El mecanismo de abstracción fundamental para conectar componentes: qué proveen, qué consumen, cómo se diseñan, cómo evolucionan y qué hay que documentar de ellas.</p>
  </div>
</div>
`);

// 1. Términos relacionados
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-book"></i> Vocabulario base</span>
  <h2 class="slide-title">Términos relacionados</h2>
  <div class="grid-2 mt-3">
    <div class="sub-item"><div class="sname"><i class="fa-solid fa-user-group"></i>Clientes</div><p class="sdesc">Los demás componentes, usuarios o sistemas con los que interactúa un componente.</p></div>
    <div class="sub-item"><div class="sname"><i class="fa-solid fa-globe"></i>Entorno (environment)</div><p class="sdesc">El conjunto de clientes con los que interactúa un componente.</p></div>
    <div class="sub-item"><div class="sname"><i class="fa-solid fa-right-left"></i>Interacciones</div><p class="sdesc">Transferencias de control (calls) o de datos entre componentes.</p></div>
    <div class="sub-item"><div class="sname"><i class="fa-solid fa-door-open"></i>Recursos</div><p class="sdesc">Construcciones que proveen puntos de interacción directa con un componente.</p></div>
  </div>
</div>
`);

// 2. Implicaciones clave
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-lightbulb"></i> Tres consecuencias</span>
  <h2 class="slide-title">Implicaciones clave</h2>
  <div class="card-panel mt-3">
    <div class="d-flex gap-3">
      <div class="icon-tile"><i class="fa-solid fa-cube"></i></div>
      <p class="mb-0" style="font-size:1rem; line-height:1.7;">Todos los componentes tienen interfaces — de lo contrario, ¿cuál sería su propósito?</p>
    </div>
  </div>
  <div class="card-panel mt-3">
    <div class="d-flex gap-3">
      <div class="icon-tile" style="background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)"><i class="fa-solid fa-arrows-left-right"></i></div>
      <p class="mb-0" style="font-size:1rem; line-height:1.7;">Las interfaces no son solo lo que un componente <strong>provee</strong>, sino también lo que <strong>consume</strong> — si lo que consume no está disponible, no provee lo esperado.</p>
    </div>
  </div>
  <div class="card-panel mt-3">
    <div class="d-flex gap-3">
      <div class="icon-tile" style="background:rgba(255,181,71,.14); color:var(--accent-3); border-color:rgba(255,181,71,.4)"><i class="fa-solid fa-users"></i></div>
      <p class="mb-0" style="font-size:1rem; line-height:1.7;">Un componente puede interactuar con varios clientes a través de la <strong>misma interfaz</strong> al mismo tiempo.</p>
    </div>
  </div>
</div>
`);

// 3. Conceptos fundamentales - explorador
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-diagram-project"></i> El vocabulario técnico</span>
  <h2 class="slide-title">Conceptos fundamentales</h2>
  <p class="subtitle mb-3">Tocá cada tarjeta para ver su definición.</p>
  <div class="tac-grid" id="gridConceptos"></div>
</div>
`);

// 4. Semántica del recurso en detalle
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-magnifying-glass"></i> Un concepto rico</span>
  <h2 class="slide-title">Semántica del recurso: qué incluye</h2>
  <p class="subtitle mb-3">Es el resultado de invocar el recurso — mucho más que solo "qué devuelve".</p>
  <div class="grid-2">
    <div class="sub-item"><div class="sname"><i class="fa-solid fa-database"></i>Asignación de valores</div><p class="sdesc">Desde un simple valor hasta una transacción completa en base de datos.</p></div>
    <div class="sub-item"><div class="sname"><i class="fa-solid fa-shield-halved"></i>Asunciones sobre valores</div><p class="sdesc">Qué se asume acerca de los datos que atraviesan la interfaz.</p></div>
    <div class="sub-item"><div class="sname"><i class="fa-solid fa-arrows-spin"></i>Cambios de estado</div><p class="sdesc">Incluyendo estados excepcionales resultantes de usar el recurso.</p></div>
    <div class="sub-item"><div class="sname"><i class="fa-solid fa-bell"></i>Eventos o mensajes</div><p class="sdesc">Los que se señalan o envían como resultado del uso del recurso.</p></div>
    <div class="sub-item"><div class="sname"><i class="fa-solid fa-clock-rotate-left"></i>Efecto sobre otros recursos</div><p class="sdesc">Cómo se comportarán distinto en el futuro. Ejemplo: acceder a un objeto ya destruido produce error.</p></div>
    <div class="sub-item"><div class="sname"><i class="fa-solid fa-eye"></i>Resultados observables</div><p class="sdesc">En sistemas embebidos, si la ejecución es atómica o se puede suspender y retomar.</p></div>
  </div>
</div>
`);

// 5. Evolución de interfaces
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-seedling"></i> Cuando hay que cambiar algo</span>
  <h2 class="slide-title">Evolución de las interfaces</h2>
  <div class="card-panel mt-3">
    <p style="font-size:1rem; line-height:1.7; margin:0;">
      Idealmente, el componente detrás de una interfaz evoluciona <strong>sin afectar</strong> a quienes la consumen
      — mientras la interfaz en sí no cambie. Cuando sí hace falta cambiarla, hay tres técnicas:
    </p>
  </div>
  <div class="grid-3 mt-3">
    <div class="sub-item"><div class="sname"><i class="fa-solid fa-trash"></i>Deprecación</div><p class="sdesc">Eliminar la interfaz, avisando con antelación o introduciendo códigos de error que anuncien la deprecación.</p></div>
    <div class="sub-item"><div class="sname"><i class="fa-solid fa-code-branch"></i>Versionado</div><p class="sdesc">Introducir una nueva versión manteniendo la anterior, que se deprecará luego. Puede requerir un adaptador o mediador.</p></div>
    <div class="sub-item"><div class="sname"><i class="fa-solid fa-plus"></i>Extensión</div><p class="sdesc">Dejar la interfaz original sin cambios y agregar nuevos recursos. También puede requerir adaptador o mediador.</p></div>
  </div>
</div>
`);

// 6. Principios de diseño
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-drafting-compass"></i> Cómo diseñar bien</span>
  <h2 class="slide-title">Principios para el diseño de interfaces</h2>
  <div class="grid-2 mt-3">
    <div class="card-panel h-100">
      <div class="icon-tile mb-2"><i class="fa-solid fa-face-surprise"></i></div>
      <h6 class="fw-bold">Mínima sorpresa</h6>
      <p class="small mb-0" style="color:var(--text-dim)">La interfaz debe comportarse de forma consistente con las expectativas del actor. Los nombres importan: un buen nombre da pistas claras sobre el uso del recurso.</p>
    </div>
    <div class="card-panel h-100">
      <div class="icon-tile mb-2" style="background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)"><i class="fa-solid fa-compress"></i></div>
      <h6 class="fw-bold">Interfaces pequeñas</h6>
      <p class="small mb-0" style="color:var(--text-dim)">Cuando dos elementos interactúan, que intercambien la menor cantidad de información posible.</p>
    </div>
    <div class="card-panel h-100">
      <div class="icon-tile mb-2" style="background:rgba(255,181,71,.14); color:var(--accent-3); border-color:rgba(255,181,71,.4)"><i class="fa-solid fa-eye-slash"></i></div>
      <h6 class="fw-bold">Acceso uniforme</h6>
      <p class="small mb-0" style="color:var(--text-dim)">No filtrar detalles de implementación. El actor no debe saber si un valor viene de un caché, un cálculo, o una búsqueda externa.</p>
    </div>
    <div class="card-panel h-100">
      <div class="icon-tile mb-2" style="background:rgba(62,230,168,.12); color:var(--ok); border-color:rgba(62,230,168,.35)"><i class="fa-solid fa-recycle"></i></div>
      <h6 class="fw-bold">DRY (don't repeat yourself)</h6>
      <p class="small mb-0" style="color:var(--text-dim)">Ofrecer primitivas componibles, en vez de muchas formas distintas de lograr lo mismo.</p>
    </div>
  </div>
  <div class="card-panel mt-3 d-flex gap-3 align-items-center">
    <div class="icon-tile" style="background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)"><i class="fa-solid fa-object-ungroup"></i></div>
    <div class="small" style="color:var(--text-dim)"><strong style="color:var(--text)">Múltiples interfaces</strong> es otro concepto clave: separar una interfaz en varias, basado en el principio de segregación de interfaces (ISP) de Robert C. Martin — útil para dar distintos niveles de acceso al mismo recurso.</div>
  </div>
</div>
`);

// 7. Alcance de la interfaz + gateway
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-handshake"></i> Acuerdo 1 de 4</span>
  <h2 class="slide-title">Alcance de la interfaz y gateways</h2>
  <div class="card-panel mt-3">
    <p style="font-size:1rem; line-height:1.7;">
      El <strong>alcance</strong> define qué recursos están directamente disponibles para los actores — todos
      podrían acceder a todo, o ciertos actores solo a ciertos recursos, por seguridad, desempeño o facilidad de
      modificación.
    </p>
  </div>
  <div class="card-panel mt-3">
    <span class="pill"><i class="fa-solid fa-door-closed"></i> Patrón gateway (puerta de enlace)</span>
    <p class="small mt-2 mb-2" style="color:var(--text-dim)">Traduce las solicitudes de los actores hacia los recursos del componente de destino, que pasa a ver a la puerta de enlace como su único actor. Es útil porque:</p>
    <ul class="clean">
      <li>La granularidad que ofrece un componente puede diferir de la que necesita un actor</li>
      <li>Puede traducir entre distintos elementos y actores</li>
      <li>Puede restringir el acceso a subconjuntos específicos de recursos</li>
      <li>Ofrece una interfaz más estable aunque los detalles internos cambien con el tiempo</li>
    </ul>
  </div>
</div>
`);

// 8. Estilo de interacción
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-handshake"></i> Acuerdo 2 de 4</span>
  <h2 class="slide-title">Estilo de interacción</h2>
  <div class="card-panel mt-3">
    <p style="font-size:1rem; line-height:1.7; margin:0;">
      Depende de la combinación entre comunicación y coordinación, y de si los elementos están <strong>co-ubicados</strong>
      o se implementan de forma <strong>remota</strong>.
    </p>
  </div>
  <div class="grid-2 mt-3">
    <div class="sub-item"><div class="sname"><i class="fa-solid fa-house"></i>Co-ubicados</div><p class="sdesc">Acceso eficiente a grandes volúmenes de datos vía memoria compartida local.</p></div>
    <div class="sub-item"><div class="sname"><i class="fa-solid fa-bolt"></i>Sincrónicos (disponibles al mismo tiempo)</div><p class="sdesc">Llamadas sincrónicas para invocar operaciones directamente.</p></div>
    <div class="sub-item"><div class="sname"><i class="fa-solid fa-network-wired"></i>Distribuidos no confiables</div><p class="sdesc">Interacciones asíncronas basadas en eventos, vía colas de mensajes o flujos de datos — ver las falacias de la computación distribuida.</p></div>
    <div class="sub-item"><div class="sname"><i class="fa-solid fa-code-compare"></i>Los dos estilos más comunes</div><p class="sdesc"><strong>RPC</strong> y <strong>REST</strong>.</p></div>
  </div>
</div>
`);

// 9. Representación de datos
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-handshake"></i> Acuerdo 3 de 4</span>
  <h2 class="slide-title">Representación y estructura de los datos</h2>
  <div class="card-panel mt-3">
    <p style="font-size:1rem; line-height:1.7;">
      Cada interfaz abstrae la representación interna de datos —dependiente de la tecnología del componente— hacia
      una representación más adecuada para intercambiar entre componentes distintos. Esa conversión se llama
      <strong>secuenciación, marshaling o traducción</strong>.
    </p>
  </div>
  <div class="grid-2 mt-3">
    <div class="card-panel h-100">
      <span class="pill"><i class="fa-solid fa-file-lines"></i> Textuales</span>
      <p class="small mt-2 mb-0" style="color:var(--text-dim)">XML, JSON</p>
    </div>
    <div class="card-panel h-100">
      <span class="pill purple"><i class="fa-solid fa-microchip"></i> Binarias</span>
      <p class="small mt-2 mb-0" style="color:var(--text-dim)">Protocol Buffers</p>
    </div>
  </div>
</div>
`);

// 10. Manejo de errores
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-handshake"></i> Acuerdo 4 de 4</span>
  <h2 class="slide-title">Manejo de errores</h2>
  <p class="subtitle mb-2">Los actores necesitan saber si el componente funciona bien y si su interacción fue exitosa.</p>
  <div class="grid-3">
    <div class="sub-item"><div class="sname"><i class="fa-solid fa-bomb"></i>Excepción</div><p class="sdesc">La operación fallida genera una excepción.</p></div>

slidesHTML.push(`
<div class="slide-inner d-flex flex-column justify-content-center align-items-center text-center" style="min-height:78vh;">
  <div class="icon-tile mb-3" style="width:72px;height:72px;font-size:2rem;"><i class="fa-solid fa-check"></i></div>
  <span class="eyebrow"><i class="fa-solid fa-flag-checkered"></i> Repaso completo</span>
  <h2 class="slide-title">Una interfaz es un contrato, no solo una firma</h2>
  <p class="subtitle mb-4" style="max-width:640px;">Sintaxis, semántica, eventos, metadata, errores, evolución — todo eso es parte de lo que un componente promete a quien lo usa. Próxima parada: Interacción, computación distribuida, RPC y REST.</p>
</div>

/* ============ MOTOR DE NAVEGACIÓN ============ */
const container = document.getElementById('slidesContainer');
slidesHTML.forEach((html, i)=>{
  const div = document.createElement('div');
  div.className = 'slide' + (i===0 ? ' active' : '');
  div.id = 'slide'+i;
  div.innerHTML = html;
  container.appendChild(div);
});

let current = 0;
const total = slidesHTML.length;
document.getElementById('hudTotal').textContent = total;

const dotsWrap = document.getElementById('navDots');
for(let i=0;i<total;i++){
  const d = document.createElement('div');
  d.className = 'dot' + (i===0?' active':'');
  d.onclick = ()=>goTo(i);
  dotsWrap.appendChild(d);
}

function updateUI(){
  document.querySelectorAll('.slide').forEach((s,i)=>{ s.classList.toggle('active', i===current); });
  document.querySelectorAll('.nav-dots .dot').forEach((d,i)=>{ d.classList.toggle('active', i===current); });
  document.getElementById('hudCurrent').textContent = current+1;
  document.getElementById('progressFill').style.width = ((current+1)/total*100)+'%';
  const active = document.getElementById('slide'+current);
  active.scrollTop = 0;
  const animTarget = active.querySelector('.slide-inner');
  if(animTarget){
    animTarget.classList.remove('animate__fadeIn');
    void animTarget.offsetWidth;
    animTarget.classList.add('animate__animated','animate__fadeIn');
  }
}
function goTo(i){ if(i<0||i>=total) return; current = i; updateUI(); }
document.getElementById('prevBtn').onclick = ()=>goTo(current-1);
document.getElementById('nextBtn').onclick = ()=>goTo(current+1);
document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight') goTo(current+1);
  if(e.key==='ArrowLeft') goTo(current-1);
});
updateUI();

/* ============ CONCEPTOS FUNDAMENTALES ============ */
const conceptos = [
  {icon:'fa-object-ungroup', n:'Múltiples interfaces', d:'Es posible separar una interfaz en varias, basado en el principio de segregación de interfaces (ISP). Permite, por ejemplo, dar distintos niveles de acceso al mismo recurso.'},
  {icon:'fa-signature', n:'Sintaxis del recurso', d:'La firma del recurso: nombre, nombre y tipo de argumentos, tipo del resultado, etc. Permite escribir código sintácticamente correcto para usar el recurso.'},
  {icon:'fa-brain', n:'Semántica del recurso', d:'El resultado de invocar el recurso: asignación de valores, asunciones, cambios de estado, eventos, efectos futuros, resultados observables. Ver el detalle en la próxima diapositiva.'},
  {icon:'fa-gears', n:'Operaciones', d:'Se invocan para transferir control o datos al componente. La mayoría devuelve un resultado, y la interfaz debe dejar claro cómo detectar errores.'},
  {icon:'fa-bell', n:'Eventos', d:'Normalmente asíncronos, representan la recepción de un mensaje. Los elementos activos producen eventos salientes para notificar a observadores o suscriptores.'},
  {icon:'fa-tags', n:'Metadata', d:'Permisos de acceso, unidades de parámetros o resultados, formatos (por ejemplo, el separador decimal). También llamada "propiedades".'}
];
const gridConceptos = document.getElementById('gridConceptos');
conceptos.forEach(t=>{
  const tile = document.createElement('div');

    Swal.fire({
      title: t.n,
      html: `<p style="text-align:left;">${t.d}</p>`,
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    });
  };
  gridConceptos.appendChild(tile);
});

/* ============ INTERESADOS DE LA DOCUMENTACIÓN ============ */
const interesados = [
  {icon:'fa-user-pen', n:'Desarrollador del componente', d:'Debe conocer el contrato que su interfaz tiene que cumplir. Solo puede probar la información incorporada en la descripción de la interfaz.'},
  {icon:'fa-wrench', n:'Mantenedor', d:'Un tipo especial de desarrollador: hace cambios asignados al componente y su interfaz, minimizando la interrupción de los actores existentes.'},

  {icon:'fa-magnifying-glass', n:'Arquitecto que busca activos reutilizables', d:'Examina interfaces de sistemas anteriores o del mercado comercial, interesado en capacidades, atributos de calidad y variabilidad del elemento.'}

/* ============ QUIZ ============ */
const preguntas = [
  {
    texto:'¿Por qué se dice que las interfaces no son solo lo que un componente provee?',
    opciones:{
      a:'Porque también incluyen lo que el componente consume: si lo que consume no está disponible, no puede proveer lo esperado',
      b:'Porque las interfaces nunca pueden proveer más de un recurso a la vez',
      c:'Porque un componente solo puede tener una interfaz durante toda su vida útil',
      d:'Porque la documentación de la interfaz siempre debe estar en un formato binario'
    },
    correcta:'a'
  },
  {
    texto:'¿Qué busca el principio de "acceso uniforme" al diseñar una interfaz?',
    opciones:{
      a:'Que todos los recursos de la interfaz tengan exactamente el mismo nombre',
      b:'Que un recurso sea accesible de la misma manera para el actor, sin filtrar detalles de implementación como si un valor viene de un caché o de un cálculo',
      c:'Que solo un actor pueda usar la interfaz a la vez',
      d:'Que las interfaces nunca cambien una vez publicadas'
    },
    correcta:'b'
  },
  {
    texto:'¿Qué técnica de evolución de interfaces consiste en dejar la interfaz original sin cambios y agregar nuevos recursos?',
    opciones:{
      a:'Deprecación',
      b:'Versionado',
      c:'Extensión',
      d:'Segregación'
    },
    correcta:'c'
  },
  {
    texto:'¿Qué estilo de interacción es más apropiado para elementos implementados en un entorno distribuido no confiable, según el texto?',
    opciones:{
      a:'Llamadas sincrónicas asumiendo que ambos componentes están siempre disponibles',
      b:'Acceso directo a memoria compartida local',
      c:'Interacciones asíncronas basadas en el consumo y producción de eventos, vía colas de mensajes o flujos de datos',
      d:'Comunicación exclusivamente a través de archivos compartidos en disco'
    },
    correcta:'c'
  },
  {
    texto:'Según el texto, ¿qué necesita especialmente un "analista de rendimiento" en la documentación de una interfaz?',
    opciones:{
      a:'El código fuente completo del componente',
      b:'Una garantía de acuerdo de nivel de servicio (SLA), para poder ajustar sus solicitudes de manera adecuada',
      c:'La lista de todos los desarrolladores que trabajaron en el componente',
      d:'El historial completo de versiones deprecadas de la interfaz'
    },
    correcta:'b'
  }
];
let idxPregunta = 0, aciertos = 0;

function lanzarQuiz(){ idxPregunta = 0; aciertos = 0; mostrarPregunta(); }
function mostrarPregunta(){
  if(idxPregunta >= preguntas.length){
    Swal.fire({
      title:'Resultado',
      html:`Acertaste <b>${aciertos}/${preguntas.length}</b>.`,
      icon: aciertos===preguntas.length ? 'success' : 'info',
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    });
    return;
  }
  const p = preguntas[idxPregunta];
  Swal.fire({
    title: p.texto,
    input:'radio',
    inputOptions: p.opciones,
    background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff',
    confirmButtonText:'Responder',
    inputValidator: (value)=> !value && 'Elegí una opción'
  }).then(res=>{
    if(!res.isConfirmed) return;
    const ok = res.value === p.correcta;
    if(ok) aciertos++;
    Swal.fire({
      title: ok ? '¡Correcto!' : 'No es así',
      html: `La respuesta correcta era: <b>${p.opciones[p.correcta]}</b>`,
      icon: ok ? 'success' : 'error',
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    }).then(()=>{ idxPregunta++; mostrarPregunta(); });
  });
}
</script>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANDIS 2 · Unidad 3 — Shared Database</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#070b14; --bg-1:#0d1424; --panel:#111a2e; --panel-2:#16223a;
  --accent:#3ec1ff; --accent-2:#7b6bff; --accent-3:#ffb547; --ok:#3ee6a8;
  --text:#e8edf7; --text-dim:#8fa0bd; --border:#22304d;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(1200px 700px at 15% -10%, rgba(62,193,255,.10), transparent 60%),
    radial-gradient(1000px 700px at 110% 10%, rgba(123,107,255,.12), transparent 55%),
    var(--bg-0);
  color:var(--text); font-family:'Inter',sans-serif; overflow:hidden;
}
.mono{font-family:'JetBrains Mono',monospace}
.blueprint{
  position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.35;
  background-image:linear-gradient(rgba(62,193,255,.06) 1px, transparent 1px),linear-gradient(90deg, rgba(62,193,255,.06) 1px, transparent 1px);
  background-size:42px 42px;
}
.progress-track{position:fixed; top:0; left:0; width:100%; height:4px; background:rgba(255,255,255,.06); z-index:50;}
.progress-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--accent-2)); transition:width .4s ease; box-shadow:0 0 12px var(--accent);}
.hud{position:fixed; top:14px; right:18px; z-index:50; background:rgba(17,26,46,.85); border:1px solid var(--border); backdrop-filter:blur(6px); padding:7px 14px; border-radius:999px; font-size:.82rem; color:var(--text-dim); display:flex; align-items:center; gap:8px;}
.hud .unit-tag{color:var(--accent); font-weight:700}
.brand{position:fixed; top:14px; left:18px; z-index:50; font-size:.78rem; color:var(--text-dim); display:flex; align-items:center; gap:8px; letter-spacing:.03em;}
.brand i{color:var(--accent-3)}
.slides-container{position:relative; z-index:1; height:100vh; width:100vw;}
.slide{position:absolute; inset:0; display:none; padding:90px 8vw 110px 8vw; overflow-y:auto;}
.slide.active{display:block}
.slide-inner{max-width:1180px; margin:0 auto;}
.eyebrow{display:inline-flex; align-items:center; gap:8px; font-size:.78rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent); font-weight:700; margin-bottom:14px;}
.eyebrow i{font-size:.9rem}
h1.slide-title{font-size:clamp(1.9rem,3.4vw,3rem); font-weight:800; margin-bottom:.4rem; line-height:1.1;}
h2.slide-title{font-size:clamp(1.5rem,2.6vw,2.2rem); font-weight:800; margin-bottom:.6rem;}
.subtitle{color:var(--text-dim); font-size:1.05rem; max-width:820px;}
.card-panel{background:linear-gradient(180deg, var(--panel), var(--panel-2)); border:1px solid var(--border); border-radius:16px; padding:26px 28px; box-shadow:0 12px 30px rgba(0,0,0,.35);}
.card-panel + .card-panel{margin-top:18px}
.pill{display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:999px; font-size:.76rem; font-weight:700; background:rgba(62,193,255,.12); color:var(--accent); border:1px solid rgba(62,193,255,.35);}
.pill.purple{background:rgba(123,107,255,.14); color:#b3a8ff; border-color:rgba(123,107,255,.4)}
.pill.amber{background:rgba(255,181,71,.14); color:var(--accent-3); border-color:rgba(255,181,71,.4)}
.pill.ok{background:rgba(62,230,168,.12); color:var(--ok); border-color:rgba(62,230,168,.35)}
.pill.bad{background:rgba(255,107,107,.12); color:#ff6b6b; border-color:rgba(255,107,107,.35)}
.icon-tile{width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center; background:rgba(62,193,255,.12); color:var(--accent); font-size:1.3rem; border:1px solid rgba(62,193,255,.3); flex-shrink:0;}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
.grid-4{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
@media (max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}
ul.clean{list-style:none; margin:0; padding:0;}
ul.clean li{position:relative; padding:6px 0 6px 26px; color:var(--text); font-size:.94rem;}
ul.clean li::before{content:"\f105"; font-family:"Font Awesome 6 Free"; font-weight:900; color:var(--accent); position:absolute; left:2px; top:8px; font-size:.85rem;}
.check-btn{border:none; background:linear-gradient(90deg,var(--accent),var(--accent-2)); color:#04101f; font-weight:800; padding:10px 22px; border-radius:10px; font-size:.9rem; box-shadow:0 8px 22px rgba(62,193,255,.25); cursor:pointer;}
.check-btn:hover{filter:brightness(1.08); color:#04101f;}
.nav-controls{position:fixed; bottom:18px; left:0; right:0; z-index:50; display:flex; justify-content:center; gap:14px; align-items:center;}
.nav-btn{width:46px; height:46px; border-radius:50%; border:1px solid var(--border); background:rgba(17,26,46,.9); color:var(--text); display:flex; align-items:center; justify-content:center; font-size:1.1rem; backdrop-filter:blur(6px);}
.nav-btn:hover{border-color:var(--accent); color:var(--accent);}
.nav-dots{display:flex; gap:6px; align-items:center; background:rgba(17,26,46,.9); border:1px solid var(--border); padding:8px 14px; border-radius:999px;}
.nav-dots .dot{width:7px; height:7px; border-radius:50%; background:var(--border); cursor:pointer; transition:.2s;}
.nav-dots .dot.active{background:var(--accent); width:20px; border-radius:4px;}
.footer-note{position:fixed; bottom:20px; right:22px; z-index:50; font-size:.72rem; color:var(--text-dim); font-family:'JetBrains Mono';}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px}

.tac-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px;}
@media (max-width:900px){.tac-grid{grid-template-columns:1fr;}}
.tac-tile{
  background:var(--panel-2); border:1px solid var(--border); border-radius:14px; padding:16px;
  cursor:pointer; transition:.2s; text-align:center;
}
.tac-tile:hover{transform:translateY(-4px); border-color:var(--accent); box-shadow:0 10px 24px rgba(62,193,255,.15);}
.tac-tile i{font-size:1.3rem; color:var(--accent); margin-bottom:6px; display:block;}
.tac-tile .tname{font-size:.86rem; font-weight:700;}

.link-row{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid rgba(255,255,255,.06);}
.link-row:last-child{border-bottom:none;}
.link-row a{color:var(--text); text-decoration:none; font-weight:600;}
.link-row a:hover{color:var(--accent);}
.link-row .ext{margin-left:auto; color:var(--text-dim); font-size:.75rem;}

.fig-img{max-width:100%; border-radius:12px; border:1px solid var(--border); background:#fff; padding:14px; display:block; margin:0 auto;}
.fig-cap{text-align:center; font-size:.78rem; color:var(--text-dim); margin-top:8px;}

.step-big{display:flex; gap:20px; align-items:flex-start;}
.step-num{
  width:60px; height:60px; border-radius:16px; background:rgba(62,193,255,.12); border:1px solid rgba(62,193,255,.35);
  color:var(--accent); display:flex; align-items:center; justify-content:center; font-size:1.6rem; font-weight:800;
  font-family:'JetBrains Mono'; flex-shrink:0;
}
.compare-col{background:var(--panel-2); border:1px solid var(--border); border-radius:14px; padding:20px;}
.compare-col h4{font-weight:800; font-size:1.02rem; margin-bottom:10px; display:flex; align-items:center; gap:8px;}
.example-box{background:rgba(62,193,255,.07); border:1px dashed rgba(62,193,255,.35); border-radius:12px; padding:14px 16px; margin-top:10px;}
.example-box .ex-label{font-size:.72rem; text-transform:uppercase; letter-spacing:.08em; color:var(--accent); font-weight:800; margin-bottom:4px; display:flex; align-items:center; gap:6px;}
</style>
</head>

// 1. Por qué no alcanza con File Transfer
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-arrow-right-arrow-left"></i> El límite del mecanismo anterior</span>
  <h2 class="slide-title">Lo que File Transfer no resuelve</h2>
  <div class="card-panel">
    <p style="font-size:1.0rem; line-height:1.75; margin-bottom:0;">
      La transferencia de archivos permite compartir datos, pero la sincronización puede demorar más de lo razonable para el negocio: mientras el archivo no se transfiera, ese dato queda <strong>inconsistente</strong> en las demás aplicaciones. Además, aunque se respete el formato, puede haber diferentes <strong>interpretaciones semánticas</strong> de los mismos datos.
    </p>
  </div>
  <div class="example-box mt-3" style="margin-top:18px;">
    <div class="ex-label"><i class="fa-solid fa-lightbulb"></i> Ejemplo simple</div>
    Retomando la inmobiliaria: si el archivo nocturno de cobros falla una noche, el contador va a trabajar todo el día con datos de ayer, sin saberlo. Lo que hace falta es que ambos sistemas miren siempre <strong>el mismo dato, en el mismo lugar, al mismo tiempo</strong>.
  </div>
</div>
`);

// 2. Qué es Shared Database
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-database"></i> La idea</span>
  <h2 class="slide-title">¿Qué es Shared Database?</h2>
  <div class="card-panel">
    <p style="font-size:1.0rem; line-height:1.75; margin-bottom:0;">
      Es un mecanismo que permite integrar aplicaciones construidas de forma independiente —en lenguajes y plataformas distintas— haciendo que todas almacenen sus datos en <strong>una única base de datos compartida</strong>, con un esquema diseñado para cubrir las necesidades de todas ellas.
    </p>
  </div>
  <img src="${IMG_SHAREDDB}" class="fig-img mt-3" alt="Integración de aplicaciones mediante base de datos compartida: Aplicación A, B y C conectadas a través de sus interfaces a una única base de datos compartida">

</div>
`);

  <div class="card-panel">
    <p style="font-size:1.0rem; line-height:1.75; margin-bottom:0;">
      Cuando varias aplicaciones comparten una base de datos, los datos son <strong>consistentes todo el tiempo</strong>. Aunque varias aplicaciones actualicen los mismos datos al mismo tiempo, las <strong>transacciones</strong> de la base de datos manejan la concurrencia por vos.
    </p>
  </div>
  <div class="example-box mt-3" style="margin-top:18px;">
    <div class="ex-label"><i class="fa-solid fa-lightbulb"></i> Ejemplo simple</div>
    Un hospital tiene el sistema de turnos, el de historias clínicas y el de facturación conectados a la misma base de datos de pacientes. Si en recepción actualizan el teléfono de un paciente, el sistema de facturación lo ve al instante — sin archivos, sin esperar a la noche.
  </div>
  <div class="card-panel mt-3 d-flex gap-3 align-items-center">
    <div class="icon-tile"><i class="fa-solid fa-plug"></i></div>
    <div class="small" style="color:var(--text-dim)">Hoy esto se facilita por la amplia difusión de las bases de datos relacionales <strong style="color:var(--text)">SQL</strong>: el esquema elimina el problema de los formatos de archivo, y casi todo lenguaje o framework moderno se conecta fácilmente a una base de datos.</div>
  </div>
</div>
`);

// 4. Desafíos - explorer
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-triangle-exclamation"></i> No todo es tan simple</span>
  <h2 class="slide-title">Los desafíos de compartir una base de datos</h2>
  <p class="subtitle mb-3">Tocá cada desafío para ver de qué se trata y un ejemplo real.</p>
  <div class="tac-grid" id="gridDesafios"></div>
</div>
`);

// 5. Cuándo NO usarlo
slidesHTML.push(`
<div class="slide-inner">
  <span class="eyebrow"><i class="fa-solid fa-compass"></i> El límite del mecanismo</span>
  <h2 class="slide-title">Cuándo conviene otra cosa</h2>
  <div class="grid-2">
    <div class="compare-col">
      <h4><i class="fa-solid fa-tower-broadcast" style="color:var(--accent)"></i> Necesitás integrar funcionalidad, no datos</h4>
      <p style="color:var(--text-dim); font-size:.88rem; line-height:1.6; margin:0;">Si lo que hace falta es que una aplicación le pida a otra que <strong style="color:var(--text)">haga algo</strong> —no solo que lea un dato— conviene <strong style="color:var(--text)">RPC</strong> —invocación de procedimientos remotos—.</p>
    </div>
    <div class="compare-col">
      <h4><i class="fa-solid fa-envelope" style="color:var(--ok)"></i> Intercambios frecuentes y chicos</h4>
      <p style="color:var(--text-dim); font-size:.88rem; line-height:1.6; margin:0;">Si se necesita intercambiar seguido pequeñas cantidades de datos, con un formato propio por tipo de dato en vez de un esquema universal, conviene <strong style="color:var(--text)">mensajería</strong>.</p>
    </div>
  </div>
  <div class="example-box mt-3" style="margin-top:18px;">
    <div class="ex-label"><i class="fa-solid fa-lightbulb"></i> Ejemplo simple</div>
    Si el sistema de facturación del hospital necesita pedirle al sistema de turnos "cancelá este turno", eso es una acción, no solo un dato — ahí RPC encaja mejor que forzar esa lógica dentro de la base de datos compartida.
  </div>
</div>
`);

// 6. Quiz
slidesHTML.push(`
<div class="slide-inner d-flex flex-column justify-content-center align-items-center text-center" style="min-height:70vh;">
  <span class="eyebrow"><i class="fa-solid fa-brain"></i> Chequeo de comprensión</span>
  <h2 class="slide-title">5 preguntas sobre Shared Database</h2>
  <p class="subtitle mb-4">Qué resuelve, cómo garantiza consistencia, y cuáles son sus riesgos y límites.</p>
  <button class="check-btn" onclick="lanzarQuiz()"><i class="fa-solid fa-play me-2"></i>Iniciar quiz</button>
</div>
`);

// 7. Cierre
slidesHTML.push(`
<div class="slide-inner d-flex flex-column justify-content-center align-items-center text-center" style="min-height:78vh;">
  <div class="icon-tile mb-3" style="width:72px;height:72px;font-size:2rem;"><i class="fa-solid fa-check"></i></div>
  <span class="eyebrow"><i class="fa-solid fa-flag-checkered"></i> Repaso completo</span>
  <h2 class="slide-title">Consistencia inmediata, a cambio de un esquema compartido</h2>
  <p class="subtitle mb-4" style="max-width:680px;">Shared Database resuelve la inconsistencia temporal de File Transfer, pero paga el precio de negociar un esquema único y de exponerse a cuellos de botella — un trade-off más, no una bala de plata.</p>
</div>
`);

/* ============ MOTOR DE NAVEGACIÓN ============ */
const container = document.getElementById('slidesContainer');
slidesHTML.forEach((html, i)=>{
  const div = document.createElement('div');
  div.className = 'slide' + (i===0 ? ' active' : '');
  div.id = 'slide'+i;
  div.innerHTML = html;
  container.appendChild(div);
});

let current = 0;
const total = slidesHTML.length;
document.getElementById('hudTotal').textContent = total;

const dotsWrap = document.getElementById('navDots');
for(let i=0;i<total;i++){
  const d = document.createElement('div');
  d.className = 'dot' + (i===0?' active':'');
  d.onclick = ()=>goTo(i);
  dotsWrap.appendChild(d);
}

function updateUI(){
  document.querySelectorAll('.slide').forEach((s,i)=>{ s.classList.toggle('active', i===current); });
  document.querySelectorAll('.nav-dots .dot').forEach((d,i)=>{ d.classList.toggle('active', i===current); });
  document.getElementById('hudCurrent').textContent = current+1;
  document.getElementById('progressFill').style.width = ((current+1)/total*100)+'%';
  const active = document.getElementById('slide'+current);
  active.scrollTop = 0;
  const animTarget = active.querySelector('.slide-inner');
  if(animTarget){
    animTarget.classList.remove('animate__fadeIn');
    void animTarget.offsetWidth;
    animTarget.classList.add('animate__animated','animate__fadeIn');
  }
}
function goTo(i){ if(i<0||i>=total) return; current = i; updateUI(); }
document.getElementById('prevBtn').onclick = ()=>goTo(current-1);
document.getElementById('nextBtn').onclick = ()=>goTo(current+1);
document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight') goTo(current+1);
  if(e.key==='ArrowLeft') goTo(current-1);
});
updateUI();

/* ============ DESAFÍOS ============ */
const desafios = [
  {icon:'fa-drafting-compass', n:'Acordar un esquema único', d:'Conseguir un esquema que satisfaga las necesidades de todas las aplicaciones a integrar puede ser un gran desafío, y el resultado puede terminar siendo complejo de usar.<br><br><strong>Ejemplo simple:</strong> el sistema de turnos del hospital necesita saber la "especialidad" del médico, pero el sistema de facturación necesita su "tarifa por hora" — el esquema compartido tiene que contemplar ambas necesidades sin volverse un monstruo.'},
  {icon:'fa-box', n:'Aplicaciones COTS', d:'Cuando alguna de las aplicaciones a integrar es un paquete listo para usar, su esquema de base de datos no se puede cambiar — o puede ser modificado por el proveedor en una futura versión, rompiendo la integración.<br><br><strong>Ejemplo simple:</strong> un software de facturación comprado "de fábrica" trae su propio esquema fijo; integrarlo por base de datos compartida significa adaptarse a sus tablas, no al revés.'},
  {icon:'fa-gauge-high', n:'Cuellos de botella', d:'Si varias aplicaciones modifican y consumen los mismos datos al mismo tiempo, la base de datos compartida puede volverse un cuello de botella de desempeño — más aún si las aplicaciones están distribuidas y hay que sumar la latencia de red.<br><br><strong>Ejemplo simple:</strong> en horario pico, si turnos, facturación e historias clínicas escriben todas a la misma tabla de pacientes al mismo tiempo, las consultas empiezan a hacerse más lentas para todos.'}
];
const gridDesafios = document.getElementById('gridDesafios');
desafios.forEach(t=>{
  const tile = document.createElement('div');
  tile.className = 'tac-tile';
  tile.innerHTML = `<i class="fa-solid ${t.icon}"></i><div class="tname">${t.n}</div>`;
  tile.onclick = ()=>{
    Swal.fire({
      title: t.n,
      html: `<div style="text-align:left; font-size:.94rem; line-height:1.6;">${t.d}</div>`,
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    });
  };
  gridDesafios.appendChild(tile);
});

/* ============ QUIZ ============ */
const preguntas = [
  {
    texto:'Un hospital conecta sus sistemas de turnos, historias clínicas y facturación a la misma base de datos de pacientes. Si recepción actualiza un teléfono, facturación lo ve al instante. ¿Qué propiedad de Shared Database explica esto?',
    opciones:{
      a:'Que cada aplicación mantiene su propia copia de los datos, sincronizada cada noche',
      b:'Que los datos son consistentes todo el tiempo, porque las transacciones de la base de datos manejan la concurrencia',
      c:'Que el hospital usa un archivo CSV compartido entre los tres sistemas',
      d:'Que cada sistema tiene su propio esquema de base de datos, sin relación entre sí'
    },
    correcta:'b'
  },
  {
    texto:'¿Qué problema de File Transfer viene a resolver Shared Database?',
    opciones:{
      a:'Que los archivos no pueden usar formatos como CSV, XML o JSON',
      b:'Que las aplicaciones nunca pueden compartir datos entre sí',
      c:'Que un dato puede quedar inconsistente entre aplicaciones mientras el archivo que lo transporta no se haya transferido',
      d:'Que los archivos ocupan demasiado espacio en disco'
    },
    correcta:'c'
  },
  {
    texto:'¿Qué dificultad aparece cuando una de las aplicaciones a integrar es un paquete COTS?',
    opciones:{
      a:'Que su esquema de base de datos puede no poder cambiarse, o ser modificado por el proveedor en versiones futuras',
      b:'Que los paquetes COTS nunca usan bases de datos relacionales',
      c:'Que automáticamente se vuelve imposible integrarlo por cualquier mecanismo',
      d:'Que deja de ser necesario definir un esquema compartido'
    },
    correcta:'a'
  },
  {
    texto:'¿Cuándo puede una base de datos compartida convertirse en un cuello de botella de desempeño?',
    opciones:{
      a:'Nunca, las bases de datos relacionales escalan sin límites',
      b:'Solo si las aplicaciones están escritas en el mismo lenguaje de programación',
      c:'Únicamente cuando se usa un formato de archivo incorrecto',
      d:'Cuando varias aplicaciones modifican y consumen los mismos datos al mismo tiempo, sobre todo si además están distribuidas'
    },
    correcta:'d'
  },
  {
    texto:'Si lo que se necesita es que una aplicación le pida explícitamente a otra que ejecute una acción —no solo compartir un dato— ¿qué mecanismo es más adecuado que Shared Database?',
    opciones:{
      a:'Seguir agrandando el esquema de la base de datos compartida',
      b:'Volver a usar File Transfer con archivos más frecuentes',
      c:'RPC — invocación de procedimientos remotos',
      d:'Duplicar la base de datos en cada aplicación'
    },
    correcta:'c'
  }
];
let idxPregunta = 0, aciertos = 0;

function lanzarQuiz(){ idxPregunta = 0; aciertos = 0; mostrarPregunta(); }
function mostrarPregunta(){
  if(idxPregunta >= preguntas.length){
    Swal.fire({
      title:'Resultado',
      html:`Acertaste <b>${aciertos}/${preguntas.length}</b>.`,
      icon: aciertos===preguntas.length ? 'success' : 'info',
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    });
    return;
  }
  const p = preguntas[idxPregunta];
  Swal.fire({
    title: p.texto,
    input:'radio',
    inputOptions: p.opciones,
    background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff',
    confirmButtonText:'Responder',
    inputValidator: (value)=> !value && 'Elegí una opción'
  }).then(res=>{
    if(!res.isConfirmed) return;
    const ok = res.value === p.correcta;
    if(ok) aciertos++;
    Swal.fire({
      title: ok ? '¡Correcto!' : 'No es así',
      html: `La respuesta correcta era: <b>${p.opciones[p.correcta]}</b>`,
      icon: ok ? 'success' : 'error',
      background:'#111a2e', color:'#e8edf7', confirmButtonColor:'#3ec1ff'
    }).then(()=>{ idxPregunta++; mostrarPregunta(); });
  });
}
</script>
